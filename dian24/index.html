<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>24点决斗 · 科技节挑战</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --lv1:#F0AA3C; --lv1-bg:#FFFBF0;
  --lv2:#5AB46E; --lv2-bg:#F2FBF3;
  --lv3:#8C6EDC; --lv3-bg:#F6F3FF;
  --lv4:#E14640; --lv4-bg:#FFF1F0;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  background:var(--lv1-bg); color:#3A3733;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  transition:background .3s;
}
/* ===== 顶栏 ===== */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 32px;background:#fff;border-bottom:3px solid var(--lv1);
  transition:border-color .3s;flex-shrink:0;
}
.brand{display:flex;align-items:baseline;gap:14px}
.brand h1{font-size:26px;letter-spacing:1px}
.brand .tag{font-size:14px;color:#9A9187;letter-spacing:2px}
.hud{display:flex;align-items:center;gap:26px;font-size:15px}
.hud .item{display:flex;flex-direction:column;align-items:center;min-width:70px}
.hud .label{font-size:12px;color:#A79E94;letter-spacing:1px}
.hud .val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
#timer.warn{color:#E14640;animation:blink .6s infinite}
@keyframes blink{50%{opacity:.35}}
/* ===== 难度档 ===== */
.levels{display:flex;gap:8px}
.levels button{
  border:2px solid #E4DACB;background:#fff;border-radius:12px;
  padding:9px 16px;font-size:15px;font-weight:700;cursor:pointer;
  color:#8B8378;font-family:inherit;transition:all .18s;
}
.levels button:hover{border-color:#C9BBA6;transform:translateY(-1px)}
.levels button.on{color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(0,0,0,.14)}
.levels button[data-lv="1"].on{background:var(--lv1)}
.levels button[data-lv="2"].on{background:var(--lv2)}
.levels button[data-lv="3"].on{background:var(--lv3)}
.levels button[data-lv="4"].on{background:var(--lv4)}
.levels button .num{font-size:12px;opacity:.75;font-weight:400;margin-left:4px}
/* ===== 主舞台 ===== */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
     padding:18px;position:relative;gap:8px}
.stage-top{display:flex;align-items:center;gap:16px;font-size:16px;color:#9A9187}
.stage-top .badge{
  padding:5px 16px;border-radius:20px;font-weight:700;font-size:15px;color:#fff;
  background:var(--lv1);transition:background .3s;
}
/* 数字卡 */
.nums{display:flex;gap:clamp(10px,2.2vw,30px);margin:6px 0}
.numcard{
  width:clamp(96px,15vw,190px);height:clamp(120px,19vw,240px);
  background:#fff;border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(58px,10vw,130px);font-weight:800;
  color:#3A3733;border:4px solid var(--lv1);
  box-shadow:0 6px 22px rgba(160,130,90,.13);
  transition:border-color .3s,transform .25s;
}
.numcard.pop{animation:pop .4s cubic-bezier(.2,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
/* 答案区 */
.answers{
  display:flex;flex-direction:column;gap:10px;margin-top:14px;
  min-height:0;width:100%;max-width:900px;
}
.answers.empty{visibility:hidden}
.ansrow{
  display:flex;align-items:center;gap:16px;
  background:#fff;border-radius:14px;padding:12px 22px;
  border-left:8px solid var(--lv1);
  box-shadow:0 3px 12px rgba(160,130,90,.10);
  animation:slide .3s ease-out backwards;
  transition:border-color .3s;
}
.ansrow:nth-child(2){animation-delay:.07s}
.ansrow:nth-child(3){animation-delay:.14s}
@keyframes slide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ansrow .idx{
  font-size:15px;font-weight:700;color:#fff;background:var(--lv1);
  width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .3s;
}
.ansrow .expr{font-size:clamp(24px,3.4vw,44px);font-weight:700;letter-spacing:1px}
.ansrow .eq{margin-left:auto;font-size:clamp(20px,2.4vw,32px);color:#B9B0A4;font-weight:700}
/* ===== 底部操作条 ===== */
footer{
  flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:14px;
  padding:14px 32px 18px;background:#fff;border-top:1px solid #F0E6DA;
}
.keybtn{
  display:flex;align-items:center;gap:9px;font-size:16px;
  padding:10px 22px;border-radius:12px;font-weight:700;
  border:2px solid #E4DACB;background:#FCFAF6;cursor:pointer;
  font-family:inherit;color:#5C554C;transition:all .16s;
}
.keybtn:hover{background:#F5F0E8;border-color:#C9BBA6}
.keybtn:active{transform:scale(.97)}
.keybtn .k{
  background:#3A3733;color:#fff;border-radius:7px;padding:2px 11px;
  font-size:15px;font-weight:800;min-width:30px;text-align:center;
}
.keybtn.hint{border-color:#F0AA3C;background:#FFFBF0;color:#B25E10}
/* 试玩提示 */
.toast{
  position:fixed;left:50%;top:20px;transform:translateX(-50%);
  background:rgba(58,55,51,.93);color:#fff;padding:11px 24px;border-radius:11px;
  font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;
}
.toast.show{opacity:1}
/* 计分 */
.score-chip{
  display:flex;align-items:center;gap:8px;background:#F5F0E8;border-radius:10px;
  padding:6px 14px;font-size:15px;font-weight:700;color:#7A7165;cursor:pointer;
  border:2px solid transparent;transition:all .16s;
}
.score-chip:hover{border-color:#DCCEB8}
#score{transition:color .2s}

/* ================= 挑战模式 ================= */
.modebar{display:flex;gap:4px;background:#F5F0E8;border-radius:12px;padding:4px}
.modebar button{
  border:none;background:transparent;border-radius:9px;padding:8px 18px;
  font-size:15px;font-weight:700;color:#8B8378;cursor:pointer;font-family:inherit;
  transition:all .18s;
}
.modebar button.on{background:#fff;color:#3A3733;box-shadow:0 2px 6px rgba(0,0,0,.09)}

#practiceView{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;width:100%}
#challenge{display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,1.6vh,22px);width:100%}
#challenge.on{display:flex}

/* 可点数字卡 */
.nums.cpick .numcard{cursor:pointer;user-select:none;transition:all .16s}
.nums.cpick .numcard:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(160,130,90,.22)}
.nums.cpick .numcard.sel{
  border-color:#3A3733 !important;transform:translateY(-7px) scale(1.07);
  box-shadow:0 14px 32px rgba(58,55,51,.3);
}
.nums.cpick .numcard.mid{font-size:clamp(40px,7vw,96px)}
.nums.cpick .numcard.tiny{font-size:clamp(30px,5vw,66px)}
.nums.cpick .numcard.done{
  border-color:#5AB46E !important;background:#F2FBF3;
  animation:pop .4s cubic-bezier(.2,1.6,.5,1);
}

/* 运算符条 */
.ops{display:flex;gap:clamp(8px,1.6vw,22px)}
.ops button{
  width:clamp(54px,6.6vw,84px);height:clamp(54px,6.6vw,84px);
  border-radius:18px;border:3px solid #E4DACB;background:#fff;
  font-size:clamp(24px,3.2vw,40px);font-weight:800;color:#5C554C;
  cursor:pointer;font-family:inherit;transition:all .16s;
}
.ops button:hover{border-color:#C9BBA6;transform:translateY(-2px)}
.ops button.on{background:#3A3733;color:#fff;border-color:#3A3733}

/* 操作条 */
.actbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.actbar button{
  border:2px solid #E4DACB;background:#FCFAF6;border-radius:11px;
  padding:9px 20px;font-size:15px;font-weight:700;color:#5C554C;
  cursor:pointer;font-family:inherit;transition:all .16s;
}
.actbar button:hover{background:#F5F0E8;border-color:#C9BBA6}
.actbar button:disabled{opacity:.38;cursor:not-allowed;transform:none}

/* 反馈 */
.feedback{min-height:34px;font-size:clamp(17px,1.6vw,22px);font-weight:700;
  display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.feedback.ok{color:#3E9B54}
.feedback.bad{color:#E14640}
.feedback.tip{color:#A79E94;font-weight:400;font-size:16px}

/* 倒计时条 */
.timebar{width:min(780px,90%);height:12px;background:#EFE7DB;border-radius:8px;overflow:hidden}
.timebar > i{display:block;height:100%;width:100%;background:#5AB46E;border-radius:8px;
  transition:width .22s linear,background .3s}
.timebar.warn > i{background:#E14640}

/* 弹窗 */
.modal{
  position:fixed;inset:0;background:rgba(48,44,40,.55);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:200;padding:20px;
}
.modal.on{display:flex}
.card{
  background:#fff;border-radius:22px;padding:30px 34px;max-width:800px;width:100%;
  max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.28);
}
.card h2{font-size:26px;margin-bottom:6px}
.card .sub{color:#9A9187;font-size:15px;margin-bottom:20px}
.card input{
  width:100%;padding:14px 18px;font-size:20px;font-family:inherit;
  border:2px solid #E4DACB;border-radius:13px;outline:none;background:#FCFAF6;color:#3A3733;
}
.card input:focus{border-color:#F0AA3C;background:#fff}
.btnrow{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.btnrow button{
  flex:1;min-width:120px;padding:14px;border-radius:13px;font-size:17px;font-weight:700;
  border:none;cursor:pointer;font-family:inherit;transition:all .16s;
}
.btn-ok{background:#F0AA3C;color:#fff}
.btn-ok:hover{background:#E09A2C}
.btn-ghost{background:#F5F0E8;color:#6B6359}
.btn-ghost:hover{background:#EBE3D6}

/* 排行榜 */
.rank{width:100%;border-collapse:collapse;font-size:17px}
.rank th{
  text-align:left;font-size:13px;color:#A79E94;font-weight:600;letter-spacing:1px;
  padding:8px 12px;border-bottom:2px solid #F0E6DA;white-space:nowrap;
}
.rank td{padding:11px 12px;border-bottom:1px solid #F6F0E7}
.rank tr.me{background:#FFFBF0}
.rank tr.me td{font-weight:700}
.rank .medal{font-size:20px;width:46px}
.rank .nm{font-weight:700}
.rank .sc{font-variant-numeric:tabular-nums;font-weight:800;color:#B25E10;font-size:19px}
.rank .meta{color:#A79E94;font-size:14px;white-space:nowrap}
.empty-rank{text-align:center;color:#B9B0A4;padding:34px 0;font-size:16px}

@media print{body{background:#fff}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>24 点决斗</h1>
    <span class="tag">科技节挑战</span>
  </div>
  <div class="modebar" id="modeBar">
    <button data-mode="challenge" class="on">🏆 挑战模式</button>
    <button data-mode="practice">📖 练习模式</button>
  </div>
  <div class="levels" id="levelBar"></div>
  <div class="hud">
    <div class="item"><span class="label">题号</span><span class="val" id="prog">1/1</span></div>
    <div class="item"><span class="label" id="timeLabel">剩余</span><span class="val" id="timer">01:00</span></div>
    <div class="item" id="solvedItem"><span class="label">已解</span><span class="val" id="solved">0</span></div>
    <div class="score-chip" id="scoreChip" title="点击清零">
      得分 <span id="score">0</span>
    </div>
  </div>
</header>

<main>
  <div id="practiceView">
    <div class="stage-top">
      <span class="badge" id="lvBadge">LV.1 入门</span>
      <span id="lvTip">答案不止一条，先自己算</span>
    </div>
    <div class="nums" id="nums"></div>
    <div class="answers empty" id="answers"></div>
  </div>

  <div id="challenge" class="on">
    <div class="stage-top">
      <span class="badge" id="cBadge">LV.1 入门</span>
      <span id="cTip">点两个数字 + 一个运算符，把 4 个数合成 1 个</span>
      <span id="cWorth" style="font-weight:700;color:#B25E10">本题 2 分</span>
    </div>
    <div class="nums cpick" id="cNums"></div>
    <div class="ops" id="cOps">
      <button data-op="+">＋</button>
      <button data-op="-">－</button>
      <button data-op="*">×</button>
      <button data-op="/">÷</button>
    </div>
    <div class="feedback" id="cFeedback"></div>
    <div class="actbar">
      <button id="cUndo">↶ 撤销</button>
      <button id="cReset">重来本题</button>
      <button id="cSkip">跳过 →</button>
      <button id="cRank">🏆 排行榜</button>
    </div>
    <div class="timebar" id="cTimebar"><i></i></div>
  </div>
</main>

<footer>
  <div id="footPractice" style="display:none;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center">
    <button class="keybtn hint" id="btnA"><span class="k">A</span> 看答案（-1分）</button>
    <button class="keybtn" id="btnB"><span class="k">B</span> 下一题（+2分）</button>
    <button class="keybtn" id="btnX"><span class="k">X</span> 换一题</button>
    <span style="color:#C6BDB1;font-size:14px">空格键 = 暂停计时 · 点右上角得分可清零</span>
  </div>
  <div id="footChallenge" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center">
    <button class="keybtn" id="btnStart" style="border-color:#F0AA3C;background:#FFFBF0;color:#B25E10">▶ 开始挑战（60 秒）</button>
    <span style="color:#C6BDB1;font-size:14px">先点数字 → 点运算符 → 点另一个数字，合成 24 即得分 · 答错扣一半分</span>
  </div>
</footer>

<div class="toast" id="toast"></div>

<!-- 结算弹窗 -->
<div class="modal" id="resultModal">
  <div class="card">
    <h2>⏱ 时间到！</h2>
    <div class="sub" id="resSub"></div>
    <input id="nameInput" maxlength="12" placeholder="输入你的名字（最多 12 字）" autocomplete="off">
    <div class="btnrow">
      <button class="btn-ok" id="saveRank">保存成绩</button>
      <button class="btn-ghost" id="skipSave">不保存</button>
    </div>
  </div>
</div>

<!-- 排行榜弹窗 -->
<div class="modal" id="rankModal">
  <div class="card">
    <h2>🏆 排行榜</h2>
    <div class="sub" id="rankSub">一分钟内得分最高者胜 · 同分看解题数</div>
    <div id="rankBody"></div>
    <div class="btnrow">
      <button class="btn-ok" id="rankClose">关闭</button>
      <button class="btn-ghost" id="rankExport">导出成绩 CSV</button>
      <button class="btn-ghost" id="rankClear">清空排行榜</button>
    </div>
  </div>
</div>

    b.onclick = () => switchLevel(lv);
    bar.appendChild(b);
  }
}

function switchLevel(lv) {
  if (MODE === 'challenge' && C.running) { toast('挑战进行中，不能换难度'); return; }
  state.lv = lv;
  state.idx = 0;
  state.shown = false;
  document.body.style.background = LV_BG[lv];
  document.querySelector('header').style.borderBottomColor = LV_COLOR[lv];
  document.querySelectorAll('.levels button').forEach(b => {
    b.classList.toggle('on', +b.dataset.lv === lv);
  });
  renderLevelBar();
  if (MODE === 'challenge') {
    C.qi = 0; cBuildList(); cLoadQuestion(); cUpdateHud();   // ★ 每次换难度都重新洗牌
  } else {
    buildOrder(); state.idx = 0; renderQuestion(false);
  }
}

// ==== 渲染题目 ====
function renderQuestion(animate) {
  const p = curPool();
  const list = curList();

  // 数字卡
  const wrap = document.getElementById('nums');
  wrap.innerHTML = '';
  p.n.forEach((v, i) => {
    const d = document.createElement('div');
    d.className = 'numcard' + (animate ? ' pop' : '');
    d.style.animationDelay = (i * 60) + 'ms';
    d.textContent = v;
    d.style.borderColor = LV_COLOR[state.lv];
    wrap.appendChild(d);
  });

  // 进度
  document.getElementById('prog').textContent = (state.idx + 1) + '/' + list.length;
  document.getElementById('lvBadge').textContent = 'LV.' + state.lv + ' ' + LV_NAME[state.lv];
  document.getElementById('lvBadge').style.background = LV_COLOR[state.lv];
  document.getElementById('lvTip').textContent = LV_TIP[state.lv];

  // 答案区隐藏
  hideAnswers();
  state.shown = false;
}

function hideAnswers() {
  const a = document.getElementById('answers');
  a.classList.add('empty');
  a.innerHTML = '';
}

// ==== 显示答案 ====
function showAnswers() {
  if (state.shown) return;
  state.shown = true;
  const p = curPool();
  const a = document.getElementById('answers');
  a.classList.remove('empty');
  a.innerHTML = '';
  p.s.forEach((ex, i) => {
    const row = document.createElement('div');
    row.className = 'ansrow';
    row.style.borderLeftColor = LV_COLOR[state.lv];
    row.innerHTML =
      '<div class="idx" style="background:' + LV_COLOR[state.lv] + '">' + (i + 1) + '</div>' +
      '<div class="expr">' + ex + '</div>' +
      '<div class="eq">= 24</div>';
    a.appendChild(row);
  });
  if (p.s.length === 1) {
    const row = document.createElement('div');
    row.className = 'ansrow';
    row.style.borderLeftColor = LV_COLOR[state.lv];
    row.style.opacity = '.55';
    row.innerHTML = '<div class="idx" style="background:#C6BDB1">·</div>' +
      '<div class="expr" style="font-size:20px;color:#9A9187">本题只有这一种思路</div>';
    a.appendChild(row);
  }
}

// ==== 下一题 ====
function nextQuestion(scored) {
  const list = curList();
  state.idx = (state.idx + 1) % list.length;
  if (state.idx === 0) {
    // 一轮走完，重新洗牌
    buildOrder();
    toast('本档已走完一轮，重新打乱开始！');
  }
  renderQuestion(true);
}

// ==== 换一题（随机跳，不计分）====
function skipQuestion() {
  const list = curList();
  state.idx = Math.floor(Math.random() * list.length);
  renderQuestion(true);
}

// ==== 计时 ====
function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function tick() {
  if (state.startTs === null) return;
  const now = state.paused ? state.pauseTs : Date.now();
  state.elapsed = now - state.startTs;
  if (MODE === 'practice') {
    const el = document.getElementById('timer');
    el.textContent = fmt(state.elapsed);
    el.classList.toggle('warn', state.elapsed > 60000 && !state.paused);
  }
  requestAnimationFrame(tick);
}

function togglePause() {
  if (state.startTs === null) { state.startTs = Date.now(); toast('计时开始'); return; }
  if (state.paused) {
    // 恢复：把暂停时长补回起点
    state.startTs += Date.now() - state.pauseTs;
    state.paused = false;
    document.getElementById('timer').classList.remove('warn');
    toast('继续计时');
  } else {
    state.pauseTs = Date.now();
    state.paused = true;
    toast('已暂停');
  }
}

// ==== 计分 ====
function addScore(n) {
  state.score = state.score + n;
  const el = document.getElementById('score');
  el.textContent = state.score;
  el.style.color = state.score < 0 ? '#E14640' : (state.score > 0 ? '#5AB46E' : '#3A3733');
}

// ==== 提示条 ====
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ==== 键盘：A 看答案 / B 下一题 / X 换题 / 空格 暂停（仅练习模式）====
document.addEventListener('keydown', e => {
  if (MODE !== 'practice') return;
  const k = e.key.toLowerCase();
  if (k === 'a') {
    e.preventDefault();
    if (!state.shown) { showAnswers(); addScore(-1); toast('看了答案，扣 1 分'); }
    else toast('答案已经显示啦');
  } else if (k === 'b') {
    e.preventDefault();
    if (!state.shown) { addScore(2); toast('答对 +2 分！'); }   // 没看答案就翻页 = 自己算出来了
    nextQuestion(true);
  } else if (k === 'x') {
    e.preventDefault();
    skipQuestion();
  } else if (e.code === 'Space') {
    e.preventDefault();
    togglePause();
  }
});

// ==== 按钮 ====
document.getElementById('btnA').onclick = () => {
  if (!state.shown) { showAnswers(); addScore(-1); toast('看了答案，扣 1 分'); }
};
document.getElementById('btnB').onclick = () => {
  if (!state.shown) { addScore(2); toast('答对 +2 分！'); }
  nextQuestion(true);
};
document.getElementById('btnX').onclick = skipQuestion;
document.getElementById('scoreChip').onclick = () => {
  if (MODE === 'challenge') {
    C.score = 0; C.solved = 0; cUpdateHud(); toast('挑战分数已清零');
  } else {
    state.score = 0;
    document.getElementById('score').textContent = 0;
    toast('得分已清零');
  }
};

/* ================================================================
   挑战模式：60 秒限时 · 点选拼算式 · 分档计分 · 本机排行榜
   ================================================================ */
let MODE = 'challenge';

const WORTH = { 1: 2, 2: 4, 3: 8, 4: 16 };   // 难度分值（翻倍制；答错扣一半仍为整数）
const CHALLENGE_MS = 60000;
const RANK_KEY = 'dian24_rank_v1';
const OPSIGN = { '+': '＋', '-': '－', '*': '×', '/': '÷' };

const C = {
  cards: [], history: [], sel: -1, op: null,
  wrongThisQ: false, score: 0, solved: 0,
  qi: 0, list: [], cw: null,
  left: CHALLENGE_MS, running: false, endTs: 0, raf: null
};

/* ---------- 分数运算（必须支持分数，否则地狱题做不出来）---------- */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; }
function FN(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; }
function fAdd(a, b) { return FN(a[0] * b[1] + b[0] * a[1], a[1] * b[1]); }
function fSub(a, b) { return FN(a[0] * b[1] - b[0] * a[1], a[1] * b[1]); }
function fMul(a, b) { return FN(a[0] * b[0], a[1] * b[1]); }
function fDiv(a, b) { if (b[0] === 0) return null; return FN(a[0] * b[1], a[1] * b[0]); }
function fStr(a) { return a[1] === 1 ? String(a[0]) : a[0] + '/' + a[1]; }
function is24(a) { return a[0] === 24 * a[1]; }

/* ---------- 出题 ---------- */
function cBuildList() {
  const arr = POOL.filter(p => p.lv === state.lv);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  C.list = arr;
}

function cLoadQuestion() {
  if (!C.list.length) cBuildList();
  C.cw = C.list[C.qi % C.list.length];
  C.cards = C.cw.n.map(v => ({ v: [v, 1] }));
  C.history = []; C.sel = -1; C.op = null; C.wrongThisQ = false;
  cRender();
  cFeedback('', '');
}

function cRender() {
  const wrap = document.getElementById('cNums');
  wrap.innerHTML = '';
  C.cards.forEach((c, i) => {
    const s = fStr(c.v);
    const d = document.createElement('div');
    d.className = 'numcard';
    if (s.length >= 5) d.classList.add('tiny');
    else if (s.length >= 3) d.classList.add('mid');
    if (i === C.sel) d.classList.add('sel');
    if (C.cards.length === 1 && is24(c.v)) d.classList.add('done');
    d.style.borderColor = LV_COLOR[state.lv];
    d.textContent = s;
    d.onclick = () => cPick(i);
    wrap.appendChild(d);
  });
  document.querySelectorAll('#cOps button').forEach(b => b.classList.toggle('on', b.dataset.op === C.op));
  document.getElementById('cUndo').disabled = C.history.length === 0;
}

function cFeedback(msg, cls) {
  const el = document.getElementById('cFeedback');
  el.textContent = msg;
  el.className = 'feedback' + (cls ? ' ' + cls : '');
}

/* ---------- 点选交互：数字 → 运算符 → 数字 ---------- */
function cPick(i) {
  if (!C.running) { toast('先点「开始挑战」'); return; }
  if (C.cards.length <= 1) return;

  if (C.sel === -1) {
    C.sel = i; C.op = null; cRender();
    cFeedback('已选中 ' + fStr(C.cards[i].v) + '，再点一个运算符', 'tip');
    return;
  }
  if (C.op === null) {
    if (i === C.sel) { C.sel = -1; cRender(); cFeedback('', ''); }
    else { C.sel = i; cRender(); cFeedback('已选中 ' + fStr(C.cards[i].v) + '，再点一个运算符', 'tip'); }
    return;
  }
  if (i === C.sel) { C.sel = -1; C.op = null; cRender(); cFeedback('', ''); return; }
  cCombine(C.sel, i, C.op);
}

function cCombine(i, j, op) {
  const a = C.cards[i].v, b = C.cards[j].v;
  let r;
  if (op === '+') r = fAdd(a, b);
  else if (op === '-') r = fSub(a, b);
  else if (op === '*') r = fMul(a, b);
  else { r = fDiv(a, b); if (r === null) { cFeedback('不能除以 0 哦', 'bad'); return; } }

  C.history.push(C.cards.map(c => ({ v: c.v.slice() })));

  const keep = C.cards.filter((_, k) => k !== i && k !== j);
  keep.splice(Math.min(i, j), 0, { v: r });
  C.cards = keep;
  C.sel = -1; C.op = null;
  cRender();

  if (C.cards.length === 1) {
    if (is24(C.cards[0].v)) cWin();
    else cLose();
  } else {
    cFeedback('合并得 ' + fStr(r) + '，还剩 ' + C.cards.length + ' 个数', '');
  }
}

function cWin() {
  const w = WORTH[state.lv];
  C.score += w; C.solved++;
  cUpdateHud();
  cFeedback('✅ 答对！ +' + w + ' 分', 'ok');
  setTimeout(() => { if (C.running) cNext(); }, 650);
}

function cLose() {
  const w = WORTH[state.lv];
  const got = fStr(C.cards[0].v);
  if (!C.wrongThisQ) {
    C.score -= w / 2; C.wrongThisQ = true;
    cUpdateHud();
    cFeedback('❌ 结果是 ' + got + '，不是 24    −' + (w / 2) + ' 分', 'bad');
  } else {
    cFeedback('❌ 结果是 ' + got + '，不是 24', 'bad');
  }
  setTimeout(() => { if (C.running && C.cards.length === 1) cResetQuestion(); }, 1500);
}

function cResetQuestion() {
  C.cards = C.cw.n.map(v => ({ v: [v, 1] }));
  C.history = []; C.sel = -1; C.op = null;
  cRender();
  cFeedback('重新来一次～', 'tip');
}

function cNext() {
  C.qi++;
  if (C.qi >= C.list.length) { C.qi = 0; cBuildList(); }
  cLoadQuestion();
  cUpdateHud();
}

function cUndo() {
  if (!C.history.length) return;
  C.cards = C.history.pop();
  C.sel = -1; C.op = null;
  cRender(); cFeedback('', '');
}

function cSkip() {
  if (!C.running) { toast('先点「开始挑战」'); return; }
  const w = WORTH[state.lv];
  cNext();
  cFeedback('已跳过（不扣分，但少了一次拿 ' + w + ' 分的机会）', 'tip');
}

/* ---------- 计时与 HUD ---------- */
function cUpdateHud() {
  const t = document.getElementById('timer');
  t.textContent = fmt(Math.max(0, C.left));
  t.classList.toggle('warn', C.left <= 10000 && C.running);
  document.getElementById('prog').textContent = (C.qi + 1) + '/' + C.list.length;
  document.getElementById('solved').textContent = C.solved;
  document.getElementById('score').textContent = C.score;
  document.getElementById('cBadge').textContent = 'LV.' + state.lv + ' ' + LV_NAME[state.lv];
  document.getElementById('cBadge').style.background = LV_COLOR[state.lv];
  document.getElementById('cWorth').textContent = '本题 ' + WORTH[state.lv] + ' 分';
  const pct = Math.max(0, Math.min(100, C.left / CHALLENGE_MS * 100));
  document.querySelector('#cTimebar > i').style.width = pct + '%';
  document.getElementById('cTimebar').classList.toggle('warn', C.left <= 10000);
}

function cStart() {
  if (C.running) return;
  C.score = 0; C.solved = 0; C.qi = 0;
  // ★ 每局都必须重新洗牌！
  //   原来的写法是 `if (!C.list.length) cBuildList();`（列表为空才洗），
  //   结果只有页面加载时洗过一次，之后每局顺序完全一样 —— 60 秒走不完一轮，
  //   学生每次看到的都是那几道开头题，挑战就失去意义了。
  cBuildList();
  C.left = CHALLENGE_MS;
  C.endTs = Date.now() + CHALLENGE_MS;
  C.running = true;
  cLoadQuestion();
  cUpdateHud();
  const b = document.getElementById('btnStart');
  b.textContent = '挑战中…';
  b.disabled = true;
  cTick();
}

function cTick() {
  if (!C.running) return;
  const left = C.endTs - Date.now();
  C.left = left > 0 ? left : 0;
  cUpdateHud();
  if (C.left <= 0) { cEnd(); return; }
  C.raf = requestAnimationFrame(cTick);
}

function cEnd() {
  C.running = false;
  if (C.raf) cancelAnimationFrame(C.raf);
  const b = document.getElementById('btnStart');
  b.textContent = '▶ 再挑战一次';
  b.disabled = false;
  document.getElementById('resSub').textContent =
    '得分 ' + C.score + ' 分 · 解出 ' + C.solved + ' 题 · 难度「' + LV_NAME[state.lv] + '」';
  document.getElementById('nameInput').value = '';
  document.getElementById('resultModal').classList.add('on');
  setTimeout(() => document.getElementById('nameInput').focus(), 80);
}

/* ---------- 排行榜（本机浏览器存储）---------- */
function loadRank() { try { return JSON.parse(localStorage.getItem(RANK_KEY)) || []; } catch (e) { return []; } }
function saveRankStore(l) { try { localStorage.setItem(RANK_KEY, JSON.stringify(l)); } catch (e) { toast('浏览器存储不可用'); } }

function addRankItem(name, score, solved, lv) {
  const list = loadRank();
  const item = { name: name, score: score, solved: solved, lv: lv, ts: Date.now() };
  list.push(item);
  list.sort((a, b) => (b.score - a.score) || (b.solved - a.solved) || (a.ts - b.ts));
  saveRankStore(list.slice(0, 300));
  return item;
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fdate(ts) { const d = new Date(ts); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

function renderRank(highlightTs) {
  const list = loadRank();
  const body = document.getElementById('rankBody');
  if (!list.length) { body.innerHTML = '<div class="empty-rank">还没有成绩，快来做第一个挑战者！</div>'; return; }
  let h = '<table class="rank"><thead><tr><th>#</th><th>姓名</th><th>得分</th><th>解题</th><th>难度</th><th>时间</th></tr></thead><tbody>';
  list.slice(0, 50).forEach((r, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
    const me = (highlightTs && r.ts === highlightTs) ? ' class="me"' : '';
    h += '<tr' + me + '><td class="medal">' + medal + '</td><td class="nm">' + esc(r.name) + '</td>'
      + '<td class="sc">' + r.score + '</td><td class="meta">' + r.solved + ' 题</td>'
      + '<td class="meta">' + (LV_NAME[r.lv] || '-') + '</td><td class="meta">' + fdate(r.ts) + '</td></tr>';
  });
  h += '</tbody></table>';
  body.innerHTML = h;
}

function exportRank() {
  const list = loadRank();
  if (!list.length) { toast('还没有成绩'); return; }
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  let csv = '\ufeff排名,姓名,得分,解题数,难度,时间\n';
  list.forEach((r, i) => {
    csv += [i + 1, q(r.name), r.score, r.solved, q(LV_NAME[r.lv] || ''), q(new Date(r.ts).toLocaleString('zh-CN'))].join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const d = new Date();
  a.download = '24点挑战成绩_' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('已导出 CSV');
}

/* ---------- 模式切换 ---------- */
function setMode(m) {
  MODE = m;
  document.querySelectorAll('#modeBar button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  document.getElementById('practiceView').style.display = (m === 'practice') ? 'flex' : 'none';
  document.getElementById('challenge').classList.toggle('on', m === 'challenge');
  document.getElementById('footPractice').style.display = (m === 'practice') ? 'flex' : 'none';
  document.getElementById('footChallenge').style.display = (m === 'challenge') ? 'flex' : 'none';
  document.getElementById('timeLabel').textContent = (m === 'practice') ? '用时' : '剩余';
  document.getElementById('solvedItem').style.display = (m === 'challenge') ? 'flex' : 'none';
  if (m === 'challenge') {
    if (!C.list.length) cBuildList();
    if (!C.cw) cLoadQuestion();
    cUpdateHud();
  } else {
    state.startTs = Date.now(); state.elapsed = 0;
    buildOrder(); state.idx = 0; renderQuestion(false);   // ★ 每次进练习模式重新洗牌
    document.getElementById('timer').classList.remove('warn');
    document.getElementById('score').textContent = state.score;
  }
}

/* ---------- 挑战模式事件绑定 ---------- */
document.querySelectorAll('#cOps button').forEach(b => {
  b.onclick = () => {
    if (!C.running) { toast('先点「开始挑战」'); return; }
    if (C.sel === -1) { toast('先点一个数字，再点运算符'); return; }
    C.op = b.dataset.op;
    cRender();
    cFeedback(fStr(C.cards[C.sel].v) + ' ' + OPSIGN[C.op] + ' ?   再点一个数字', 'tip');
  };
});
document.getElementById('btnStart').onclick = cStart;
document.getElementById('cUndo').onclick = cUndo;
document.getElementById('cReset').onclick = () => { if (C.running) cResetQuestion(); };
document.getElementById('cSkip').onclick = cSkip;
document.getElementById('cRank').onclick = () => { renderRank(null); document.getElementById('rankModal').classList.add('on'); };

document.getElementById('saveRank').onclick = () => {
  const nm = document.getElementById('nameInput').value.trim().slice(0, 12);
  if (!nm) { toast('请输入名字'); document.getElementById('nameInput').focus(); return; }
  const it = addRankItem(nm, C.score, C.solved, state.lv);
  document.getElementById('resultModal').classList.remove('on');
  renderRank(it.ts);
  document.getElementById('rankModal').classList.add('on');
};
document.getElementById('skipSave').onclick = () => document.getElementById('resultModal').classList.remove('on');
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('saveRank').click(); }
});
document.getElementById('rankClose').onclick = () => document.getElementById('rankModal').classList.remove('on');
document.getElementById('rankExport').onclick = exportRank;
document.getElementById('rankClear').onclick = () => {
  if (!confirm('确定清空全部排行榜成绩？此操作不能撤销。')) return;
  saveRankStore([]);
  renderRank(null);
  toast('排行榜已清空');
};
document.querySelectorAll('#modeBar button').forEach(b => { b.onclick = () => setMode(b.dataset.mode); });

// ==== 启动 ====
buildOrder();
renderLevelBar();
document.body.style.background = LV_BG[1];
document.querySelector('header').style.borderBottomColor = LV_COLOR[1];
renderQuestion(false);
state.startTs = Date.now();
requestAnimationFrame(tick);
setMode('challenge');
setTimeout(() => toast('点「开始挑战」，60 秒内解出最多 24 点！'), 700);
</script>
