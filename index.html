<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小学教师工作台 · dadajs.cn</title>
<meta name="description" content="小学教师效率工作台集合：语文、英语、科学等学科工具，单文件离线可用。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎒</text></svg>">
<style>
:root{
  --ink:#5A4A5E; --ink-l:#8A7A8E; --ink-h:#3C3440;
  --white:#FFFDFD; --card:rgba(255,253,253,.94);
  --bg1:#FFF6FA; --bg2:#F2F7FF; --bg3:#F3FBF6;
  --line:rgba(90,74,94,.13);
  --radius:22px; --radius-s:14px;
  --shadow:0 4px 18px rgba(150,120,140,.10);
  --shadow-h:0 10px 28px rgba(150,120,140,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  color:var(--ink); min-height:100vh; line-height:1.6;
  background:
    radial-gradient(1100px 620px at 8% -8%, var(--bg1) 0%, transparent 58%),
    radial-gradient(980px 560px at 96% 4%, var(--bg2) 0%, transparent 56%),
    radial-gradient(900px 620px at 50% 104%, var(--bg3) 0%, transparent 58%),
    var(--white);
  background-attachment:fixed;
  padding:0 16px 56px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:940px;margin:0 auto}

header{text-align:center;padding:52px 0 30px}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:5px 15px;font-size:12.5px;color:var(--ink-l);margin-bottom:16px;
  box-shadow:var(--shadow);
}
h1{
  font-size:clamp(26px,5.2vw,38px);font-weight:800;margin:0 0 8px;
  letter-spacing:-.5px;color:var(--ink-h);
}
h1 .em{
  background:linear-gradient(96deg,#F79CB8,#BFA8E6 48%,#8CC6EA);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{font-size:14.5px;color:var(--ink-l);margin:0}
.sub b{color:var(--ink);font-weight:600}

.group{margin-top:26px}
.ghead{display:flex;align-items:center;gap:9px;margin:0 0 13px;padding:0 4px}
.gdot{width:11px;height:11px;border-radius:50%;flex:none}
.gtitle{font-size:15.5px;font-weight:700;color:var(--ink-h)}
.gcount{font-size:12px;color:var(--ink-l);background:var(--white);border:1px solid var(--line);border-radius:999px;padding:1px 9px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:13px}

.card{
  position:relative;display:block;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:17px 17px 15px;box-shadow:var(--shadow);
  transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s,border-color .18s;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent);opacity:.85;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:var(--accent)}
.card:active{transform:translateY(-1px)}
.card.soon{opacity:.56;cursor:default;pointer-events:none}
.card.soon::before{background:#B4B2A9}

.ic{
  width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:21px;background:var(--tint);margin-bottom:11px;
}
.name{font-size:16px;font-weight:700;color:var(--ink-h);margin:0 0 4px;display:flex;align-items:center;gap:7px}
.tag{
  font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;
  background:var(--tint);color:var(--accent);letter-spacing:.2px;
}
.desc{font-size:13px;color:var(--ink-l);margin:0 0 11px;min-height:38px}
.path{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11.5px;color:var(--accent);background:var(--tint);
  border-radius:7px;padding:3px 8px;display:inline-block;
}
.card.soon .path{background:#F1EFE8;color:#888780}

footer{text-align:center;margin-top:44px;font-size:12.5px;color:var(--ink-l);line-height:1.9}
footer a{color:var(--ink-l);text-decoration:none;border-bottom:1px dotted var(--line)}
footer a:hover{color:var(--ink)}
.tip{
  display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:4px 14px;font-size:12px;margin-top:10px;
}
@media(max-width:560px){
  header{padding:34px 0 22px}
  .grid{grid-template-columns:1fr}
  .desc{min-height:0}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="badge">🎒 单文件 · 离线可用 · 数据存在本机</div>
    <h1>小学<span class="em">教师工作台</span></h1>
    <p class="sub">按学科进入，目前上线 <b id="cnt">4</b> 个工具</p>
  </header>

  <main id="main"></main>

  <footer>
    <div>dadajs.cn · 谭政 制作 · 数据全部保存在你自己的浏览器里</div>
    <div class="tip">💡 手机上可「添加到主屏幕」，像 App 一样打开</div>
  </footer>

</div>

<script>
/* ========== 工作台清单：以后加新工具，改这里就行 ==========
   path  留空 = 还没上线，显示灰色「即将上线」
   accent 主色 / tint 浅色底 / icon 图标
=========================================================== */
var GROUPS = [
  {
    name:'语文', accent:'#D85A30', tint:'#FAECE7',
    items:[
      { icon:'📖', name:'一五班专用工作台', tag:'语文', path:'/yuwen/',
        desc:'座位表 · 加减分 · 随机抽签 · 课程表，班主任与语文老师日常' }
    ]
  },
  {
    name:'英语', accent:'#534AB7', tint:'#EEEDFE',
    items:[
      { icon:'🔤', name:'英语工作台', tag:'NEW', path:'/yingyu/',
        desc:'今日计划 · 课程表 · 学生追踪 · 教研助手等 13 个效率模块' },
      { icon:'🎮', name:'英语互动课堂', tag:'课堂', path:'/yingyu/game/',
        desc:'外研版新版三上四上共 12 单元，5 类游戏 + 计时器点名计分' }
    ]
  },
  {
    name:'科学', accent:'#3B6D11', tint:'#EAF3DE',
    items:[
      { icon:'🔬', name:'科学工作台 · 教案版', tag:'52份', path:'/kexue/',
        desc:'教科版四上五上全册教案，随备随查，含教案阅读与进度管理' }
    ]
  },
  {
    name:'通用', accent:'#993556', tint:'#FBEAF0',
    items:[
      { icon:'🐰', name:'哒哒工作台', tag:'母版', path:'/dada/',
        desc:'13 个效率模块通用版，其他工作台都由它改造而来' }
    ]
  },
  {
    name:'更多学科', accent:'#5F5E5A', tint:'#F1EFE8',
    items:[
      { icon:'🔢', name:'数学工作台', tag:'待建', path:'',
        desc:'预留位置，随时可以加进来' },
      { icon:'🎨', name:'综合 / 班会', tag:'待建', path:'',
        desc:'道法、综合实践、班会课工具，预留' }
    ]
  }
];

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function render(){
  var live = 0, html = '';
  GROUPS.forEach(function(g){
    g.items.forEach(function(it){ if(it.path) live++; });
    var cards = g.items.map(function(it){
      var on = !!it.path;
      return '<a class="card' + (on ? '' : ' soon') + '"'
        + (on ? ' href="' + esc(it.path) + '"' : '')
        + ' style="--accent:' + g.accent + ';--tint:' + g.tint + '">'
        + '<div class="ic">' + it.icon + '</div>'
        + '<div class="name">' + esc(it.name)
        + (it.tag ? '<span class="tag">' + esc(it.tag) + '</span>' : '')
        + '</div>'
        + '<p class="desc">' + esc(it.desc) + '</p>'
        + '<span class="path">dadajs.cn' + esc(it.path || '/待建') + '</span>'
        + '</a>';
    }).join('');
    html += '<section class="group">'
      + '<div class="ghead"><span class="gdot" style="background:' + g.accent + '"></span>'
      + '<span class="gtitle">' + esc(g.name) + '</span>'
      + '<span class="gcount">' + g.items.filter(function(i){return i.path;}).length + ' / ' + g.items.length + '</span>'
      + '</div><div class="grid">' + cards + '</div></section>';
  });
  document.getElementById('main').innerHTML = html;
  document.getElementById('cnt').textContent = live;
}

render();
</script>
</body>
</html>
