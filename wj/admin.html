<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>问卷数据看板 · 2026 城西科技节</title>
<style>
:root{--ink:#14213D;--ink2:#4A5875;--ink3:#8B97AD;--blue:#1A4F96;--blue-d:#0E2356;
--cyan:#17A8D8;--gold:#C9A227;--bg:#F2F6FB;--card:#fff;--line:#E3EAF4;--ok:#12A66A;--warn:#E8892C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.top{background:linear-gradient(160deg,#0E2356,#1A4F96);color:#fff;padding:22px 0 40px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.top h1{margin:0 0 4px;font-size:20px;font-weight:800}
.top p{margin:0;font-size:13px;color:rgba(255,255,255,.75)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.topact{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:8px 15px;font-family:inherit;font-size:13px;font-weight:600;
cursor:pointer;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn:hover{background:rgba(255,255,255,.26)}
.btn.solid{background:#fff;color:var(--blue-d);border-color:#fff}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:-24px}
.stat{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(20,33,61,.07);text-align:center}
.stat b{display:block;font-size:32px;line-height:1.15;color:var(--blue);font-weight:800}
.stat span{font-size:12.5px;color:var(--ink3)}

.card{background:var(--card);border-radius:14px;padding:20px;margin-top:16px;box-shadow:0 1px 4px rgba(20,33,61,.06)}
.card h2{margin:0 0 3px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .sub{font-size:12.5px;color:var(--ink3);margin:0 0 16px}

.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col{border:1px solid var(--line);border-radius:12px;padding:13px;background:#FCFDFF}
.col h3{margin:0 0 10px;font-size:13.5px;color:var(--blue);font-weight:700;
padding-bottom:8px;border-bottom:1px solid var(--line)}
.bar{margin-bottom:9px}
.bar-t{display:flex;justify-content:space-between;font-size:12.5px;gap:8px;margin-bottom:4px;line-height:1.35}
.bar-t span:first-child{flex:1}
.bar-t b{color:var(--blue);font-weight:700;white-space:nowrap}
.bar-b{height:7px;border-radius:4px;background:#E9EFF7;overflow:hidden}
.bar-b i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#3E86D8,#1A4F96);transition:width .4s}
.bar.hi .bar-b i{background:linear-gradient(90deg,#E0B93C,#B8901C)}
.empty{color:var(--ink3);font-size:12.5px;text-align:center;padding:22px 0}

.avgbox{display:flex;gap:10px;flex-wrap:wrap}
.avg{flex:1;min-width:112px;background:#F5F9FE;border:1px solid #E1EBF7;border-radius:11px;padding:11px 13px;text-align:center}
.avg b{display:block;font-size:23px;color:var(--blue);line-height:1.2;font-weight:800}
.avg span{font-size:11.5px;color:var(--ink3)}
.avg small{display:block;font-size:10.5px;color:#A8542A;margin-top:2px}

.qblock{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.qblock:first-of-type{border-top:0;padding-top:0;margin-top:0}
.qt{font-size:13.5px;font-weight:600;margin:0 0 9px;color:var(--ink)}
.qt em{font-style:normal;color:var(--ink3);font-weight:400;font-size:11.5px;margin-left:6px}
.txtlist{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 0;background:#FCFDFF}
.txtitem{padding:8px 13px;font-size:13px;line-height:1.6;border-bottom:1px dashed #EDF2F8;color:var(--ink2)}
.txtitem:last-child{border-bottom:0}
.txtitem i{color:var(--gold);font-style:normal;margin-right:7px;font-size:11px}

.tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#FCFDFF;border-radius:8px;padding:6px 14px;
font-family:inherit;font-size:13px;cursor:pointer;color:var(--ink2)}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}

.lock{max-width:360px;margin:100px auto;background:#fff;border-radius:16px;padding:30px;
box-shadow:0 8px 30px rgba(20,33,61,.1);text-align:center}
.lock h2{margin:0 0 6px;font-size:18px}
.lock p{margin:0 0 18px;font-size:13px;color:var(--ink3)}
.lock input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;
font-family:inherit;font-size:15px;text-align:center;letter-spacing:.15em}
.lock button{width:100%;margin-top:12px;border:0;border-radius:10px;padding:12px;background:var(--blue);
color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.hint{font-size:11.5px;color:var(--ink3);margin-top:12px}
@media(max-width:820px){
  .cmp{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr 1fr;gap:9px}
  .stat b{font-size:25px}
}
</style>
</head>
<body>

<div id="lockView">
  <div class="lock">
    <h2>问卷数据看板</h2>
    <p>2026 城西科技节 · 活动后反馈</p>
    <input id="keyInput" type="password" placeholder="输入密码" autocomplete="off">
    <button onclick="login()">进入</button>
    <div class="hint">仅限活动组织者使用</div>
  </div>
</div>

<div id="mainView" style="display:none">
  <div class="top">
    <div class="wrap">
      <div class="topbar">
        <div>
          <h1>活动后问卷 · 数据看板</h1>
          <p id="meta">—</p>
        </div>
        <div class="topact">
          <button class="btn" onclick="load()">刷新</button>
          <button class="btn" onclick="dl('t')">导出老师</button>
          <button class="btn" onclick="dl('s')">导出家长</button>
          <button class="btn" onclick="dl('b')">导出摊主</button>
          <button class="btn solid" onclick="dl('all')">导出全部 CSV</button>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap" style="padding-bottom:60px">
    <div class="grid3">
      <div class="stat"><b id="cT">0</b><span>老师</span></div>
      <div class="stat"><b id="cS">0</b><span>学生 / 家长</span></div>
      <div class="stat"><b id="cB">0</b><span>小摊主</span></div>
    </div>

    <div class="card">
      <h2>🎯 下一次怎么办 · 三方对照</h2>
      <p class="sub">这是本次问卷最核心的一题：老师、家长、小摊主各自怎么选，直接决定下一次活动怎么办。</p>
      <div class="cmp" id="newyearCmp"></div>
    </div>

    <div class="card">
      <h2>💪 老师辛苦了没</h2>
      <p class="sub">累不累、累在哪，下次排人手的依据。</p>
      <div id="teacherLoad"></div>
    </div>

    <div class="card">
      <h2>🎪 小摊主的成长曲线</h2>
      <p class="sub">从「木木不敢开口」到「立刻上岗」，就看这两个分布。</p>
      <div id="boothGrow"></div>
    </div>

    <div class="card">
      <h2>📋 全部题目明细</h2>
      <p class="sub">按问卷切换查看每题分布与原始作答。</p>
      <div class="tabs">
        <button class="tab on" data-r="t" onclick="switchTab('t',this)">老师问卷</button>
        <button class="tab" data-r="s" onclick="switchTab('s',this)">学生 / 家长</button>
        <button class="tab" data-r="b" onclick="switchTab('b',this)">小摊主</button>
      </div>
      <div id="detail"></div>
    </div>
  </div>
</div>

<script>
/* 主域名（GitHub Pages 静态版）跨域调 api 域名 */
var API = (function(){
  var h = location.hostname;
  if (h === 'kexvefuxi.cn' || h === 'www.kexvefuxi.cn' || h === 'dadajs.cn')
    return 'https://api.kexvefuxi.cn/wj/api';
  return 'api';
})();
var KEY = '';
var DATA = null;
var curRole = 't';

var ROLE_NAME = { t:'老师', s:'学生家长', b:'小摊主' };

/* 题干与选项元数据（与问卷页保持一致，只用于展示） */
var QMETA = {
  t_role:{t:'您的身份',o:['班主任','摊位指导老师（带学生摆摊）','行政 / 后勤保障','科任教师（这次没直接参与摊位）','其他']},
  t_depth:{t:'这次您实际投入的程度',o:['全程扎在自己的摊位上','带班参观，同时兼顾本班摊位','主要是带班走场','主要在后勤 / 场地 / 拍摄','基本是旁观']},
  t_before:{t:'活动前对「学生当摊主」的信心',scale:['完全没底','很有信心']},
  t_expect:{t:'活动前最期待看到什么',text:1},
  t_satisfy:{t:'整体办得怎么样',scale:['不太行','非常成功']},
  t_rate:{t:'分项打分',matrix:['学生参与的热度','摊位内容的水平','现场秩序','时间节奏（三批次）','学生自主的程度','对孩子的成长价值']},
  t_beyond:{t:'最超出预期的一点',text:1},
  t_gap:{t:'最没达到预期、最该改的一点',text:1},
  t_tired:{t:'这次活动累不累',scale:['很轻松','非常累']},
  t_tired_why:{t:'累主要来自',o:['摊位看管和讲解','学生纪律','场地布置、搬桌椅','活动时间太长','人手不够','家长沟通','收尾清理','其实不太累']},
  t_load:{t:'下次同样规模愿意承担',o:['比这次少一些','和这次差不多','可以再多担一些']},
  t_newyear:{t:'下一次还办，倾向哪种形式',o:['学生自主策划摆摊（延续这次）','老师组织文艺表演 / 汇演（往年那种）','两者结合：白天摆摊 + 舞台汇演','不搞大型活动，正常上课','再说，先看看别的老师怎么说']},
  t_freq:{t:'这种科技节多久办一次合适（何敏敏老师提议）',o:['一年一次','一个学期一次','三个月一次','一个月一次','每周一次','不再举办']},
  t_plan:{t:'以后该不该多让学生自己做策划',scale:['完全不该','非常应该']},
  t_worry:{t:'让学生策划最担心什么',o:['安全问题','现场秩序乱','内容质量不够','老师反而更累','家长不理解','占用课时','学生三分钟热度','不太担心']},
  t_keep:{t:'最值得保留的一个做法',text:1},
  t_advice:{t:'给下一次的一句话建议',text:1},

  s_grade:{t:'你在读几年级',o:['一年级','二年级','三年级','四年级','五年级','六年级']},
  s_count:{t:'今天大概逛了几个摊位',o:['1 ~ 3 个','4 ~ 6 个','7 ~ 10 个','10 个以上','记不清了']},
  s_like:{t:'今天哪个摊位让你印象最深',rank:1},
  s_why:{t:'为什么这个摊位让你印象最深',text:1},
  s_form:{t:'你最喜欢哪种摊位',o:['能自己动手做、动手玩','看别人表演','听人讲解','比赛、拿奖、盖章集章','自己当摊主卖东西']},
  s_be_booth:{t:'今天有没有冒出「我也想摆个摊」的念头',o:['有，很强烈','有一点','没有']},
  s_apply:{t:'下次公开招募摊主，你会自己报名吗',o:['会，我想自己申报一个','会，但我想和同学一起搞','看情况，要看搞什么','不会，我更想当游客']},
  s_boring:{t:'觉得「没什么意思」的摊位',text:1},
  s_newyear:{t:'下一次更希望是',o:['像今天这样，学生自己摆摊','老师安排节目表演（唱歌跳舞那种）','两种都要','都行，说不清']},
  s_plan:{t:'你想自己策划什么摊位',text:1},
  s_better:{t:'这次活动哪些地方需要改进（学生的建议）',text:1},
  s_word:{t:'一句话说说今天的感受',text:1},

  b_name:{t:'摊位名字',text:1},
  b_role:{t:'在摊位里主要负责',o:['摊主（总负责）','摊主助手','讲解介绍','收银 / 兑换 / 盖章','秩序维持','摄影、广播等工作人员']},
  b_prep:{t:'事前准备了多久',o:['当天才临时准备','1 ~ 2 天','一周左右','更久，一直在打磨']},
  b_feel_before:{t:'开摊之前的感觉',o:['紧张，不知道该怎么开口','有点期待','特别兴奋','没什么感觉']},
  b_warmup:{t:'大概多久就上手了',o:['一开摊就会','几分钟','半小时左右','一两个小时','到现在还没太会']},
  b_gain:{t:'最大的收获',o:['敢主动跟不认识的人说话了','能把我的东西讲清楚了','会处理排队和插队','会算账、找零','和队友分工配合','遇到问题自己想办法解决','被人夸的时候特别有成就感','好像没什么收获']},
  b_proud:{t:'最有成就感的时刻',text:1},
  b_hard:{t:'遇到为难或难受的事',o:['有人不排队、插队','有人嫌贵或者不相信我们','东西被弄坏、弄乱了','太累了有点撑不住','一直没人来我的摊位','同学之间闹了矛盾','没有遇到']},
  b_support:{t:'下次最希望得到的支持',o:['更好的位置','更多物料和道具','多几个人手','提前培训怎么讲解','家长来帮忙','广播帮忙宣传','中间能有休息时间']},
  b_again:{t:'还想再当一次摊主吗',scale:['完全不想','非常想']},
  b_newyear:{t:'下一次如果搞活动，你愿意',o:['自己策划一个全新的摊位','还做这次这个，做得更好','当工作人员，不当摊主','只想当游客逛逛']},
  b_teach:{t:'想对第一次当摊主的同学说什么',text:1}
};

var ORDER = {
  t:['t_role','t_depth','t_before','t_expect','t_satisfy','t_rate','t_beyond','t_gap','t_tired','t_tired_why','t_load','t_newyear','t_freq','t_plan','t_worry','t_keep','t_advice'],
  s:['s_grade','s_count','s_like','s_why','s_form','s_be_booth','s_apply','s_boring','s_newyear','s_plan','s_better','s_word'],
  b:['b_name','b_role','b_prep','b_feel_before','b_warmup','b_gain','b_proud','b_hard','b_support','b_again','b_newyear','b_teach']
};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function login(){
  var v = document.getElementById('keyInput').value.trim();
  if(!v){ alert('请输入密码'); return; }
  KEY = v;
  sessionStorage.setItem('cx_survey_key', KEY);
  load(true);
}

function load(fromLogin){
  fetch(API + '/stats?key=' + encodeURIComponent(KEY))
    .then(r => r.json())
    .then(function(d){
      if(!d.ok){ alert(d.error || '加载失败（密码可能不对）'); sessionStorage.removeItem('cx_survey_key'); return; }
      DATA = d;
      document.getElementById('lockView').style.display = 'none';
      document.getElementById('mainView').style.display = '';
      renderAll();
    })
    .catch(function(){ alert('网络错误，请稍后重试'); });
}

function renderAll(){
  document.getElementById('cT').textContent = DATA.roles.t.count;
  document.getElementById('cS').textContent = DATA.roles.s.count;
  document.getElementById('cB').textContent = DATA.roles.b.count;

  var days = Object.keys(DATA.days || {}).sort();
  document.getElementById('meta').textContent = '共 ' + DATA.total + ' 份 · ' +
    (days.length ? days.map(d => d + ' ' + DATA.days[d] + '份').join('，') : '暂无数据') +
    ' · 更新于 ' + new Date().toLocaleTimeString('zh-CN');

  renderNewyear();
  renderTeacherLoad();
  renderBoothGrow();
  renderDetail(curRole);
}

/* 三份「下一次怎么办」并排 */
function renderNewyear(){
  var map = [
    { r:'t', q:'t_newyear', name:'老师怎么想' },
    { r:'s', q:'s_newyear', name:'学生 / 家长怎么想' },
    { r:'b', q:'b_newyear', name:'小摊主怎么想' }
  ];
  var html = '';
  var maxPct = 0, tmp = [];
  map.forEach(function(m){
    var q = (DATA.roles[m.r].questions || {})[m.q];
    tmp.push(q);
    if(q) Object.keys(q.opts || {}).forEach(function(k){ maxPct = Math.max(maxPct, q.opts[k]); });
  });
  map.forEach(function(m, i){
    var q = tmp[i];
    var cnt = DATA.roles[m.r].count;
    html += '<div class="col"><h3>' + m.name + '<span style="float:right;font-weight:400;color:#8B97AD">' + cnt + ' 份</span></h3>';
    if(!q || !Object.keys(q.opts || {}).length){ html += '<div class="empty">还没有作答</div></div>'; return; }
    var opts = QMETA[m.q].o;
    var sorted = opts.slice().sort(function(a,b){ return (q.opts[b]||0) - (q.opts[a]||0); });
    sorted.forEach(function(o, idx){
      var n = q.opts[o] || 0;
      var pct = cnt ? Math.round(n / cnt * 100) : 0;
      var w = maxPct ? Math.round(n / maxPct * 100) : 0;
      html += '<div class="bar' + (idx === 0 && n > 0 ? ' hi' : '') + '">' +
        '<div class="bar-t"><span>' + esc(o) + '</span><b>' + n + ' 人 · ' + pct + '%</b></div>' +
        '<div class="bar-b"><i style="width:' + w + '%"></i></div></div>';
    });
    html += '</div>';
  });
  document.getElementById('newyearCmp').innerHTML = html;
}

function renderTeacherLoad(){
  var q = DATA.roles.t.questions || {};
  var h = '<div class="avgbox">';
  h += avgCard('劳累程度（1轻松-5很累）', q.t_tired);
  h += avgCard('活动前信心（1-5）', q.t_before);
  h += avgCard('整体满意度（1-5）', q.t_satisfy);
  h += avgCard('该不该让学生策划（1-5）', q.t_plan);
  h += '</div>';
  h += bars(q.t_freq, QMETA.t_freq.o, DATA.roles.t.count, '这种科技节多久办一次合适（何敏敏老师提议）');
  h += bars(q.t_tired_why, QMETA.t_tired_why.o, DATA.roles.t.count, '累主要来自哪里');
  h += bars(q.t_load, QMETA.t_load.o, DATA.roles.t.count, '下次愿意承担的工作量');
  h += textList(q.t_advice, '给下一次的一句话建议');
  document.getElementById('teacherLoad').innerHTML = h;
}

function renderBoothGrow(){
  var q = DATA.roles.b.questions || {};
  var h = '<div class="avgbox">';
  h += avgCard('还想再当摊主（1-5）', q.b_again);
  h += '</div>';
  h += bars(q.b_feel_before, QMETA.b_feel_before.o, DATA.roles.b.count, '开摊之前的感觉');
  h += bars(q.b_warmup, QMETA.b_warmup.o, DATA.roles.b.count, '多久就上手了');
  h += bars(q.b_gain, QMETA.b_gain.o, DATA.roles.b.count, '最大的收获（多选，按提及次数）');
  h += textList(q.b_proud, '最有成就感的时刻');
  h += textList(q.b_teach, '想对第一次当摊主的同学说什么');
  document.getElementById('boothGrow').innerHTML = h;
}

function avgCard(label, q){
  if(!q || q.avg === undefined) return '<div class="avg"><b>—</b><span>' + label + '</span></div>';
  return '<div class="avg"><b>' + q.avg + '</b><span>' + label + '</span><small>' + q.count + ' 人作答</small></div>';
}

function bars(q, optList, total, title){
  if(!q || !Object.keys(q.opts || {}).length) return '';
  var max = 0;
  Object.keys(q.opts).forEach(function(k){ max = Math.max(max, q.opts[k]); });
  var h = '<div class="qblock"><p class="qt">' + esc(title) + '<em>' + q.count + ' 人作答</em></p>';
  optList.forEach(function(o){
    var n = q.opts[o] || 0;
    if(!n && !optList.length) return;
    var pct = total ? Math.round(n / total * 100) : 0;
    var w = max ? Math.round(n / max * 100) : 0;
    h += '<div class="bar"><div class="bar-t"><span>' + esc(o) + '</span><b>' + n + ' 人 · ' + pct + '%</b></div>' +
      '<div class="bar-b"><i style="width:' + w + '%"></i></div></div>';
  });
  return h + '</div>';
}

function textList(q, title){
  if(!q || !q.values || !q.values.length) return '';
  var h = '<div class="qblock"><p class="qt">' + esc(title) + '<em>' + q.values.length + ' 条</em></p><div class="txtlist">';
  q.values.slice(0, 120).forEach(function(v, i){
    h += '<div class="txtitem"><i>' + (i+1) + '</i>' + esc(v) + '</div>';
  });
  return h + '</div></div>';
}

function switchTab(role, el){
  curRole = role;
  [].forEach.call(document.querySelectorAll('.tab'), function(t){ t.classList.remove('on'); });
  el.classList.add('on');
  renderDetail(role);
}

function renderDetail(role){
  var qs = DATA.roles[role].questions || {};
  var total = DATA.roles[role].count;
  var h = '';
  ORDER[role].forEach(function(qid, i){
    var q = qs[qid], meta = QMETA[qid];
    if(!meta) return;
    if(!q){ return; }
    h += '<div class="qblock"><p class="qt">Q' + (i+1) + ' ' + esc(meta.t) + '<em>' + (q.count||0) + ' 人作答</em></p>';
    if(meta.text){
      if(q.values && q.values.length){
        h += '<div class="txtlist">';
        q.values.slice(0, 200).forEach(function(v, k){ h += '<div class="txtitem"><i>' + (k+1) + '</i>' + esc(v) + '</div>'; });
        h += '</div>';
      } else h += '<div class="empty">暂无文字作答</div>';
    }
    else if(meta.scale){
      var dist = q.dist || [0,0,0,0,0];
      var maxd = Math.max.apply(null, dist.concat([1]));
      h += '<div style="font-size:12.5px;color:#8B97AD;margin-bottom:9px">平均 <b style="color:#1A4F96;font-size:15px">' + (q.avg!==undefined?q.avg:'—') + '</b> 分（' + esc(meta.scale[0]) + ' → ' + esc(meta.scale[1]) + '）</div>';
      for(var i2=1;i2<=5;i2++){
        var n = dist[i2-1];
        h += '<div class="bar"><div class="bar-t"><span>' + i2 + ' 分</span><b>' + n + ' 人</b></div>' +
          '<div class="bar-b"><i style="width:' + Math.round(n/maxd*100) + '%"></i></div></div>';
      }
    }
    else if(meta.matrix){
      h += '<div class="avgbox" style="margin-bottom:10px">';
      meta.matrix.forEach(function(row, ri){
        var m = (q.matrix || {})[ri];
        h += '<div class="avg"><b>' + (m ? m.avg : '—') + '</b><span style="font-size:11px">' + esc(row) + '</span></div>';
      });
      h += '</div>';
    }
    else if(meta.rank){
      var arr = Object.keys(q.opts || {}).map(function(k){ return { k:k, n:q.opts[k] }; })
        .sort(function(a,b){ return b.n - a.n; });
      var mx = arr.length ? arr[0].n : 1;
      if(!arr.length){ h += '<div class="empty">暂无作答</div>'; }
      arr.forEach(function(o, oi){
        var pct = total ? Math.round(o.n / total * 100) : 0;
        h += '<div class="bar' + (oi === 0 && o.n > 0 ? ' hi' : '') + '">' +
          '<div class="bar-t"><span>' + (oi+1) + '. ' + esc(o.k) + '</span><b>' + o.n + ' 票 · ' + pct + '%</b></div>' +
          '<div class="bar-b"><i style="width:' + Math.round(o.n / mx * 100) + '%"></i></div></div>';
      });
    }
    else if(meta.o){
      var max2 = 0;
      Object.keys(q.opts||{}).forEach(function(k){ max2 = Math.max(max2, q.opts[k]); });
      meta.o.forEach(function(o){
        var n = q.opts[o] || 0;
        var pct = total ? Math.round(n/total*100) : 0;
        var w = max2 ? Math.round(n/max2*100) : 0;
        h += '<div class="bar"><div class="bar-t"><span>' + esc(o) + '</span><b>' + n + ' 人 · ' + pct + '%</b></div>' +
          '<div class="bar-b"><i style="width:' + w + '%"></i></div></div>';
      });
      // 多选里出现的非预置选项（理论上不会有）
      Object.keys(q.opts||{}).forEach(function(k){
        if(meta.o.indexOf(k) < 0){
          h += '<div class="bar"><div class="bar-t"><span>' + esc(k) + '</span><b>' + q.opts[k] + ' 人</b></div>' +
            '<div class="bar-b"><i style="width:100%"></i></div></div>';
        }
      });
    }
    h += '</div>';
  });
  if(!h) h = '<div class="empty">这份问卷还没有收到作答</div>';
  document.getElementById('detail').innerHTML = h;
}

function dl(role){
  location.href = API + '/export?key=' + encodeURIComponent(KEY) + '&role=' + role;
}

(function boot(){
  var saved = sessionStorage.getItem('cx_survey_key');
  if(saved){ KEY = saved; load(true); }
})();
</script>
