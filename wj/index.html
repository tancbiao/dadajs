<html lang="zh-CN">
<head>

<style>
:root{
  --ink:#14213D; --ink2:#4A5875; --ink3:#8B97AD;
  --blue:#1A4F96; --blue-d:#0E2356; --cyan:#17A8D8; --gold:#C9A227;
  --bg:#F2F6FB; --card:#FFFFFF; --line:#E3EAF4;
  --ok:#12A66A; --warn:#E8892C;
  --r:16px;
  --sh:0 2px 10px rgba(20,33,61,.06), 0 8px 28px rgba(20,33,61,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 120px}
.hide{display:none!important}

/* ---------- 顶部 ---------- */
.hero{
  background:linear-gradient(160deg,#0E2356 0%,#1A4F96 52%,#1778B8 100%);
  color:#fff;padding:26px 16px 30px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-56px;top:-56px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,162,39,.34),rgba(201,162,39,0) 68%);
}
.hero-inner{max-width:620px;margin:0 auto;position:relative;z-index:1}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);
  color:#fff;font-size:12px;letter-spacing:.06em;padding:4px 11px;border-radius:999px;
}
.hero h1{font-size:23px;line-height:1.32;margin:12px 0 6px;font-weight:800;letter-spacing:-.2px}
.hero p{margin:0;font-size:13.5px;color:rgba(255,255,255,.82);line-height:1.6}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px 18px;margin-top:14px}
.card-h{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin:0 0 4px}
.card-sub{font-size:13px;color:var(--ink3);margin:0 0 14px}

/* ---------- 角色选择 ---------- */
.pick{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  padding:17px 16px;margin-top:12px;cursor:pointer;font-family:inherit;
  transition:border-color .16s,transform .1s,box-shadow .16s;
  box-shadow:0 1px 3px rgba(20,33,61,.04);
}
.pick:active{transform:scale(.985)}
.pick:hover{border-color:#A9C4E8;box-shadow:0 4px 16px rgba(26,79,150,.12)}
.grp-title{font-size:13px;color:var(--ink3);letter-spacing:.04em;
  margin:2px 0 12px;display:flex;align-items:center;gap:10px}
.grp-title::after{content:"";flex:1;height:1px;background:var(--line)}
.pick.rep .ico{background:#EAF7F1}
.pick.rep .tt{color:#0E8F5E}

.pick .ico{
  flex:0 0 46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:#EAF2FC;
}
.pick.b .ico{background:#FDF4E0}
.pick.c .ico{background:#E7F6F1}
.pick.rep .ico{background:#EAF7F1}
.pick.rep .tt{color:#0E8F5E}
.pick .txt{flex:1;min-width:0}
.pick .tt{display:block;font-size:16px;font-weight:700;margin-bottom:2px;line-height:1.4}
.pick .dd{display:block;font-size:12.5px;color:var(--ink3);line-height:1.5}
.pick .go{flex:0 0 auto;color:var(--ink3);font-size:19px;line-height:1}
.foot-note{text-align:center;font-size:12px;color:var(--ink3);margin-top:26px;line-height:1.8}
.foot-note b{color:var(--ink2);font-weight:600}

/* ---------- 进度条 ---------- */
.prog{position:fixed;top:0;left:0;right:0;height:3px;background:rgba(26,79,150,.1);z-index:60}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#17A8D8,#1A4F96);transition:width .25s}

/* ---------- 问卷 ---------- */
.qhead{
  background:linear-gradient(160deg,#0E2356,#1A4F96);color:#fff;padding:18px 16px 22px;
  position:relative;overflow:hidden;
}
.qhead::after{
  content:"";position:absolute;left:-40px;bottom:-70px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(23,168,216,.3),rgba(23,168,216,0) 70%);
}
.qhead-in{max-width:620px;margin:0 auto;position:relative;z-index:1}
.qhead h2{margin:0 0 5px;font-size:19px;font-weight:800;letter-spacing:-.2px}
.qhead p{margin:0;font-size:13px;color:rgba(255,255,255,.8)}
.back{
  background:rgba(255,255,255,.15);border:0;color:#fff;font-size:13px;font-family:inherit;
  padding:5px 12px;border-radius:999px;margin-bottom:10px;cursor:pointer;
}

.sec{margin-top:22px}
.sec-t{
  font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--blue);
  display:flex;align-items:center;gap:8px;margin:0 0 2px;padding-left:2px;
}
.sec-t::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#CBDCF0,transparent)}

.q{background:var(--card);border-radius:var(--r);padding:18px 16px;margin-top:11px;box-shadow:0 1px 4px rgba(20,33,61,.05)}
.q-n{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.08em;margin-bottom:5px}
.q-t{font-size:15.5px;font-weight:600;line-height:1.55;margin:0 0 3px}
.q-t em{color:var(--warn);font-style:normal;font-size:11px;font-weight:600;margin-left:5px;vertical-align:top}
.q-h{font-size:12.5px;color:var(--ink3);margin:0 0 12px;line-height:1.55}
.q-by{display:inline-block;font-size:11.5px;color:#9A7311;background:#FDF6E3;border:1px solid #F0E3BC;
border-radius:99px;padding:2px 10px;margin:2px 0 10px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:11px}
.opts.cols2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.cols2 .opt{padding:11px 10px;font-size:14px}
.opt{
  display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  border:1.5px solid var(--line);background:#FCFDFF;border-radius:11px;
  padding:11px 13px;font-size:14.5px;font-family:inherit;color:var(--ink);
  cursor:pointer;transition:.15s;line-height:1.45;
}
.opt:active{transform:scale(.99)}
.opt .dot{
  flex:0 0 19px;height:19px;border-radius:50%;border:2px solid #C6D4E6;
  margin-top:1px;position:relative;transition:.15s;
}
.opt .dot.sq{border-radius:6px}
.opt.on{border-color:var(--blue);background:#EEF5FE;color:var(--blue-d);font-weight:600}
.opt.on .dot{border-color:var(--blue);background:var(--blue)}
.opt.on .dot::after{
  content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;
  border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg);
}
.opt.on .dot.sq::after{left:5.5px;top:2.5px}

/* 分组选项（摊位多时按类折叠） */
.groups{margin-top:11px}
.grp{border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;background:#FCFDFF;transition:.15s}
.grp.open{border-color:#A9C4E8;background:#fff;box-shadow:0 2px 10px rgba(26,79,150,.07)}
.grp.picked{border-color:#8FD3B4;background:#F5FCF8}
.grp-h{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;font-family:inherit;
padding:12px 13px;cursor:pointer;text-align:left;font-size:14.5px;font-weight:700;color:var(--ink)}
.grp-n{flex:0 0 auto}
.grp-pick{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--ok);
overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.grp-c{font-size:11.5px;color:var(--ink3);font-weight:400;flex:0 0 auto}
.grp-x{flex:0 0 15px;text-align:center;color:var(--ink3);font-weight:400;font-size:15px;line-height:1}
.grp.open .grp-x{color:var(--blue)}
.grp-b{display:none;padding:3px 9px 11px;grid-template-columns:1fr 1fr;gap:7px}
.grp.open .grp-b{display:grid}
.grp-b .opt{padding:10px 9px;font-size:13.5px}
.grp-b .opt .dot{flex:0 0 17px;height:17px;margin-top:0}
.grp-b .opt .dot::after{left:4.5px;top:1.5px;width:4px;height:8px}
.grpextra{margin-top:2px}
.grpextra .opt{font-size:13.5px;padding:10px 12px}

/* 评分 */
.scale{display:flex;gap:7px;margin-top:12px}
.scale button{
  flex:1;border:1.5px solid var(--line);background:#FCFDFF;border-radius:11px;
  padding:11px 0 9px;font-family:inherit;cursor:pointer;transition:.15s;
}
.scale button b{display:block;font-size:17px;font-weight:700;color:var(--ink2);line-height:1.2}
.scale button span{display:block;font-size:10px;color:var(--ink3);margin-top:2px;transform:scale(.92)}
.scale button.on{background:var(--blue);border-color:var(--blue)}
.scale button.on b,.scale button.on span{color:#fff}
.scale-legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-top:7px}

/* 矩阵 */
.mx{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mx-row{display:flex;align-items:center;gap:6px;padding:9px 10px;border-bottom:1px solid var(--line);background:#fff}
.mx-row:last-child{border-bottom:0}
.mx-row:nth-child(even){background:#FAFCFE}
.mx-lab{flex:1;font-size:13.5px;line-height:1.35;color:var(--ink)}
.mx-pick{display:flex;gap:4px}
.mx-pick button{
  width:29px;height:29px;border-radius:8px;border:1.5px solid var(--line);background:#fff;
  font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink3);cursor:pointer;padding:0;transition:.12s;
}
.mx-pick button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.mx-head{display:flex;padding:7px 10px 6px;background:#F3F7FC;font-size:10.5px;color:var(--ink3);align-items:center}
.mx-head .mx-lab{font-size:11px}
.mx-head .mx-pick{display:flex;gap:4px;width:153px;justify-content:space-between;padding:0 1px}
.mx-head .mx-pick i{width:29px;text-align:center;font-style:normal}

/* 文本 */
textarea{
  width:100%;border:1.5px solid var(--line);border-radius:11px;background:#FCFDFF;
  padding:11px 13px;font-family:inherit;font-size:14.5px;line-height:1.6;color:var(--ink);
  resize:vertical;min-height:68px;transition:.15s;
}
textarea:focus{outline:0;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(26,79,150,.08)}
textarea::placeholder{color:#AEBBCC}
.cnt{text-align:right;font-size:11px;color:var(--ink3);margin-top:5px}

/* 底部提交 */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:11px 16px calc(11px + env(safe-area-inset-bottom));
}
.bar-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar-tip{font-size:12px;color:var(--ink3);flex:1;line-height:1.4}
.bar-tip b{color:var(--blue);font-weight:700}
.btn{
  border:0;border-radius:12px;background:linear-gradient(135deg,#1A4F96,#0E2356);color:#fff;
  font-family:inherit;font-size:15.5px;font-weight:700;padding:13px 30px;cursor:pointer;
  letter-spacing:.02em;box-shadow:0 4px 14px rgba(26,79,150,.28);transition:.15s;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;box-shadow:none}
.btn.gold{background:linear-gradient(135deg,#D9B23A,#B8901C);box-shadow:0 4px 14px rgba(201,162,39,.3)}

/* 完成页 */
.done{text-align:center;padding:52px 20px 40px}
.done .ring{
  width:78px;height:78px;border-radius:50%;margin:0 auto 20px;
  background:linear-gradient(135deg,#12A66A,#0B8A55);display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px rgba(18,166,106,.28);animation:pop .45s cubic-bezier(.2,1.4,.5,1);
}
.done .ring svg{width:36px;height:36px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.done h2{font-size:21px;margin:0 0 8px;font-weight:800}
.done p{color:var(--ink2);font-size:14.5px;margin:0 auto;max-width:400px;line-height:1.7}
.done .stat{
  display:inline-flex;gap:20px;margin-top:24px;background:#fff;border-radius:14px;
  padding:13px 22px;box-shadow:var(--sh);
}
.done .stat div{text-align:center}
.done .stat b{display:block;font-size:19px;color:var(--blue);line-height:1.3}
.done .stat span{font-size:11px;color:var(--ink3)}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);
  background:rgba(20,33,61,.92);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:11px;
  opacity:0;pointer-events:none;transition:.24s;z-index:99;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.err{border-color:#E88!important;background:#FFF6F6!important}
@media (max-width:359px){
  .hero h1{font-size:20px}
  .scale button b{font-size:15px}
  .mx-pick button{width:26px;height:26px;font-size:11.5px}
  .mx-head .mx-pick{width:138px}
}
</style>
</head>
<body>

<div class="prog hide" id="prog"><i></i></div>

<!-- ============ 首页：选身份 ============ -->
<div id="home">
  <div class="grp-title">2026 霜降科技节 · 活动后问卷（10 月 29 日）</div>
  <div class="hero">
    <div class="hero-inner">
      <span class="badge">天等县城西小学 · 问卷中心</span>
      <h1>问卷中心</h1>
      <p>每次活动一份匿名问卷，不记名、不收集联系方式，填完即可看数据结果。</p>
    </div>
  </div>
  <div class="wrap" style="padding-bottom:60px;margin-top:-18px">
    <div style="position:relative">
      <button class="pick a" onclick="go('t')">
        <span class="ico">🏫</span>
        <span class="txt">
          <span class="tt">我是老师</span>
          <span class="dd">想法、效果、累不累，下次怎么搞</span>
        </span>
        <span class="go">›</span>
      </button>
      <button class="pick b" onclick="go('s')">
        <span class="ico">👨‍👩‍👧</span>
        <span class="txt">
          <span class="tt">我是学生（家长协助）</span>
          <span class="dd">今天哪个摊位让你印象最深，下次想怎么玩</span>
        </span>
        <span class="go">›</span>
      </button>
      <button class="pick c" onclick="go('b')">
        <span class="ico">🎪</span>
        <span class="txt">
          <span class="tt">我是小摊主 / 学生工作人员</span>
          <span class="dd">摆摊的收获、上手的过程、还想不想再来</span>
        </span>
        <span class="go">›</span>
      </button>
    </div>
    <button class="pick rep" onclick="location.href='report.html'">
      <span class="ico">📊</span>
      <span class="txt">
        <span class="tt">问卷分析报告（已出）</span>
        <span class="dd">623 份问卷的数据结果与改进清单 · 点开即看</span>
      </span>
      <span class="go">›</span>
    </button>

    <p class="foot-note">
      <b>全部匿名</b>，不收集姓名和手机号<br>
      结果只用于本次复盘和下一次活动策划<br>
      学生问卷请让孩子自己作答，家长只帮忙点选项和打字<br>更多问卷将陆续上线，往后的每一次活动都在这里
    </p>
  </div>
</div>

<!-- ============ 问卷容器 ============ -->
<div id="quiz" class="hide">
  <div class="qhead">
    <div class="qhead-in">
      <button class="back" onclick="backHome()">‹ 返回</button>
      <h2 id="qTitle"></h2>
      <p id="qDesc"></p>
    </div>
  </div>
  <div class="wrap" id="qBody"></div>
  <div class="bar">
    <div class="bar-in">
      <div class="bar-tip" id="barTip">已填 <b>0</b> 题</div>
      <button class="btn" id="submitBtn" onclick="submitForm()">提交问卷</button>
    </div>
  </div>
</div>

<!-- ============ 完成 ============ -->
<div id="finish" class="hide">
  <div class="wrap">
    <div class="done">
      <div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
      <h2>提交成功，谢谢您！</h2>
      <p id="finishTip">您的每一句都算数。我们会把大家的意见汇总，直接变成下一次活动的方案依据。</p>
      <div class="stat">
        <div><b id="finTotal">—</b><span>已收到</span></div>
        <div><b id="finMine">1</b><span>本次提交</span></div>
      </div>
      <div style="margin-top:30px">
        <button class="btn gold" onclick="backHome()" style="padding:12px 26px;font-size:14.5px">再填一份（换人填写）</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   2026 城西科技节 · 活动后问卷
   三份问卷：老师 t / 学生家长 s / 小摊主 b
   ========================================================= */

/* 主域名（GitHub Pages 静态版）跨域调 api 域名；同源部署时走相对路径 */
var API = (function(){
  var h = location.hostname;
  if (h === 'kexvefuxi.cn' || h === 'www.kexvefuxi.cn' || h === 'dadajs.cn')
    return 'https://api.kexvefuxi.cn/wj/api';
  return 'api';
})();

var SCHEMA = {
  t: {
    title: '老师问卷',
    desc: '匿名 · 约 3 分钟 · 17 题，开放题可跳过',
    sections: [
      { name: '一、回到最初的想法', qs: [
        { id:'t_role', type:'single', req:true, title:'您的身份是',
          opts:['班主任','摊位指导老师（带学生摆摊）','行政 / 后勤保障','科任教师（这次没直接参与摊位）','其他'] },
        { id:'t_depth', type:'single', title:'这次您实际投入的程度是',
          opts:['全程扎在自己的摊位上','带班参观，同时兼顾本班摊位','主要是带班走场','主要在后勤 / 场地 / 拍摄','基本是旁观'] },
        { id:'t_before', type:'scale', title:'活动前，「让学生自己当摊主」这个想法，您心里的信心有多少',
          legend:['完全没底','很有信心'] },
        { id:'t_expect', type:'text', title:'活动前，您最期待看到的是什么', hint:'选填。比如期待孩子敢开口、期待某个摊位出彩、或者其实没什么期待' }
      ]},
      { name: '二、实际效果感受', qs: [
        { id:'t_satisfy', type:'scale', title:'整体上，这次科技节办得怎么样',

var state = { role:null, answers:{}, total:0 };

/* ---------- 路由 ---------- */
/* ★ 地址必须「干净」：首页永远是 /wj/，某一卷是 /wj/?r=t
   早先用 #t 记状态、返回时只清 hash 不清 query，导致「从老师卷退回首页后
   地址仍是 ?r=t#」，一转发送出去别人点开就直达老师卷。这里统一用 ?r=。 */
function setUrl(role){
  var want = location.pathname + (role ? '?r=' + role : '');
  try{ history.replaceState(null, '', want); }catch(e){}
}

function go(role){
  if(!SCHEMA[role]) return;
  state.role = role; state.answers = {};
  setUrl(role);
  document.getElementById('home').classList.add('hide');
  document.getElementById('finish').classList.add('hide');
  document.getElementById('quiz').classList.remove('hide');
  document.getElementById('prog').classList.remove('hide');
  render();
  window.scrollTo(0,0);
}
function backHome(){
  state.role = null; state.answers = {};
  setUrl(null);                       // 彻底回到 /wj/，不留任何参数，转发才是三选一
  document.getElementById('quiz').classList.add('hide');
  document.getElementById('finish').classList.add('hide');
  document.getElementById('prog').classList.add('hide');
  document.getElementById('home').classList.remove('hide');
  window.scrollTo(0,0);
}

/* ---------- 渲染 ---------- */
var qIndex = 0;
function render(){
  var sc = SCHEMA[state.role];
  qIndex = 0;
  document.getElementById('qTitle').textContent = sc.title;
  document.getElementById('qDesc').textContent = sc.desc;
  var html = '', n = 0;
  sc.sections.forEach(function(sec){
    html += '<div class="sec"><p class="sec-t">'+esc(sec.name)+'</p>';
    sec.qs.forEach(function(q){
      n++; q._n = n;
      html += renderQ(q, n);
    });
    html += '</div>';
  });
  var body = document.getElementById('qBody');
  body.innerHTML = html;
  bindAll();
  updateBar();
}

function renderQ(q, n){
  var star = q.req ? '<em>＊必填</em>' : '';
  var h = '<div class="q" id="q_'+q.id+'" data-id="'+q.id+'">';
  h += '<div class="q-n">Q'+n+'</div>';
  h += '<p class="q-t">'+esc(q.title)+star+'</p>';
  if(q.by) h += '<div class="q-by">'+esc(q.by)+'</div>';
  if(q.hint) h += '<p class="q-h">'+esc(q.hint)+'</p>';

  if(q.type === 'single' || q.type === 'multi'){
    var twoCol = q.opts.length >= 4 && q.opts.every(function(o){ return o.length <= 8; });
    h += '<div class="opts'+(twoCol?' cols2':'')+'" data-type="'+q.type+'">';
    q.opts.forEach(function(o, i){
      h += '<button type="button" class="opt" data-v="'+esc(o)+'">'
        +  '<span class="dot'+(q.type==='multi'?' sq':'')+'"></span>'
        +  '<span>'+esc(o)+'</span></button>';
    });
    h += '</div>';
  }
  else if(q.type === 'grouped'){
    h += '<div class="groups" data-type="grouped">';
    q.groups.forEach(function(g, gi){
      h += '<div class="grp" data-g="'+gi+'">';
      h += '<button type="button" class="grp-h">'
        +  '<span class="grp-n">'+esc(g.n)+'</span>'
        +  '<span class="grp-pick"></span>'
        +  '<span class="grp-c">'+g.items.length+'</span>'
        +  '<span class="grp-x">＋</span></button>';
      h += '<div class="grp-b">';
      g.items.forEach(function(it){
        h += '<button type="button" class="opt" data-v="'+esc(it)+'">'
          +  '<span class="dot"></span><span>'+esc(it)+'</span></button>';
      });
      h += '</div></div>';
    });
    if(q.extra && q.extra.length){
      h += '<div class="grpextra">';
      q.extra.forEach(function(it){
        h += '<button type="button" class="opt" data-v="'+esc(it)+'">'
          +  '<span class="dot"></span><span>'+esc(it)+'</span></button>';
      });
      h += '</div>';
    }
    h += '</div>';
  }
  else if(q.type === 'scale'){
    h += '<div class="scale" data-type="scale">';
    for(var i=1;i<=5;i++) h += '<button type="button" data-v="'+i+'"><b>'+i+'</b><span>'+(i===1?'最低':i===5?'最高':'')+'</span></button>';
    h += '</div>';
    h += '<div class="scale-legend"><span>'+esc(q.legend[0])+'</span><span>'+esc(q.legend[1])+'</span></div>';
  }
  else if(q.type === 'matrix'){
    h += '<div class="mx" data-type="matrix">';
    h += '<div class="mx-head"><span class="mx-lab">评分项</span><span class="mx-pick">';
    for(var j=1;j<=5;j++) h += '<i>'+j+'</i>';
    h += '</span></div>';
    q.rows.forEach(function(r, ri){
      h += '<div class="mx-row" data-row="'+ri+'"><span class="mx-lab">'+esc(r)+'</span><span class="mx-pick">';
      for(var k=1;k<=5;k++) h += '<button type="button" data-v="'+k+'">'+k+'</button>';
      h += '</span></div>';
    });
    h += '</div>';
  }
  else if(q.type === 'text'){
    var lim = 200;
    h += '<textarea data-type="text" maxlength="'+lim+'" placeholder="'+(q.req?'请填写…':'可以留空')+'"></textarea>';
    h += '<div class="cnt"><span>0</span>/'+lim+'</div>';
  }
  h += '</div>';
  return h;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------- 事件绑定（委托） ---------- */
function bindAll(){
  var body = document.getElementById('qBody');
  body.onclick = function(e){
    // 分组标题：手风琴，一次只开一组
    var gh = e.target.closest('.grp-h');
    if(gh){
      var grp = gh.closest('.grp'), wrapEl = grp.parentNode;
      var wasOpen = grp.classList.contains('open');
      [].forEach.call(wrapEl.querySelectorAll('.grp'), function(c){
        c.classList.remove('open');
        var xi = c.querySelector('.grp-x'); if(xi) xi.textContent = '＋';
      });
      if(!wasOpen){
        grp.classList.add('open');
        var xo = grp.querySelector('.grp-x'); if(xo) xo.textContent = '−';
      }
      return;
    }

    var btn = e.target.closest('.opt') || e.target.closest('.scale button') || e.target.closest('.mx-pick button');
    if(!btn) return;
    var q = btn.closest('.q'); if(!q) return;
    var id = q.dataset.id;
    var box = btn.closest('.opts') || btn.closest('.scale') || btn.closest('.mx') || btn.closest('.groups');

    if(box.dataset.type === 'multi'){
      btn.classList.toggle('on');
      var vals = [].map.call(box.querySelectorAll('.opt.on'), function(x){ return x.dataset.v; });
      setAns(id, vals.length ? vals : undefined);
    }
    else if(box.dataset.type === 'single'){
      [].forEach.call(box.querySelectorAll('.opt'), function(x){ x.classList.remove('on'); });
      btn.classList.add('on');
      setAns(id, btn.dataset.v);
    }
    else if(box.dataset.type === 'grouped'){
      [].forEach.call(box.querySelectorAll('.opt'), function(x){
        x.classList.remove('on');
        var g0 = x.closest('.grp');
        if(g0){ g0.classList.remove('picked'); var p = g0.querySelector('.grp-pick'); if(p) p.textContent = ''; }
      });
      btn.classList.add('on');
      var g = btn.closest('.grp');
      if(g){
        g.classList.add('picked');
        var pk = g.querySelector('.grp-pick');
        if(pk) pk.textContent = btn.dataset.v;
      }
      setAns(id, btn.dataset.v);
    }
    else if(box.dataset.type === 'scale'){
      [].forEach.call(box.querySelectorAll('button'), function(x){ x.classList.remove('on'); });
      btn.classList.add('on');
      setAns(id, +btn.dataset.v);
    }
    else if(box.dataset.type === 'matrix'){
      var row = btn.closest('.mx-row');
      [].forEach.call(row.querySelectorAll('button'), function(x){ x.classList.remove('on'); });
      btn.classList.add('on');
      var m = state.answers[id] || {};
      m[row.dataset.row] = +btn.dataset.v;
      setAns(id, m);
    }
    q.classList.remove('err');
    updateBar();
  };

  body.oninput = function(e){
    if(e.target.tagName !== 'TEXTAREA') return;
    var q = e.target.closest('.q');
    var c = q.querySelector('.cnt span');
    if(c) c.textContent = e.target.value.length;
    setAns(q.dataset.id, e.target.value.trim() || undefined);
    q.classList.remove('err');
    updateBar();
  };
}

function setAns(id, v){
  if(v === undefined || v === '' || (Array.isArray(v) && !v.length)) delete state.answers[id];
  else state.answers[id] = v;
}

/* ---------- 进度 ---------- */
function countAll(){
  var n = 0;
  SCHEMA[state.role].sections.forEach(function(s){ n += s.qs.length; });
  return n;
}
function updateBar(){
  var total = countAll();
  var done = Object.keys(state.answers).length;
  var pct = Math.round(done / total * 100);
  document.querySelector('#prog i').style.width = pct + '%';
  document.getElementById('barTip').innerHTML = '已填 <b>'+done+'</b> / '+total+' 题';
}

/* ---------- 校验 + 提交 ---------- */
function submitForm(){
  var sc = SCHEMA[state.role];
  var miss = null, missEl = null;
  sc.sections.forEach(function(sec){
    sec.qs.forEach(function(q){
      if(!q.req) return;
      var v = state.answers[q.id];
      var ok = false;
      if(q.type === 'matrix') ok = v && Object.keys(v).length === q.rows.length;
      else if(typeof v === 'number') ok = true;
      else if(Array.isArray(v)) ok = v.length > 0;
      else ok = v !== undefined && String(v).length > 0;
      if(!ok && !miss){ miss = q.title; missEl = document.getElementById('q_'+q.id); }
    });
  });
  if(miss){
    toast('还有必填题没填：' + miss);
    if(missEl){
      missEl.classList.add('err');
      missEl.scrollIntoView({behavior:'smooth', block:'center'});
    }
    return;
  }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '提交中…';

  var payload = {
    role: state.role,
    answers: state.answers,
    ua: navigator.userAgent.slice(0, 180),
    ref: document.referrer ? document.referrer.slice(0, 200) : '',
    ts: Date.now()
  };

  fetch(API + '/submit', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  }).then(function(r){
    return r.json().then(function(j){ return { status:r.status, body:j }; });
  }).then(function(res){
    if(res.body && res.body.ok){
      showFinish(res.body.total);
      return;
    }
    // 同一个网络当天份数用完了：别把内容丢掉，换个网络还能交
    if(res.status === 429){
      btn.disabled = false; btn.textContent = '提交问卷';
      toast('这个网络今天已经交满 ' + (res.body.limit || 5) + ' 份了。内容还留着，'
          + '换手机流量、或换另一台设备再点提交就行');
      return;
    }
    throw new Error((res.body && res.body.error) || '服务返回异常');
  }).catch(function(err){
    btn.disabled = false; btn.textContent = '提交问卷';
    toast('提交失败，请检查网络后重试');
    console.error(err);
  });
}

function showFinish(total){
  document.getElementById('qBody').innerHTML = '';
  document.getElementById('quiz').classList.add('hide');
  document.getElementById('prog').classList.add('hide');
  document.getElementById('finish').classList.remove('hide');
  document.getElementById('finTotal').textContent = total || '—';
  var tips = {
    t:'谢谢您。老师们的意见我们会原样整理出来，下一次怎么搞，先看大家怎么说。',
    s:'谢谢你！你说的每一句话我们都会看，说不定就成了下一次的一个摊位。',
    b:'谢谢你！从开不了口到能招呼一整个摊位，这件事本身就很了不起。'
  };
  document.getElementById('finishTip').textContent = tips[state.role] || '';
  window.scrollTo(0,0);
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitBtn').textContent = '提交问卷';
}

var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
}

/* ---------- 启动 ---------- */
function readRoleFromUrl(){
  var r = '';
  try{ r = (new URLSearchParams(location.search)).get('r') || ''; }catch(e){}
  if(!SCHEMA[r]) r = (location.hash || '').replace('#','');   // 兼容老的 #t 链接
  return SCHEMA[r] ? r : '';
}

(function init(){
  var r = readRoleFromUrl();
  if(r) go(r);          // 带 ?r= 才直达对应问卷；否则老老实实停在首页
  window.addEventListener('popstate', function(){
    var k = readRoleFromUrl();
    if(k && state.role !== k) go(k);
    else if(!k && state.role) backHome();
  });
})();
</script>
