<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7F1">
<meta name="description" content="人生模拟器：1-18岁的人生播报，18岁觉醒随机的系统，之后用一块数据面板过完这一生。">
<title>人生模拟器 · 系统觉醒</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎲</span>
      <b>人生模拟器</b>
      <span class="sub">系统觉醒</span>
    </div>
    <div style="display:flex;gap:8px">
      <button id="btnHome" class="icon-btn" title="首页">⌂</button>
      <button id="btnMenu" class="icon-btn" title="菜单">☰</button>
    </div>
  </header>

  <main id="stage" class="stage"></main>
</div>

<div class="sheet-wrap" id="sheet">
  <div class="sheet-mask" data-act="closesheet"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<!-- 数据 -->
<script src="js/data-worlds.js"></script>
<script src="js/data-systems.js"></script>
<script src="js/config.local.js" onerror="void 0"></script>
<script src="js/store.js"></script>
<script src="js/data-child.js"></script>
<script src="js/data-events.js"></script>
<script src="js/data-brain.js"></script>
<script src="js/data-econ.js"></script>
<script src="js/data-worlds2.js"></script>
<script src="js/data-lore.js"></script>
<script src="js/data-webnovel.js"></script>
<script src="js/data-systropes.js"></script>
<script src="js/data-paths.js"></script>
<script src="js/data-slice.js"></script>
<script src="js/data-talents.js"></script>
<script src="js/data-waves.js"></script>
<script src="js/data-builds.js"></script>
<!-- 逻辑 -->
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/editor.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
