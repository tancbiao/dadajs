<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#FFD3E0">

<title>科学工作台 · 教科版教案（全册52份）</title>

<style>

/* ============ 基础变量 ============ */

:root{

  --pink:#FFC2D4; --pink-l:#FFD9E6; --pink-d:#F79CB8;

  --blue:#B8E0F6; --blue-d:#8CC6EA; --mint:#C9EEDC; --mint-d:#9ADBBB;

  --lav:#DCD0F2; --lav-d:#BFA8E6; --cream:#FFF3D9; --cream-d:#F5DFA8;

  --peach:#FFE0CC; --ink:#5A4A5E; --ink-l:#8A7A8E; --white:#FFFDFD;

  --card-bg:rgba(255,253,253,.92); --radius:22px;

  --shadow:0 6px 0 rgba(190,120,150,.18), 0 10px 24px rgba(190,120,150,.15);

}

/* ============ 皮肤预设（马卡龙配色，一键切换）============ */

[data-theme="mint"]{ --pink:#C9EEDC;--pink-l:#E4F6EC;--pink-d:#7CC9A0;--card-bg:rgba(244,255,250,.92);--shadow:0 6px 0 rgba(120,190,150,.18),0 10px 24px rgba(120,190,150,.15); }

[data-theme="sky"]{ --pink:#B8E0F6;--pink-l:#DCF1FC;--pink-d:#8CC6EA;--card-bg:rgba(244,252,255,.92);--shadow:0 6px 0 rgba(120,180,230,.18),0 10px 24px rgba(120,180,230,.15); }

[data-theme="peach"]{ --pink:#FFD9C2;--pink-l:#FFEAE0;--pink-d:#F5A980;--card-bg:rgba(255,250,245,.92);--shadow:0 6px 0 rgba(230,160,120,.18),0 10px 24px rgba(230,160,120,.15); }

[data-theme="lilac"]{ --pink:#DCD0F2;--pink-l:#EFE8FB;--pink-d:#BFA8E6;--card-bg:rgba(251,247,255,.92);--shadow:0 6px 0 rgba(185,150,225,.18),0 10px 24px rgba(185,150,225,.15); }

[data-theme="lemon"]{ --pink:#FFE9A8;--pink-l:#FFF6D6;--pink-d:#F2C94C;--card-bg:rgba(255,253,245,.93);--shadow:0 6px 0 rgba(225,190,90,.18),0 10px 24px rgba(225,190,90,.15); }

/* 皮肤选择芯片 */

.theme-chips{display:flex;gap:8px;flex-wrap:wrap}

.theme-chip{width:84px;height:34px;border-radius:14px;border:2.5px solid rgba(90,74,94,.18);font-size:.76rem;color:#5A4A5E;font-weight:bold;cursor:pointer;transition:transform .12s}

.theme-chip:active{transform:translateY(2px)}

.theme-chip.on{border-color:#5A4A5E;box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(90,74,94,.55)}

.theme-chip.t-sakura{background:#FFD9E6}

.theme-chip.t-mint{background:#E2F6EC}

.theme-chip.t-sky{background:#DCF1FC}

.theme-chip.t-peach{background:#FFEAE0}

.theme-chip.t-lilac{background:#EFE8FB}

.theme-chip.t-lemon{background:#FFF6D6}

.rule-row{background:var(--pink-l);border-radius:14px;padding:10px 12px;margin-top:8px}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html{font-size:16px}

body{

  font-family:'ZCOOL KuaiLe','Yuanti SC','YouYuan','幼圆','PingFang SC','Microsoft YaHei',sans-serif;

  color:var(--ink); background:#EAF6FF; min-height:100vh; overflow-x:hidden;

}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

input,select,textarea{font-family:inherit;color:var(--ink);font-size:1rem}

::-webkit-scrollbar{width:8px;height:8px}

::-webkit-scrollbar-thumb{background:var(--pink);border-radius:8px}

::-webkit-scrollbar-track{background:transparent}



/* ============ 固定卡通背景 ============ */

.bg-scene{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,#D9F0FF 0%,#FFF0F5 55%,#E3F8E8 100%);overflow:hidden}

.bg-scene .grass{position:absolute;bottom:-6vh;left:-5vw;width:110vw;height:22vh;background:var(--mint);border-radius:50% 50% 0 0/100% 100% 0 0;box-shadow:0 -6px 0 rgba(255,255,255,.5)}

.bg-scene .grass::after{content:'';position:absolute;bottom:0;left:30%;width:80vw;height:18vh;background:#B4E6CB;border-radius:50% 50% 0 0/100% 100% 0 0}

.cloud{position:absolute;background:#fff;border-radius:50%;opacity:.85;animation:drift 60s linear infinite}

.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}

.cloud.c1{width:90px;height:34px;top:8%;left:-100px;animation-duration:80s}

.cloud.c1::before{width:50px;height:50px;top:-24px;left:12px}

.cloud.c1::after{width:38px;height:38px;top:-16px;left:48px}

.cloud.c2{width:70px;height:28px;top:22%;left:-100px;animation-duration:110s;animation-delay:-40s}

.cloud.c2::before{width:40px;height:40px;top:-20px;left:10px}

.cloud.c2::after{width:30px;height:30px;top:-14px;left:38px}

.cloud.c3{width:110px;height:40px;top:5%;left:-140px;animation-duration:140s;animation-delay:-70s;opacity:.6}

.cloud.c3::before{width:60px;height:60px;top:-30px;left:16px}

.cloud.c3::after{width:44px;height:44px;top:-20px;left:58px}

@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(calc(100vw + 160px))}}

.star{position:absolute;color:#FFE28A;font-size:18px;animation:twinkle 3s ease-in-out infinite}

@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:.9;transform:scale(1.1)}}

.flower-deco{position:absolute;font-size:22px;opacity:.7;animation:sway 5s ease-in-out infinite}

@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

.heart-deco{position:absolute;font-size:18px;color:var(--pink-d);opacity:.6;animation:floaty 6s ease-in-out infinite}

@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}



/* ============ 布局 ============ */

.app{display:flex;min-height:100vh}

.sidebar{

  width:230px;background:var(--card-bg);backdrop-filter:blur(10px);

  border-right:3px dashed var(--pink);padding:18px 12px;display:flex;flex-direction:column;gap:4px;

  position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;

}

.sidebar-brand{display:flex;align-items:center;gap:10px;padding:8px 6px 14px}

.sidebar-brand img{width:48px;height:48px;border-radius:50%;border:3px solid var(--pink);object-fit:cover}

.sidebar-brand .t{font-size:1.15rem;color:var(--pink-d);line-height:1.2}

.sidebar-brand .s{font-size:.7rem;color:var(--ink-l)}

.nav-group{margin:10px 0 4px;font-size:.78rem;color:var(--ink-l);padding:0 10px;letter-spacing:2px;display:flex;align-items:center;gap:6px}

.nav-group::after{content:'';flex:1;border-top:2px dotted var(--pink)}

.nav-item{

  display:flex;align-items:center;gap:10px;padding:10px 12px;margin:2px 0;border-radius:16px;

  font-size:.95rem;color:var(--ink);transition:all .18s;position:relative;text-align:left;width:100%;

}

.nav-item .ic{font-size:1.15rem;width:24px;text-align:center}

.nav-item:hover{background:var(--pink-l);transform:translateX(3px)}

.nav-item.active{background:linear-gradient(90deg,var(--pink),var(--pink-l));color:#fff;box-shadow:0 3px 0 var(--pink-d)}

.nav-item.active .ic{filter:none}

.sidebar-foot{margin-top:auto;padding:10px 6px}

.settings-btn{

  width:100%;display:flex;align-items:center;gap:8px;justify-content:center;padding:10px;

  background:linear-gradient(180deg,#fff,var(--cream));border:2.5px solid var(--cream-d);

  border-radius:18px;font-size:.95rem;color:var(--ink);box-shadow:0 3px 0 var(--cream-d);transition:all .15s;

}

.settings-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--cream-d)}

.ver{text-align:center;font-size:.7rem;color:var(--ink-l);margin-top:6px;letter-spacing:1px}

.ver-chip{display:inline-block;vertical-align:middle;margin-left:8px;padding:2px 10px;border-radius:20px;background:var(--pink);color:#fff;font-size:.72rem;font-weight:bold;letter-spacing:1px;box-shadow:0 2px 0 var(--pink-d)}

.main{flex:1;margin-left:230px;padding:20px 26px 90px;max-width:1000px}

.menu-toggle{

  display:none;position:fixed;top:14px;left:14px;z-index:210;width:48px;height:48px;

  background:var(--pink);border-radius:50%;font-size:1.4rem;color:#fff;

  box-shadow:0 4px 0 var(--pink-d),0 8px 18px rgba(247,156,184,.4);align-items:center;justify-content:center;

}

.menu-toggle:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink-d)}



/* ============ 宽屏右侧信息栏 ============ */

.rail{display:none}

@media(min-width:1280px){

  .main{max-width:none;padding-right:24px}

  .rail{

    display:flex;flex-direction:column;gap:14px;flex:0 0 300px;width:300px;

    padding:20px 18px 90px 2px;position:sticky;top:0;align-self:flex-start;

    height:100vh;overflow-y:auto;

  }

  .rail .rcard{background:var(--card-bg);backdrop-filter:blur(8px);border:3px solid var(--pink-l);border-radius:20px;padding:14px 14px;box-shadow:var(--shadow)}

  .rail .rcard h4{font-size:1rem;color:var(--pink-d);margin-bottom:8px;display:flex;align-items:center;gap:6px}

  .rail .rstat{display:flex;gap:8px;flex-wrap:wrap}

  .rail .rstat .s{flex:1;min-width:64px;background:var(--pink-l);border-radius:14px;padding:8px 4px;text-align:center}

  .rail .rstat .s b{display:block;font-size:1.25rem;color:var(--pink-d)}

  .rail .rstat .s span{font-size:.64rem;color:var(--ink-l)}

  .rail .qlink{display:flex;flex-direction:column;gap:8px;margin-top:2px}

  .rail .qlink button{width:100%;text-align:left;padding:9px 12px;border-radius:14px;border:2px solid var(--pink-l);background:#fff;font-size:.9rem;color:var(--ink)}

  .rail .qlink button:active{transform:translateY(2px)}

}



/* ============ 顶部吉祥物卡（dada家族素材图 + 文字 + 贴纸）============ */

.mascot-card{

  position:relative;display:flex;align-items:stretch;

  min-height:170px;border:3.5px solid var(--ink);border-radius:24px;overflow:hidden;

  box-shadow:0 4px 0 #E07A9E,0 8px 18px rgba(247,156,184,.25);

  margin-bottom:18px;background:#BDE3FF;

}

.mascot-card .img{flex:0 0 46%;position:relative;overflow:hidden;background:#BDE3FF}

.mascot-card .img img{width:100%;height:100%;object-fit:cover;object-position:center 38%;display:block;min-height:100%}

.mascot-card .ovl{

  flex:1;padding:18px 18px 16px;display:flex;flex-direction:column;justify-content:center;

  gap:8px;align-items:flex-start;position:relative;z-index:2;

  background:linear-gradient(135deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.08) 100%);

}

.mascot-card .ovl .badge{

  background:var(--ink);color:#fff;border-radius:999px;padding:3px 12px;

  font-size:.7rem;font-weight:bold;letter-spacing:1px;box-shadow:0 2px 0 rgba(0,0,0,.2);

}

.mascot-card .ovl h2{

  background:rgba(255,255,255,.96);border:2.5px solid var(--ink);

  border-radius:18px 18px 4px 18px;padding:6px 16px;

  font-size:1.42rem;color:var(--ink);display:inline-block;

  box-shadow:0 3px 0 rgba(0,0,0,.12);line-height:1.2;margin:0;

}

.mascot-card .ovl p{

  background:rgba(255,255,255,.9);border-radius:14px;padding:5px 12px;

  font-size:.82rem;color:var(--ink-l);display:inline-block;line-height:1.45;margin:0;

}

.mascot-card .sticker{position:absolute;top:6px;left:6px;z-index:3;transform:rotate(-8deg);animation:floaty 5s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}

.mascot-card .sticker-tr{position:absolute;top:6px;right:6px;z-index:3;animation:floaty 4.5s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}

.mascot-card .sticker-br{position:absolute;bottom:6px;right:8px;z-index:3;animation:floaty 5.5s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}

.mascot-card .cover-edit{position:absolute;bottom:8px;right:10px;z-index:4;display:flex;gap:6px}

.mascot-card .cover-edit button{font-family:inherit;font-size:.74rem;font-weight:bold;color:#3A3335;background:rgba(255,255,255,.92);border:2px solid var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15);line-height:1.4}

.mascot-card .cover-edit button:active{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.15)}

.mascot-card .cover-edit button.ghost{background:#fff0f5}



/* ============ 首页看板 ============ */

.home-welcome{font-size:1.02rem;color:var(--ink-l);margin:-2px 0 14px;line-height:1.6}

/* 首页待办提醒 */

.alert-card{background:linear-gradient(180deg,#FFF3F6,#FFFDFD);border:2.5px solid #FFD9E2;border-radius:20px;padding:14px 16px 10px;margin-bottom:14px;box-shadow:0 3px 0 #FFD9E2}

.alert-item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1.5px dashed #F5E3E7}

.alert-item:last-child{border-bottom:none}

.alert-item .al-ic{font-size:1.35rem;flex:0 0 auto}

.alert-item .al-main{flex:1;min-width:0}

.alert-item .al-title{font-weight:bold;line-height:1.45;font-size:.95rem}

.alert-item .al-sub{font-size:.76rem;color:var(--ink-l);margin-top:2px}

/* 记忆闪卡 */

.fc-stats{display:flex;gap:10px}

.fc-stats .st{flex:1;background:#fff;border:2px solid var(--pink-l);border-radius:14px;padding:10px 6px;text-align:center}

.fc-stats .st b{display:block;font-size:1.35rem;color:var(--pink-d)}

.fc-stats .st span{font-size:.72rem;color:var(--ink-l)}

.fc-card{border:2.5px solid var(--pink-d);border-radius:18px;padding:20px;min-height:170px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(180deg,#fff,#FFF8FA)}

.fc-card .fc-q{font-size:1.18rem;font-weight:bold;margin-top:10px;line-height:1.65}

.fc-card .fc-a{font-size:.97rem;line-height:1.8;margin-top:10px;color:var(--ink);border-top:2px dashed var(--pink-l);padding-top:10px}

.fc-add{border:2px dashed var(--pink);border-radius:14px;padding:12px}



/* 倒计时模块 */

.cd-wrap{display:flex;flex-direction:column;align-items:center}

.cd-modes{display:flex;gap:8px;margin-bottom:18px}

.cd-mode-btn{padding:8px 20px;border-radius:20px;border:2.5px solid var(--pink-l);background:#fff;color:var(--ink-l);font-weight:bold;cursor:pointer;transition:all .15s;font-size:.92rem}

.cd-mode-btn:hover{border-color:var(--pink)}

.cd-mode-btn.active{background:var(--pink);border-color:var(--pink-d);color:#fff;box-shadow:0 3px 0 var(--pink-d)}

.cd-circle{width:230px;height:230px;margin:0 auto 10px;border-radius:50%;border:5px solid var(--pink-l);display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(180deg,#fff,var(--pink-l));transition:all .3s;box-shadow:0 6px 18px rgba(247,156,184,.25)}

.cd-circle.running{border-color:var(--pink)}

.cd-circle.warning{border-color:#F2A65A}

.cd-circle.danger{border-color:#E76F6F;animation:cd-pulse 1s ease-in-out infinite}

@keyframes cd-pulse{0%,100%{box-shadow:0 0 0 0 rgba(231,111,111,.4)}50%{box-shadow:0 0 0 16px rgba(231,111,111,0)}}

.cd-time{font-size:60px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums;font-family:'SF Mono','Consolas',monospace;color:var(--ink)}

.cd-time.has-hours{font-size:36px}

.cd-circle.danger .cd-time{color:#E76F6F}

.cd-circle.warning .cd-time{color:#E07B3A}

.cd-label{font-size:13px;color:var(--ink-l);letter-spacing:.05em;margin-top:6px}

.cd-sec-title{font-size:12px;color:var(--ink-l);letter-spacing:.1em;margin:14px 0 8px;text-align:center}

.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}

.cd-timepoint,.cd-preset{padding:10px 6px;border-radius:12px;border:2.5px solid var(--pink-l);background:#fff;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;text-align:center}

.cd-timepoint:hover{border-color:#F2A65A}

.cd-timepoint.selected{border-color:#F2A65A;background:#F2A65A;color:#fff}

.cd-preset:hover{border-color:var(--pink)}

.cd-preset.selected{border-color:var(--pink-d);background:var(--pink);color:#fff}

.cd-preset small{font-size:12px;font-weight:400;opacity:.85}

.cd-preset .cd-tomato{font-size:18px;display:block;margin-bottom:1px}

.cd-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}

.cd-input{width:56px;padding:8px 4px;text-align:center;font-size:18px;font-weight:700;font-family:'SF Mono','Consolas',monospace;background:#fff;border:2.5px solid var(--pink-l);border-radius:10px;color:var(--ink);outline:none}

.cd-input:focus{border-color:var(--pink-d)}

.cd-sep{font-size:20px;font-weight:700;color:var(--ink-l)}

.cd-refresh{font-size:12px;color:var(--ink-l);background:none;border:none;cursor:pointer;padding:4px 12px;border-radius:6px;margin-bottom:6px}

.cd-refresh:hover{color:var(--ink);background:var(--pink-l)}

.cd-ctrl{display:flex;gap:12px;justify-content:center;margin-top:14px}

.cd-info{text-align:center;margin-top:14px;font-size:11px;color:var(--ink-l);line-height:1.8}

.cd-info .dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--ink-l);margin:0 6px;vertical-align:middle}

/* 全屏专注模式（对齐 xixitime 效果：纯黑底 + 巨号数字 + 隐藏全部控件） */

body.cd-fs{background:#000 !important;color:#e2e8f0}

body.cd-fs .bg-scene,body.cd-fs .bg-scene *{display:none !important}

body.cd-fs .sidebar,body.cd-fs .rail,body.cd-fs .fab,body.cd-fs .menu-toggle,body.cd-fs .side-mask,body.cd-fs .mascot-card,body.cd-fs .cd-ctrl,body.cd-fs .cd-modes,body.cd-fs .cd-info,body.cd-fs .cd-sec-title,body.cd-fs .cd-grid,body.cd-fs .cd-row,body.cd-fs .cd-refresh,body.cd-fs #cdExamSection,body.cd-fs #cdDailySection{display:none !important}

body.cd-fs .main{margin-left:0;max-width:none;padding:0;display:flex;align-items:center;justify-content:center;background:transparent}

body.cd-fs #main{width:100%}

body.cd-fs .page.active{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;background:transparent}

body.cd-fs .cd-wrap{justify-content:center;background:transparent !important;border:none;box-shadow:none;padding:0;width:100%}

body.cd-fs .cd-circle{width:auto;height:auto;border:none;background:transparent;box-shadow:none;animation:none}

body.cd-fs .cd-time{font-size:min(42vw,38vh);line-height:1;letter-spacing:0;white-space:nowrap;color:#e2e8f0}

body.cd-fs .cd-time.has-hours{font-size:min(28vw,30vh)}

body.cd-fs .cd-circle.warning .cd-time{color:#f59e0b}

body.cd-fs .cd-circle.danger .cd-time{color:#ef4444}

body.cd-fs .cd-label{font-size:min(5vw,5vh,36px);color:rgba(255,255,255,.6);margin-top:12px;letter-spacing:.05em}

body.cd-fs .cd-fs-exit{

  display:block;position:fixed;bottom:28px;left:50%;transform:translateX(-50%);

  padding:10px 24px;border:1px solid rgba(255,255,255,.15);border-radius:8px;

  background:rgba(255,255,255,.06);color:rgba(255,255,255,.25);

  font-size:14px;cursor:pointer;font-family:inherit;transition:all .3s;letter-spacing:.05em;z-index:99;

}

body.cd-fs .cd-fs-exit:hover{color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.3)}

.cd-fs-exit{display:none}



/* 值日表格已完成行 */

tr.row-done td{opacity:.5;text-decoration:line-through}

.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:14px}

.home-card{background:var(--card-bg);backdrop-filter:blur(8px);border:3px solid var(--pink-l);border-radius:20px;padding:16px 12px 14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;position:relative;text-align:center;overflow:hidden}

.home-card:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(247,156,184,.32)}

.home-card:active{transform:translateY(1px)}

.home-card .hc-ic{font-size:2.1rem;line-height:1}

.home-card .hc-t{font-weight:bold;margin:6px 0 2px;color:var(--pink-d);font-size:1.02rem}

.home-card .hc-s{font-size:.7rem;color:var(--ink-l);line-height:1.35}

.home-card .hc-badge{position:absolute;top:-9px;right:-9px;background:var(--pink);color:#fff;border:2.5px solid var(--ink);border-radius:999px;font-size:.66rem;padding:2px 9px;box-shadow:0 2px 0 var(--pink-d);white-space:nowrap}

.home-card .hc-deco{position:absolute;bottom:-6px;left:-6px;font-size:1.4rem;opacity:.5;transform:rotate(-12deg)}



/* ============ 卡片 ============ */

.card{

  background:var(--card-bg);backdrop-filter:blur(8px);border:3px solid var(--pink-l);

  border-radius:var(--radius);padding:18px;margin-bottom:16px;position:relative;

  box-shadow:var(--shadow);transition:transform .18s;

}

.card::before{ /* 贴纸角标 */

  content:'';position:absolute;top:-8px;left:18px;width:26px;height:26px;

  background:radial-gradient(circle at 30% 30%,#FFE28A,#F5C542);border-radius:50% 8px 50% 50%;

  transform:rotate(-15deg);box-shadow:0 2px 4px rgba(0,0,0,.12);

}

.card.t-blue{border-color:var(--blue)}

.card.t-blue::before{background:radial-gradient(circle at 30% 30%,#AEE4FF,#7CC4EF)}

.card.t-mint{border-color:var(--mint)}

.card.t-mint::before{background:radial-gradient(circle at 30% 30%,#B8F0D4,#82D6AC)}

.card.t-lav{border-color:var(--lav)}

.card.t-lav::before{background:radial-gradient(circle at 30% 30%,#E4D8FA,#BFA8E6)}

.card.t-cream{border-color:var(--cream-d)}

.card.t-cream::before{background:radial-gradient(circle at 30% 30%,#FFEFC0,#F5DFA8)}

.card h3{font-size:1.12rem;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:8px}

.card h3 .em{font-size:1.25rem}

.card h3 .cnt{font-size:.75rem;background:var(--pink-l);color:var(--pink-d);padding:2px 10px;border-radius:10px;margin-left:auto}



/* ============ 按钮（云朵+3D按压） ============ */

.btn{

  display:inline-flex;align-items:center;justify-content:center;gap:6px;

  padding:10px 20px;font-size:.95rem;color:#fff;border-radius:999px 999px 999px 999px/60% 60% 60% 60%;

  background:linear-gradient(180deg,var(--pink) 0%,var(--pink-d) 100%);

  box-shadow:0 4px 0 #E07A9E,0 8px 16px rgba(247,156,184,.35);transition:all .12s;

  min-height:44px;user-select:none;white-space:nowrap;

}

.btn:active{transform:translateY(4px);box-shadow:0 0 0 #E07A9E}

.btn.b-blue{background:linear-gradient(180deg,var(--blue),var(--blue-d));box-shadow:0 4px 0 #6FADDA,0 8px 16px rgba(140,198,234,.4)}

.btn.b-blue:active{box-shadow:0 0 0 #6FADDA}

.btn.b-mint{background:linear-gradient(180deg,var(--mint),var(--mint-d));box-shadow:0 4px 0 #7BC7A4,0 8px 16px rgba(154,219,187,.4)}

.btn.b-mint:active{box-shadow:0 0 0 #7BC7A4}

.btn.b-lav{background:linear-gradient(180deg,var(--lav),var(--lav-d));box-shadow:0 4px 0 #A486D4,0 8px 16px rgba(191,168,230,.4)}

.btn.b-lav:active{box-shadow:0 0 0 #A486D4}

.btn.b-cream{background:linear-gradient(180deg,#FFE9BC,var(--cream-d));color:var(--ink);box-shadow:0 4px 0 #DDBE72,0 8px 16px rgba(245,223,168,.4)}

.btn.b-cream:active{box-shadow:0 0 0 #DDBE72}

.btn.b-ghost{background:#fff;color:var(--pink-d);border:2.5px dashed var(--pink-d);box-shadow:none}

.btn.b-ghost:active{transform:translateY(2px);background:var(--pink-l)}

.btn.sm{padding:6px 14px;font-size:.85rem;min-height:36px}

.btn.xs{padding:3px 10px;font-size:.75rem;min-height:28px;border-radius:999px}

.btn.danger{background:linear-gradient(180deg,#FFB3B3,#F58A8A);box-shadow:0 4px 0 #E06A6A}

.btn.danger:active{box-shadow:0 0 0 #E06A6A}



/* ============ 输入（手绘边框） ============ */

.inp,select.inp,textarea.inp{

  width:100%;padding:11px 14px;border:2.5px solid var(--pink-l);border-radius:18px 22px 20px 24px/24px 18px 26px 20px;

  background:#fff;font-size:.95rem;outline:none;transition:border .18s;min-height:44px;

}

.inp:focus{border-color:var(--pink-d);box-shadow:0 0 0 4px rgba(247,156,184,.15)}

textarea.inp{min-height:80px;resize:vertical}

label.lbl{display:block;font-size:.82rem;color:var(--ink-l);margin:10px 0 5px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

.row>*{flex:1;min-width:130px}

.row .btn{flex:0 0 auto}



/* ============ 提醒横幅 ============ */

.banner{

  position:fixed;top:0;left:0;right:0;z-index:500;padding:12px 60px 12px 20px;

  background:linear-gradient(90deg,var(--pink),var(--lav));color:#fff;font-size:1rem;

  display:none;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.15);

  animation:bannerIn .4s ease;border-radius:0 0 18px 18px;

}

.banner.show{display:flex}

.banner .b-ic{font-size:1.4rem;animation:ring 1s ease-in-out infinite}

@keyframes ring{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}

@keyframes bannerIn{from{transform:translateY(-100%)}to{transform:translateY(0)}}

.banner .b-close{margin-left:auto;background:rgba(255,255,255,.25);border-radius:50%;width:32px;height:32px;font-size:1rem;color:#fff;flex:0 0 auto}



/* ============ Toast ============ */

.toast{

  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);z-index:600;

  background:var(--ink);color:#fff;padding:12px 26px;border-radius:999px;font-size:.92rem;

  opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center;

}

.toast.show{transform:translateX(-50%) translateY(0);opacity:1}



/* ============ 模态框 ============ */

.modal-mask{position:fixed;inset:0;background:rgba(90,74,94,.35);backdrop-filter:blur(3px);z-index:400;display:none;align-items:center;justify-content:center;padding:16px}

.modal-mask.show{display:flex}

.modal{

  background:var(--white);border-radius:26px;border:3px solid var(--pink);max-width:560px;width:100%;

  max-height:88vh;overflow-y:auto;padding:24px;position:relative;box-shadow:var(--shadow);

  animation:pop .25s ease;

}

@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

.modal h3{color:var(--pink-d);margin-bottom:14px;font-size:1.25rem;display:flex;align-items:center;gap:8px}

.modal .x-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--pink-l);color:var(--pink-d);font-size:1rem}

.modal .x-close:active{transform:scale(.9)}



/* ============ 页面切换 ============ */

.page{display:none;animation:pageIn .3s ease}

.page.active{display:block}

@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}



/* ============ 空状态 ============ */

.empty{

  text-align:center;padding:30px 16px;color:var(--ink-l);font-size:.9rem;

}

.empty .pic{font-size:3.2rem;display:block;margin-bottom:10px;animation:floaty 4s ease-in-out infinite}

.empty .tip{font-size:.78rem;color:#B8A8BE;margin-top:6px}



/* ============ 列表条目 ============ */

.item{

  display:flex;align-items:center;gap:10px;padding:12px 14px;margin:8px 0;

  background:#fff;border:2px solid var(--pink-l);border-radius:20px 16px 22px 18px/18px 22px 16px 22px;

  transition:all .15s;flex-wrap:wrap;

}

.item:hover{border-color:var(--pink);transform:translateX(2px)}

.item .it-ic{font-size:1.3rem;flex:0 0 auto}

.item .it-main{flex:1;min-width:0}

.item .it-title{font-size:.95rem;color:var(--ink);word-break:break-all}

.item .it-sub{font-size:.75rem;color:var(--ink-l);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.item .it-acts{display:flex;gap:6px;flex:0 0 auto;align-items:center}

.badge{font-size:.7rem;padding:2px 10px;border-radius:10px;white-space:nowrap}

.badge.pink{background:var(--pink-l);color:var(--pink-d)}

.badge.blue{background:var(--blue);color:#4A7EA8}

.badge.mint{background:var(--mint);color:#3E8E68}

.badge.lav{background:var(--lav);color:#7B5FB5}

.badge.cream{background:var(--cream);color:#A98428}

.badge.gray{background:#EEE9EF;color:#9A8A9E}

.badge.red{background:#FFD6D6;color:#C55}



/* 小花勾选框 */

.chk{

  width:26px;height:26px;flex:0 0 auto;position:relative;background:#fff;

  border:2.5px solid var(--pink-l);border-radius:50%;transition:all .2s;

}

.chk::after{content:'✿';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;transition:all .2s}

.chk.on{background:var(--pink);border-color:var(--pink-d);transform:rotate(20deg) scale(1.05)}

.chk.on::after{color:#fff}

.chk:active{transform:scale(.85)}



/* 糖果条纹进度条 */

.candy{height:16px;border-radius:999px;background:#F3EBF4;overflow:hidden;border:2px solid #fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}

.candy>i{display:block;height:100%;border-radius:999px;background:repeating-linear-gradient(45deg,var(--pink) 0 10px,#FFD9E6 10px 20px);transition:width .5s ease}

.candy.mint>i{background:repeating-linear-gradient(45deg,var(--mint-d) 0 10px,var(--mint) 10px 20px)}

.candy.blue>i{background:repeating-linear-gradient(45deg,var(--blue-d) 0 10px,var(--blue) 10px 20px)}



/* ============ 日历 ============ */

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}

.cal-head .m{font-size:1.15rem;color:var(--pink-d)}

.cal-head .nav-btns{display:flex;gap:8px}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}

.cal-dow{text-align:center;font-size:.75rem;color:var(--ink-l);padding:4px 0}

.cal-cell{

  aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;

  font-size:.88rem;border-radius:14px;cursor:pointer;transition:all .15s;color:var(--ink);

  background:rgba(255,255,255,.7);border:2px solid transparent;

}

.cal-cell:hover{border-color:var(--pink);transform:scale(1.08)}

.cal-cell.other{opacity:.3}

.cal-cell.today{background:var(--pink);color:#fff;font-weight:bold;box-shadow:0 3px 0 var(--pink-d)}

.cal-cell.today::before{content:'';position:absolute;inset:-2px;z-index:-1}

.cal-cell.sel{border-color:var(--pink-d);background:var(--pink-l)}

.cal-cell .dot-marks{position:absolute;bottom:4px;display:flex;gap:2px}

.cal-cell .dot-marks i{width:5px;height:5px;border-radius:50%;display:block}



/* 时间轴 */

.timeline{position:relative;padding-left:24px}

.timeline::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;border-left:3px dotted var(--pink-d)}

.tl-item{position:relative;margin:10px 0}

.tl-item::before{content:'';position:absolute;left:-22px;top:14px;width:12px;height:12px;background:#fff;border:3px solid var(--pink-d);border-radius:50%}

.tl-item.done::before{background:var(--mint-d);border-color:var(--mint-d)}



/* ============ Tabs ============ */

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

.tab{

  padding:8px 18px;border-radius:999px;background:#fff;border:2.5px solid var(--pink-l);

  font-size:.88rem;color:var(--ink-l);transition:all .15s;min-height:40px;

}

.tab.on{background:linear-gradient(180deg,var(--pink),var(--pink-d));color:#fff;border-color:var(--pink-d);box-shadow:0 3px 0 var(--pink-d)}

.tab:active{transform:translateY(2px)}



/* ============ 表格 ============ */

.tbl-wrap{overflow-x:auto;border-radius:18px;border:2px solid var(--pink-l);background:#fff}

table.tbl{width:100%;border-collapse:collapse;font-size:.88rem;min-width:480px}

.tbl th{background:var(--pink-l);color:var(--pink-d);padding:10px 8px;font-weight:normal;white-space:nowrap}

.tbl td{padding:9px 8px;border-top:1.5px dashed var(--pink-l);text-align:center;white-space:nowrap}

.tbl tr:hover td{background:#FFF7FA}



/* ============ 模块特定 ============ */

.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}

.res-card{

  border:2.5px solid var(--blue);border-radius:20px 16px 22px 18px/18px 22px 16px 22px;background:#fff;

  padding:14px;position:relative;transition:all .15s;display:flex;flex-direction:column;gap:6px;

}

.res-card:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(140,198,234,.3)}

.res-card .src{font-size:.68rem}

.res-card a{color:var(--blue-d);word-break:break-all;font-size:.82rem;text-decoration:none;border-bottom:1.5px dotted var(--blue-d)}

.cat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.chip{

  padding:7px 16px;border-radius:999px;background:#fff;border:2.5px solid var(--blue);

  font-size:.85rem;color:var(--ink);transition:all .15s;

}

.chip.on{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d)}



/* 课程表 */

.cls-grid{display:grid;grid-template-columns:70px repeat(5,1fr);gap:6px;min-width:600px}

.cls-grid .h{

  background:var(--pink-l);color:var(--pink-d);text-align:center;padding:10px 4px;border-radius:14px;font-size:.85rem;

}

.cls-grid .c{

  background:#fff;border:2px solid var(--blue);border-radius:14px;padding:8px 4px;text-align:center;

  font-size:.78rem;cursor:pointer;min-height:56px;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:all .15s;

}

.cls-grid .c:hover{background:var(--blue)}

.cls-grid .c.now{background:var(--mint);border-color:var(--mint-d);animation:pulse 2s infinite}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(154,219,187,.5)}50%{box-shadow:0 0 0 8px rgba(154,219,187,0)}}



/* 学生花名册 */

.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}

.stu-card{

  background:#fff;border:2.5px solid var(--lav);border-radius:18px;padding:12px 8px;text-align:center;

  cursor:pointer;transition:all .15s;position:relative;

}

.stu-card:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(191,168,230,.3)}

.stu-card .av{width:44px;height:44px;margin:0 auto 6px;border-radius:50%;background:var(--lav);display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff}

.stu-card .nm{font-size:.92rem}

.stu-card .st{font-size:.68rem;margin-top:3px}

.stu-card .warn{position:absolute;top:-6px;right:-4px;font-size:1.1rem;animation:twinkle 1.5s infinite}



/* 折线图 */

.chart-box{background:#fff;border-radius:18px;border:2px solid var(--pink-l);padding:10px;overflow-x:auto}

.chart-box canvas{display:block;max-width:100%}



/* 附件缩略 */

.att{

  display:inline-flex;align-items:center;gap:6px;background:var(--blue);border-radius:14px;

  padding:6px 12px;font-size:.8rem;color:#3A6E96;margin:4px 4px 0 0;max-width:100%;

}

.att img{width:30px;height:30px;object-fit:cover;border-radius:8px}

.att .del{color:#C55;font-weight:bold}



/* 金额统计 */

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}

.stat{

  background:#fff;border:2.5px solid var(--cream-d);border-radius:20px;padding:14px;text-align:center;

}

.stat .v{font-size:1.5rem;color:var(--pink-d)}

.stat .l{font-size:.78rem;color:var(--ink-l);margin-top:2px}



/* 设置 */

.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:2px dashed var(--pink-l);flex-wrap:wrap}

.set-row:last-child{border:none}

.set-row .sl{font-size:.95rem}

.set-row .sd{font-size:.72rem;color:var(--ink-l);margin-top:2px}

.switch{position:relative;width:54px;height:30px;flex:0 0 auto}

.switch input{opacity:0;width:0;height:0}

.switch .tk{position:absolute;inset:0;background:#E3D8E5;border-radius:999px;transition:.25s;cursor:pointer}

.switch .tk::before{content:'';position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 2px 5px rgba(0,0,0,.2)}

.switch input:checked+.tk{background:var(--mint-d)}

.switch input:checked+.tk::before{transform:translateX(24px)}



/* 快速添加浮动按钮 */

.fab{

  position:fixed;right:22px;bottom:22px;z-index:150;width:58px;height:58px;

  background:linear-gradient(180deg,var(--pink),var(--pink-d));color:#fff;font-size:1.7rem;

  border-radius:50% 50% 50% 8px;box-shadow:0 5px 0 #E07A9E,0 10px 20px rgba(247,156,184,.45);

  display:flex;align-items:center;justify-content:center;transition:all .12s;

}

.fab:active{transform:translateY(5px);box-shadow:0 0 0 #E07A9E}



/* 照片墙 */

.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}

.photo-grid .ph{position:relative;border-radius:14px;overflow:hidden;border:2.5px solid var(--pink-l);aspect-ratio:1;cursor:pointer}

.photo-grid .ph img{width:100%;height:100%;object-fit:cover}

.photo-grid .ph .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.45);color:#fff;width:22px;height:22px;border-radius:50%;font-size:.8rem;display:flex;align-items:center;justify-content:center}



/* ============ 吉祥物装饰元素 ============ */

.bg-deco{position:absolute;pointer-events:none;opacity:.92}

.deco-balloon{animation:floaty 6s ease-in-out infinite}

.deco-balloon.b2{animation-delay:-2s}

.deco-balloon.b3{animation-delay:-4s}

.deco-flower{position:absolute;bottom:9vh;pointer-events:none;animation:sway 4.5s ease-in-out infinite;transform-origin:bottom center}

.deco-flower.f2{animation-delay:-1.5s}

.deco-flower.f3{animation-delay:-2.8s}

.deco-bow{animation:floaty 7s ease-in-out infinite}

.deco-bow.by2{animation-delay:-3s}

.deco-star{position:absolute;pointer-events:none;animation:twinkle 3.2s ease-in-out infinite}

.mascot-card .img svg{width:100%;height:100%;display:block}

.bunny-bullet{display:inline-flex;vertical-align:-3px;margin-right:4px}



/* ============ 头像 / 名字编辑 ============ */

.avatar-wrap{position:relative;cursor:pointer;flex:0 0 auto}

.avatar-wrap img{width:48px;height:48px;border-radius:50%;border:3px solid var(--pink);object-fit:cover;display:block;background:#fff}

.avatar-wrap:hover img{border-color:var(--pink-d)}

.avatar-wrap .cam{

  position:absolute;right:-5px;bottom:-5px;width:21px;height:21px;border-radius:50%;

  background:var(--pink-d);color:#fff;font-size:.62rem;display:flex;align-items:center;justify-content:center;

  border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);

}

.brand-name{cursor:pointer;display:flex;align-items:center;gap:5px;line-height:1.2}

.brand-name:hover{color:var(--pink-d)}

.brand-name .pen{font-size:.68rem;opacity:.55}



/* ============ 每日共读 ============ */

.art-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

.art-digest p{line-height:1.95;font-size:.95rem;margin:0 0 13px;color:var(--ink);text-align:justify}

.annot{

  position:relative;background:linear-gradient(90deg,#FFF0F5,#FFFAF6);

  border-left:4px solid var(--pink-d);border-radius:0 18px 18px 0;

  padding:11px 15px;margin:14px 0;font-size:.9rem;line-height:1.75;color:var(--ink);

  box-shadow:0 2px 8px rgba(247,156,184,.15);

}

.annot .who{font-weight:bold;color:var(--pink-d);display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:.85rem}

.annot em{font-style:normal;background:linear-gradient(180deg,transparent 62%,#FFE3EE 62%);font-weight:bold;color:var(--pink-d)}

.checkin-area{margin-top:16px;padding-top:14px;border-top:2px dashed var(--pink-l);display:flex;flex-direction:column;gap:10px}

.checkin-note{font-size:.88rem;color:var(--ink-l)}

.learn-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}

.learn-stats .st{background:#fff;border:2.5px solid var(--mint);border-radius:18px;padding:10px 6px;text-align:center}

.learn-stats .st b{display:block;font-size:1.5rem;color:var(--mint-d);line-height:1.2}

.learn-stats .st span{font-size:.72rem;color:var(--ink-l)}

.streak-dots{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

.streak-dots .lab{font-size:.75rem;color:var(--ink-l);width:100%}

.sdot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;background:#fff;border:2px dashed var(--pink-l);color:var(--ink-l)}

.sdot.on{background:var(--pink);border:2px solid var(--pink-d);color:#fff;box-shadow:0 2px 0 var(--pink-d)}

.sdot.tdy{border-color:var(--pink-d)}

.checkin-log{display:flex;flex-direction:column;gap:8px}

.checkin-log .lg{display:flex;gap:8px;align-items:center;font-size:.82rem;background:#fff;border:2px solid var(--mint);border-radius:14px;padding:7px 12px}

.checkin-log .lg .d{color:var(--mint-d);font-weight:bold;flex:0 0 auto}

.checkin-log .lg .t{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

.lib-card{background:#fff;border:2.5px solid var(--blue);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:all .18s;position:relative}

.lib-card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(140,198,234,.35)}

.lib-card .ti{font-weight:bold;font-size:.95rem;line-height:1.45}

.lib-card .src{font-size:.72rem;color:var(--ink-l)}

.lib-card .rd{

  position:absolute;top:-9px;right:10px;background:var(--mint);border:2px solid var(--mint-d);

  color:#fff;font-size:.65rem;padding:2px 10px;border-radius:10px;transform:rotate(3deg);font-weight:bold;

}

.art-modal-body{max-height:60vh;overflow-y:auto;padding-right:6px}

}

  .sidebar{transform:translateX(-105%);transition:transform .28s ease;width:250px;box-shadow:8px 0 30px rgba(0,0,0,.15)}

  .main{margin-left:0;padding:70px 14px 110px}

  .menu-toggle{display:flex}

// 读取浏览器中存储的数据

function load(){

  try{

    const raw = localStorage.getItem('kexue_v1');

    if(raw){

      S = Object.assign(defaultState(), JSON.parse(raw));

    } else {

      S = defaultState();

    }

  }catch(e){ S = defaultState(); console.warn(e); }

  // 保证嵌套对象存在

  const d = defaultState();

  for(const k of Object.keys(d)){

    if(typeof d[k]==='object' && !Array.isArray(d[k]) && d[k]!==null && (typeof S[k]!=='object' || S[k]===null)){

      S[k]=d[k];

    }

  }

  S.today = S.today || {selDate:'', calMonth:null};

  S.profile = Object.assign(d.profile, S.profile);

  // 品牌迁移：旧本地数据里遗留的"米菲"标题一律替换为"科学工作台"

  if(S.profile && S.profile.title && String(S.profile.title).indexOf('米菲')>-1){

    S.profile.title = '科学工作台';

  }

  S.settings = Object.assign(d.settings, S.settings);

  S.class = Object.assign(d.class, S.class);

  S.learn = Object.assign({checks:{},read:{},notes:{}}, S.learn||{});

  S.learn.checks = S.learn.checks||{}; S.learn.read = S.learn.read||{}; S.learn.notes = S.learn.notes||{};

}



function save(){

  try{

    localStorage.setItem('kexue_v1', JSON.stringify(S));

  }catch(e){

    toast('⚠️ 存储已满，请导出备份');

  }

}



/* ============== 通用工具 ============== */

function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function pad(n){ return n<10?'0'+n:''+n; }

function fmtDate(d){

  const x = (d instanceof Date)?d:new Date(d);

  return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());

}

function todayISO(){ return fmtDate(new Date()); }

function weekDay(d){

  const x = (d instanceof Date)?d:new Date(d);

  const arr=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  return arr[x.getDay()];

}

function ymdhms(d){

  d = d || new Date();

  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());

}

function parseDate(s){

  const t = (s+'').split('-');

  if(t.length!==3) return new Date();

  return new Date(+t[0],+t[1]-1,+t[2]);

}

function escapeHtml(s){

  return (s+'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

}

function fileSize(b){

  if(b<1024) return b+'B';

  if(b<1024*1024) return (b/1024).toFixed(1)+'KB';

  return (b/1024/1024).toFixed(2)+'MB';

}

function toast(msg, t){

  const el = document.getElementById('toast');

  el.textContent = msg;

  el.classList.add('show');

  clearTimeout(el._t);

  el._t = setTimeout(()=>el.classList.remove('show'), t||2200);

}

function showBanner(text){

  const b = document.getElementById('banner');

  document.getElementById('bannerText').textContent = text;

  b.classList.add('show');

  if(window.Notification && Notification.permission==='granted'){

    try{ new Notification('科学工作台 💗', {body:text, icon:IMG_MASCOT}); }catch(_){}

  }

}

function closeBanner(){ document.getElementById('banner').classList.remove('show'); }

window.closeBanner = closeBanner;



function readFileAsDataURL(file){

  return new Promise((res,rej)=>{

    const r = new FileReader();

    r.onload = e => res({name:file.name, type:file.type, size:file.size, b64:e.target.result});

    r.onerror = rej;

    r.readAsDataURL(file);

  });

}

  });

  // 5) 其他工作未完成（到期日不晚于今天）

  (S.other||[]).filter(x=>x.date && x.date<=t && !x.done).forEach(x=>{

    list.push({ic:'🎀', tag:'其他工作', title:x.title, sub:x.date, btn:'✓ 完成', act:"doneOther('"+x.id+"')"});

function cdEnsureAudio(){ try{ if(!window._cdAudioCtx) window._cdAudioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(window._cdAudioCtx.state==='suspended') window._cdAudioCtx.resume(); }catch(e){} }

function cdBeep(f,d,t){

  try{

    cdEnsureAudio();

    const c = window._cdAudioCtx.currentTime, o = window._cdAudioCtx.createOscillator(), g = window._cdAudioCtx.createGain();

    o.type = t||'sine'; o.frequency.setValueAtTime(f,c); g.gain.setValueAtTime(.3,c);

    g.gain.exponentialRampToValueAtTime(.001, c+d); o.connect(g); g.connect(window._cdAudioCtx.destination);

    o.start(c); o.stop(c+d);

  }catch(e){}

}

function cdChime(){ cdBeep(520,.25); setTimeout(function(){cdBeep(660,.3)},300); }

function cdFormatTime(sec){

  sec = Math.max(0, Math.floor(sec));

  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), ss = sec%60;

  return h>0 ? String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')

             : String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');

}

function cdUpdateDisplay(){

  const $t = document.getElementById('cdTimer'), $c = document.getElementById('cdCircle'), $l = document.getElementById('cdLabel');

  if(!$t) return;

  $t.textContent = cdFormatTime(CD.remaining);

  $t.classList.toggle('has-hours', CD.remaining>=3600);

  $c.classList.remove('warning','danger','running');

  if(CD.timerId!==null) $c.classList.add('running');

  if(CD.remaining<=5 && CD.remaining>0) $c.classList.add('danger');

  else if(CD.remaining<=CD.warningTime && CD.remaining>0) $c.classList.add('warning');

  if(CD.remaining<=0 && CD.timerId===null){ $l.textContent='⏰ 时间到！'; }

  else if(CD.timerId!==null){

    if(CD.remaining<=5) $l.textContent='即将结束...';

    else if(CD.remaining<=CD.warningTime) $l.textContent='最后 '+Math.ceil(CD.warningTime/60)+' 分钟提醒';

    else {

      const et = new Date(Date.now()+CD.remaining*1000);

      const days = Math.floor(CD.remaining/86400);

      const hh = String(et.getHours()).padStart(2,'0'), mm = String(et.getMinutes()).padStart(2,'0');

      $l.textContent = '计时中 · 预计 '+(days>0?(et.getMonth()+1)+'/'+et.getDate()+' ':'')+hh+':'+mm+' 结束';

    }

  } else {

    const m = Math.floor(CD.remaining/60);

    if(CD.targetEndSeconds){

      const td = new Date(CD.targetEndSeconds);

      const tdStr = (td.toLocaleDateString('zh-CN',{month:'short',day:'numeric'}));

      const hh = String(td.getHours()).padStart(2,'0'), mm = String(td.getMinutes()).padStart(2,'0');

      $l.textContent = '目标: '+tdStr+' '+hh+':'+mm+' ('+(m>=60?Math.floor(m/60)+'时'+m%60+'分':m+'分钟')+')';

    } else {

      $l.textContent = m>=60 ? '已设定 '+Math.floor(m/60)+'小时'+m%60+'分钟' : '已设定 '+m+' 分钟';

    }

  }

  const el = document.getElementById('cdInfoWarn');

  if(el) el.textContent = Math.ceil(CD.warningTime/60);

  const el2 = document.getElementById('cdInfoEnd');

  if(el2) el2.textContent = CD.targetEndSeconds ? '结束 '+(function(){const t=new Date(CD.targetEndSeconds);return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');})() : '—';

}

function cdStop(){ if(CD.timerId!==null){ clearInterval(CD.timerId); CD.timerId=null; } }

function cdStart(){

  if(CD.remaining<=0) return;

  cdEnsureAudio(); cdStop(); CD.warningFired=false;

  CD.timerId = setInterval(function(){

    CD.remaining--; cdUpdateDisplay();

    if(CD.remaining<=5 && CD.remaining>0) cdBeep(880,.1,'square');

    if(CD.remaining===CD.warningTime && !CD.warningFired){ CD.warningFired=true; cdChime(); }

    if(CD.remaining<=0){

      cdStop(); cdUpdateDisplay();

      cdBeep(660,.2); setTimeout(function(){cdBeep(880,.3)},200); setTimeout(function(){cdBeep(1100,.5)},400);

    }

  },1000);

  document.getElementById('cdBtnStart').style.display='none';

  document.getElementById('cdBtnPause').style.display='';

  cdUpdateDisplay();

}

function cdPause(){

  cdStop();

  document.getElementById('cdBtnStart').style.display='';

  document.getElementById('cdBtnPause').style.display='none';

  document.getElementById('cdLabel').textContent='已暂停';

  document.getElementById('cdCircle').classList.remove('warning','danger','running');

}

function cdReset(){

  cdStop(); CD.remaining = CD.totalSeconds;

  document.getElementById('cdBtnStart').style.display='';

  document.getElementById('cdBtnPause').style.display='none';

  document.getElementById('cdCircle').classList.remove('warning','danger','running');

  cdUpdateDisplay(); cdHighlightActive();

}

function cdSetTime(sec){

  cdStop(); CD.totalSeconds = sec; CD.remaining = sec; CD.targetEndSeconds = null;

  document.getElementById('cdBtnStart').style.display='';

  document.getElementById('cdBtnPause').style.display='none';

  document.getElementById('cdCircle').classList.remove('warning','danger','running');

  cdUpdateDisplay(); cdHighlightActive();

}

function cdSetEndTimeByTs(ts, diff){

  cdStop(); CD.targetEndSeconds = ts; CD.totalSeconds = diff; CD.remaining = diff;

  document.getElementById('cdBtnStart').style.display='';

  document.getElementById('cdBtnPause').style.display='none';

  document.getElementById('cdCircle').classList.remove('warning','danger','running');

  cdUpdateDisplay(); cdHighlightActive();

}

function cdSetEndTime(dateStr, h, m){

  cdStop();

  const now = new Date();

  let target;

  if(dateStr){

    target = new Date(dateStr+'T'+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':00');

  } else {

    target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);

    if(target<=now) target.setDate(target.getDate()+1);

  }

  const diff = Math.floor((target.getTime()-Date.now())/1000);

  if(diff<=0){ toast('目标时间已过！请选择未来时间'); return; }

  CD.targetEndSeconds = target.getTime(); CD.totalSeconds = diff; CD.remaining = diff;

  document.getElementById('cdBtnStart').style.display='';

  document.getElementById('cdBtnPause').style.display='none';

  document.getElementById('cdCircle').classList.remove('warning','danger','running');

  cdUpdateDisplay(); cdHighlightActive();

}

function cdGenTimepoints(){

  const now = new Date();

  const nowMins = now.getHours()*60 + now.getMinutes();

  const next5 = Math.ceil(nowMins/5)*5;

  const offsets = [0,5,10,15,20,25,30,40,50,60,75,90,105,120,150,180];

  const points = [];

  let dayOffset = 0;

  for(let i=0;i<offsets.length && points.length<12; i++){

    let tm = (next5+offsets[i])%1440;

    if(next5+offsets[i]>=1440 && dayOffset===0) dayOffset=1;

    const h = Math.floor(tm/60)%24, mm = tm%60;

    const ts = new Date(now.getFullYear(), now.getMonth(), now.getDate()+dayOffset, h, mm, 0).getTime();

    const diff = Math.floor((ts-Date.now())/1000);

    if(diff<50) continue;

    points.push({h:h, m:mm, ts:ts, diff:diff, dayOffset:dayOffset});

  }

  return points;

}

function cdRenderTimepoints(){

  const grid = document.getElementById('cdTimepointGrid');

  if(!grid) return;

  const pts = cdGenTimepoints();

  grid.innerHTML = pts.map(function(p){

    const hh = String(p.h).padStart(2,'0'), mm = String(p.m).padStart(2,'0');

    const tag = p.dayOffset ? '<small>明天</small>' : '';

    return '<button class="cd-timepoint" data-ts="'+p.ts+'" onclick="cdPickTimepoint('+p.ts+')">'+hh+':'+mm+tag+'</button>';

  }).join('');

  cdHighlightTimepoints();

}

window.cdPickTimepoint = function(ts){

  const diff = Math.floor((ts-Date.now())/1000);

  if(diff<=0) return;

  cdSetEndTimeByTs(ts, diff);

  cdHighlightTimepoints();

};

function cdHighlightTimepoints(){

  const grid = document.getElementById('cdTimepointGrid');

  if(!grid) return;

  grid.querySelectorAll('.cd-timepoint').forEach(function(b){

    b.classList.toggle('selected', parseInt(b.dataset.ts)===CD.targetEndSeconds);

  });

}

function cdHighlightActive(){

  const grid = document.getElementById('cdTimepointGrid');

  if(grid) cdHighlightTimepoints();

  if(CD.mode==='daily'){

    const pg = document.getElementById('cdPresetGrid');

    if(pg) pg.querySelectorAll('.cd-preset').forEach(function(b){

      b.classList.toggle('selected', parseInt(b.dataset.sec)===CD.totalSeconds);

    });

  } else {

    const h = document.getElementById('cdInHours'), m = document.getElementById('cdInMinutes'), s = document.getElementById('cdInSeconds');

    if(h){ h.value = Math.floor(CD.totalSeconds/3600); m.value = Math.floor((CD.totalSeconds%3600)/60); s.value = CD.totalSeconds%60; }

  }

}

function renderToday(box){

  const now = new Date();

  S.today = S.today || {};

  if(!S.today.calMonth) S.today.calMonth = {y: now.getFullYear(), m: now.getMonth()};

  if(!S.today.selDate)  S.today.selDate = todayISO();

  const cm = S.today.calMonth;

  const sel = S.today.selDate;

  box.innerHTML = `

    <div class="card t-blue">

      <h3><span class="em">📆</span>日历视图 <span class="cnt" id="curMonthTxt"></span></h3>

      <div class="cal-head">

        <button class="btn sm b-blue" onclick="calNav(-1)">‹</button>

        <div class="m" id="calTitle">—</div>

        <button class="btn sm b-blue" onclick="calNav(1)">›</button>

        <button class="btn sm b-ghost" onclick="calToday()">回到今天</button>

      </div>

      <div class="cal-grid" id="calGrid"></div>

    </div>

    <div class="card t-blue">

      <h3><span class="em">⏰</span>所选日期行程 <span class="cnt" id="selDateTxt"></span></h3>

      <div class="row" style="margin-bottom:10px">

        <button class="btn sm b-blue" onclick="openEdit('schedule',null)">+ 固定行程</button>

        <button class="btn sm b-cream" onclick="openEdit('reminder',null)">+ 提醒事项</button>

      </div>

      <div class="timeline" id="dayTimeline"></div>

    </div>`;

  drawCal();

  drawDay();

}



function drawCal(){

  const cm = S.today.calMonth;

  const sel = S.today.selDate;

  document.getElementById('calTitle').textContent = `${cm.y} 年 ${cm.m+1} 月`;

  document.getElementById('curMonthTxt').textContent = `${cm.m+1}/${cm.y}`;

  const grid = document.getElementById('calGrid');

  const dow = ['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('');

  const first = new Date(cm.y, cm.m, 1);

  const startW = first.getDay();

  const lastDay = new Date(cm.y, cm.m+1, 0).getDate();

  let html = dow;

  for(let i=0;i<startW;i++) html += `<div></div>`;

  for(let d=1; d<=lastDay; d++){

    const iso = cm.y+'-'+pad(cm.m+1)+'-'+pad(d);

    const isSel = iso===sel;

    const isToday = iso===todayISO();

    const hasFix = S.schedule_fixed[iso] && S.schedule_fixed[iso].length;

    const hasRem = S.reminders[iso] && S.reminders[iso].length;

    const hasDuty = S.duty.some(x => x.date === iso);

    html += `<div class="cal-cell ${isSel?'sel':''} ${isToday?'today':''}" onclick="pickCal('${iso}')">

      ${d}

      <div class="dot-marks">

        ${hasFix?'<i style="background:#FFC2D4"></i>':''}

        ${hasRem?'<i style="background:#FFE28A"></i>':''}

        ${hasDuty?'<i style="background:#9ADBBB"></i>':''}

      </div>

    </div>`;

  }

  grid.innerHTML = html;

}



window.calNav = function(delta){

  let {y,m} = S.today.calMonth;

  m += delta;

  if(m<0){ m=11; y--; }

  if(m>11){ m=0; y++; }

  S.today.calMonth = {y,m};

  save();

  drawCal();

};



window.calToday = function(){

  const n = new Date();

  S.today.calMonth = {y:n.getFullYear(), m:n.getMonth()};

  S.today.selDate = todayISO();

  save();

  drawCal();

  drawDay();

};



window.pickCal = function(iso){

  S.today.selDate = iso;

  save();

  drawCal();

  drawDay();

};



function drawDay(){

  const sel = S.today.selDate;

  document.getElementById('selDateTxt').textContent = sel + ' ' + weekDay(sel);

  // 合并显示：固定行程 + 提醒（按时间升序）

  const fix = (S.schedule_fixed[sel] || []).map(x => ({...x, type:'fix'}));

  const rem = (S.reminders[sel] || []).map(x => ({...x, type:'rem'}));

  const all = [...fix, ...rem].sort((a,b)=> (a.time||'').localeCompare(b.time||''));

  const box = document.getElementById('dayTimeline');

  if(all.length===0){

    box.innerHTML = `<div class="empty"><span class="pic">📭</span>当天还没有安排<br><span class="tip">点击上方 + 固定行程 / + 提醒事项 开始添加吧～</span></div>`;

    return;

  }

  let html='';

  for(const x of all){

    const ic = x.type==='fix' ? '🗓️' : '🔔';

    const tag = x.type==='fix' ? '<span class="badge pink">固定</span>' : '<span class="badge cream">提醒</span>';

    html += `<div class="tl-item ${x.done?'done':''}">

      <div class="item" style="margin:6px 0;width:100%">

        <span class="chk ${x.done?'on':''}" onclick="toggleTodo('${x.type}','${sel}','${x.id}')"></span>

        <span class="it-ic">${ic}</span>

        <div class="it-main">

          <div class="it-title">${escapeHtml(x.title)} ${tag}</div>

          <div class="it-sub">${escapeHtml(x.time||'')}${x.duration?'  /  '+escapeHtml(x.duration):''}</div>

        </div>

        <div class="it-acts">

          <button class="btn xs b-ghost" onclick="openEdit('${x.type}','${sel}','${x.id}')">编辑</button>

          <button class="btn xs danger" onclick="delTodo('${x.type}','${sel}','${x.id}')">删除</button>

        </div>

      </div>

    </div>`;

  }

  box.innerHTML = html;

}



window.toggleTodo = function(type, date, id){

  const arr = (type==='fix') ? S.schedule_fixed[date] : S.reminders[date];

  if(!arr) return;

  const item = arr.find(x=>x.id===id);

  if(item) item.done = !item.done;

  save();

  if(document.getElementById('dayTimeline')) drawDay();

  if(document.getElementById('calGrid')) drawCal();

  if(document.getElementById('homeAlerts')) drawHomeAlerts();

};



window.delTodo = function(type, date, id){

  if(!confirm('确定要删除吗？')) return;

  const arr = (type==='fix') ? S.schedule_fixed[date] : S.reminders[date];

  if(!arr) return;

  const i = arr.findIndex(x=>x.id===id);

  if(i>=0) arr.splice(i,1);

  save();

  drawDay();

  drawCal();

};

/* 连续打卡天数 */

function streakDays(){

  let c = 0;

  const d = new Date();

  if(!S.learn.checks[fmtDate(d)]) d.setDate(d.getDate()-1);

  while(S.learn.checks[fmtDate(d)]){ c++; d.setDate(d.getDate()-1); }

  return c;

}

function renderDigest(art){

  let html = '';

  const n = Math.max(art.paras.length, art.notes.length);

  for(let i=0;i<n;i++){

    if(art.paras[i]) html += '<p>'+escapeHtml(art.paras[i])+'</p>';

    if(art.notes[i]){

      html += '<div class="annot"><div class="who">'+bunnyHeadSVG('#FFC2D4',15)+' 科学批注 · '+escapeHtml(art.notes[i].t)+'</div><div>'+escapeHtml(art.notes[i].d)+'</div></div>';

    }

  }

  return html;

}

function initCards(){

  if(S.cardsInit || !Array.isArray(S.cards) || S.cards.length>0) return;

  S.cards = CARD_DECK.map(c=>({id:uid(), tag:c.tag, q:c.q, a:c.a, box:0, due:todayISO(), n:0}));

  S.cardsInit = true;

  save();

}

function dueCards(){

  const t = todayISO();

  return (S.cards||[]).filter(c=>c.box<6 && c.due<=t);

}

function drawFlashCards(){

  const el = document.getElementById('flashPanel');

  if(!el) return;

  const due = dueCards();

  const total = (S.cards||[]).length;

  const mastered = (S.cards||[]).filter(c=>c.box>=6).length;

  el.innerHTML = `

    <div class="fc-stats">

      <div class="st"><b>${due.length}</b><span>今日待复习</span></div>

      <div class="st"><b>${total}</b><span>卡组总数</span></div>

      <div class="st"><b>${mastered}</b><span>已掌握</span></div>

    </div>

    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">

      <button class="btn b-mint" onclick="openCardStudy()">🧠 开始复习（${due.length}）</button>

      <button class="btn b-ghost" onclick="openCardManager()">🗂️ 卡组管理</button>

      <span class="checkin-note" style="align-self:center">记得 → 拉长复习间隔；忘了 → 重新学</span>

    </div>`;

}

let studyQueue = [], studyIdx = 0, studyOK = 0;

window.openCardStudy = function(){

  const due = dueCards();

  if(due.length===0){

    const total = (S.cards||[]).length;

    showModal({title:'🧠 记忆闪卡', bodyHtml:`<div style="text-align:center;padding:10px">

      ${total===0?'<p>卡组还是空的～点"卡组管理"添加第一张卡吧</p>':'<p style="font-size:1.1rem">🎉 今天该复习的都复习完啦！</p><p class="tip">已掌握 '+(S.cards||[]).filter(c=>c.box>=6).length+' 张 · 共 '+total+' 张</p>'}

      <button class="btn b-mint" style="margin-top:10px" onclick="closeModal();openCardManager()">🗂️ 卡组管理</button>

    </div>`});

    return;

  }

  studyQueue = due.slice().sort((a,b)=>(a.due||'').localeCompare(b.due||''));

  studyIdx = 0; studyOK = 0;

  showCardModal();

};

function showCardModal(){

  const c = studyQueue[studyIdx];

  if(!c) return;

  const gap = c.box>=6 ? '—' : (CARD_STAGES[Math.min(c.box,5)]+' 天后');

  showModal({

    title:'🧠 记忆闪卡 · 第 '+(studyIdx+1)+'/'+studyQueue.length+' 张',

    bodyHtml:`

      <div class="fc-card" id="fcCard">

        <span class="badge pink">${escapeHtml(c.tag)} · 已复习 ${c.n||0} 次</span>

        <div class="fc-q">${escapeHtml(c.q)}</div>

        <div class="fc-a" id="fcAnswer" style="display:none">${escapeHtml(c.a)}</div>

      </div>

      <div style="text-align:center;margin-top:14px">

        <button class="btn b-blue" id="fcFlip" onclick="flipCard()">👀 显示答案</button>

        <div id="fcRate" style="display:none;margin-top:12px">

          <button class="btn b-mint" onclick="cardRate(1)">✓ 记得 · 下次 ${gap} 复习</button>

          <button class="btn danger" onclick="cardRate(0)">✗ 忘了 · 重新学</button>

        </div>

      </div>`

  });

}

window.flipCard = function(){

  const ans = document.getElementById('fcAnswer');

  const flip = document.getElementById('fcFlip');

  if(!ans || !flip) return;

  ans.style.display = 'block';

  flip.style.display = 'none';

  document.getElementById('fcRate').style.display = 'block';

};

window.cardRate = function(know){

  const c = studyQueue[studyIdx];

  if(!c) return;

  if(know){

    c.box = Math.min((c.box||0)+1, 6);

    studyOK++;

  } else {

    c.box = 0;

  }

  c.n = (c.n||0)+1;

  const d = new Date();

  d.setDate(d.getDate() + (c.box>=6 ? 9999 : CARD_STAGES[Math.min(c.box,5)]));

  c.due = fmtDate(d);

  save();

  studyIdx++;

window.onAvatarPicked = function(ev){

  const f = ev.target.files[0];

  if(!f) return;

  readFileAsDataURL(f).then(({b64})=>{

    const img = new Image();

    img.onload = ()=>{

      try{

        const c = document.createElement('canvas');

        const sc = Math.min(1, 220/Math.max(img.width,img.height));

        c.width = Math.max(1,Math.round(img.width*sc));

        c.height = Math.max(1,Math.round(img.height*sc));

        c.getContext('2d').drawImage(img,0,0,c.width,c.height);

        S.profile.avatar = c.toDataURL('image/jpeg', .85);

      }catch(e){ S.profile.avatar = b64; }

      save(); applyProfile(); toast('🐰 头像已更换');

    };

    img.onerror = ()=>{ S.profile.avatar = b64; save(); applyProfile(); toast('🐰 头像已更换'); };

    img.src = b64;

  }).catch(()=>toast('❌ 图片读取失败'));

  ev.target.value = '';

};

/* ── 作息配置：点「⚙ 作息时间」可自定义，存在本机 ── */
const CLS_DEF = { days: ['一','二','三','四','五'], periods: ['第1节','第2节','第3节','第4节','第5节','第6节','第7节','第8节'], times: ['08:00','08:50','09:50','10:40','11:30','13:30','14:20','15:10'] };
function clsCfg(){
  var c = S.class.cfg;
  if(!c || !c.periods || !c.periods.length) c = S.class.cfg = {days:CLS_DEF.days.slice(), periods:CLS_DEF.periods.slice(), times:CLS_DEF.times.slice()};
  if(!c.days || !c.days.length) c.days = CLS_DEF.days.slice();
  if(!c.times) c.times = [];
  while(c.times.length < c.periods.length) c.times.push('');
  return c;
}
function clsDays(){ return clsCfg().days; }
function clsPeriods(){ return clsCfg().periods; }
function clsTimes(){ return clsCfg().times; }



function drawClsGrid(){

  const g = document.getElementById('clsGrid');

  g.style.gridTemplateColumns = '70px repeat(' + clsDays().length + ',1fr)';
  let html = '<div class="h">节次</div>';

  clsDays().forEach((d,i)=>{ html += `<div class="h">星期${d}</div>`; });

  const now = new Date();

  const curDay = now.getDay(); // 0-6

  for(let p=0;p<clsPeriods().length;p++){

  if(curDay>=1 && curDay<=5){

    const todayItems = S.class.items.filter(x => x.day === curDay-1).sort((a,b)=>a.period-b.period);

    // 高亮当前节次（根据时分比较）

  }

  drawTodayCls();

}



function drawTodayCls(){

  const curDay = new Date().getDay();

  if(curDay<1 || curDay>clsDays().length){

    document.getElementById('todayClassList').innerHTML = `<div class="empty"><span class="pic">🌙</span>今天是周末，休息一下吧</div>`;

    return;

  }

  const items = S.class.items.filter(x=>x.day===curDay-1).sort((a,b)=>a.period-b.period);

  if(items.length===0){

    document.getElementById('todayClassList').innerHTML = `<div class="empty"><span class="pic">📭</span>今天还没有课程安排</div>`;

    return;

  }

  // 高亮当前正在进行

  const now = new Date();

  const nowH = now.getHours();

  const nowM = now.getMinutes();

  const nowMin = nowH*60 + nowM;

  function inPeriod(p){

    const t = clsTimes()[p] || '00:00';

    const [h,m] = t.split(':').map(Number);

    const start = h*60+m;

    const next = p+1<clsTimes().length ? (parseInt(clsTimes()[p+1].split(':')[0])*60 + parseInt(clsTimes()[p+1].split(':')[1])) : (start+50);

    return nowMin>=start && nowMin<next;

  }

  let html = '';

  for(const it of items){

    const active = inPeriod(it.period);

    html += `<div class="item" style="${active?'border-color:var(--mint-d);background:var(--mint);':''}">

      <span class="it-ic">${active?'🔔':'📘'}</span>

      <div class="it-main">

        <div class="it-title">${escapeHtml(it.name||'')} <span class="badge blue">${clsPeriods()[it.period]||''}</span> ${active?'<span class="badge mint">进行中</span>':''}</div>

        <div class="it-sub">

          <span>⏰ ${clsTimes()[it.period]||''}</span>

          ${it.room?`<span>📍 ${escapeHtml(it.room)}</span>`:''}

        </div>

      </div>

    </div>`;

  }

  document.getElementById('todayClassList').innerHTML = html;

}

function drawExamChart(stuId){

  const c = document.getElementById('examChart');

  if(!c) return;

  const ctx = c.getContext('2d');

  ctx.clearRect(0,0,c.width,c.height);

  const e = (S.studentData[stuId]||{}).exam || [];

  if(e.length===0){

    ctx.font='20px sans-serif';

    ctx.fillStyle='#BFB0C7';

    ctx.textAlign='center';

    ctx.fillText('还没有考试数据，先录入考试～', c.width/2, c.height/2);

    return;

  }

  const data = e.slice().sort((a,b)=>a.date.localeCompare(b.date));

  const padL=50, padB=40, padT=20, padR=20;

  const W = c.width - padL - padR;

  const H = c.height - padB - padT;

  const maxScore = Math.max(...data.map(x=>parseFloat(x.max)||100));

  const minScore = Math.min(...data.map(x=>parseFloat(x.score)||0), 0);



  // 网格

  ctx.strokeStyle='#F3E0EA'; ctx.lineWidth=1;

  for(let i=0;i<=5;i++){

    const y = padT + H*i/5;

    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+W,y); ctx.stroke();

    const val = (maxScore - (maxScore-minScore)*i/5).toFixed(0);

    ctx.fillStyle='#9A8AA0';

    ctx.font='12px sans-serif';

    ctx.textAlign='right';

    ctx.fillText(val, padL-8, y+4);

  }

  // x 轴

  ctx.fillStyle='#5A4A5E';

  ctx.font='11px sans-serif';

  ctx.textAlign='right';

  data.forEach((d,i)=>{

    const x = padL + (data.length===1? W/2 : W*i/(data.length-1));

    ctx.save();

    ctx.translate(x, padT+H+8);

    ctx.rotate(-Math.PI/6);

    ctx.textAlign='right';

    ctx.fillText(`${d.date.slice(5)}\n${d.subject||''}`, 0, 8);

    ctx.restore();

  });

  // 折线

  ctx.strokeStyle='#F79CB8'; ctx.lineWidth=3;

  ctx.beginPath();

  data.forEach((d,i)=>{

    const x = padL + (data.length===1? W/2 : W*i/(data.length-1));

    const y = padT + H*(1 - (parseFloat(d.score)-minScore)/(maxScore-minScore || 1));

    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);

  });

  ctx.stroke();

  // 点

  data.forEach((d,i)=>{

    const x = padL + (data.length===1? W/2 : W*i/(data.length-1));

    const y = padT + H*(1 - (parseFloat(d.score)-minScore)/(maxScore-minScore || 1));

    ctx.fillStyle='#fff'; ctx.strokeStyle='#F79CB8'; ctx.lineWidth=3;

    ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill(); ctx.stroke();

    ctx.fillStyle='#5A4A5E';

    ctx.font='12px sans-serif';

    ctx.textAlign='center';

    ctx.fillText(d.score, x, y-12);

  });

}

function drawDutyCal(){

  const now = new Date();

  const startW = first.getDay();

  const lastDay = new Date(y,m+1,0).getDate();

  let html = ['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('');

  for(let i=0;i<startW;i++) html += `<div></div>`;

  for(let d=1; d<=lastDay; d++){

    const iso = y+'-'+pad(m+1)+'-'+pad(d);

    const items = S.duty.filter(x=>x.date===iso);

    html += `<div class="cal-cell ${iso===todayISO()?'today':''}" title="${items.map(x=>x.item+' '+x.period).join('\\n')}">

      ${d}

      ${items.length?'<div class="dot-marks"><i style="background:#9ADBBB"></i></div>':''}

}

      <input class="inp" id="drPeriod" value="17:30-18:00" placeholder="例如：12:00-13:30">

      <input class="inp" id="drNote" placeholder="如：负责区域 / 注意事项">

        <button class="btn b-mint" onclick="saveDutyRule()">一键生成</button>

      </div>`

  });

};

window.saveDutyRule = function(){

  const wd = ['周日','周一','周二','周三','周四','周五','周六'];

  const weekday = parseInt(document.getElementById('drWd').value,10);

  const item = document.getElementById('drItem').value;

  const period = document.getElementById('drPeriod').value.trim();

  const note = document.getElementById('drNote').value.trim();

  const weeks = Math.max(1, Math.min(24, parseInt(document.getElementById('drWeeks').value,10)||16));

  if(!period) return toast('时段必填');

  const d = new Date(); d.setHours(0,0,0,0);

  while(d.getDay()!==weekday) d.setDate(d.getDate()+1);

  const dates = [];

  for(let i=0;i<weeks;i++){ dates.push(fmtDate(d)); d.setDate(d.getDate()+7); }

  const end = dates[dates.length-1];

  const ruleId = uid();

  for(const iso of dates){ S.duty.push({id:uid(), date:iso, item, period, note, ruleId}); }

  S.dutyRules = S.dutyRules||[];

  S.dutyRules.push({id:ruleId, weekday, item, period, note, weeks, end});

  save();

  closeModal();

  drawDutyTable(); drawDutyCal(); drawDutyRules();

  toast('✅ 已为随后 '+weeks+' 个'+wd[weekday]+'排好值日');

};

window.delDutyRule = function(id){

  if(!confirm('删除该循环规则？已自动生成的值日也会一并移除。')) return;

  S.duty = (S.duty||[]).filter(x=>x.ruleId!==id);

  S.dutyRules = (S.dutyRules||[]).filter(r=>r.id!==id);

  save(); drawDutyTable(); drawDutyCal(); drawDutyRules();

};

function drawParentGrid(){

  const g = document.getElementById('parentGrid');

  if(S.students.length===0){

    g.innerHTML = `<div class="empty" style="grid-column:1/-1"><span class="pic">🐰</span>请先在【学生追踪】中添加学生</div>`;

    return;

  }

  const now = Date.now();

  let html = '';

  for(const s of S.students){

    const list = S.parent[s.id] || [];

    const last = list[list.length-1];

    const days = last ? Math.floor((now - new Date(last.date).getTime())/86400000) : 999;

    let pass = true;

    if(S.parentFilter==='warn' && days<=7) pass = false;

    if(S.parentFilter==='fresh' && days>7) pass = false;

    if(!pass) continue;

    const warn = days>7 ? '<span class="warn">⚠️</span>' : '<span class="badge mint" style="position:absolute;top:-6px;right:-6px">✅</span>';

    html += `<div class="stu-card" onclick="openParentDetail('${s.id}')">

      ${warn}

      <div class="av">${escapeHtml((s.name||'?').slice(0,1))}</div>

      <div class="nm">${escapeHtml(s.name)}</div>

      <div class="st">${last? escapeHtml(last.date)+'（'+days+'天前）': '<span style="color:#bbb">还没沟通</span>'}</div>

    </div>`;

  }

  if(!html) html = `<div class="empty" style="grid-column:1/-1"><span class="pic">📭</span>该筛选下无学生</div>`;

  g.innerHTML = html;

}

  const st = document.getElementById('s63Stat');

  const totalIn = S.six30.filter(x=>x.type==='收').reduce((s,x)=>s+(+x.amt||0),0);

  const totalOut = S.six30.filter(x=>x.type==='支').reduce((s,x)=>s+(+x.amt||0),0);

  const totalR = S.six30.filter(x=>x.type==='报销').reduce((s,x)=>s+(+x.amt||0),0);

  const totalB = S.six30.filter(x=>x.type==='补贴').reduce((s,x)=>s+(+x.amt||0),0);

  st.innerHTML = `

    <div class="stat"><div class="v" style="color:var(--mint-d)">¥${totalIn.toFixed(2)}</div><div class="l">总收入</div></div>

    <div class="stat"><div class="v" style="color:#F58A8A">¥${totalOut.toFixed(2)}</div><div class="l">总支出</div></div>

    <div class="stat"><div class="v" style="color:var(--blue-d)">¥${totalR.toFixed(2)}</div><div class="l">报销合计</div></div>

    <div class="stat"><div class="v" style="color:var(--lav-d)">¥${totalB.toFixed(2)}</div><div class="l">补贴合计</div></div>

  `;

  const tbody = document.querySelector('#s63Table tbody');

  document.getElementById('s63Cnt').textContent = S.six30.length + ' 条';

    tbody.innerHTML = `<tr><td colspan="7"><div class="empty"><span class="pic">💰</span>还没有台账记录</div></td></tr>`;

window.saveClsCfg = function(){
  const WEEK = ['一','二','三','四','五','六','日'];
  const dayBox = document.getElementById('cfgDays');
  const rowBox = document.getElementById('cfgRows');
  if(!dayBox || !rowBox) return;
  const days = Array.prototype.slice.call(dayBox.querySelectorAll('input:checked')).map(function(x){ return +x.value; });
  const names = Array.prototype.slice.call(rowBox.querySelectorAll('[data-pname]')).map(function(x){ return x.value.trim(); });
  const times = Array.prototype.slice.call(rowBox.querySelectorAll('[data-ptime]')).map(function(x){ return x.value; });
  if(!days.length) return toast('至少选一个上课日');
  const keep = [];
  names.forEach(function(n,i){ if(n) keep.push({n:n, t:times[i]||''}); });
  if(!keep.length) return toast('至少保留一个节次');
  days.sort(function(a,b){ return a-b; });
  const oldP = clsPeriods().slice();
  const oldD = clsDays().slice();
  const newDays = days.map(function(i){ return WEEK[i]; });
  // 已排的课按「星期名 / 节次名」重新映射，对不上就夹到最接近的一格
  S.class.items.forEach(function(it){
    const di = newDays.indexOf(oldD[it.day]);
    it.day = di>=0 ? di : Math.min(it.day, newDays.length-1);
    const pi = keep.findIndex(function(k){ return k.n===oldP[it.period]; });
    it.period = pi>=0 ? pi : Math.min(it.period, keep.length-1);
  });
  S.class.items = S.class.items.filter(function(it){ return it.day < newDays.length && it.period < keep.length; });
  S.class.cfg = {days:newDays, periods:keep.map(function(k){return k.n;}), times:keep.map(function(k){return k.t;})};
  save(); closeModal(); drawClsGrid();
  toast('✅ 作息已更新');
};

/* ============== 文件下载 ============== */

function downloadFile(name, content, mime){

  const blob = content.startsWith('data:') ? null : new Blob([content], {type: mime||'text/plain'});

  let url;

  if(blob) url = URL.createObjectURL(blob);

  else {

    // content 是 data url

    const a = document.createElement('a');

    a.href = content;

    a.download = name;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    return;

  }

  const a = document.createElement('a');

  a.href = url; a.download = name;

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  setTimeout(()=>URL.revokeObjectURL(url), 2000);

}

window.saveSettings = function(){

  toast('✅ 已保存');

};



window.exportData = function(){

  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});

  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');

  a.href = url;

  a.download = '科学工作台_备份_'+ymdhms().replace(/[: ]/g,'-')+'.json';

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  setTimeout(()=>URL.revokeObjectURL(url), 2000);

  toast('✅ 备份已下载');

};



window.importData = function(ev){

  const f = ev.target.files[0];

  if(!f) return;

  const r = new FileReader();

  r.onload = e=>{

    try{

      const obj = JSON.parse(e.target.result);

      if(!confirm('导入后将覆盖当前所有数据，确定吗？')) return;

      S = Object.assign(defaultState(), obj);

      save();

      closeModal();

      renderPageBody(S.activePage);

      toast('✅ 已恢复');

    }catch(e){

      toast('❌ 文件格式错误');

    }

  };

  r.readAsText(f);

};



window.clearAllData = function(){

  if(!confirm('确认要清空全部数据吗？此操作不可恢复！')) return;

  if(!confirm('再确认一次：真的要清空吗？')) return;

  S = defaultState();

  save();

  closeModal();

  renderPageBody(S.activePage);

  toast('🗑 已清空');

};



window.requestNotifPerm = function(){

  if(!window.Notification){

    return toast('当前浏览器不支持系统通知');

  }

  Notification.requestPermission().then(p=>{

    toast('通知权限：'+p);

  });

};



/* ============== 提醒调度器 ============== */

let _remindedHash = {};



function checkReminders(){

  if(!S.settings.reminderOn) return;

  const now = new Date();

  const date = todayISO();

  const cur = pad(now.getHours())+':'+pad(now.getMinutes());

  const rems = (S.reminders[date]||[]).filter(x => !x.done && !x.alerted);

  for(const r of rems){

    if(r.time && r.time.substring(0,5) === cur){

      r.alerted = true;

      save();

      showBanner('🔔 提醒：'+r.title+'（'+r.time+'）');

    }

  }

  // 每分钟重新计算"未做"事情的 banner

}



function checkDailyGen(){

  // 设置生成时间，每日提示一次

  const now = new Date();

  const cur = pad(now.getHours())+':'+pad(now.getMinutes());

  if(cur === (S.settings.genTime||'07:30') && now.getSeconds() < 30){

    const today = todayISO();

    const fix = S.schedule_fixed[today] || [];

    const rem = S.reminders[today] || [];

    const clsToday = S.class.items.filter(x => x.day === (new Date().getDay()-1)).sort((a,b)=>a.period-b.period);

    let summary = `☀️ 早上好！今天 ${weekDay(today)}，`;

    summary += `固定行程 ${fix.length} 条，提醒 ${rem.length} 条，`;

    summary += `课程 ${clsToday.length} 节`;

    // 今日共读提醒

    try{

      const art = dailyArticle();

      if(art && !S.learn.checks[today]){

        summary += `；🌸 今日共读《${art.title.slice(0,18)}${art.title.length>18?'…':''}》等你来打卡`;

      }

    }catch(_){}

    if(!S._dailyShown || S._dailyShown !== today){

      S._dailyShown = today;

      save();

      showBanner(summary);

    }

  }

}



/* 晚间共读温柔提醒：20:00 还没打卡就提示一次 */

function checkLearnReminder(){

  try{

    const now = new Date();

    const cur = pad(now.getHours())+':'+pad(now.getMinutes());

    const today = todayISO();

    if(cur === '20:00' && now.getSeconds() < 30 && !S.learn.checks[today] && S._learnReminded !== today){

      S._learnReminded = today;

      save();

      const art = dailyArticle();

      showBanner('🌸 今晚还有 10 分钟共读：《'+(art?art.title.slice(0,16):'今日文章')+'…》打卡了吗？');

    }

  }catch(_){}

}



setInterval(()=>{

  checkReminders();

  checkDailyGen();

  checkLearnReminder();

}, 30000); // 每 30 秒检查一次

  "proc": "一、激趣导入（5分钟）\n材料准备：教学课件、透明塑料袋、气球\n\n1.教师拿出一个鼓鼓的透明塑料袋，不说话，在学生面前晃一晃。\n提问：老师的袋子里装的是什么？你怎么知道的？\n\n预设1：是空气。\n预设2：什么都没有，袋子是空的。\n\n2.教师不急着下结论，请两位学生上台摸一摸、捏一捏。\n提问：现在你还觉得袋子是空的吗？你摸到了什么？\n\n预设：袋子鼓鼓的，摸起来软软的、有弹性，里面一定装了东西。\n\n3.引入：这个看不见、摸不着形状、却又确实在袋子里的东西，就是我们今天要认识的朋友——空气。\n（板书课题：感受空气）\n\n二、新课教学（28分钟）\n\n（一）活动一：捕捉空气（10分钟）\n材料准备：每组透明塑料袋1个\n\n1.提问：空气就在我们身边，你能不能想办法把它\"抓\"进袋子里？\n要求：四人小组合作，比一比哪个组想到的办法多。\n\n2.学生分组活动，教师巡视，提示：可以试试在空中挥动、可以兜着跑、可以对着袋子吹。\n\n3.全班交流捕捉方法。\n预设1：把袋子张开，在空中一兜，再迅速扎紧袋口。\n预设2：拿着袋子跑一圈，袋子就鼓起来了。\n预设3：直接对着袋口吹气。\n\n4.追问（关键）：袋子鼓起来了，能说明什么？\n引导：袋子本来是瘪的，现在鼓起来了，说明有什么东西进到了袋子里面——这个东西就是空气。虽然我们看不见它，但它确实存在，而且\"占\"住了袋子里的地方。\n\n师小结：我们用\"袋子鼓起来\"这个看得见的现象，证明了看不见的空气是真实存在的。\n\n（二）活动二：观察空气有什么特征（10分钟）\n材料准备：每组1袋捕捉到的空气、记录单\n\n1.提问：空气是什么样子的？请你用眼睛看、用鼻子闻、用手摸，把发现记在记录单上。\n\n2.学生观察并记录，教师巡视提醒：闻的时候要用\"扇闻法\"，不能直接把鼻子凑上去。\n\n3.全班交流，教师逐条板书。\n预设1：看起来什么都没有，是透明的。\n师：能透过袋子看到后面的同学吗？——能。这说明空气是透明的。\n预设2：闻起来没有味道。\n师：所以空气是无味的。\n预设3：摸起来软软的，捏一捏会变形。\n师：捏成各种形状都不影响它，说明空气没有固定的形状。\n预设4：袋子里的空气是看不见的。\n师：对，空气是无色的。\n\n4.对比提升：我们上学期学过水和木块，空气和它们比，有什么相同和不同？\n预设：都会占地方、都真实存在；但水看得见、摸得着，有固定体积，空气看不见。\n\n师小结：空气是无色、无味、透明、没有固定形状的气体，它和固体、液体一样，都是真实存在的物质。\n\n（三）活动三：感受空气会流动（8分钟）\n材料准备：每组1袋空气、扇子\n\n1.提问：空气会动吗？你有什么办法让它动起来？\n\n2.学生活动：①把袋口对准自己的脸，轻轻打开，感受一下；②用扇子扇一扇同桌的脸；③观察教室里的窗帘、绿萝叶子。\n\n3.交流：你感觉到了什么？生活中还在哪里见过空气流动？\n预设1：有风吹到脸上。\n预设2：扇子一扇，纸就动了。\n预设3：刮风的时候树叶会摇、旗子会飘。\n预设4：妈妈做饭时，厨房的烟会飘出来。\n\n4.引申提问：空气流动形成了什么？——风。\n师小结：空气是会流动的，空气流动起来就形成了风，风在我们的生活中非常有用。\n\n三、课堂总结（5分钟）\n1.提问：今天我们用了哪些办法，证明空气是真实存在的？\n预设：用袋子捕捉、用手摸、用扇子扇、看东西被吹动。\n2.提问：空气有哪些特征？\n预设：无色、无味、透明、没有固定形状、会流动。\n3.教师补充：空气虽然看不见，但人和动物呼吸、植物生长都离不开它，它是我们生命中不可缺少的好朋友。\n4.布置：回家找一找，家里哪些地方有空气？下节课来分享。\n\n【板书中的气泡图由师生共同完成，中心词\"空气\"，外围气泡依次为：无色、无味、透明、无固定形状、会流动、无处不在】",
  "board": "                      1. 感受空气\n\n              无色    无味    透明\n                  ╲      │      ╱\n                    【 空 气 】── 没有固定形状\n                  ╱      │      ╲\n              会流动   无处不在   生命离不开\n\n    证明方法：袋子鼓起来 · 手摸得到 · 扇子扇得动 · 东西被吹动",
  "reflect": ""
