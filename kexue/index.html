 "4|空气|5": {
  "goal": "科学观念：\n1.知道空气流动会产生力量（风力）。\n2.知道风有大小和方向，风越大，产生的力量越大。\n3.知道风既能帮助人类，也可能带来灾害。\n\n科学思维：\n1.能通过\"纸风车转动\"\"纸屑被吹动\"等现象，推理出看不见的空气流动产生了力。\n2.能根据实验现象比较风力大小与效果的对应关系。\n\n探究实践：\n1.能制作纸风车并完成\"用不同方式让它转动\"的探究。\n2.能设计简单的方法比较风的大小（如吹动纸屑的远近）。\n3.能规范记录实验现象。\n\n态度责任：\n1.乐于动手制作和尝试，感受探究的乐趣。\n2.实验中注意不影响其他小组（控制\"风\"的范围）。\n3.辩证看待风的作用，初步形成人与自然和谐相处的意识。",
  "key": "通过纸风车、吹纸屑等活动，认识空气流动会产生力量，风力大小不同产生的效果也不同。",
  "hard": "空气流动本身看不见，学生难以把\"风车转起来\"和\"空气在用力\"联系起来。难点在于：①用可见的现象（风车转、纸屑动）证明不可见的空气在施力；②引导学生理解\"风越大，力量越大\"这一对应关系，并设计公平的比较方法（同样的风车、同样的距离）。",
  "mat": "教师：纸风车1个、电风扇（可选）、纸条、教学课件、记录单\n\n学生（四人小组）：正方形彩纸（每人1张）、大头针或图钉（教师保管）、小木棍或吸管、纸屑一小撮、扇子1把、吹风机（教师保管，可选）、记录单\n\n【低成本替代】\n纸风车：用废作业本纸、旧报纸折剪即可；固定可用图钉＋铅笔橡皮头，或用细铁丝弯折。\n无电风扇：用书本扇风、用嘴吹（距离不同力度不同）。\n纸屑：撕碎的废纸、小泡沫粒、干树叶碎。\n安全提示：大头针、图钉由教师统一保管和分发，用后立即收回。",
  "proc": "一、激趣导入（5分钟）\n材料准备：纸风车1个\n\n1.教师拿出一个纸风车，不动它。\n提问：风车会转吗？——不会。\n教师用嘴吹、用扇子扇，风车转起来。\n\n2.追问：是什么让风车转起来的？\n预设1：是风。\n预设2：是你吹的气。\n\n3.继续追问：风是什么？为什么风能让风车转起来？\n预设：风是空气在流动，是空气\"推\"着风车转的。\n\n4.引入：看来，空气流动起来是有\"力气\"的。今天我们就来研究空气的这种力量。\n（板书课题：空气流动有力量）\n\n二、新课教学（28分钟）\n\n（一）制作纸风车（8分钟）\n材料准备：每组彩纸、吸管、图钉\n\n1.教师示范制作（或播放折法图示）：\n①把正方形纸沿对角线剪开（剪到离中心约2厘米处，不要剪断）；\n②把四个角依次朝中心折，形成风车叶片；\n③用图钉穿过中心，固定在吸管（或小木棍）上；\n④注意：图钉不要扎得太紧，要让风车能自由转动。\n\n2.学生制作，教师巡视协助（重点帮助折叶片和固定环节）。\n\n3.提醒安全：图钉用后立即交回，不要拿在手里走动。\n\n（二）活动一：怎样让风车转起来（10分钟）\n材料准备：每组风车、扇子、记录单\n\n1.任务：想办法让风车转起来，比一比哪个组想到的方法多。\n\n2.学生尝试，教师巡视。\n预设方法：用嘴吹、用扇子扇、举着风车跑、把风车放在窗口（自然风）、用书本扇。\n\n3.交流：你们用了哪些方法？这些方法有什么共同点？\n预设：都让空气动起来了——空气流动产生了风，风推动风车转。\n\n4.追问（关键）：空气看不见，你怎么知道它在\"用力\"？\n预设：风车转起来了，说明有东西在推它，那就是流动的空气。\n\n师小结：空气流动起来能产生力量，这种力量推动风车转动。我们把流动的空气叫\"风\"，风是有力量的。\n（板书：空气流动 → 产生力量）\n\n（三）活动二：风的大小与力量（10分钟）\n材料准备：每组风车、纸屑、扇子、记录单\n\n1.提问：轻轻扇和用力扇，风车转动一样吗？\n预设：用力扇转得更快。\n\n2.实验：轻轻扇 vs 用力扇，观察风车转动快慢，记录在记录单上。\n\n3.交流：\n提问：什么情况下风车转得快？这说明了什么？\n预设：用力扇时风大，风车转得快；说明风越大，力量越大。\n\n4.再做一个：吹纸屑\n任务：在桌上放一小撮纸屑，用不同的力度吹，看纸屑被吹多远。\n提醒：轻轻吹 vs 用力吹，要对着同一堆纸屑、同样的角度。\n\n5.交流：\n提问：纸屑被吹多远说明什么？\n预设：吹得用力，风大，纸屑被吹得远，说明力量大。\n\n师小结：风有大小，风力有强弱。风越大，产生的力量越大，能推动更重、更远的东西。\n\n（四）风的利与弊（5分钟，可选压缩到总结）\n材料准备：教学课件\n\n1.提问：风对我们有什么好处？\n预设：风力发电、帆船航行、放风筝、传播花粉和种子、夏天吹风凉快、晾干衣服。\n\n2.提问：风会带来灾害吗？\n预设：台风把树吹倒、把房子吹坏；大风把庄稼吹倒；沙尘暴。\n\n师小结：风既能帮我们做事，也可能造成灾害，我们要学会利用它、防范它。\n\n三、课堂总结（5分钟）\n1.提问：今天我们用什么证明了\"空气流动有力量\"？\n预设：风车转起来、纸屑被吹动。\n2.提问：风的大小和力量有什么关系？\n预设：风越大，力量越大。\n3.教师提升：今天我们又一次\"看见了看不见的东西\"——用风车的转动、纸屑的移动，证明空气在施力。这种\"用看得见的现象证明看不见的事实\"的办法，是我们研究空气的好帮手。\n4.布置：回家用扇子对着不同轻重的物体扇（纸片、羽毛、小积木），看看哪些能被吹动，记录下来。\n\n【整理：图钉、大头针全部收回；纸屑清扫干净】",
  "board": "                 5. 空气流动有力量\n\n    一、让风车转起来的方法\n        嘴吹 · 扇子扇 · 举着跑 · 窗口自然风\n        共同点：★ 让空气流动起来 ★\n\n    二、现象 → 结论\n        风车转动  ┐\n        纸屑被吹动 ├→ 空气流动产生了力量（风）\n        头发飘起  ┘\n\n    三、风力大小对比\n        轻轻扇 → 风小 → 风车转得慢 · 纸屑吹得近\n        用力扇 → 风大 → 风车转得快 · 纸屑吹得远\n        ★ 风越大 → 力量越大 ★\n\n    四、风的两面性\n        利：发电 · 帆船 · 传粉 · 放风筝 · 晾衣\n        害：台风 · 吹倒庄稼 · 沙尘暴",
  "reflect": ""

 "4|空气|6": {
  "goal": "科学观念：\n1.知道空气受热会膨胀、变轻而上升，遇冷会收缩、变重而下沉。\n2.知道热气球是利用\"热空气上升\"的原理升空的。\n3.知道热气球的基本结构（球囊、加热装置、吊篮）。\n\n科学思维：\n1.能根据\"塑料袋在蜡烛上方鼓起并上升\"的现象，推理出热空气在上升。\n2.能建立\"加热→空气膨胀变轻→上升→带动袋子\"的因果链条。\n\n探究实践：\n1.能小组合作制作简易\"热气球\"（塑料袋）并完成升空实验。\n2.能规范、安全地使用蜡烛，遵守用火安全规则。\n3.能观察并描述实验现象，记录成功与失败的原因。\n\n态度责任：\n1.对\"能让东西飞起来\"充满好奇与成就感。\n2.严格遵守用火安全要求，不玩火、不触碰热源，实验后确认火已熄灭。\n3.面对失败（袋子没飞起来）能分析原因、反复尝试。",
  "key": "通过制作简易热气球并让它升空，认识空气受热会上升、热空气比冷空气轻，理解热气球升空的原理。",
  "hard": "①\"热空气轻、会上升\"与学生\"热的东西重\"的直觉相反，需要充分的实验体验来建立新认识。②实验成败受多个因素影响（袋子重量、密封性、加热时间、外界风），学生失败时容易归因错误，需要引导分析具体原因。③蜡烛使用是安全风险点，课堂组织要求高。",
  "mat": "教师：大号轻薄塑料袋（或专用热气球袋）2个、蜡烛2支、火柴、纸筒（或去掉底的易拉罐）2个、透明胶带、剪刀、湿毛巾2块、教学课件、热气球升空视频\n\n学生（四人小组）：大号轻薄塑料袋1个（尽量薄、尽量大，垃圾袋亦可）、蜡烛1支、纸筒1个（或细铁丝做支架）、透明胶带、剪刀、湿毛巾1块、记录单\n\n【低成本替代】\n塑料袋：选用最薄的垃圾袋、食品袋（越薄越轻越容易成功）；也可用大张薄绵纸糊成袋状。\n支架：用硬纸卷成筒、或用三根细铁丝做成三角支架。\n无蜡烛：可用酒精灯（教师操作），或用大功率吹风机（冷风档加热需注意）——但蜡烛效果最直观，建议保留。\n⚠ 安全：必须在教师监督下使用明火；每组准备湿毛巾；远离纸张等易燃物；实验后逐一确认熄灭。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件（热气球升空视频或图片）\n\n1.播放热气球升空的视频。\n提问：这么大的热气球，靠什么飞起来的？里面装的是什么？\n\n预设1：里面是热气。\n预设2：靠火加热空气。\n预设3：不知道，没有翅膀怎么飞得起来？\n\n2.追问：热空气为什么能让这么重的东西升上天？它有什么特别之处？\n\n3.引入：今天我们就亲手做一个\"热气球\"，看看它能不能真的飞起来。\n（板书课题：我们来做\"热气球\"）\n\n二、新课教学（28分钟）\n\n（一）认识热气球的结构（4分钟）\n材料准备：教学课件（热气球结构图）\n\n1.教师介绍：热气球主要由三部分组成——\n·球囊（大大的袋子）：装热空气；\n·加热装置（燃烧器）：加热球囊里的空气；\n·吊篮：载人、装物品。\n\n2.提问：猜一猜，让热气球升空的\"力量\"来自哪里？\n预设：来自里面的热空气。\n\n（二）制作简易热气球（6分钟）\n材料准备：每组塑料袋、纸筒、蜡烛、胶带、剪刀\n\n1.教师示范制作步骤：\n①把蜡烛固定在桌面中央（用融化的蜡油粘牢，或用橡皮泥固定），点燃；\n②把纸筒（支架）罩在蜡烛外面（注意：纸筒上方要留有出气口，下方要留进气口，不能把火捂灭）；\n③把大塑料袋撑开，袋口朝下，轻轻地罩在纸筒上方，用胶带把袋口松松地固定在纸筒上（不要封死，要让空气能进去）。\n\n2.强调安全（板书）：\n·点燃蜡烛用火柴，用过的火柴梗放入水杯；\n·不要用手触碰蜡烛和纸筒（会烫）；\n·长头发、宽松衣袖要远离火焰；\n·每组备好湿毛巾。\n\n3.学生分组制作，教师逐个检查稳固性与安全性。\n\n（三）放飞实验（12分钟）\n材料准备：每组装置、记录单\n\n1.实验步骤：\n①把塑料袋罩好，让蜡烛的火焰加热袋内的空气；\n②用手轻轻扶住袋子（不要让袋口贴到火焰烧着塑料袋！）；\n③等约30—60秒，感觉袋子变鼓、有向上的拉力时，慢慢松手；\n④观察袋子是否上升，记录现象。\n\n2.学生分组实验，教师巡视指导（重点：提醒袋口不要接触火焰、等待足够时间、松手要轻）。\n\n3.交流：\n提问：你们的\"热气球\"飞起来了吗？飞了多高？\n预设1：飞起来了，升到天花板了！\n预设2：我们的没飞起来，袋子掉下来了。\n预设3：我们的一下子就烧着了/被烫破了。\n\n4.研讨成功经验：\n提问：飞起来的小组，你们是怎么做到的？\n预设1：我们等了很久，袋子鼓起来才松手。\n预设2：我们用的袋子很薄很轻。\n\n5.研讨失败原因（★重要，引导学生分析）：\n提问：没飞起来的小组，可能是什么原因？\n预设1：袋子太厚太重了，热气托不动。\n预设2：等待时间不够，里面的空气还不够热。\n预设3：袋子破了/漏气了，热气跑掉了。\n预设4：旁边有人走动，风把它吹歪了。\n预设5：袋口离火太近烧坏了。\n\n6.追问（关键研讨）：袋子为什么会往上飞？是谁把它推上去的？\n引导分析：\n·蜡烛加热了袋子里面的空气；\n·空气受热以后，会膨胀、变轻；\n·变轻的热空气就会往上升；\n·往上升的热空气把袋子\"托\"了起来。\n\n师小结：空气受热会膨胀、变轻，热空气会上升——这就是热气球升空的秘密。\n（板书：空气受热 → 膨胀变轻 → 上升 → 托起袋子）\n\n（四）拓展：生活中的\"热空气上升\"（6分钟）\n材料准备：教学课件\n\n1.提问：生活中还有哪些地方用到了\"热空气上升\"？\n预设1：孔明灯（和我们的实验一模一样）。\n预设2：抽油烟机装在炉灶上方（油烟随热空气上升被吸走）。\n预设3：暖气片装在房间下方（热空气上升让整个房间变暖）。\n预设4：烟囱（烟往上升）。\n预设5：火灾时浓烟向上，逃生要弯腰低姿。\n\n2.安全教育：火灾时，热空气和浓烟向上，所以逃生时要**弯腰、用湿毛巾捂住口鼻**，因为靠近地面的空气相对清洁。\n\n三、课堂总结（6分钟）\n1.提问：热气球为什么能升空？\n预设：因为袋子里的空气被加热后变轻、往上升，把袋子托起来。\n2.提问：做实验时，最重要的注意什么？\n预设：安全用火；袋子要轻、要等够时间、不能漏气。\n3.教师提升：今天我们亲手让一个东西飞了起来，靠的不是魔法，而是\"热空气上升\"的科学原理。人类就是利用这个原理，造出了真正的热气球，飞上了天空。\n4.布置：回家和爸爸妈妈一起查一查\"孔明灯\"的故事，想一想它和我们今天做的热气球有什么相同和不同（注意：孔明灯有火灾隐患，不能随意燃放）。\n\n【★ 下课前必须逐一确认每组蜡烛已完全熄灭（用湿毛巾覆盖或吹灭），桌面无火星，方可收拾器材】",
  "board": "               6. 我们来做\"热气球\"\n\n    一、热气球的结构\n        球囊（装热空气）· 加热装置 · 吊篮\n\n    二、制作与放飞\n        蜡烛固定 → 罩上纸筒 → 塑料袋袋口朝下罩住\n        → 加热 30~60 秒（袋鼓起来）→ 轻轻松手\n\n    三、原理\n        ★ 蜡烛加热 → 空气受热膨胀变轻 → 热空气上升 → 托起袋子 ★\n\n    四、成败分析\n        成功：袋薄而轻 · 等待够久 · 不漏气\n        失败：袋太重 · 时间不够 · 漏气 · 被风吹 · 袋口烧坏\n\n    五、生活应用\n        孔明灯 · 抽油烟机在上方 · 暖气装在下方\n        烟囱 · 火灾逃生要弯腰（浓烟向上）\n\n    ⚠ 安全：湿毛巾备用 · 不碰火焰 · 下课前确认熄灭",
  "reflect": ""
 },
 "4|空气|8": {
  "goal": "科学观念：\n1.知道打气筒是利用\"压缩空气\"的原理工作的工具。\n2.知道打气筒主要由筒身、活塞、活塞杆、进气阀（或进气孔）、出气口等部分组成。\n3.知道单向阀（只让空气进、不让空气出）是打气筒能持续打气的关键。\n\n科学思维：\n1.能根据打气筒的工作过程，分析\"活塞下压时空气去哪了、活塞上提时空气从哪来\"。\n2.能理解工程产品需要\"结构配合\"才能完成功能。\n\n探究实践：\n1.能利用废旧材料制作一个简易打气筒模型。\n2.能测试自己的作品是否能给气球打气，并根据测试结果改进。\n3.能画出打气筒的结构示意图并标注各部分作用。\n\n态度责任：\n1.乐于动手制作，体会\"用简单材料解决实际问题\"的乐趣。\n2.面对漏气、打不进气等问题能耐心排查、反复改进。\n3.养成废物利用、节约材料的习惯。",
  "key": "通过拆解分析打气筒的工作原理，并利用废旧材料制作简易打气筒，理解压缩空气的利用与单向阀的作用。",
  "hard": "①打气筒内部的阀门动作看不见，学生难以理解\"为什么活塞上提时空气不会从出气口倒流回来\"。②制作时\"密封性\"是最大技术障碍——活塞与筒壁之间既要能滑动又要不漏气，学生很难处理。③需要引导学生接受\"模型不完美\"，重点在于理解原理而非做出完美产品。",
  "mat": "教师：真实打气筒1个（可拆开演示）、打气筒结构示意图、动画课件（演示活塞运动与阀门开闭）、气球若干\n\n学生（四人小组）：大号注射器（60毫升）1支、废旧矿泉水瓶1个、气球2个、软管（或粗吸管）1段、橡皮泥、透明胶带、剪刀、记录单\n\n【低成本替代】\n打气筒模型：最简单可靠的做法是——用大号注射器直接改装（拔掉针头，在出口处接软管和气球），推动活塞即可给气球充气，成功率很高。\n软管：可用粗吸管、笔芯外套、细塑料管代替；接口处用橡皮泥密封。\n气球：可用薄塑料袋代替（更易吹起，但观察效果略差）。\n密封材料：橡皮泥最佳（可塑形、易密封），也可用湿纸巾＋胶带。",
  "proc": "一、激趣导入（5分钟）\n材料准备：一个瘪的篮球（或气球）、打气筒\n\n1.教师出示一个瘪了的篮球。\n提问：怎样让它鼓起来？——用打气筒打气。\n\n2.教师用打气筒给篮球打气，学生观察。\n提问：打气筒是怎么把空气\"送\"进篮球里的？它肚子里有什么？\n\n预设1：里面有活塞，像注射器一样。\n预设2：一压就把空气挤出去了。\n\n3.引入：打气筒是我们最熟悉的工具之一，但你真的了解它吗？今天我们不仅研究它，还要自己做一个。\n（板书课题：自制打气筒）\n\n二、新课教学（28分钟）\n\n（一）拆解观察：打气筒里有什么（6分钟）\n材料准备：真实打气筒（可拆）、结构示意图\n\n1.教师拆开打气筒（或对照示意图），介绍主要部件：\n·筒身：空气被压缩的地方；\n·活塞与活塞杆：活塞在筒内上下移动，压缩或吸入空气；\n·进气口/进气阀：空气进入筒内的入口；\n·出气口（气管）：空气被压出去的通道；\n·手柄：手握的地方。\n\n2.演示活塞运动，提问：\n提问：向下压活塞时，筒里的空气去哪了？\n预设：被压出去了，从出气口进到球里。\n提问：向上提活塞时呢？\n预设：空气又从进气口进到筒里。\n\n3.追问（关键）：为什么压下去的时候，空气不从进气口跑掉？为什么提上来的时候，空气不把球里的气又吸回来？\n预设：因为里面有\"门\"（阀门），只让空气往一个方向走。\n\n4.教师讲解单向阀（用动画配合）：\n打气筒里有两个\"单向门\"——\n·压下去时：进气门关闭，出气门打开，空气被压进球里；\n·提上来时：出气门关闭，进气门打开，外面的空气进到筒里。\n正是这两个\"只准单向通过\"的门，让打气筒能连续不断地打气。\n\n师小结：打气筒利用了两个原理——**压缩空气** + **单向阀控制方向**。\n\n（二）设计方案（5分钟）\n材料准备：每组材料、记录单\n\n1.布置任务：用桌上的废旧材料，做一个能把气球吹起来的\"打气筒\"。\n\n2.小组讨论方案并记录：\n·用什么做\"筒身\"？（矿泉水瓶 / 注射器）\n·用什么做\"活塞\"？（注射器的活塞最好用）\n·怎样把空气送到气球里？（软管 + 接口密封）\n·怎样保证不漏气？（橡皮泥、胶带）\n\n3.教师提示关键技术：\n·活塞要能滑动，但周围不能漏气——注射器是现成的最佳选择；\n·所有接口必须密封，用橡皮泥堵严实；\n·气球套在软管上要用胶带扎紧。\n\n（三）动手制作（10分钟）\n材料准备：每组材料\n\n1.推荐做法（教师示范）：\n①取大号注射器，拔掉针头；\n②在注射器出口接上软管，接口处用橡皮泥密封；\n③软管另一端套上气球，用胶带扎紧；\n④来回推拉活塞：推→气球鼓起；拉→空气从出口（或针头处）进入。\n\n2.学生制作，教师巡视协助（重点是密封处理）。\n\n3.测试：推动活塞，看气球是否鼓起来。\n\n（四）测试与改进（7分钟）\n1.各组测试，记录：推几次能把气球吹多大？有没有漏气？\n\n2.交流问题：\n提问：遇到了什么困难？\n预设1：漏气，推的时候听到\"哧哧\"声。\n预设2：气球套不紧，气跑了。\n预设3：推活塞很费力。\n预设4：拉活塞时气球又瘪了（没有单向阀，空气倒流）。\n\n3.研讨改进：\n提问：怎么解决漏气？\n预设：接口用橡皮泥堵严，气球口用胶带缠紧。\n提问：拉活塞时气球变瘪，怎么办？\n预设：用手捏住软管（相当于人工单向阀），或者加一个\"门\"。\n\n4.教师说明局限：真正的打气筒有精密的单向阀，我们用简单材料很难做出完美的阀门。但我们可以用\"用手捏住软管\"的办法，体验一下单向阀的作用——这就是工程师思考问题的方式。\n\n5.改进后再测试。\n\n三、课堂总结（6分钟）\n1.提问：打气筒为什么能不断把空气送进球里？\n预设：因为有两个单向阀，控制空气只往一个方向走；还利用了压缩空气。\n2.提问：制作时最大的困难是什么？怎么解决的？\n预设：漏气；用橡皮泥密封、用胶带扎紧。\n3.教师提升：今天我们做的是\"模型\"，它不完美——但这正是工程实践的真实样子：先做出能用的东西，再一点点改进。真正的打气筒，就是这样一点点被改进出来的。\n4.布置：回家观察家里的打气筒（或气筒、喷雾瓶），找一找它的\"单向阀\"在哪里，画下来。\n\n【整理：注射器、软管清洗后回收；气球碎片收进垃圾桶；橡皮泥收好】",
  "board": "                   8. 自制打气筒\n\n    一、打气筒的结构\n        筒身 · 活塞 · 活塞杆 · 进气口 · 出气口 · 手柄\n\n    二、工作原理（两个\"单向门\"）\n        压下去 → 进气门关 · 出气门开 → 空气进球\n        提上来 → 出气门关 · 进气门开 → 空气进筒\n        ★ 单向阀：只准空气往一个方向走 ★\n\n    三、自制方案\n        注射器（筒身+活塞）+ 软管 + 气球\n        接口用橡皮泥密封 · 气球口用胶带扎紧\n\n    四、常见问题与改进\n        漏气 → 接口密封不严 → 橡皮泥堵实\n        拉活塞时气球回瘪 → 缺单向阀 → 用手捏住软管\n        推不动 → 密封太紧 → 调整松紧\n\n    五、核心原理：压缩空气 + 单向阀控制方向",
  "reflect": ""
 },
 "4|呼吸与消化|3": {
  "goal": "科学观念：\n1.知道人呼吸的次数（呼吸频率）是可以测量的，会随着运动状态而改变。\n2.知道运动时身体需要更多氧气，呼吸会加快加深；休息后会逐渐恢复正常。\n3.知道呼吸与身体健康、运动能力密切相关。\n\n科学思维：\n1.能根据测量数据，比较安静状态与运动后呼吸次数的差异。\n2.能建立\"运动→需氧增加→呼吸加快\"的因果解释。\n\n探究实践：\n1.能规范测量一分钟的呼吸次数（一呼一吸算一次）。\n2.能在安静、运动后、休息后三种状态下分别测量并记录数据。\n3.能通过对比数据，发现规律并作出解释。\n\n态度责任：\n1.坚持实事求是，如实记录自己的真实数据。\n2.乐意参与体育锻炼，愿意为增强体质付出行动。\n3.小组活动中互相配合，注意运动安全（避免剧烈运动导致不适）。",
  "key": "通过测量安静状态、运动后、休息后的呼吸次数，探究运动与呼吸变化的关系，理解运动时身体需要更多氧气。",
  "hard": "①测量呼吸次数时，学生容易\"被观察者察觉后刻意调整呼吸\"，导致数据失真——需要强调自然呼吸、暗中计数。②\"一呼一吸算一次\"的计数标准需要统一训练。③组织运动环节时要注意安全与秩序，避免学生过度运动。",
  "mat": "教师：秒表1个（或用课件计时器）、记录单、汇总表（大张或课件）、教学课件、轻音乐（可选）\n\n学生（四人小组）：秒表（或用手机/教室钟表）1个、记录单每人1张\n\n【低成本替代】\n计时：用教室的钟表、教师的手机秒表，或用课件中的倒计时器。\n运动方式：原地深蹲、高抬腿、原地小跑、跳绳（无器材可做徒手操）——均在座位旁进行，安全可控。\n记录单：手绘表格即可（状态 / 呼吸次数）。",
  "proc": "一、激趣导入（5分钟）\n材料准备：教学课件\n\n1.提问：我们每时每刻都在呼吸。你一分钟大概呼吸多少次？\n学生自由猜测（预设：20次、30次、60次……各不相同）。\n\n2.追问：跑步以后呢？呼吸会怎样？\n预设：会变快、会喘气。\n\n3.追问：为什么跑步就会喘？身体发生了什么？\n\n预设：因为累，需要更多氧气。\n\n4.引入：感觉不一定准，今天我们用数据来研究\"呼吸的变化\"。\n（板书课题：呼吸的变化）\n\n二、新课教学（28分钟）\n\n（一）学习测量呼吸次数（6分钟）\n1.教师讲解并示范：\n·一次呼吸 = 一次吸气 + 一次呼气（一呼一吸算一次）；\n·把手轻轻放在胸口或腹部，感受起伏，一起一伏算一次；\n·数的时候要\"数呼气\"，比较容易准确。\n\n2.练习：全班一起做，教师计时1分钟，学生默数自己的呼吸次数。\n提醒：要自然呼吸，不要刻意加快或放慢。\n\n3.交流：你数了多少次？大家一样吗？\n预设：不一样，大约20—30次（成人约16—20次，儿童约20—25次）。\n\n4.教师说明：不同人、不同状态下，呼吸次数不一样，这很正常。重要的是**同一个人**在不同状态下的变化。\n\n（二）实验：三种状态下的呼吸次数（14分钟）\n材料准备：秒表、记录单\n\n1.设计实验，明确三种状态：\n状态一：安静坐着（刚上课，安静1分钟后）\n状态二：运动后立刻（原地深蹲30个 / 高抬腿30秒）\n状态三：休息2分钟后\n\n2.强调控制变量（公平比较）：\n·每次都数满1分钟；\n·都由同一个人来数自己的呼吸；\n·运动强度要一致（全班统一做30个深蹲）。\n\n3.第一次测量（安静状态）：\n全班安静1分钟，教师计时，学生默数并记录。\n\n4.运动：\n全班起立，在座位旁做30个原地深蹲（或高抬腿30秒）。\n提醒：动作要标准但不要太猛，有不适立即停下。\n\n5.第二次测量（运动后立刻）：\n运动结束立刻坐下，教师计时1分钟，学生数呼吸次数并记录。\n提问：现在什么感觉？\n预设：喘、心跳快、胸口起伏大。\n\n6.休息2分钟，第三次测量。\n\n7.学生填写记录单，教师收集数据做全班汇总。\n\n（三）分析数据（8分钟）\n1.提问：比较三次数据，你发现了什么规律？\n预设1：运动后呼吸次数明显变多。\n预设2：休息一会儿后又变少了。\n预设3：运动后呼吸又快又深。\n\n2.追问（关键研讨）：为什么运动后呼吸会加快？\n引导：\n·运动时，肌肉要工作，需要能量；\n·产生能量需要氧气；\n·氧气靠呼吸进来；\n·所以身体要加快呼吸，多吸氧气、多排出二氧化碳。\n\n3.追问：为什么休息一会儿又恢复正常了？\n预设：因为身体不再需要那么多氧气了。\n\n4.拓展提问：经常锻炼的人和很少锻炼的人，运动后谁喘得更厉害？\n预设：很少锻炼的人喘得更厉害。\n教师补充：经常锻炼的人心肺功能更强，呼吸和心跳恢复得更快。所以——**锻炼能增强呼吸功能**。\n\n5.联系前课：还记得我们学过的肺活量吗？经常锻炼的人肺活量更大，呼吸系统更强，运动时就不容易气喘吁吁。\n\n三、课堂总结（5分钟）\n1.提问：呼吸次数与什么有关？\n预设：与运动状态有关，运动时加快，休息后恢复。\n2.提问：为什么运动后呼吸会加快？\n预设：因为身体需要更多氧气。\n3.教师提升：今天我们又一次\"用数据说话\"——三次测量，一个清晰的规律。呼吸的变化不是偶然的，它反映了身体的真实需要。\n4.布置：回家测一测爸爸妈妈安静时和运动后的呼吸次数，比一比有什么不同。\n\n【安全提示：运动环节控制强度，有心脏疾病或身体不适的学生可不参与剧烈运动，改为观察者/记录员】",
  "board": "                 3. 呼吸的变化\n\n    一、测量方法\n        一呼一吸 = 一次\n        手放胸口感受起伏 · 数呼气更准确 · 自然呼吸不刻意\n\n    二、三种状态对比（示例）\n        ┌──────────┬──────────┬──────────┐\n        │  安静坐着 │ 运动后立刻 │ 休息2分钟后│\n        ├──────────┼──────────┼──────────┤\n        │  约 22 次 │  约 38 次 │  约 24 次 │\n        └──────────┴──────────┴──────────┘\n\n    三、规律\n        ★ 运动 → 需氧增多 → 呼吸加快加深\n          休息 → 需求减少 → 呼吸恢复 ★\n\n    四、为什么？\n        肌肉工作要能量 → 产生能量要氧气 → 氧气靠呼吸\n\n    五、健康启示\n        常锻炼 → 心肺强 → 肺活量大 → 运动不易喘",
  "reflect": ""
 },
 "4|呼吸与消化|5": {
  "goal": "科学观念：\n1.知道消化是从口腔开始的，牙齿的咀嚼和唾液的作用都属于消化。\n2.知道牙齿分为门齿、犬齿、臼齿，不同形状的牙齿有不同的作用。\n3.知道唾液能湿润食物，并能使淀粉发生变化（初步消化）。\n4.知道细嚼慢咽有助于消化，保护牙齿很重要。\n\n科学思维：\n1.能根据牙齿的形状推测其功能，建立\"结构与功能相适应\"的认识。\n2.能通过对照实验（唾液 + 淀粉 vs 清水 + 淀粉，用碘酒检验）推理唾液的作用。\n\n探究实践：\n1.能借助小镜子观察自己的牙齿，记录不同类型牙齿的位置和形状。\n2.能完成\"唾液对淀粉的作用\"对比实验（用碘酒检验）。\n3.能规范咀嚼馒头并描述味道的变化。\n\n态度责任：\n1.养成细嚼慢咽、饭后漱口、早晚刷牙的口腔卫生习惯。\n2.实验中使用一次性用品，注意卫生，不共用餐具和漱口杯。\n3.愿意把学到的护牙知识分享给家人。",
  "key": "观察牙齿的形态与功能，通过唾液对淀粉的对比实验，认识消化从口腔开始，牙齿咀嚼和唾液都很重要。",
  "hard": "①\"唾液使淀粉发生变化\"这一化学变化看不见，需要借助碘酒遇淀粉变蓝的显色反应来间接证明，学生的推理链条较长。②对照实验的操作与等待时间（需几分钟）对课堂节奏是考验。③学生容易把\"嚼馒头变甜\"简单归因为\"馒头本身甜\"，需要设计对比（干嚼 vs 充分咀嚼，或不嚼直接咽）。",
  "mat": "教师：牙齿结构挂图（或模型）1套、小镜子（每人1面）、馒头（或饼干、米饭）若干、碘酒（稀释）1瓶、滴管、试管（或小透明杯）若干、温水、烧杯、教学课件、记录单\n\n学生（四人小组）：小镜子每人1面、馒头小块每人1份、一次性小杯2个（或试管2支）、稀释碘酒、滴管、记录单\n\n【低成本替代】\n馒头：可用米饭、饼干、面包代替（都含淀粉）。\n容器：一次性透明塑料杯、小玻璃杯代替试管。\n碘酒：药店有售，需稀释（棕黄色即可）；也可用碘伏。\n温水：保温杯装温水，温度约37℃（与体温相近，效果最好）。\n⚠ 卫生：必须使用一次性杯具，实验后集中丢弃；馒头为食品，提醒学生实验用的馒头不再食用。",
  "proc": "一、激趣导入（5分钟）\n材料准备：每人一小块馒头\n\n1.活动：请学生把馒头放进嘴里，嚼一口就咽下去（教师故意这样要求）。\n提问：什么感觉？\n预设：没什么味道，有点干，不好咽。\n\n2.再请学生拿一小块馒头，慢慢嚼30下。\n提问：这次有什么不同？\n预设1：变软了，好咽了。\n预设2：好像有点甜味！\n预设3：馒头变碎了，和口水混在一起了。\n\n3.追问：为什么多嚼一会儿，馒头就变软、还变甜了？嘴巴里发生了什么？\n\n4.引入：原来，我们的嘴巴里就已经开始\"消化\"了。今天就来研究口腔里的秘密。\n（板书课题：口腔里的消化）\n\n二、新课教学（28分钟）\n\n（一）观察牙齿（9分钟）\n材料准备：每组小镜子、牙齿挂图\n\n1.任务：用小镜子照一照自己的牙齿，观察它们的形状一样吗？\n\n2.学生观察，教师巡视。\n\n3.对照挂图介绍三类牙齿：\n·门齿（切牙）：前面正中，扁扁的、像小铲子——负责切断食物；\n·犬齿（尖牙）：门齿两侧，尖尖的——负责撕碎食物；\n·臼齿（磨牙）：后面，大大的、表面有凹凸——负责磨碎食物。\n\n4.小活动：对镜找一找自己的门齿、犬齿、臼齿分别在哪里，各有多少颗。\n\n5.提问：不同形状的牙齿有什么用？\n预设：扁的切、尖的撕、宽的磨。\n师小结：牙齿的形状不同，作用也不同——**结构决定了功能**。\n\n6.追问：如果后面的大牙（臼齿）掉了，会怎么样？\n预设：嚼不碎食物，不好消化。\n\n（二）体验：牙齿的咀嚼作用（5分钟）\n材料准备：馒头小块\n\n1.活动：\n①先不咀嚼，直接吞咽一小口馒头——什么感觉？（干、难咽）\n②再充分咀嚼30下后咽下——什么感觉？（软、滑、有甜味）\n\n2.提问：咀嚼起了什么作用？\n预设1：把食物磨碎了。\n预设2：让食物和口水混在一起，变软了。\n预设3：嚼久了会变甜。\n\n师小结：牙齿把食物嚼碎、磨细，这是消化的第一步——**物理消化**。食物变小了，后面才好继续消化。\n\n（三）实验：唾液有什么作用（10分钟）\n材料准备：每组2个一次性杯、碘酒、滴管、馒头碎屑、温水\n\n1.提问：馒头嚼久了为什么会变甜？是不是馒头本来就是甜的？\n学生猜想。\n\n2.教师介绍实验方法（用碘酒检验淀粉）：\n·碘酒遇到淀粉会变成蓝紫色，这是检验淀粉的\"试剂\"；\n·如果淀粉被分解了，就不会变蓝（或颜色变浅）。\n\n3.实验步骤（教师示范，学生分组操作）：\n①取两个透明杯，分别编号A、B；\n②每个杯子放入少量馒头碎屑（等量）；\n③A杯：加入唾液（请学生吐一点到杯里，或事先收集的唾液）；\n④B杯：加入等量的清水（对照）；\n⑤两支杯子都放在温水中（约37℃）静置5—10分钟；\n⑥分别滴入1—2滴稀释碘酒，观察颜色变化。\n\n4.强调控制变量：两杯馒头同样多、液体同样多、温度和时间都一样，**只改变\"加唾液还是加水\"**。\n\n5.学生实验，等待期间教师讲解注意事项（卫生、不品尝）。\n\n6.观察记录：\n提问：两杯的颜色有什么不同？\n预设：加清水的B杯变蓝紫色（淀粉还在）；加唾液的A杯颜色较浅或不变蓝（淀粉被分解了）。\n\n7.追问：这说明了什么？\n预设：唾液能把淀粉变成别的东西（分解掉）。\n\n8.教师讲解：唾液里有一种叫\"唾液淀粉酶\"的物质，它能把淀粉分解成有甜味的糖——这就是馒头嚼久了会变甜的原因。这是**化学消化**。\n\n师小结：口腔里的消化包括两部分——牙齿咀嚼（把食物变小，物理变化）和唾液分解淀粉（把淀粉变糖，化学变化）。\n\n（四）保护牙齿（4分钟）\n1.提问：怎样保护我们的牙齿？\n预设1：早晚刷牙，饭后漱口。\n预设2：少吃糖、少喝碳酸饮料。\n预设3：不用牙齿咬硬物（核桃壳、瓶盖）。\n预设4：定期检查牙齿。\n预设5：细嚼慢咽，不狼吞虎咽。\n\n师小结：牙齿一旦损坏就不能再生，我们要从小保护它。\n\n三、课堂总结（6分钟）\n1.提问：消化从哪里开始？\n预设：从口腔开始。\n2.提问：口腔里有哪些\"消化助手\"？\n预设：牙齿（嚼碎）、唾液（分解淀粉）、舌头（搅拌）。\n3.提问：为什么吃饭要细嚼慢咽？\n预设：嚼得碎、和唾液混合充分，更容易消化，也减轻胃的负担。\n4.布置：回家用镜子数一数自己有多少颗牙齿，记录下来，并给爸爸妈妈讲一讲为什么要细嚼慢咽。\n\n【卫生要求：一次性杯具用后集中丢弃；实验用的馒头不食用；镜用后擦拭干净归位】",
  "board": "                5. 口腔里的消化\n\n    一、牙齿（三种）\n        门齿（扁·切）  犬齿（尖·撕）  臼齿（宽·磨）\n        ★ 形状不同 → 作用不同（结构决定功能）★\n\n    二、口腔里的两件事\n        ① 牙齿咀嚼 → 把食物磨碎变小（物理消化）\n        ② 唾液分解 → 把淀粉变成糖（化学消化）← 所以嚼久了变甜\n\n    三、实验：唾液对淀粉的作用\n        ┌────┬────────┬────────┬──────────┐\n        │    │  馒头碎  │  加入    │ 滴碘酒后  │\n        ├────┼────────┼────────┼──────────┤\n        │ A杯 │  同样多  │  唾液    │ 不变蓝/浅 │\n        │ B杯 │  同样多  │  清水    │  变蓝紫   │\n        └────┴────────┴────────┴──────────┘\n        改变的条件：唾液 vs 清水（其余全相同）\n\n    四、护牙\n        早晚刷牙 · 饭后漱口 · 少吃糖 · 不咬硬物 · 定期检查",
  "reflect": ""
 },
 "4|呼吸与消化|6": {
  "goal": "科学观念：\n1.知道胃的主要功能是储存食物、混合食物并初步消化（主要是蛋白质）。\n2.知道小肠是消化和吸收营养物质的主要场所，小肠很长、内壁有皱褶和绒毛，能增大吸收面积。\n3.知道大肠主要吸收水分，形成粪便。\n\n科学思维：\n1.能通过模拟实验（塑料袋模拟胃的蠕动）理解胃的机械消化作用。\n2.能根据\"小肠很长、内壁有皱褶\"的结构特点，推理其与吸收功能的关系。\n\n探究实践：\n1.能完成\"模拟胃的蠕动\"实验（塑料袋 + 水 + 面包）。\n2.能通过对比（长筒袜与直筒）体会\"长度与面积\"对吸收的意义。\n3.能画出食物在体内的旅行路线图。\n\n态度责任：\n1.认识到消化器官的精巧，愿意养成健康的饮食习惯。\n2.实验中爱护器材，保持桌面清洁。\n3.愿意把健康饮食的知识运用到生活中。",
  "key": "通过模拟胃的蠕动、对比小肠长度的等活动，认识胃和小肠在消化中的主要作用。",
  "hard": "①胃和小肠的内部过程看不见，需要借助模拟实验和模型。②\"小肠很长（约5—6米）却装在肚子里\"这一事实与学生直觉冲突，理解\"皱褶和绒毛增大面积\"较抽象。③容易把\"胃\"误认为是消化吸收的主要场所，需要纠正——小肠才是主要的吸收器官。",
  "mat": "教师：人体消化系统挂图1张、塑料袋（厚实）2个、面包块、水、长筒袜（或长丝袜）1只、直筒布套1个（对比用）、漏斗、教学课件、记录单\n\n学生（四人小组）：厚实塑料袋（密封袋更佳）1个、面包（或馒头）小块、水半杯、长筒袜1只（或长条布）、记录单\n\n【低成本替代】\n密封袋：用厚实的食品密封袋（自封袋）效果最好，不易破；普通塑料袋需双层。\n长筒袜：可用长条毛巾卷成筒、或用长纸筒代替，用于演示\"长而弯曲\"。\n面包：馒头、饼干均可。\n⚠ 提醒：模拟实验后袋子里的东西不可食用，实验后集中丢弃。",
  "proc": "一、激趣导入（5分钟）\n材料准备：教学课件、消化系统图\n\n1.回顾：上节课我们知道了消化从口腔开始。\n提问：食物咽下去以后，又去了哪里？经过哪些地方？\n\n预设：食道 → 胃 → 小肠 → 大肠。\n\n2.教师出示消化系统图，请学生按顺序说一说。\n（学生说，教师在图上标出箭头）\n\n3.追问：食物在这些地方发生了什么变化？胃和小肠分别干了什么？\n\n4.引入：今天我们重点研究胃和小肠这两位\"主力队员\"。\n（板书课题：胃和小肠里的消化）\n\n二、新课教学（28分钟）\n\n（一）认识胃（4分钟）\n材料准备：消化系统挂图\n\n1.教师介绍：\n·胃位于腹腔左上方，形状像一个大口袋（囊状）；\n·胃很有弹性，吃饱了会撑大，空了又会缩小；\n·胃能分泌胃液（含盐酸和胃蛋白酶），主要消化蛋白质；\n·食物在胃里停留约2—4小时，被搅拌成糊状（食糜）。\n\n2.提问：胃像一个什么？\n预设：像一个大口袋、像一个搅拌机、像个袋子。\n\n（二）实验：模拟胃的蠕动（10分钟）\n材料准备：每组密封袋、面包块、水\n\n1.任务：用密封袋模拟\"胃\"，看看食物在里面会发生什么。\n\n2.步骤：\n①把一小块面包（或馒头）放进密封袋；\n②加入少量水（模拟胃液）；\n③尽量挤出袋内空气，封好口；\n④用手在袋子外面轻轻地、反复地揉、捏、挤（模拟胃壁肌肉的蠕动）；\n⑤观察面包的变化。\n\n3.学生实验，教师巡视提醒：不要太用力把袋子捏破；不要打开袋子闻。\n\n4.交流：\n提问：面包变成了什么样子？\n预设1：碎了，变成了糊状。\n预设2：和水混在一起了，像稀饭一样。\n预设3：有的小组的袋子破了，水漏出来了。\n\n5.追问（关键研讨）：我们的手相当于什么？袋子里的水相当于什么？\n预设：手相当于胃壁的肌肉（蠕动），水相当于胃液。\n\n6.教师讲解：\n·胃壁有很厚的肌肉层，会不停地收缩、蠕动，把食物和胃液充分混合；\n·胃液里的胃酸和酶能把食物（特别是蛋白质）进一步分解；\n·经过胃的处理，食物变成了像粥一样的\"食糜\"，然后一点一点进入小肠。\n\n师小结：胃的作用是——**储存食物、搅拌混合、初步消化**。\n\n（三）认识小肠（8分钟）\n材料准备：长筒袜、教学课件\n\n1.提问：食物变成食糜后，接下来去哪？——小肠。\n\n2.介绍小肠的特点（配合课件）：\n·小肠很长，成年人约5—6米（相当于3个小朋友的身高那么长！）；\n·小肠内壁上有很多皱褶和绒毛，如果把绒毛全部展开，面积约有200平方米（相当于半个篮球场）；\n·食物在小肠里停留时间最长（约3—5小时）。\n\n3.小活动（理解\"长而曲折\"）：\n教师拿出长筒袜，请两位同学各拉一头——\n提问：这么长的袜子，怎么装进小盒子里？\n预设：团起来、卷起来、折起来。\n师：小肠就是这样，5米多长，却\"盘\"在我们的肚子里。\n\n4.追问（关键）：小肠为什么要这么长、内壁还要有那么多皱褶和绒毛？\n预设：为了和食物充分接触，更好地吸收营养。\n\n师小结：**小肠是消化和吸收营养物质的主要场所**。它长、内壁皱褶多、绒毛多，都是为了尽可能大地增加吸收面积。\n（板书：小肠——消化吸收的主要场所）\n\n5.教师强调常见误区：很多人以为\"胃是吸收营养的主要器官\"，其实不是——胃主要负责初步消化，**营养主要在小肠被吸收**。\n\n（四）认识大肠（3分钟）\n1.教师介绍：\n·食物残渣进入大肠；\n·大肠主要吸收其中的水分和无机盐；\n·剩下的残渣形成粪便，排出体外；\n·大肠比小肠短、粗。\n\n2.提问：如果大肠吸收水分过多会怎样？\n预设：大便干结、便秘。\n教师补充：所以要多喝水、多吃蔬菜水果，帮助肠道正常工作。\n\n（五）画出食物旅行图（3分钟）\n任务：在记录单上画出\"食物在体内的旅行路线\"，标注各器官的作用。\n（口腔→食道→胃→小肠→大肠→肛门）\n\n三、课堂总结（5分钟）\n1.提问：胃有什么作用？\n预设：储存食物、搅拌、初步消化，把食物变成食糜。\n2.提问：营养主要在哪里被吸收？\n预设：小肠。\n3.提问：小肠为什么又长又有很多皱褶？\n预设：为了增大吸收面积，吸收更多营养。\n4.教师提升：我们的消化系统就像一个分工明确的工厂，每个器官都有自己的职责，任何一环出问题，都会影响健康。好好吃饭、细嚼慢咽，就是对它们最好的保护。\n5.布置：回家画一张\"食物旅行图\"，标注每个器官的作用，贴在自己的书桌前。\n\n【整理：密封袋内的混合物集中丢弃，不可食用；桌面擦拭干净】",
  "board": "              6. 胃和小肠里的消化\n\n    一、食物旅行路线\n        口腔 → 食道 → 胃 → 小肠 → 大肠 → 排出\n\n    二、胃（大口袋）\n        储存食物 · 蠕动搅拌 · 分泌胃液（消化蛋白质）\n        食物停留 2~4 小时 → 变成\"食糜\"\n        模拟实验：密封袋=胃 · 水=胃液 · 揉捏=胃壁蠕动\n\n    三、小肠（★ 消化吸收的主角 ★）\n        长约 5~6 米（盘在腹腔里）\n        内壁有皱褶和绒毛 → 展开面积约 200 平方米\n        食物停留 3~5 小时\n        ★ 长 + 皱褶 + 绒毛 = 增大吸收面积 ★\n        ⚠ 常见误区：营养主要在胃吸收（✗）→ 主要在小肠（✓）\n\n    四、大肠\n        吸收水分和无机盐 → 形成粪便\n        多喝水、多吃蔬果 → 防便秘",
  "reflect": ""
 },
 "4|呼吸与消化|7": {
  "goal": "科学观念：\n1.知道食物在人体内经过的完整路线：口腔→食道→胃→小肠→大肠→肛门。\n2.知道每个消化器官的主要作用，知道消化是一个多器官协作的过程。\n3.知道消化系统各器官相互协调，共同完成消化和吸收的任务。\n\n科学思维：\n1.能按顺序梳理食物旅行的路线，建立\"系统\"的概念。\n2.能通过角色扮演和模型，把抽象的体内过程具体化。\n\n探究实践：\n1.能小组合作完成\"食物旅行\"的角色扮演或模型演示。\n2.能绘制一幅完整的消化系统示意图并标注各器官作用。\n3.能用准确的语言描述食物在各器官中的变化。\n\n态度责任：\n1.认识到人体是一个协调统一的整体，各器官相互配合。\n2.养成健康的饮食习惯（细嚼慢咽、定时定量、不挑食）。\n3.乐于合作表演，愿意向他人介绍学到的知识。",
  "key": "通过绘制路线图、角色扮演等活动，整体认识食物在人体内的旅行路线与各消化器官的作用。",
  "hard": "①器官名称多、顺序容易记混（尤其食道、小肠、大肠的顺序）。②各器官的作用容易张冠李戴（如把\"吸收营养\"归给胃）。③\"食物\"在不同阶段形态不同（食团→食糜→营养→残渣），需要建立动态变化的认识。",
  "mat": "教师：人体消化系统大幅挂图1张（或可粘贴的器官卡片）、消化系统模型（可选）、教学课件（食物旅行动画）、空白人体轮廓图（A3，每组1张）、彩色笔\n\n学生（四人小组）：空白人体轮廓图1张、彩色笔、器官名称卡片（可自制）、记录单\n\n【低成本替代】\n挂图：教师可在黑板上用粉笔画出简笔消化系统图。\n模型：用不同颜色的橡皮泥捏出各器官，贴在人体轮廓图上。\n动画：若无条件，可用课本插图 + 教师分步板画代替。\n角色扮演道具：用卡纸做\"器官胸牌\"（写器官名），挂在扮演者胸前。",
  "proc": "一、激趣导入（5分钟）\n材料准备：教学课件（食物旅行动画）或课本插图\n\n1.教师讲述：今天我们要跟着一小口馒头，去做一次特别的旅行——它在我们身体里的旅行。\n\n2.播放动画（或分步展示插图），学生观看。\n提问：这口馒头经过了哪些地方？\n\n预设：嘴巴、食道、胃、小肠、大肠……\n\n3.追问：你能按顺序列出来吗？\n\n4.引入：今天我们就把这条路线弄清楚，看看每个\"站点\"都做了什么。\n（板书课题：食物在身体里的旅行）\n\n二、新课教学（28分钟）\n\n（一）梳理旅行路线（8分钟）\n材料准备：每组人体轮廓图、器官卡片\n\n1.小组任务：把打乱的器官卡片按食物经过的顺序，贴在人体轮廓图上。\n\n2.学生活动，教师巡视（提示起点是口腔，终点是排出体外）。\n\n3.全班交流，教师板书正确顺序：\n**口腔 → 食道 → 胃 → 小肠 → 大肠 → 肛门**\n\n4.记忆小窍门（教师带领）：\n\"口—食—胃—小—大\"五站，可以记成\"口食胃，小大肠\"（像一句顺口溜）。\n\n5.易错点提醒：\n·食道不是\"气管\"，它只负责输送食物，不消化；\n·先到胃，再到小肠，最后才到大肠（顺序不能颠倒）；\n·小肠最长，盘在肚子中间。\n\n（二）每个站点做了什么（10分钟）\n材料准备：挂图、记录单\n\n1.逐站回顾（师生共同完成表格）：\n\n| 站点 | 食物的变化 | 器官的作用 |\n|---|---|---|\n| 口腔 | 被嚼碎、和唾液混合、淀粉变糖 | 咀嚼、初步消化 |\n| 食道 | 被推送下去 | 输送食物（不消化） |\n| 胃 | 变成糊状的食糜 | 储存、搅拌、初步消化蛋白质 |\n| 小肠 | 营养被吸收进血液 | ★消化和吸收的主要场所 |\n| 大肠 | 水分被吸收，形成粪便 | 吸收水分、形成粪便 |\n| 肛门 | 排出体外 | 排出 |\n\n2.重点强调两处易错点：\n·**胃不是吸收营养的主要器官**——它主要是\"加工\"，吸收主要在小肠；\n·**食道不消化**——它只是一条\"运输管道\"。\n\n3.追问：食物在这些地方，样子变了吗？怎么变的？\n预设：从一块馒头 → 碎屑 → 糊状食糜 → 营养被吸走 → 变成残渣粪便。\n\n师小结：食物在旅行中不断变小、不断被分解，有用的营养被身体留下，没用的残渣被排出体外。\n\n（三）角色扮演：我是消化器官（6分钟）\n材料准备：器官胸牌（卡纸自制）\n\n1.每组选派6名同学，分别扮演：口腔、食道、胃、小肠、大肠、肛门。\n\n2.扮演规则：\n·每人佩戴胸牌；\n·一位同学扮演\"食物\"，依次走过每个器官；\n·每个器官要说出：\"我是__，我负责__，食物在我这里变成__。\"\n\n3.示范（教师先演一遍\"胃\"）：\n\"我是胃，我负责储存食物、搅拌和初步消化，食物在我这里变成糊状的食糜。\"\n\n4.学生表演，全班评议。\n\n师小结：这些器官各司其职、互相配合，食物才能顺利完成旅行——人体真像一个配合默契的大工厂。\n\n（四）保护消化器官（4分钟）\n1.提问：怎样保护好我们的消化器官？\n预设1：细嚼慢咽，不狼吞虎咽。\n预设2：按时吃饭，不暴饮暴食。\n预设3：不吃太烫、太辣、太冰的食物。\n预设4：饭前便后洗手，不吃不干净的东西。\n预设5：多吃蔬菜水果，多喝水。\n\n2.追问：为什么不能暴饮暴食？\n预设：胃会被撑得太大，消化不了，会生病。\n\n师小结：消化器官每天都在为我们工作，我们要用健康的饮食习惯来保护它们。\n\n三、课堂总结（5分钟）\n1.提问：食物旅行的路线是什么？请按顺序说一遍。\n预设：口腔→食道→胃→小肠→大肠→肛门。\n2.提问：哪个器官是吸收营养的主角？\n预设：小肠。\n3.教师提升：今天我们完成了一次完整的\"旅行\"。从口腔到排出，每一步都有专门的器官负责，它们分工合作、缺一不可——这就是\"系统\"的力量。\n4.布置：把你今天画的\"食物旅行图\"带回家，给爸爸妈妈讲一讲这趟旅行，并说说你想提醒他们注意什么饮食习惯。\n\n【整理：器官卡片、胸牌回收；蜡笔、彩笔归位】",
  "board": "            7. 食物在身体里的旅行\n\n    一、旅行路线（★ 顺序 ★）\n        口腔 → 食道 → 胃 → 小肠 → 大肠 → 肛门\n        记忆：\"口 食 胃，小 大\"\n\n    二、各站作用\n        ┌────┬──────────┬───────────────┐\n        │站点 │ 食物变成    │  器官作用        │\n        ├────┼──────────┼───────────────┤\n        │口腔 │ 碎屑+甜味   │ 咀嚼·初步消化    │\n        │食道 │ 被推送下去  │ 输送（不消化）    │\n        │胃   │ 糊状食糜    │ 储存·搅拌·消化蛋白│\n        │小肠 │ 营养被吸收  │★消化吸收主战场★  │\n        │大肠 │ 粪便        │ 吸收水分        │\n        └────┴──────────┴───────────────┘\n\n    ⚠ 易错：胃不是吸收主角（小肠才是）\n            食道不消化（只运输）\n\n    三、保护\n        细嚼慢咽 · 定时定量 · 不暴饮暴食\n        不吃过烫过辣 · 注意卫生 · 多吃蔬果",
  "reflect": ""

 "4|声音|2": {
  "goal": "科学观念：\n1.知道声音有强弱之分，声音的强弱叫\"音量\"（响度）。\n2.知道声音的强弱与物体振动的幅度（振幅）有关：振动幅度大，声音强；振动幅度小，声音弱。\n3.知道用力敲、拨、弹时振动幅度大，声音就强。\n\n科学思维：\n1.能通过\"纸屑跳得高矮\"\"水花溅得大小\"等现象，判断振动幅度的大小。\n2.能建立\"用力大小→振幅大小→声音强弱\"的对应关系。\n\n探究实践：\n1.能完成\"轻轻拨与用力拨钢尺\"的对比实验，观察振动幅度与声音强弱。\n2.能完成\"轻轻敲鼓与用力敲鼓、观察纸屑跳动\"的实验。\n3.能规范记录实验现象。\n\n态度责任：\n1.实验中注意控制音量，不影响其他班级。\n2.如实记录观察结果，不臆想。\n3.初步形成\"在公共场所不大声喧哗\"的文明意识。",
  "key": "通过钢尺、鼓面等对比实验，探究声音的强弱与物体振动幅度的关系，知道振幅越大声音越强。",
  "hard": "①\"振幅\"（振动幅度）是抽象概念，学生难以直接观察——需要借助纸屑跳动的高度、水花大小等\"放大法\"来间接判断。②强弱与高低极易混淆，本课必须反复与上一课（高低）对比，明确\"用力大小改变的是强弱，不改变高低\"。③实验中\"用力\"要控制，否则钢尺会打到手或发出刺耳声音。",
  "mat": "教师：钢尺1把、鼓1面、纸屑若干、音叉1套、水槽（装水）、教学课件、记录单\n\n学生（四人小组）：钢尺1把、小鼓（或碗＋气球皮自制）1个、纸屑一小撮、水槽（装半盆水）1个、记录单\n\n【低成本替代】\n鼓：碗口蒙气球皮＋橡皮筋扎紧；或用塑料桶、月饼盒倒扣。\n钢尺：可用塑料尺、薄木片、金属调羹代替。\n纸屑：撕碎的废纸、泡沫粒、细沙（撒在\"鼓面\"上观察跳动）。\n水花法：音叉可用不锈钢调羹代替，敲击后接触水面。",
  "proc": "一、激趣导入（6分钟）\n材料准备：鼓1面\n\n1.教师轻轻敲一下鼓，再用力敲一下。\n提问：两次听到的声音有什么不同？\n预设1：第一次轻，第二次响。\n预设2：第二次声音大。\n\n2.追问：为什么用力敲就更响？鼓面发生了什么不同的变化？\n\n预设：用力敲时鼓面动得更厉害。\n\n3.引入：声音有强有弱。科学上把声音的强弱叫\"音量\"。是什么决定了声音的强弱呢？今天我们就来研究。\n（板书课题：声音的强弱）\n\n二、新课教学（28分钟）\n\n（一）实验一：钢尺的振动幅度（10分钟）\n材料准备：每组钢尺1把、记录单\n\n1.回顾：上节课我们学过，声音是由物体振动产生的。\n\n2.任务：把钢尺一端紧压在桌边，另一端伸出桌面约10厘米。\n①轻轻拨动——听声音，看钢尺振动的样子；\n②用力拨动——听声音，看钢尺振动的样子。\n\n3.强调：观察钢尺上下摆动的\"幅度\"（摆得多大），可以用手指轻轻感受，也可以侧着看它的\"影子\"。\n\n4.学生实验，教师巡视提醒：用力不要过猛，以免钢尺打到手。\n\n5.交流：\n提问：轻轻拨和用力拨，声音有什么不同？\n预设：用力拨声音更响（强），轻轻拨声音更小（弱）。\n提问：钢尺的振动有什么不同？\n预设：用力拨时，钢尺上下摆动得更大（幅度大）；轻轻拨时摆得小。\n\n6.引入科学词汇：物体振动时来回摆动的范围大小，叫\"振动幅度\"，简称\"振幅\"。\n（板书：振幅）\n\n7.小结：\n用力大 → 振幅大 → 声音强（响）\n用力小 → 振幅小 → 声音弱（轻）\n\n（二）实验二：鼓面上的纸屑（10分钟）\n材料准备：每组小鼓、纸屑\n\n1.任务：\n①在鼓面上撒一些碎纸屑；\n②轻轻敲鼓——观察纸屑跳得怎样，听声音强弱；\n③用力敲鼓——观察纸屑跳得怎样，听声音强弱。\n\n2.学生实验，教师巡视（提醒纸屑不要撒太多，薄薄一层即可）。\n\n3.交流：\n提问：轻轻敲时，纸屑怎么样？用力敲时呢？\n预设1：轻轻敲，纸屑只是微微动一下，跳得很矮。\n预设2：用力敲，纸屑跳得很高，有的还跳到桌上去了。\n\n4.追问（关键研讨）：纸屑跳得高，说明什么？\n预设：说明鼓面振动得厉害，幅度大。\n\n5.再追问：这和声音的强弱有什么关系？\n预设：鼓面振幅大，声音就强；振幅小，声音就弱。\n\n师小结：我们用\"纸屑跳得高矮\"这个看得见的现象，判断出了鼓面振动幅度的大小——这就叫\"放大法\"。\n（板书：振幅大 → 声音强；振幅小 → 声音弱）\n\n（三）实验三：水花的大小（4分钟，可选）\n材料准备：音叉或金属调羹、水槽\n\n1.教师演示（或学生分组）：\n①用音叉轻轻敲击后接触水面——水花小，声音弱；\n②用力敲击后接触水面——水花大，声音强。\n\n2.提问：水花大小说明了什么？\n预设：水花大说明音叉振动幅度大，声音强。\n\n（四）★ 关键辨析：强弱 vs 高低（4分钟）\n1.教师演示：\n①轻轻拨伸出较短的钢尺（声音高而弱）；\n②用力拨伸出较长的钢尺（声音低而强）。\n\n2.提问：哪一次声音\"高\"？哪一次声音\"强\"？\n预设：短尺的高、弱；长尺的低、强。\n\n3.教师强调（本单元最容易错的地方）：\n·**高低（音高）** 由振动快慢决定——尺子长短改变；\n·**强弱（音量）** 由振动幅度决定——用力大小改变；\n·**用力大只会让声音变响，不会让声音变高！**\n\n4.小练习：教师拨钢尺，学生判断\"变强了还是变高了\"。\n\n三、课堂总结（5分钟）\n1.提问：声音的强弱和什么有关？\n预设：和物体振动的幅度有关，振幅大声音强，振幅小声音弱。\n2.提问：怎样让一个物体发出的声音变强？\n预设：用力敲、用力拨，让它振动得更厉害。\n3.提问：强弱和高低是一回事吗？\n预设：不是，强弱看用力（振幅），高低看快慢（频率）。\n4.情感提升：生活中，该响的时候要响（比如回答问题），该轻的时候要轻（比如在图书馆、医院）。学会控制音量，是一种文明。\n5.布置：回家用不同的力度敲同一个杯子，听听声音强弱的变化，想想振幅有什么不同。\n\n【提醒：实验时控制音量，不要影响隔壁班级；纸屑清扫干净】",
  "board": "                   2. 声音的强弱\n\n    一、音量\n        声音的强弱叫做\"音量\"（响度）\n\n    二、实验对比\n        ┌────────┬──────────┬────────┬────────┐\n        │        │  用力     │  振幅   │  声音   │\n        ├────────┼──────────┼────────┼────────┤\n        │ 钢尺   │ 轻轻拨    │  摆得小 │  弱(轻) │\n        │        │ 用力拨    │  摆得大 │  强(响) │\n        ├────────┼──────────┼────────┼────────┤\n        │ 鼓面   │ 轻轻敲    │纸屑跳得矮│  弱    │\n        │        │ 用力敲    │纸屑跳得高│  强    │\n        └────────┴──────────┴────────┴────────┘\n\n    ★ 结论：振幅越大 → 声音越强\n            振幅越小 → 声音越弱 ★\n\n    方法：放大法（纸屑 · 水花 → 看出振幅）\n\n    ⚠ 辨析：\n       强弱 ← 用力大小（振幅）\n       高低 ← 振动快慢（频率）\n       用力大 ≠ 声音变高",
  "reflect": ""
 },
 "4|声音|4": {
  "goal": "科学观念：\n1.知道乐器的声音有高低、强弱等变化，这些变化可以通过改变振动部分的长短、松紧、粗细来实现。\n2.知道弦乐器（如吉他、二胡）通过改变弦的长短、松紧、粗细来改变音高。\n3.知道管乐器通过改变空气柱的长短来改变音高。\n\n科学思维：\n1.能通过观察乐器演奏，分析\"演奏者做了什么动作→改变了什么→声音怎么变\"。\n2.能归纳出改变声音高低的几种通用方法。\n\n探究实践：\n1.能观察吉他（或其他乐器）的演奏，记录改变音高的方法。\n2.能用橡皮筋、吸管等材料做简单的发声实验，验证改变音高的方法。\n3.为下节课\"设计乐器\"积累经验。\n\n态度责任：\n1.对乐器的发声原理产生兴趣，乐于探究。\n2.实验中爱护乐器（或自制器材），轻拿轻放。\n3.愿意欣赏音乐中的科学，体会科学与艺术的联系。",
  "key": "通过观察乐器演奏与简单的发声实验，认识乐器的声音变化规律，为设计和制作小乐器做准备。",
  "hard": "①学生容易观察到\"演奏者按了不同的位置\"，但难以说出\"改变了振动部分的长短\"这一本质。②管乐器（空气柱振动）比弦乐器更抽象，空气柱看不见。③需要把零散的观察归纳成几条通用规律（长短、松紧、粗细），抽象要求较高。",
  "mat": "教师：吉他（或尤克里里）1把、口琴或竖笛1支、教学课件（各种乐器演奏视频）、橡皮筋（粗细不同）若干、空纸盒、吸管（不同长度）若干、剪刀、记录单\n\n学生（四人小组）：粗细不同的橡皮筋若干、空纸盒1个（或自制琴身）、不同长度的吸管5—6根、剪刀、记录单\n\n【低成本替代】\n吉他：可用自制\"橡皮筋琴\"代替（纸盒＋橡皮筋）；或请会乐器的同学带来。\n管乐器：用吸管、竹管、塑料管剪成不同长度，吹奏比较音高。\n吸管乐器：把吸管一端压扁剪成\"簧片\"状，可吹响（简易排箫）。\n⚠ 提醒：吹奏实验注意卫生，每人一根，不共用。",
  "proc": "一、激趣导入（6分钟）\n材料准备：吉他1把（或课件视频）\n\n1.教师弹（或播放）一段简单的音阶。\n提问：演奏者是怎么弹出高低不同的声音的？\n\n预设1：按不同的弦。\n预设2：手指在弦上移动。\n预设3：有的弦粗有的弦细。\n\n2.追问：手指在弦上移动，改变了弦的什么？为什么这样声音就变了？\n\n3.引入：乐器能发出千变万化的声音，背后藏着我们学过的科学道理。今天我们就来当一次\"乐器侦探\"。\n（板书课题：乐器的声音变化）\n\n二、新课教学（28分钟）\n\n（一）观察弦乐器（10分钟）\n材料准备：吉他或尤克里里、教学课件\n\n1.教师现场演奏（或播放视频），学生重点观察：\n·演奏者的左手在做什么？（按弦的不同位置）\n·演奏者的右手在做什么？（拨弦，力度不同）\n·吉他上的弦一样吗？（粗细不同）\n·琴头上的旋钮有什么用？（调音，改变松紧）\n\n2.交流观察结果：\n提问：左手按在不同的位置，声音怎么变？\n预设：按的位置越往下（靠近琴身），声音越高。\n追问：按下去以后，实际振动的是哪一段弦？\n预设：是从按的地方到琴桥（下方固定点）那一段。\n师：对！手指按住弦，等于把弦\"变短\"了——振动的部分越短，声音越高。\n\n3.提问：吉他的弦粗细一样吗？粗细不同的弦，声音一样吗？\n预设：不一样，粗弦声音低沉，细弦声音清脆高亢。\n\n4.提问：调音旋钮在做什么？\n预设：拧紧或放松琴弦，改变弦的松紧。\n师：弦绷得越紧，声音越高。\n\n5.小结（板书）：\n改变弦乐器音高的方法：\n·改变弦的**长短**：越短 → 越高\n·改变弦的**松紧**：越紧 → 越高\n·改变弦的**粗细**：越细 → 越高\n\n（二）动手验证：橡皮筋琴（8分钟）\n材料准备：每组粗细不同的橡皮筋、空纸盒\n\n1.任务：把粗细不同的橡皮筋套在纸盒上，拨动它们，比较声音。\n\n2.实验一（粗细）：拨动粗、细不同的橡皮筋。\n提问：哪根声音高？\n预设：细橡皮筋声音高，粗的低。\n\n3.实验二（松紧）：把同一根橡皮筋拉紧、放松，分别拨动。\n提问：什么时候声音高？\n预设：拉紧时声音高。\n\n4.实验三（长短）：用手指按住橡皮筋的不同位置，改变振动部分的长度。\n提问：振动部分短时声音怎样？\n预设：短的时候声音高。\n\n师小结：我们用自己的\"小乐器\"，验证了弦乐器的三条规律。\n\n（三）观察管乐器（6分钟）\n材料准备：不同长度的吸管、竖笛或课件\n\n1.教师出示竖笛（或排箫）。\n提问：竖笛上没有弦，它是靠什么发声的？\n预设：靠里面的空气。\n\n2.教师演示（或播放视频）：按住不同的孔，吹出不同的音。\n提问：按住不同的孔，改变了什么？\n\n预设：改变了里面空气柱的长短。\n\n3.学生体验：用不同长度的吸管吹（把吸管一端压扁做成简易\"簧片\"，或用吸管吹气使管内空气振动）。\n任务：比较长吸管和短吸管发出的声音。\n提问：哪根声音高？\n预设：短的吸管声音高。\n\n4.小结（板书）：\n管乐器：靠**空气柱**振动发声；空气柱越短 → 声音越高。\n\n5.教师补充（不深究）：笛子、箫、小号、唢呐都是管乐器，它们通过改变空气柱的长短来吹出不同的音。\n\n（四）归纳：让声音变高的N种方法（4分钟）\n师生共同总结（板书）：\n1.让振动的部分变短：\n   ·弦乐器：手指按住弦\n   ·管乐器：按住音孔\n2.把振动的部分绷紧：\n   ·拧紧琴弦\n3.换用更细、更薄、更轻的振动体：\n   ·细弦、薄簧片\n\n师小结：无论是弦还是空气柱，道理都一样——**让振动的部分\"更短、更紧、更细\"，声音就更高**。\n\n三、课堂总结（5分钟）\n1.提问：弦乐器怎样改变音高？\n预设：改变弦的长短、松紧、粗细。\n2.提问：管乐器靠什么发声？怎样改变音高？\n预设：靠空气柱振动，改变空气柱长短。\n3.教师提升：今天我们发现了乐器背后的科学——音乐家在演奏，其实就是在巧妙地控制振动。下节课，我们就要用这些规律，自己设计一件小乐器！\n4.布置：回家观察一件乐器（或请家长帮忙看看图片），想一想它是靠什么振动发声的，怎样改变音高，下节课分享。\n\n【整理：橡皮筋、吸管回收；提醒吹奏过的吸管不要共用】",
  "board": "                4. 乐器的声音变化\n\n    一、弦乐器（吉他 · 二胡 · 古筝）\n        靠\"弦\"振动发声\n        ★ 越短 → 越高   （手指按住弦）\n          越紧 → 越高   （拧动调音旋钮）\n          越细 → 越高   （换细弦）★\n\n    二、管乐器（笛 · 箫 · 小号 · 唢呐）\n        靠\"空气柱\"振动发声\n        ★ 空气柱越短 → 声音越高 ★\n\n    三、实验验证（橡皮筋琴）\n        细橡皮筋 → 声音高 ｜ 粗的 → 低\n        拉紧 → 高        ｜ 放松 → 低\n        振动部分短 → 高  ｜ 长 → 低\n\n    四、通用规律\n        ★ 让振动部分【更短 · 更紧 · 更细】→ 声音更高 ★",
  "reflect": ""
 },
 "4|声音|5": {
  "goal": "科学观念：\n1.知道制作乐器需要考虑发声方式、音高调节方法、材料选择等要素。\n2.知道工程设计需要先设计方案（画图、选材料、定步骤），再动手制作。\n3.知道不同的材料会发出不同的声音。\n\n科学思维：\n1.能运用\"改变长短、松紧、粗细可改变音高\"的规律，指导乐器设计。\n2.能针对\"要发出高低不同的音\"这一目标，提出可行的设计方案。\n\n探究实践：\n1.能以小组为单位完成一份小乐器设计方案（含设计图、材料清单、分工）。\n2.能根据方案选择合适的废旧材料。\n3.能向同学介绍并解说自己的设计方案。\n\n态度责任：\n1.乐于与同伴合作，能倾听和采纳他人的建议。\n2.树立废物利用、节约环保的意识。\n3.愿意接受他人对自己方案的评价并改进。",
  "key": "运用声音的知识设计一件小乐器，完成设计方案（画图、选材、定步骤），为下一课的制作做准备。",
  "hard": "①学生容易跳过设计直接动手，导致制作出来的乐器发不出不同音高。②设计方案要具体到\"怎样调节音高\"，这是难点——需要把科学原理转化为可操作的结构。③材料选择的合理性（什么材料能振动发声、怎样固定）需要教师引导。",
  "mat": "教师：设计图纸（A3，每组1张）、各种乐器实物或图片、废旧材料示例（纸盒、橡皮筋、吸管、瓶盖、竹签、旧光盘等）、教学课件、评价表\n\n学生（四人小组）：设计图纸1张、彩色笔、铅笔、尺子、可选择的废旧材料（提前收集）、记录单\n\n【低成本替代 —— 乡村学校重点】\n全部使用废旧材料：纸盒、塑料瓶、易拉罐、竹筒、木棍、橡皮筋、气球皮、旧光盘、瓶盖、吸管、玉米棒、竹片等。\n建议提前一周布置学生收集，学校也可常备一个\"材料箱\"。\n⚠ 设计阶段不必带齐材料，下一课制作时再带来。",
  "proc": "一、明确任务（6分钟）\n材料准备：教学课件（各种自制小乐器图片）\n\n1.展示几件用废旧材料做的小乐器（橡皮筋琴、水瓶琴、吸管排箫、瓶子沙锤）。\n提问：这些乐器是用什么做的？它们能发出声音吗？\n\n预设1：用纸盒和橡皮筋做的。\n预设2：用瓶子和水的。\n预设3：用吸管做的。\n\n2.发布任务：\n我们要设计并制作一件**小乐器**，要求：\n①能发出声音；\n②能发出**高低不同**的至少3个音（或强弱不同的声音）；\n③尽量用废旧材料；\n④美观、结实，能演奏一小段简单的旋律。\n\n3.提问：动手做之前，第一步该做什么？\n预设：先想好怎么做，画个图。\n教师强调：工程师都是\"先设计、后制作\"。今天这节课，我们只做设计。\n\n（板书课题：设计我们的乐器）\n\n二、设计方案（24分钟）\n\n（一）回顾原理（4分钟）\n1.提问：要让乐器发出高低不同的音，有哪些办法？\n预设1：让振动的部分变短——比如吸管排箫，用不同长度的管子。\n预设2：把弦绷紧或放松——比如橡皮筋琴。\n预设3：用粗细不同的弦或管。\n预设4：管子里装不同高度的水——水瓶琴，水少的音高。\n\n2.教师板书\"方法菜单\"，供设计时选用：\n·长短不同（吸管排箫、琴弦按位）\n·松紧不同（橡皮筋琴）\n·粗细不同（不同粗细的橡皮筋/弦）\n·水位不同（水瓶琴：水少音高，水多音低）\n\n（二）选择乐器类型（4分钟）\n1.各组讨论：我们打算做什么类型的小乐器？\n\n提供四个方向供选择：\n①弦乐类：橡皮筋琴（纸盒＋粗细不同的橡皮筋）\n②管乐类：吸管排箫（不同长度的吸管排列）\n③打击类：水瓶琴（相同瓶子装不同高度的水，敲击）\n④打击类：沙锤/鼓（容器＋不同填充物，靠强弱和音色变化）\n\n2.教师提示选择依据：\n·材料是否容易找到？\n·能不能发出**高低不同**的音？（这是关键要求）\n·制作难度是否适合？\n\n3.各组确定类型，填写在设计图上。\n\n（三）绘制设计图（10分钟）\n材料准备：每组设计图、彩色笔\n\n1.设计要求（教师板书）：\n·画出乐器的样子（外形）；\n·标注各部分的材料和尺寸；\n·**重点标注：怎样调节音高**（这是评分关键）；\n·写出制作步骤（1、2、3……）；\n·小组分工（谁做什么）。\n\n2.学生分组设计，教师巡视指导，重点追问：\n·\"你们打算怎么让它发出高音？怎么发出低音？\"\n·\"这个材料能振动发声吗？\"\n·\"橡皮筋怎么固定在纸盒上？\"\n·\"吸管长短差多少才能听出音高差别？\"\n\n3.教师提示几个技术要点：\n·橡皮筋琴：橡皮筋要能自由振动，纸盒开口要朝向声音传出的方向；可在纸盒上垫一根小木条做\"琴桥\"，把橡皮筋垫高，振动更充分；\n·吸管排箫：吸管长度差要明显（如相差2厘米），用胶带并排固定，吹奏时嘴唇对准管口；\n·水瓶琴：用相同的瓶子（材质、大小一致），只改变水位；敲瓶子时，水越少声音越高。\n\n（四）方案交流（6分钟）\n1.各组派代表展示设计图，介绍：\n·我们做的是哪种乐器？\n·用什么材料？\n·怎样让它发出高低不同的音？\n·小组怎么分工？\n\n2.其他组提问或提建议（教师示范）：\n✔ \"你们的想法很好，如果橡皮筋再垫高一点，声音可能会更响。\"\n✔ \"建议把吸管的长度差距拉大一些，音高差别会更明显。\"\n\n3.教师点评要点：\n·是否能发出高低不同的音（核心要求）；\n·调节音高的方法是否符合科学原理；\n·材料是否易得、方案是否可行。\n\n4.各组根据建议修改设计图。\n\n三、课堂总结（6分钟）\n1.提问：设计一件乐器，要考虑哪几件事？\n预设：用什么发声、怎样调节音高、用什么材料、怎么做、谁来做。\n2.教师提升：今天我们做了一件工程师做的事——把学过的科学知识（振动、音高规律），变成一个可以动手实现的方案。这就是\"技术与工程\"。\n3.预告：下节课我们就按设计图动手制作，做完后还要演奏给全班听！\n4.布置：课后按设计图准备材料（废旧物品为主），下节课带来制作。\n\n【提示：设计图妥善保存，下节课制作时要对照使用】",
  "board": "               5. 设计我们的乐器\n\n    一、任务要求\n        ① 能发声  ② 能发出高低不同的 ≥3 个音\n        ③ 废旧材料为主  ④ 美观结实\n\n    二、方法菜单（怎样改变音高）\n        ·长短不同 → 吸管排箫（短管音高）\n        ·松紧不同 → 橡皮筋琴（紧的音高）\n        ·粗细不同 → 细弦音高\n        ·水位不同 → 水瓶琴（水少音高）\n\n    三、四种可选方案\n        ① 弦乐：纸盒 + 粗细橡皮筋（垫木条做琴桥）\n        ② 管乐：不同长度吸管并排（差 2cm 以上）\n        ③ 打击：相同瓶子 + 不同水位（敲瓶口）\n        ④ 打击：容器 + 填充物（沙锤/鼓，音色变化）\n\n    四、设计图要包含\n        外形图 · 材料与尺寸 · ★怎样调音高★\n        制作步骤 · 小组分工\n\n    五、流程：★ 先设计 · 后制作 ★",
  "reflect": ""
 },
 "4|声音|6": {
  "goal": "科学观念：\n1.知道制作完成后的测试与改进是工程实践的重要环节。\n2.知道通过调节振动部分的长短、松紧、水量等，可以校准乐器的音高。\n3.知道作品需要经过反复调试才能达到预期效果。\n\n科学思维：\n1.能通过试奏发现作品的问题（音不准、声音小、易散架），并分析原因。\n2.能针对具体问题提出有效的改进措施。\n\n探究实践：\n1.能按设计方案完成小乐器的制作。\n2.能通过试奏测试乐器，发现问题并进行改进。\n3.能用自制乐器演奏一段简单的旋律。\n\n态度责任：\n1.面对失败不气馁，愿意反复调试和改进。\n2.小组合作中互相帮助，共同解决问题。\n3.乐于展示和欣赏他人的作品，体验成功的喜悦。",
  "key": "按设计方案制作小乐器，通过试奏发现问题并改进，最终能用自制乐器演奏简单旋律。",
  "hard": "①制作过程中会遇到各种技术问题（固定不牢、橡皮筋滑动、吸管吹不响、音高差别不明显），学生的耐心和解决问题的能力是考验。②\"调音\"需要耳朵辨别，部分学生音准感较弱。③课堂时间有限，需要合理分配制作与调试的时间。",
  "mat": "教师：热熔胶枪（教师操作）1把、剪刀、美工刀、透明胶带、双面胶、备用材料（橡皮筋、吸管、瓶盖等）、调音参考（钢琴APP或音叉）、评价表、教学课件\n\n学生（四人小组）：上节课准备好的废旧材料、设计图、剪刀、胶带、彩色笔（装饰用）、记录单\n\n【低成本替代】\n固定材料：透明胶带、双面胶为主；热熔胶由教师统一操作（安全）。\n调音工具：可用手机钢琴APP、音乐课本上的音阶图，或直接\"两个音听起来不一样\"即可（小学阶段不必追求精确音准）。\n备用材料：教师准备一个\"材料箱\"，学生材料不够时可补充。\n⚠ 美工刀、剪刀使用时注意安全，不朝向自己和他人。",
  "proc": "一、回顾与准备（4分钟）\n材料准备：各组设计图、材料\n\n1.各组拿出上节课的设计图，对照检查材料是否齐备。\n\n2.教师重申任务：\n①能发声；②能发出高低不同的至少3个音；③废旧材料；④能演奏一小段旋律。\n\n3.教师强调时间分配：制作15分钟，调试10分钟，展示5分钟。\n\n（板书课题：改进我们的乐器）\n\n二、动手制作（15分钟）\n材料准备：各组材料、工具\n\n1.学生按设计图制作，教师巡视，提供技术支援：\n·热熔胶粘接（教师操作）；\n·橡皮筋的固定与防滑（可在纸盒边缘剪小缺口卡住橡皮筋）；\n·吸管的并排固定与长度调整；\n·水瓶琴的水位调整。\n\n2.教师在各组间引导：\n·\"现在能响吗？先试试。\"\n·\"两个音听起来有明显差别吗？\"\n·\"哪里不牢固？需要怎么加固？\"\n\n3.提醒：先做到\"能响、能出不同音\"，再追求美观。\n\n三、测试与改进（10分钟）\n材料准备：调音参考、记录单\n\n1.各组试奏，记录问题：\n·能发声吗？（能 / 不能）\n·能发出几个不同的音？\n·音高差别明显吗？\n·有什么问题？\n\n2.常见问题与解决办法（师生共同研讨，教师板书）：\n\n| 问题 | 可能原因 | 改进办法 |\n|---|---|---|\n| 不发声 | 橡皮筋没绷紧 / 吸管没吹响 | 拉紧橡皮筋 / 调整吹奏角度 |\n| 声音太小 | 振动不充分 / 没有共鸣箱 | 垫高琴桥 / 加纸盒共鸣 |\n| 音高差别不明显 | 长短/松紧差距太小 | 拉大差距（吸管差2cm以上） |\n| 音不准、跑调 | 振动部分长度不合适 | 微调长度或水量 |\n| 容易散架 | 固定不牢 | 用胶带加固 / 热熔胶 |\n\n3.各组针对自己的问题改进。\n\n4.二次试奏：改进后效果如何？还需要再改吗？\n\n师小结：很少有作品一次就完美。正是\"试奏→发现问题→改进→再试奏\"这个循环，让我们的乐器越来越好——这就是工程师的工作方式。\n\n四、展示与演奏（6分钟）\n1.各组展示作品，演奏一小段（可以是音阶，也可以是简单的儿歌片段，如《小星星》前几句）。\n\n2.评价（多元，不只看音准）：\n·最动听奖\n·最有创意奖\n·最美外观奖\n·最环保奖（废物利用最好）\n·最大进步奖（改进幅度最大）\n\n3.学生互评：你最喜欢哪一组的作品？为什么？它哪里做得好？\n\n4.教师提升：我们用废旧材料，做出了能演奏的乐器。你们不仅学会了声音的知识，还像工程师一样动手把它做了出来。\n\n五、课堂总结（5分钟）\n1.提问：制作过程中，你遇到了什么困难？怎么解决的？\n预设：（学生自由分享）\n2.提问：改进前后有什么不同？\n预设：声音更响、音更准、更结实了。\n3.教师提升：从\"设计\"到\"制作\"再到\"改进\"，我们完整地经历了一次工程实践。这个过程中，最重要的不是作品有多完美，而是你学会了\"发现问题—想办法—动手改进\"。\n4.布置：把你的小乐器带回家，给家人演奏一段，并讲一讲它是靠什么振动发声、怎样改变音高的。\n\n【整理：剩余材料回收进\"材料箱\"；废纸、塑料分类投放；工具清点归位】",
  "board": "               6. 改进我们的乐器\n\n    一、制作流程\n        对照设计图 → 准备材料 → 动手制作 → 试奏 → 改进\n\n    二、问题诊断表\n        ┌────────────┬──────────────┬──────────────┐\n        │   问  题     │   原  因      │   改进办法     │\n        ├────────────┼──────────────┼──────────────┤\n        │ 不发声      │ 没绷紧·没吹响│ 拉紧·调角度    │\n        │ 声音太小    │ 振动不充分    │ 垫琴桥·加共鸣箱│\n        │ 音高差别小  │ 长短差距太小  │ 差距拉大到2cm+ │\n        │ 音不准      │ 长度不合适    │ 微调长度/水量  │\n        │ 易散架      │ 固定不牢      │ 胶带加固       │\n        └────────────┴──────────────┴──────────────┘\n\n    三、循环\n        ★ 试奏 → 发现问题 → 改进 → 再试奏 ★\n\n    四、展示评价（多元）\n        最动听 · 最有创意 · 最美外观 · 最环保 · 最大进步",
  "reflect": ""
 },
 "4|呼吸与消化|8": {
  "goal": "科学观念：\n1.知道呼吸器官（鼻、咽、喉、气管、支气管、肺）和消化器官（口腔、食道、胃、小肠、大肠）都需要细心呵护。\n2.知道常见的不良习惯会伤害这些器官，知道基本的保护方法。\n3.知道吸烟、雾霾、不洁饮食等对器官的危害。\n\n科学思维：\n1.能列举生活中的不良习惯，并分析它们会伤害哪个器官。\n2.能针对具体器官提出有针对性的保护措施。\n\n探究实践：\n1.能完成\"护器官行动卡\"的制作（列出具体可执行的行动）。\n2.能以小组为单位编排一段\"护器官\"宣传语或短剧。\n3.能制定一份个人健康生活小计划。\n\n态度责任：\n1.树立\"健康第一、预防为先\"的意识。\n2.愿意把健康知识落实到日常行动，并向家人宣传。\n3.关心他人的健康，劝阻身边的不良行为（如吸烟）。",
  "key": "通过讨论、案例分析与行动卡制作，认识保护呼吸器官和消化器官的重要性，掌握具体的保护方法，并落实到行动。",
  "hard": "本课是单元总结课，知识难度不高，难点在于\"从知道到做到\"——如何把保护方法转化为学生真实的日常行动。此外，涉及吸烟等话题时需要注意引导方式，避免说教，重在让学生自主得出结论。",
  "mat": "教师：教学课件（不良习惯的图片、器官受损的科普图）、大白纸（每组1张）、彩色笔、健康习惯调查表（每人1份）、护器官行动卡模板\n\n学生（四人小组）：大白纸1张、彩色笔、每人一份\"我的护器官行动卡\"\n\n【低成本替代】\n课件图片：可用简笔画、手绘图片代替。\n行动卡：用废纸裁成小卡即可。\n调查表：手绘表格。\n⚠ 涉及\"吸烟危害\"等话题时注意语气，侧重健康科普，不针对具体个人（避免学生联想到家中吸烟的亲人而产生压力）。",
  "proc": "一、激趣导入（5分钟）\n材料准备：教学课件\n\n1.回顾：这个单元我们认识了身体的两套系统——呼吸系统和消化系统。\n提问：它们每天都在为我们做什么？\n\n预设1：呼吸系统帮我们吸入氧气。\n预设2：消化系统帮我们吸收营养。\n\n2.追问：如果它们生病了，会怎么样？\n预设：会咳嗽、肚子疼、吃不下饭、没力气……\n\n3.引入：这些器官日夜不停地工作，我们应该怎样对待它们？今天就来制定一份\"护器官行动计划\"。\n（板书课题：呵护我们的器官）\n\n二、新课教学（28分钟）\n\n（一）找一找：哪些习惯在伤害它们（8分钟）\n材料准备：教学课件（不良习惯图片）\n\n1.教师逐一出示情境，学生判断\"伤害了哪个器官、为什么\"：\n情境一：冬天用嘴呼吸、抠鼻子 → 伤害鼻腔、呼吸道（鼻毛和黏液是天然屏障）\n情境二：在灰尘大的地方不戴口罩 → 伤害肺\n情境三：有人在家里吸烟 → 伤害肺（二手烟危害更大）\n情境四：暴饮暴食、吃太多零食 → 伤害胃\n情境五：狼吞虎咽、不细嚼慢咽 → 伤害胃（增加负担）\n情境六：吃很烫的食物、喝冰镇饮料 → 伤害食道和胃黏膜\n情境七：吃不干净的食物、饭前不洗手 → 伤害肠道（细菌感染）\n情境八：长时间大声喊叫 → 伤害喉（声带）\n\n2.小组讨论：除了这些，生活中还有哪些习惯在伤害我们的器官？\n\n3.全班交流，教师板书归类：\n·伤害呼吸器官：用嘴呼吸、抠鼻子、吸二手烟、雾霾天不防护、大声喊叫\n·伤害消化器官：暴饮暴食、狼吞虎咽、过烫过冰、不洁饮食、不规律吃饭\n\n（二）议一议：怎样保护它们（10分钟）\n材料准备：大白纸、彩色笔\n\n1.小组任务：分成\"呼吸组\"和\"消化组\"，讨论保护措施，写在白纸上。\n\n2.交流汇总，教师补充完善：\n\n**保护呼吸器官：**\n·用鼻子呼吸（鼻腔能温暖、湿润、过滤空气）\n·不抠鼻子，不用力擤鼻涕\n·雾霾天戴口罩、减少户外活动\n·远离吸烟的人，劝家人不吸烟\n·经常开窗通风，保持空气清新\n·坚持体育锻炼，增强肺活量\n·不大声喊叫，保护声带\n\n**保护消化器官：**\n·细嚼慢咽，不狼吞虎咽\n·定时定量，不暴饮暴食\n·不吃过烫、过冰、过辣的食物\n·饭前便后洗手，不吃不洁食物\n·多吃蔬菜水果，多喝水，不挑食\n·饭后不做剧烈运动\n\n3.追问：为什么要用鼻子呼吸，而不是用嘴？\n预设：鼻子里有鼻毛和黏液，能挡住灰尘、温暖空气。\n\n4.追问：为什么饭后不能马上剧烈运动？\n预设：血液都跑到肌肉去了，肠胃消化会受影响，容易肚子疼。\n\n（三）做一做：我的护器官行动卡（6分钟）\n材料准备：每人一张行动卡模板\n\n1.任务：写下3条你**从今天开始就要做到**的具体行动。\n要求：要具体、能做到、能检查。\n\n示例：\n✗ 不好：\"我要保护肺。\"\n✔ 好：\"①每天用鼻子呼吸，不抠鼻子；②雾霾天戴口罩；③劝爸爸不在家里吸烟。\"\n\n2.学生填写，教师巡视指导（帮助把目标写具体）。\n\n3.同桌互相读一读，互相监督。\n\n（四）宣传：护器官小标语（4分钟）\n1.小组合作，编写一条\"护器官\"宣传标语。\n示例：\n·\"用鼻呼吸，肺更健康\"\n·\"细嚼慢咽，胃不抱怨\"\n·\"远离香烟，清新每一天\"\n·\"饭前洗手，肠胃不愁\"\n\n2.各组展示，全班评选\"最响亮标语\"。\n\n三、课堂总结（5分钟）\n1.提问：今天我们学到了哪些保护器官的方法？\n预设：（学生自由回答，教师梳理）\n2.教师提升：这个单元我们认识了自己的呼吸系统和消化系统。它们从我们出生那一刻起就一刻不停地工作，从不休息。好好对待它们，是我们能做的最划算的\"投资\"——因为身体好，才有一切。\n3.情感升华：今天写下的行动卡，请贴在书桌前或床头，提醒自己坚持做到。一个月后我们再来比一比，谁坚持得最好。\n4.布置：把你的\"护器官行动卡\"带回家，和家人一起制定一份\"家庭健康公约\"。\n\n【提示：把各组的宣传标语贴在教室\"科学角\"，互相提醒】",
  "board": "              8. 呵护我们的器官\n\n    一、伤害它们的行为\n        呼吸系统：用嘴呼吸 · 抠鼻子 · 二手烟\n                  雾霾不防护 · 大声喊叫\n        消化系统：暴饮暴食 · 狼吞虎咽 · 过烫过冰\n                  不洁饮食 · 不规律\n\n    二、保护方法\n        ★ 呼吸系统 ★\n          用鼻呼吸 · 不抠鼻子 · 雾霾戴口罩\n          远离香烟 · 开窗通风 · 多锻炼 · 不大喊\n\n        ★ 消化系统 ★\n          细嚼慢咽 · 定时定量 · 不过烫过冰\n          饭前洗手 · 多吃蔬果多喝水 · 饭后不剧烈运动\n\n    三、为什么用鼻呼吸？\n        鼻毛挡灰尘 · 黏液湿润 · 温暖空气\n\n    四、行动卡（要具体可行）\n        ✗ \"我要保护肺\"\n        ✔ \"每天用鼻呼吸 · 雾霾戴口罩 · 劝爸爸戒烟\"",
  "reflect": ""
 },
 "4|声音|8": {
  "goal": "科学观念：\n1.知道耳朵是听觉器官，知道耳的主要结构（耳廓、外耳道、鼓膜、听小骨、耳蜗、听觉神经）。\n2.知道噪声会损伤听力，长期处于噪声环境会导致听力下降。\n3.知道保护听力的基本方法：不大声喧哗、不长时间戴耳机、远离噪声、不用尖锐物掏耳朵等。\n\n科学思维：\n1.能根据耳朵的结构，推理\"声音是怎样传到里面去的\"。\n2.能分析生活中的哪些行为会伤害听力，并提出保护措施。\n\n探究实践：\n1.能通过模拟实验（气球皮＋纸屑模拟鼓膜振动）理解鼓膜的作用。\n2.能测量或感受环境中的噪声大小（可用手机APP或简单对比）。\n3.能制定一份\"保护听力\"的个人行动计划。\n\n态度责任：\n1.树立保护听力的意识，养成文明轻声的习惯。\n2.愿意劝阻身边制造噪声的行为，做\"轻声小卫士\"。\n3.关心听力障碍人群，懂得体谅与帮助。",
  "key": "认识耳的结构与听觉的形成，了解噪声对听力的危害，掌握保护听力的具体方法。",
  "hard": "①耳的内部结构（鼓膜、听小骨、耳蜗）看不见，需要借助模型和模拟实验。②\"噪声损伤听力\"是一个长期、累积的过程，学生难以直观感受，需要通过体验活动（如在嘈杂环境中听不清）来建立认识。③把意识转化为日常行为（如控制耳机音量）是难点。",
  "mat": "教师：耳的结构挂图（或模型）1套、教学课件（含耳朵结构动画、噪声对比音频）、气球皮（或保鲜膜）、纸屑、大碗、手机（播放音频，可选）、分贝仪APP（可选）\n\n学生（四人小组）：大碗1个、气球皮（或保鲜膜）1张、橡皮筋1根、纸屑一小撮、记录单\n\n【低成本替代】\n耳模型：可用挂图、板画代替；也可用橡皮泥捏出各部分。\n鼓膜模拟：碗口蒙保鲜膜＋撒纸屑，在旁边敲击，观察纸屑跳动（模拟鼓膜振动）。\n噪声体验：教师播放两段音量差异明显的音频，或用敲击声对比，让学生感受\"太吵就听不清、不舒服\"。\n分贝测量：无APP也可，用\"能不能听清同桌说话\"作为简单判断标准。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件（播放一段很响的声音）\n\n1.教师播放一段音量很大的声音（3秒），学生捂耳朵。\n提问：什么感觉？\n预设1：很吵，不舒服。\n预设2：耳朵难受。\n预设3：听不清别的声音了。\n\n2.追问：如果长期生活在很吵的环境里，会怎么样？\n预设：会听不见、耳朵会坏。\n\n3.教师讲述：我们靠耳朵听到世界上各种美妙的声音。可是，如果我们不好好保护它，听力一旦受损，很多时候是**无法恢复**的。\n\n4.引入：今天我们学习怎样保护我们的听力。\n（板书课题：保护听力）\n\n二、新课教学（28分钟）\n\n（一）认识耳的结构（8分钟）\n材料准备：耳结构挂图\n\n1.教师对照挂图介绍（由外向内）：\n·耳廓：收集声音（我们看到的部分）；\n·外耳道：声音传进去的通道；\n·鼓膜：一层薄薄的膜，像鼓面一样，声音传来会振动；\n·听小骨：三块最小的骨头，把振动放大传进去；\n·耳蜗：像蜗牛壳，里面有很多听觉细胞，把振动变成信号；\n·听觉神经：把信号传给大脑，我们就\"听到\"了。\n\n2.梳理听觉的形成（板书箭头）：\n耳廓收集 → 外耳道 → 鼓膜振动 → 听小骨放大 → 耳蜗产生信号 → 听觉神经 → 大脑（听到）\n\n3.追问：哪一部分最容易受伤？\n预设：鼓膜（很薄）、耳蜗里的听觉细胞。\n\n4.教师强调：鼓膜很薄，像一张纸；耳蜗里的听觉细胞**坏死了就不会再生**。所以听力损伤往往是不可逆的。\n\n（二）模拟实验：鼓膜的振动（8分钟）\n材料准备：每组大碗、气球皮、纸屑、橡皮筋\n\n1.制作\"鼓膜模型\"：\n①把气球皮（或保鲜膜）绷紧蒙在碗口上，用橡皮筋扎紧，让它像鼓面一样紧绷；\n②在膜上撒少量纸屑。\n\n2.实验：\n①在碗旁边轻轻敲击（或轻声说话），观察纸屑；\n②用力敲击（或大声喊），观察纸屑。\n\n3.交流：\n提问：纸屑怎么了？声音大小不同时，纸屑跳动有什么不同？\n预设1：敲击时纸屑跳动了，说明膜在振动。\n预设2：声音大时纸屑跳得高。\n\n4.追问：这层膜相当于耳朵里的什么？\n预设：鼓膜。\n师：声音传到耳朵，使鼓膜振动，我们就听到了声音。声音太大时，鼓膜振动得过于剧烈，就可能被震伤。\n\n（三）认识噪声的危害（6分钟）\n材料准备：教学课件\n\n1.提问：什么是噪声？\n预设：很难听的声音、很吵的声音、让人不舒服的声音。\n\n2.教师补充：凡是**影响人们休息、学习和工作**，或者**让人不舒服**的声音，都叫噪声。\n\n3.讨论：生活中哪些地方噪声大？\n预设：马路边（汽车喇叭）、建筑工地、工厂、放鞭炮、KTV、长时间戴耳机听音乐（音量过大）。\n\n4.噪声的危害：\n·损伤听力（最直接）；\n·影响睡眠、使人烦躁；\n·影响学习效率；\n·长期噪声还可能影响心血管健康。\n\n5.体验活动（可选）：\n教师播放两段声音——正常音量 vs 过大音量，学生对比感受。\n提问：哪种让你不舒服？为什么？\n预设：太大的声音刺耳、难受。\n\n（四）怎样保护听力（6分钟）\n1.小组讨论，汇总保护方法，教师板书：\n·**不制造噪声**：公共场所轻声说话，不大声喧哗；\n·**远离噪声**：遇到放鞭炮、施工等，捂住耳朵或走远；\n·**控制耳机音量**：耳机音量不超过最大音量的60%，每次不超过60分钟（\"60-60原则\"）；\n·**不用尖锐物掏耳朵**：不用指甲、发卡、棉签深挖耳道；\n·**防止耳朵进水**：游泳、洗澡后及时擦干，耳朵进水可单脚跳排出；\n·**预防感冒和中耳炎**：感冒时不要用力擤鼻涕；\n·**定期检查听力**。\n\n2.重点强调\"60-60原则\"（板书）：\n耳机音量 ≤ 60%，单次时长 ≤ 60 分钟。\n\n3.追问：为什么不能用尖锐的东西掏耳朵？\n预设：会戳破鼓膜、会损伤耳道皮肤引起感染。\n教师补充：耳屎（耵聍）其实有保护作用，会自己排出，一般不需要掏。\n\n4.情感引导：遇到有人在公共场所大声喧哗，我们可以礼貌地提醒；遇到听力障碍的人，我们要体谅和帮助。\n\n三、课堂总结（5分钟）\n1.提问：听觉是怎样形成的？\n预设：耳廓收集→外耳道→鼓膜振动→听小骨→耳蜗→听神经→大脑。\n2.提问：保护听力要注意什么？\n预设：不制造噪声、远离噪声、耳机遵循60-60原则、不掏耳朵、防水防感冒。\n3.教师提升：我们能听到鸟叫、音乐、老师的讲课、妈妈的呼唤——这些美好，都依赖一双健康的耳朵。听力一旦损伤很难恢复，所以\"保护\"比\"治疗\"重要得多。让我们都来做\"轻声小卫士\"。\n4.布置：制定一份\"我的护耳行动计划\"，写下3条从今天开始要做到的事（如：耳机音量不超过60%、每天耳机不超过1小时、不在同学耳边大声喊）。\n\n【提示：把学生的护耳计划贴在教室，一周后自查】",
  "board": "                   8. 保护听力\n\n    一、耳的结构与听觉形成\n        耳廓 → 外耳道 → 鼓膜振动 → 听小骨\n              → 耳蜗 → 听神经 → 大脑（听到）\n        （鼓膜很薄 · 耳蜗细胞坏死不可再生）\n\n    二、模拟实验\n        碗口蒙膜 + 纸屑 = 鼓膜模型\n        敲击 → 纸屑跳动 = 鼓膜在振动\n        声大 → 跳得高 → 过度振动会震伤\n\n    三、噪声\n        影响休息学习 · 让人不舒服的声音\n        来源：马路 · 工地 · 鞭炮 · 耳机音量过大\n        危害：★损伤听力（不可逆）★ · 影响睡眠 · 烦躁\n\n    四、保护方法\n        不制造噪声 · 远离噪声\n        ★ 耳机 60-60 原则：音量≤60% · 每次≤60分钟 ★\n        不掏耳朵 · 防水 · 防感冒 · 定期检查",

 "5|微小世界|2": {
  "goal": "科学观念：\n1.知道把两个凸透镜组合起来，可以获得比单个放大镜更高的放大倍数。\n2.知道靠近观察物体的是物镜，靠近眼睛的是目镜，这是显微镜的基本原理。\n3.知道组合透镜的放大效果与两片透镜之间的距离有关，需要调节到合适位置才最清晰。\n\n科学思维：\n1.能通过对比\"单镜\"与\"双镜组合\"的观察效果，归纳出组合可以\"放得更大\"。\n2.能理解\"放大\"与\"清晰\"之间需要调节，初步体会工程中的\"权衡\"。\n\n探究实践：\n1.能尝试用两块凸透镜组合观察，调节间距找到清晰的图像。\n2.能用纸筒固定组合透镜，做成简易显微镜。\n3.能如实记录观察到的新细节。\n\n态度责任：\n1.体会人类不断改进观察工具、探索未知的精神。\n2.实验中爱护镜片，不用手指触摸镜面。\n3.乐于反复尝试，不因一时找不到清晰图像而放弃。",
  "key": "通过组合两块凸透镜并调节间距，获得更大的放大倍数，理解简易显微镜（组合透镜）的基本原理。",
  "hard": "①两块透镜的间距需要耐心调节才能找到清晰图像，学生容易急躁或放弃——需要教师示范并给足时间。②放大倍数提高后，视野会变小、亮度会变暗，学生可能觉得\"反而看不清\"——需要引导理解这是放大带来的必然代价。③\"物镜\"\"目镜\"的概念对初次接触的学生较抽象。",
  "mat": "教师：不同凸度的凸透镜若干（每组至少2块）、纸筒（或卷起的卡纸）每组1个、胶带、剪刀、教学课件（列文虎克的故事）、观察材料（树叶、花粉、报纸小字、头发）、记录单\n\n学生（四人小组）：凸透镜2块（凸度不同更佳）、纸筒1个（或用卡纸卷成）、胶带、剪刀、观察材料（树叶、头发、报纸小字）、记录单\n\n【低成本替代】\n凸透镜：可用老花镜片（度数不同=凸度不同）、放大镜拆下的镜片、手机微距镜头。\n纸筒：用硬卡纸卷成筒、或用卫生纸芯、保鲜膜芯代替。\n固定：用胶带缠绕固定，或用橡皮泥固定镜片位置。\n观察材料：树叶、花瓣、头发、布料的纤维、报纸上的小字——随手可得。\n⚠ 镜片要用软布擦拭，不能用手指直接触摸镜面。",
  "proc": "一、激趣导入（6分钟）\n材料准备：放大镜1个、报纸小字\n\n1.回顾：上节课我们用放大镜观察了树叶和报纸。\n提问：如果想看清更小的东西，比如一根头发上的细节，一个放大镜还够用吗？\n预设：不够，要放得更大。\n\n2.追问：只有一个放大镜，怎么办？有没有办法让它\"放得更大\"？\n预设1：换一个更大的放大镜。\n预设2：把两个放大镜叠在一起。\n预设3：不知道。\n\n3.引入：今天我们就来试一试，怎样\"放得更大\"。\n（板书课题：怎样放得更大）\n\n二、新课教学（28分钟）\n\n（一）试一试：两块透镜叠起来（10分钟）\n材料准备：每组2块凸透镜、报纸小字\n\n1.任务：\n①先用一块放大镜观察报纸上的一行小字，记住看到的样子；\n②再把第二块放大镜叠加在第一块上面，慢慢上下移动上面那块，观察图像的变化；\n③找到一个\"又大又清楚\"的位置。\n\n2.学生尝试，教师巡视，重点提示：\n·两块镜片不要贴在一起，要留出一段距离；\n·移动时要慢，一边移一边看；\n·眼睛要靠近上面的镜片。\n\n3.交流：\n提问：两块叠起来以后，和一块比有什么不同？\n预设1：字变得更大了。\n预设2：一开始很模糊，移动到一个位置就清楚了。\n预设3：看到的字变少了（只能看到一两个字）。\n\n4.追问：为什么看到的字反而变少了？\n预设：因为放得太大了，一次只能看到一小块。\n教师点明：这是放大的\"代价\"——**放大倍数越大，看到的范围（视野）就越小，画面也越暗**。\n\n5.师小结：把两块凸透镜组合起来，就能放得更大。这就是最早的显微镜的原理。\n\n（二）认识物镜与目镜（4分钟）\n1.教师介绍（配合示意图）：\n·靠近被观察物体的那块透镜，叫**物镜**；\n·靠近眼睛的那块透镜，叫**目镜**。\n\n2.小活动：同桌互相指一指，哪块是物镜，哪块是目镜。\n\n（三）制作简易显微镜（8分钟）\n材料准备：每组2块透镜、纸筒、胶带、剪刀\n\n1.任务：把两块透镜用纸筒固定起来，做成一台简易显微镜。\n\n2.教师示范制作步骤：\n①把纸筒（或卷好的卡纸筒）作为镜筒；\n②把凸度较大的一块（物镜）固定在筒的下端；\n③把凸度较小的一块（目镜）固定在筒的上端；\n④两块之间保持一定距离（可以先不固定死，方便调节）。\n\n3.学生制作，教师巡视协助固定。\n\n4.测试：把简易显微镜对准报纸小字或树叶，调节目镜的位置，找到清晰图像。\n\n5.交流：\n提问：你们的简易显微镜能看到什么？\n预设1：能看到纸的纤维。\n预设2：能看到树叶上的小绒毛。\n预设3：有的组怎么调都不清楚。\n\n6.研讨问题：\n提问：调不清楚可能是什么原因？\n预设1：两块镜片的距离不合适。\n预设2：手抖，镜筒在动。\n预设3：光线太暗。\n预设4：镜片上有指纹或脏东西。\n\n（四）科学史：列文虎克的故事（6分钟）\n材料准备：教学课件\n\n1.教师讲述（配合课件）：\n三百多年前，荷兰有一个叫列文虎克的看门人。他喜欢磨制镜片，把两块镜片组合起来，做成了当时最精良的显微镜。通过这些自制的显微镜，他第一次看到了雨水里的\"小动物\"——细菌、原生动物，人类从此知道了一个全新的微观世界。\n\n2.提问：列文虎克为什么能发现别人没发现的东西？\n预设1：因为他做的显微镜比别人的好。\n预设2：因为他爱观察、爱琢磨。\n\n3.教师提升：工具的进步，会带来视野的拓展；而视野的拓展，会带来科学的重大发现。我们今天做的简易显微镜，和列文虎克的原理是一样的。\n\n三、课堂总结（5分钟）\n1.提问：怎样让放大镜放得更大？\n预设：把两块凸透镜组合起来。\n2.提问：哪块是物镜？哪块是目镜？\n预设：靠近物体的是物镜，靠近眼睛的是目镜。\n3.提问：放大倍数大了以后，会有什么\"代价\"？\n预设：看到的范围变小、画面变暗。\n4.教师提升：今天我们造出了自己的\"显微镜\"。下一课，我们将认识实验室里真正的光学显微镜，去看看更小的世界。\n5.布置：回家用两块老花镜片（或放大镜）试着做一个简易显微镜，看看能发现什么新东西。\n\n【整理：镜片用软布擦拭后归位；纸筒、胶带回收】",
  "board": "                 2. 怎样放得更大\n\n    一、两块透镜叠起来\n        单镜 → 放大有限\n        双镜组合 → ★ 放得更大 ★\n\n    二、物镜与目镜\n        物镜：靠近【被观察物体】的透镜\n        目镜：靠近【眼睛】的透镜\n\n    三、制作简易显微镜\n        纸筒 = 镜筒\n        下端固定物镜（凸度大）· 上端固定目镜（凸度小）\n        调节间距 → 找到清晰图像\n\n    四、放大的\"代价\"\n        ★ 倍数越大 → 视野越小 · 画面越暗 ★\n\n    五、常见问题\n        模糊 → 间距不合适 / 手抖 / 光线暗 / 镜片脏\n\n    六、科学史\n        列文虎克：磨镜片 + 组合透镜 → 首次看见微生物",

 "5|微小世界|3": {
  "goal": "科学观念：\n1.知道手持式简易显微镜的结构（目镜、物镜、调焦旋钮、载物台、光源或采光窗）。\n2.知道简易显微镜比普通放大镜放大倍数高，能看到肉眼和放大镜看不到的细节。\n3.知道可以用画图的方式记录观察到的微观图像。\n\n科学思维：\n1.能对比放大镜与简易显微镜的观察效果，分析工具进步带来的变化。\n2.能通过画图和描述，把观察到的现象准确表达出来。\n\n探究实践：\n1.能规范使用手持式简易显微镜（安放、对光、调焦、观察）。\n2.能观察花粉、叶表皮、头发、布料纤维等材料并画图记录。\n3.能如实描绘观察到的图像，不照抄课本插图。\n\n态度责任：\n1.爱护光学器材，轻拿轻放。\n2.如实记录观察结果——只画真实看到的。\n3.对微观世界保持好奇，乐于观察身边的一切。",
  "key": "学会使用手持式简易显微镜观察微小物体，掌握规范操作流程，并用画图的方式记录观察到的细节。",
  "hard": "①调焦是主要难点：学生转动调焦旋钮往往过快，图像一闪而过；需要强调\"缓慢转动、边转边看\"。②简易显微镜放大倍数有限、视野小，找到目标物本身就需要练习。③科学画图要求\"如实描绘\"，学生容易照抄课本插图画得\"太漂亮\"，需要反复强调真实性。",
  "mat": "教师：手持式简易显微镜（演示用）1台、操作示范视频或图示、观察材料（花粉、洋葱表皮、头发、布料、纸纤维）、教学课件、记录单（含画图圆圈）\n\n学生（四人小组）：手持式简易显微镜1台（2人1台更好）、观察材料（花粉、头发、叶片、布料、纸片等）、载玻片（可选）、记录单每人1张\n\n【低成本替代 —— 器材不足时】\n手持式简易显微镜：可用上节课自制的\"纸筒组合透镜显微镜\"代替；也可用手机微距镜头（夹在手机摄像头上，成本极低，效果很好）。\n分组策略：全班分6—8组轮流使用，其余时间做\"画图练习\"\"观察任务卡\"等，保证人人动手。\n观察材料：花粉（鲜花可得）、头发、洋葱表皮、纸纤维、布料纤维、食盐颗粒、砂糖颗粒——全是生活材料。\n⚠ 简易显微镜若自带光源，注意及时关灯省电。",
  "proc": "一、激趣导入（6分钟）\n材料准备：手持式简易显微镜、一朵花（带花粉）\n\n1.教师出示一朵花。\n提问：花粉是什么样子的？肉眼看得清吗？\n预设：看不清，就是黄色的粉末。\n\n2.教师用简易显微镜观察花粉，并把看到的描述出来（或投屏展示）。\n师：老师看到了——花粉粒像一个个小刺球，表面还有很多小突起。\n\n3.追问：想不想亲眼看看？今天我们就来学习使用这件工具。\n（板书课题：用简易显微镜观察）\n\n二、新课教学（28分钟）\n\n（一）认识简易显微镜（6分钟）\n材料准备：每组显微镜1台\n\n1.教师对照实物介绍结构：\n·目镜：靠近眼睛的部分；\n·物镜：靠近物体的部分；\n·调焦旋钮：转动它，让图像变清晰；\n·载物台（或观察窗）：放观察材料的地方；\n·光源/采光窗：照亮物体（有的带小灯，有的是透明窗采光）。\n\n2.小活动：同桌互相说一说各部分的名称和作用。\n\n（二）学习操作步骤（6分钟）\n材料准备：演示用显微镜\n\n教师分步示范，强调要点：\n1.**放材料**：把要观察的东西放在载物台上（或把显微镜对准观察物）；\n2.**对光**：让光从下面照上来（打开小灯，或把采光窗朝向亮处）；\n3.**调焦**：★ 慢慢转动调焦旋钮，一边转一边从目镜里看，直到图像最清晰 ★；\n4.**观察记录**：把看到的画在记录单的圆圈里。\n\n教师特别强调（易错点）：\n·调焦一定要**慢**，转快了图像一闪就过去了；\n·眼睛要贴近目镜；\n·观察时手要拿稳，不要晃动；\n·如果太暗，调整采光窗的角度或开灯。\n\n（三）分组观察（12分钟）\n材料准备：每组显微镜、观察材料、记录单\n\n1.分组（每组3—4人，轮流操作，保证每人至少观察一次）。\n\n2.观察任务（至少完成3样）：\n①花粉：什么形状？表面光滑吗？\n②头发：表面是什么样的？像什么？\n③叶片或纸：能看到什么结构？\n④布料：能看出\"线\"是怎么织的吗？\n\n3.学生分组观察，教师巡视，重点帮助：\n·调焦总是调不清的小组（一对一示范）；\n·找不到观察目标的小组（提示：先把材料放正对物镜下方，再调焦）；\n·光线不足的小组（提示转向窗户或开灯）。\n\n4.画图记录（★强调如实描绘）：\n要求：\n·画你**真实看到**的样子，不要照抄课本插图；\n·可以标注你看到的部分；\n·如果看不清，就如实写\"看不清\"。\n\n（四）交流研讨（4分钟）\n1.各组展示自己的观察图，描述看到了什么。\n预设：\n·花粉：圆圆的，像小刺球，表面有突起。\n·头发：像一根粗糙的棍子，表面有鳞片一样的东西。\n·纸：能看到很多细丝交缠在一起（纤维）。\n·布料：能看到一根根线交叉编织。\n\n2.提问：简易显微镜和放大镜比，有什么优点？\n预设1：放得更大，能看到更多细节。\n预设2：有调焦旋钮，能调得更清楚。\n\n3.提问：它有什么不足？\n预设1：放大倍数还是不够高，看不到更小的东西（比如细胞）。\n预设2：视野小，一次只能看一小块。\n预设3：要拿在手上，手一抖就模糊了。\n\n师小结：简易显微镜比放大镜强，但要看到更小的世界（比如细胞），还需要更专业的工具。下一课我们就请出实验室的\"大块头\"——光学显微镜。\n\n三、课堂总结（5分钟）\n1.提问：使用简易显微镜分哪几步？\n预设：放材料 → 对光 → 调焦 → 观察记录。\n2.提问：调焦时要注意什么？\n预设：要慢慢转，边转边看。\n3.提问：画图记录要注意什么？\n预设：只画真实看到的，不照抄书本。\n4.布置：用简易显微镜观察5样家里的东西（盐、糖、布、纸、头发），把看到的画下来，下节课交流。\n\n【整理：显微镜用后关灯、归位；观察材料清理干净】",
  "board": "                3. 用简易显微镜观察\n\n    一、结构\n        目镜 · 物镜 · 调焦旋钮 · 载物台 · 光源/采光窗\n\n    二、四步操作\n        ① 放材料（对准物镜下方）\n        ② 对  光（开灯 或 采光窗朝亮处）\n        ③ 调  焦 ★慢慢转 · 边转边看★\n        ④ 观察记录（画图）\n\n    三、观察到的（示例）\n        花粉 → 小刺球，表面有突起\n        头发 → 粗糙的棍子，表面有鳞片\n        纸   → 细丝交缠（纤维）\n        布料 → 一根根线交叉编织\n\n    四、画图要求\n        ★ 只画真实看到的，不照抄课本插图 ★\n\n    五、优点与不足\n        优：比放大镜放得大 · 能调焦更清晰\n        不足：倍数仍有限（看不到细胞）· 视野小 · 手抖易模糊",
  "reflect": ""

 "5|微小世界|6": {
  "goal": "科学观念：\n1.知道自然水域（池塘、水沟、水坑）中生活着许多微小的生物，如草履虫、水熊虫、变形虫、水绵、衣藻等。\n2.知道这些微小生物也是生物，需要食物、能运动、能繁殖。\n3.知道水样需要提前采集和培养，微生物才能繁殖到容易观察的数量。\n\n科学思维：\n1.能通过观察，区分\"活的生物\"与\"杂物碎屑\"（关键看是否会动、是否有固定形态）。\n2.能根据观察到的运动方式，推测微小生物的生活习性。\n\n探究实践：\n1.能制作临时装片观察水样中的微小生物。\n2.能正确使用显微镜观察、画图记录。\n3.能持续观察并记录（培养期间的变化）。\n\n态度责任：\n1.对微小生命产生惊奇与敬畏，体会生命的多样性。\n2.实验中注意卫生：观察后洗手，不饮用实验用水。\n3.如实记录，不把杂质当作生物，也不遗漏真实的发现。",
  "key": "观察自然水域水样中的微小生物，认识微生物的存在与多样性，感受微观世界的生命。",
  "hard": "①水样必须提前1—2周培养，否则微生物数量太少看不到——这是本课成败的关键，需要教师课前准备。②学生容易把\"水中漂浮的杂质\"当成生物，或因为杂质太多而找不到真正的生物——需要教会区分方法（会动、有固定形状、有结构）。③微生物运动较快，追踪观察需要耐心和技巧。",
  "mat": "教师：提前培养的水样（池塘水/水沟水，培养1—2周）、显微镜1台（演示）、载玻片、盖玻片、滴管、吸水纸、脱脂棉（限制运动用）、教学课件（微生物图片和视频）、记录单\n\n学生（四人小组）：显微镜1台、培养好的水样1小瓶、载玻片2片、盖玻片2片、滴管1支、吸水纸、脱脂棉（或棉絮）少许、记录单（含画图圆圈）\n\n【⚠ 课前准备（关键！）】\n提前1—2周采集水样：到学校附近的池塘、水沟、稻田取水（取水面附近的水，带一点绿色藻类更好），装进广口瓶，放入几根干草（稻草）或几片菜叶，放在温暖、有散射光的地方培养。水会慢慢变绿、变浑浊，这时微生物最多。\n【低成本替代】\n水样：池塘水、稻田水、水沟水、花瓶里放了几天的水；雨后的小水坑也可以。\n培养容器：矿泉水瓶、玻璃罐头瓶、一次性塑料杯均可（广口更好，透气）。\n脱脂棉：药棉、棉签上的棉花，用来限制微生物运动，便于观察。\n装片：无盖玻片时，可用极薄的透明塑料片代替，或直接在载玻片上滴水观察（低倍）。\n⚠ 卫生：实验后必须洗手；水样不可饮用；用后水样集中处理。",
  "proc": "一、激趣导入（6分钟）\n材料准备：一瓶培养好的水样\n\n1.教师出示一瓶略带绿色的水。\n提问：这瓶水看起来怎么样？里面有东西在动吗？\n预设1：有点绿、有点浑。\n预设2：看不出来有东西在动。\n\n2.教师（配合课件视频）：别看它只是一瓶普通的水，里面其实住着成千上万的小生命。我们来\"放大\"看看。\n\n3.播放一段水滴中微生物活动的视频（草履虫游动、水熊虫爬行）。\n提问：你看到了什么？\n预设1：有东西在游来游去！\n预设2：它们长得很奇怪。\n\n4.引入：这些就是我们今天要找的\"水中居民\"。\n（板书课题：观察水中微小生物）\n\n二、新课教学（28分钟）\n\n（一）回顾显微镜操作（3分钟）\n1.快速回顾：放片→对光→调焦→观察。\n2.强调：今天观察的是**活的、会动的**东西，调焦要更耐心，可以用低倍先找到，再换高倍。\n\n（二）制作水样装片（6分钟）\n材料准备：每组水样、载玻片、盖玻片、滴管、脱脂棉\n\n1.教师示范步骤：\n①用滴管吸取少量水样（取一点培养液，最好取靠近水面的、或瓶壁上绿色的部分）；\n②在载玻片中央滴1—2滴水样；\n★技巧：放几根脱脂棉纤维在水中（限制微生物游动太快，方便观察）★\n③轻轻盖上盖玻片（一边先接触水滴，慢慢放下，避免气泡）；\n④用吸水纸吸掉多余的水。\n\n2.学生分组制作，教师巡视（重点是盖片和气泡处理）。\n\n（三）观察与记录（13分钟）\n材料准备：每组显微镜、装片、记录单\n\n1.观察提示（教师板书）：\n·先用低倍镜找到目标；\n·目标会动，要跟着它慢慢移动装片；\n·看到会动的东西，重点观察：什么形状？怎么动？有多大？\n\n2.学生观察，教师巡视，重点帮助：\n·找不到目标的小组（提示：先找水里的\"小点\"，看它会不会移动）；\n·总是找不着焦的小组（提示：先把镜头降到最低，再慢慢往上升）；\n·把杂质当生物的小组（引导：会自己动的、形状固定的，才更可能是生物）。\n\n3.研讨：怎样判断它是\"生物\"而不是\"渣滓\"？\n师生共同总结判断标准（板书）：\n·**会自己运动**（草履虫旋转前进、变形虫缓慢变形移动）；\n·**有固定的形状**（不是随机的碎片）；\n·**能观察到内部结构**（如草履虫身上的纤毛、体内的食物泡）。\n\n4.交流发现：\n提问：你们看到了什么？它在做什么？\n预设1：看到像草鞋一样的东西在转着圈游（草履虫）。\n预设2：看到绿色的、一串串的（水绵/衣藻）。\n预设3：看到一团会变形的（变形虫）。\n预设4：只看到一些不动的小颗粒（可能是杂质）。\n\n5.教师介绍几种常见微生物（配合课件图片）：\n·**草履虫**：像倒放的草鞋底，全身长满纤毛，旋转前进，吃细菌；\n·**变形虫**：形状不固定，靠伸出\"伪足\"缓慢移动和捕食；\n·**水绵**：绿色的丝状藻类，细胞里有螺旋形的叶绿体；\n·**衣藻**：单细胞绿藻，有两根鞭毛，会游动；\n·**水熊虫**（缓步动物）：有八条腿，像小熊一样爬行，生命力极强。\n\n6.画图记录：把你观察到的画下来，标注名称和运动方式。\n\n（四）研讨：它们也是生命（6分钟）\n1.提问：这些小东西是生物吗？为什么？\n预设1：是，因为它们会动。\n预设2：是，它们会吃东西、会繁殖。\n\n2.追问：它们需要什么才能活着？\n预设：需要水、需要食物（细菌、藻类）、需要空气。\n\n3.教师补充：这些微小生物虽然只有一个细胞（如草履虫、变形虫），但它们能完成摄食、呼吸、排泄、繁殖、对外界刺激作出反应等全部生命活动——**一个细胞就是一个完整的生命**。\n\n4.情感提升：一滴看起来清澈的水里，竟然藏着一个繁忙的世界。生命无处不在，即使小到我们看不见。\n\n三、课堂总结（5分钟）\n1.提问：怎样判断水里的小东西是生物？\n预设：会自己动、有固定形状、有内部结构。\n2.提问：做这个实验，最关键的一步是什么？\n预设：水样要提前培养；装片要避免气泡；调焦要耐心。\n3.教师提升：从放大镜到简易显微镜，再到今天看到水中的小生命，我们的视野一步步深入。下一课，我们将走进\"微生物与人类\"——这些小家伙和我们到底有什么关系。\n4.布置：自己取一瓶水（雨水、池塘水），放几根干草培养，每天观察水的颜色变化，记录下来，一周后再用显微镜看看。\n\n【★ 卫生要求：实验后必须用肥皂洗手；水样不可饮用；用过的水样倒入指定容器；载玻片、盖玻片清洗归位】",
  "board": "                6. 观察水中微小生物\n\n    一、课前准备（关键）\n        ★ 提前 1~2 周采集水样 + 放干草培养 ★\n        池塘水/稻田水/水沟水 → 温暖有光处 → 变绿变浑 = 微生物多\n\n    二、装片制作\n        滴水样 → ★加几根棉纤维（限制游动）★\n        → 盖盖玻片（一边先接触）→ 吸去多余水\n\n    三、判断\"是生物吗\"\n        ★ ① 会自己运动  ② 有固定形状  ③ 有内部结构 ★\n        （不动的、形状随机的多半是杂质）\n\n    四、常见居民\n        草履虫：像草鞋 · 满身纤毛 · 旋转前进\n        变形虫：形状不定 · 伸伪足移动\n        水  绵：绿色丝状 · 螺旋叶绿体\n        衣  藻：单细胞绿藻 · 两根鞭毛\n        水熊虫：八条腿 · 像小熊爬\n\n    五、启示\n        ★ 一个细胞也能完成全部生命活动 ★\n        生命无处不在\n\n    ⚠ 卫生：实验后洗手 · 水样不饮用",
  "reflect": ""

 "5|微小世界|7": {
  "goal": "科学观念：\n1.知道微生物（细菌、真菌、病毒等）广泛存在于空气、水、土壤和我们的身体里。\n2.知道微生物对人类既有有益的一面（发酵食品、制药、分解垃圾、帮助消化），也有有害的一面（致病、使食物腐败）。\n3.知道可以通过控制条件（温度、水分、清洁）来利用有益微生物、抑制有害微生物。\n\n科学思维：\n1.能辩证地看待微生物的作用，不简单地\"好坏二分\"。\n2.能列举生活中的实例，说明微生物与人类的密切关系。\n\n探究实践：\n1.能观察并对比发霉的面包（或水果）与新鲜食物的变化。\n2.能设计一个简单的对比实验（如不同环境下馒头发霉的快慢）。\n3.能用图文并茂的方式整理\"微生物的功与过\"。\n\n态度责任：\n1.辩证看待微生物，既讲卫生又不\"谈菌色变\"。\n2.养成良好的卫生习惯（洗手、食物保存、垃圾分类）。\n3.对微生物的应用（如发酵、疫苗）产生兴趣。",
  "key": "通过阅读、讨论与观察，认识微生物与人类生活的密切关系，辩证看待微生物的利与弊。",
  "hard": "①\"微生物\"看不见，学生对其存在的认识依赖前几课的观察经验。②辩证思维是难点：学生容易形成\"细菌都是坏的\"的片面认识，需要通过大量生活实例（酸奶、面包、酿酒、制药、分解者）来建立全面认识。③发酵、腐败等过程需要时间，课堂上多用图片和已有经验。",
  "mat": "教师：教学课件（微生物图片、发酵食品图片、发霉食物图片）、发霉的面包或水果（提前准备，密封展示）、新鲜面包（对比）、酸奶/馒头/腐乳等发酵食品实物或图片、密封袋、记录单\n\n学生（四人小组）：放大镜1个、观察记录单、（可选）提前几天准备的对比实验材料\n\n【低成本替代】\n发酵食品：酸奶、馒头、面包、米酒、泡菜、腐乳——本地易得，可让学生从家中带来。\n发霉观察：提前3—5天，把一小块面包/馒头分别放在\"干燥密封\"\"潮湿密封\"\"潮湿低温（冰箱）\"三处，课上对比观察霉斑多少。\n图片：可从旧杂志、旧课本上剪取，或教师板画。\n⚠ 发霉物品必须密封观察（用密封袋装好），不要打开闻、不要触摸，观察后立即洗手。",
  "proc": "一、激趣导入（6分钟）\n材料准备：一块新鲜的馒头、一块发霉的馒头（密封）\n\n1.教师出示两块馒头（一块新鲜，一块长满霉斑，霉的那块要密封在袋子里）。\n提问：这两块馒头有什么不同？为什么会变成这样？\n预设1：一块坏了，长毛了。\n预设2：放久了发霉了。\n\n2.追问：让馒头\"长毛\"的元凶是谁？它从哪里来？\n预设：是霉菌，从空气里来的。\n\n3.引入：这些让食物发霉的小东西，和我们前几课看到的微生物是同一类。它们既会让食物坏掉，也能帮我们做出美味的食物。今天我们聊聊——微生物和我们的关系。\n（板书课题：微生物与人类）\n\n二、新课教学（28分钟）\n\n（一）认识身边的微生物（6分钟）\n材料准备：教学课件\n\n1.提问：除了让食物发霉的霉菌，你还知道哪些微生物？\n预设1：细菌。\n预设2：病毒（感冒就是病毒引起的）。\n预设3：酵母菌（妈妈蒸馒头用的）。\n\n2.教师介绍几大类（不深究分类，点到为止）：\n·**细菌**：非常小，到处都是（手上、空气里、肠道里）；\n·**真菌**：霉菌、酵母菌、蘑菇都属于真菌；\n·**病毒**：比细菌还小，必须寄生在活细胞里（如流感病毒）。\n\n3.强调：微生物看不见，但它们无处不在——空气里、水里、土壤里、我们的皮肤上和肠道里，都有大量的微生物。\n\n（二）微生物的\"功\"（10分钟）\n材料准备：酸奶、馒头等实物或图片\n\n1.小组任务：想一想，微生物帮我们做过什么好事？举例子。\n\n2.全班交流，教师梳理并补充：\n\n**① 做出美味的食物（发酵）**\n·酸奶：牛奶 + 乳酸菌 → 酸奶\n·馒头/面包：面粉 + 酵母菌 → 蓬松的馒头（酵母菌产生二氧化碳，把面团\"撑\"出小孔）\n·泡菜、酸菜：蔬菜 + 乳酸菌\n·米酒、葡萄酒：粮食/葡萄 + 酵母菌\n·腐乳、酱油、醋：都是微生物发酵的产物\n\n**② 制作药品**\n·抗生素（如青霉素）来自青霉菌；\n·疫苗利用减毒或灭活的病原微生物，帮我们预防疾病。\n\n**③ 帮助消化**\n·人的肠道里有大量益生菌，帮助我们消化食物、合成维生素。\n\n**④ 分解垃圾（大自然的清洁工）**\n·细菌和真菌把枯枝落叶、动物尸体分解成无机物，回归土壤；\n·没有它们，地球早就被垃圾堆满了；污水处理也用到微生物。\n\n**⑤ 农业生产**\n·根瘤菌帮豆科植物\"固氮\"（天然氮肥）。\n\n3.小活动（可选）：观察酵母粉，闻一闻；或对比馒头切面上的小孔（酵母菌留下的\"杰作\"）。\n\n（三）微生物的\"过\"（6分钟）\n1.提问：微生物也会带来麻烦吗？\n预设1：让食物发霉变质。\n预设2：让人生病（感冒、拉肚子、伤口化脓）。\n预设3：让衣服、墙壁发霉。\n\n2.教师补充：\n·**致病**：流感病毒、肺炎细菌、脚气（真菌）等；\n·**腐败**：食物变质造成浪费，甚至引起食物中毒。\n\n3.研讨：怎样防止食物发霉变质？（结合生活经验）\n预设1：放冰箱（低温，微生物长得慢）。\n预设2：晒干、烘干（没有水，微生物活不了）。\n预设3：真空包装、密封（隔绝空气里的微生物）。\n预设4：加盐腌制、加糖（高盐高糖抑制微生物）。\n预设5：加热煮沸（高温杀死微生物）。\n\n师小结：微生物的生长需要适宜的温度、水分和营养。我们只要破坏其中任何一个条件，就能抑制它们——这就是食物保存的科学原理。\n\n（四）对比实验：馒头发霉（6分钟，可用课前准备的结果）\n1.展示三组馒头（课前准备）：\nA：干燥处密封　B：潮湿处密封　C：冰箱冷藏（潮湿）\n\n2.观察：哪组霉斑最多？哪组最少？\n预设：B（潮湿温暖）最多，C（低温）和A（干燥）少。\n\n3.追问：这说明了什么？\n预设：微生物喜欢温暖、潮湿的环境；低温和干燥能抑制它们。\n\n三、课堂总结（5分钟）\n1.提问：微生物对人类有什么好处？\n预设：做发酵食品、制药、帮助消化、分解垃圾、农业固氮。\n2.提问：有什么坏处？怎样防止？\n预设：致病、使食物腐败；用低温、干燥、密封、高温等方法抑制。\n3.教师提升（辩证看待）：微生物不是\"敌人\"，也不是\"朋友\"——它们只是按照自己的方式生存。我们学会利用有益的一面、防范有害的一面，这才是科学的态度。所以，既不必\"谈菌色变\"，也不能不讲卫生。\n4.布置：回家找一找家里的发酵食品（酸奶、酱油、醋、腐乳等），看看配料表上写着哪些微生物，记录下来。\n\n【★ 安全：发霉物品密封观察，不可打开闻或触摸；观察后立即洗手】",
  "board": "                7. 微生物与人类\n\n    一、微生物在哪里？\n        空气 · 水 · 土壤 · 我们的皮肤和肠道（无处不在）\n\n    二、三大类\n        细菌 · 真菌（霉菌/酵母/蘑菇）· 病毒\n\n    三、★ 功 ★\n        ① 发酵食品：酸奶·馒头·泡菜·米酒·酱油·醋\n        ② 制药：青霉素 · 疫苗\n        ③ 助消化：肠道益生菌\n        ④ 分解者：枯枝落叶→养分（大自然的清洁工）\n        ⑤ 农业：根瘤菌固氮\n\n    四、★ 过 ★\n        致病（流感·肺炎·脚气）· 食物腐败\n\n    五、防止腐败（破坏生长条件）\n        低温（冰箱）· 干燥（晒干）· 密封（真空）\n        高盐高糖（腌制）· 高温（煮沸）\n\n    六、辩证看\n        ★ 不\"谈菌色变\"，也不忽视卫生 ★\n        利用有益的 · 防范有害的",
  "reflect": ""
 },
 "5|工具与技术|2": {
  "goal": "科学观念：\n1.知道杠杆是一种简单机械，有支点、动力点、阻力点三个关键点。\n2.知道当动力臂（支点到动力点的距离）大于阻力臂时，杠杆省力；反之费力。\n3.知道独轮车利用了杠杆原理，是省力的工具。\n\n科学思维：\n1.能通过实验找出杠杆省力的条件，归纳出\"动力臂长就省力\"的规律。\n2.能用杠杆原理解释独轮车为什么省力。\n\n探究实践：\n1.能组装杠杆尺（或简易杠杆）并完成平衡实验。\n2.能通过改变动力点位置，探究省力与费力的条件。\n3.能在独轮车模型上找出支点、动力点、阻力点。\n\n态度责任：\n1.乐于动手实验，体会\"工具背后的科学\"。\n2.小组合作中分工明确、轮流操作。\n3.愿意用学到的原理解释生活中的工具。",
  "key": "通过杠杆平衡实验，认识杠杆的三个关键点和省力条件，理解独轮车省力的秘密。",
  "hard": "①\"支点、动力点、阻力点\"三个概念较抽象，学生容易混淆——需要在实物上一一指认。②\"动力臂大于阻力臂就省力\"这一规律需要多组数据支撑，学生容易被\"哪边挂得多\"的表面现象迷惑。③把杠杆原理迁移到独轮车（实物变形）是难点。",
  "mat": "教师：杠杆尺（或自制杠杆）1套、钩码1盒、铁架台1个、教学课件（杠杆示意图、生活中杠杆图片）、独轮车模型（或图片）1个、记录单\n\n学生（四人小组）：杠杆尺（可用长直尺+支点代替）1套、钩码（或相同重物，如硬币、螺母）若干、支架（可用叠高的书本+铅笔）1个、记录单\n\n【低成本替代】\n杠杆尺：用一根30厘米的塑料直尺（或细木条），中间用橡皮泥固定一个支点，架在铅笔上就是简易杠杆。\n支点：铅笔、圆木棍、叠起的书本边缘。\n重物：相同面值的硬币（最方便且等重）、螺母、小石头、装水的相同小瓶。\n独轮车：可用玩具独轮车，或用课件图片代替；农村学校可观察真实的农用独轮车。\n⚠ 提醒：重物不要挂太多，防止杠杆倾翻。",
  "proc": "一、激趣导入（6分钟）\n材料准备：一根结实的木棍、一块大石头\n\n1.情境：请一位同学上台，直接用手把这块大石头搬起来。（搬不动）\n\n2.再给他一根木棍和一块小石头（做支点）。\n教师示范：把木棍插到石头下面，在小石头上撬——石头动了！\n\n3.提问：为什么垫上一根木棍、一个小石头，就能撬动刚才搬不动的大石头？\n预设1：木棍把力气放大了。\n预设2：因为有那个支点。\n\n4.引入：这根木棍其实变成了一件简单机械——杠杆。今天我们就来揭开它省力的秘密。\n（板书课题：独轮车省力的秘密）\n\n二、新课教学（28分钟）\n\n（一）认识杠杆的三个点（6分钟）\n材料准备：杠杆尺、课件示意图\n\n1.教师对照演示装置介绍：\n·**支点**：杠杆绕着它转动的那个点（像撬石头时的小石头）；\n·**动力点**：我们用力的地方（手按的一端）；\n·**阻力点**：克服阻力的地方（压在石头上的一端）。\n\n2.在示意图上标出三个点，学生在自己的装置上指认。\n\n3.小活动：同桌互相考一考，\"支点在哪里？动力点呢？\"\n\n（二）实验：怎样才省力（12分钟）\n材料准备：每组杠杆尺、钩码、记录单\n\n1.实验装置：把杠杆尺架在支架上，调节平衡（先让杠杆水平静止）。\n\n2.实验一：动力点和阻力点到支点的距离**一样远**\n·左边（阻力点）挂2个钩码；\n·右边（动力点）挂几个才能让杠杆平衡？\n学生尝试 → 预设：也要挂2个。\n提问：两边一样多，说明这是\"不省力也不费力\"。\n\n3.实验二：动力点到支点的距离**更远**\n·左边挂2个钩码，位置靠近支点；\n·右边挂钩码，位置离支点**更远**；\n·需要几个才能平衡？\n学生尝试 → 预设：只要1个就够了。\n提问：用更少的钩码就能撬起2个，这说明什么？——**省力了！**\n\n4.实验三：动力点到支点的距离**更近**\n·右边（动力点）挂得离支点很近，左边（阻力点）离支点远；\n·需要几个？\n预设：要挂3个、4个甚至更多。\n提问：用的钩码比对面还多，这说明什么？——**费力了**。\n\n5.记录数据，全班交流，归纳规律（板书）：\n·动力臂 > 阻力臂 → **省力**\n·动力臂 = 阻力臂 → 不省力也不费力\n·动力臂 < 阻力臂 → **费力**\n\n师小结：杠杆省不省力，关键看**支点到动力点的距离**（动力臂）比**支点到阻力点的距离**（阻力臂）长还是短。\n\n6.追问：费力杠杆是不是就\"没用\"？\n预设：也有用，比如省距离（手移动一点，另一端移动很多）——筷子、镊子就是这样。\n\n（三）独轮车里的杠杆（6分钟）\n材料准备：独轮车模型或图片\n\n1.提问：独轮车上，支点、动力点、阻力点分别在哪里？\n学生讨论，教师引导（配合示意图）：\n·**支点**：车轮的轴（车绕着它转）；\n·**阻力点**：车斗里重物所在的位置；\n·**动力点**：双手握车把的地方。\n\n2.追问：从支点到车把（动力臂）长，还是从支点到车斗（阻力臂）长？\n预设：到车把更长。\n\n3.那独轮车是省力还是费力？\n预设：省力（因为动力臂 > 阻力臂）。\n\n4.教师补充：独轮车能省力，还有一个原因——车轮本身是\"轮轴\"，也能省力。所以它比直接搬运省力得多。\n\n（四）生活中的杠杆（4分钟）\n1.提问：生活中还有哪些工具用到了杠杆？\n预设：撬棍、开瓶器、指甲刀、剪刀、钳子、筷子、镊子、天平、跷跷板、核桃夹……\n\n2.分类小活动：哪些是省力的？哪些是费力的？\n·省力：撬棍、开瓶器、核桃夹、指甲刀（省力但费距离）\n·费力：筷子、镊子、钓鱼竿（费力但省距离、动作更精细）\n\n3.教师提升：省力和省距离往往不能兼得，工程师会根据需要来选择——这也是一种\"权衡\"。\n\n三、课堂总结（5分钟）\n1.提问：杠杆有哪三个关键点？\n预设：支点、动力点、阻力点。\n2.提问：什么时候省力？\n预设：动力臂比阻力臂长的时候。\n3.提问：独轮车为什么省力？\n预设：因为车把到轮轴的距离，比车斗到轮轴的距离长。\n4.布置：回家找一件家里的杠杆类工具，画出它的支点、动力点、阻力点，判断它是省力还是费力。\n\n【整理：钩码清点归位；杠杆尺、支架收纳好】",
  "board": "              2. 独轮车省力的秘密\n\n    一、杠杆三要素\n        支点：杠杆绕着它转动的点\n        动力点：我们用力的地方\n        阻力点：克服阻力的地方\n\n    二、省力条件（实验结论）\n        动力臂 > 阻力臂 → ★ 省力 ★\n        动力臂 = 阻力臂 → 不省力也不费力\n        动力臂 < 阻力臂 → 费力（但省距离）\n\n    三、独轮车\n        支点   = 车轮轴\n        阻力点 = 车斗（重物）\n        动力点 = 车把手\n        ★ 车把到轴 距离 > 车斗到轴 距离 → 省力 ★\n\n    四、生活中的杠杆\n        省力：撬棍 · 开瓶器 · 核桃夹 · 指甲刀\n        费力：筷子 · 镊子 · 钓鱼竿（省距离·更精细）\n        ★ 省力与省距离不可兼得（权衡）★",
  "reflect": ""
 },
 "5|工具与技术|3": {
  "goal": "科学观念：\n1.知道独轮车主要由车斗（货箱）、车架、车轮（轮轴）、车把等部分组成。\n2.知道独轮车综合运用了杠杆原理和轮轴原理，能省力地搬运重物。\n3.知道制作独轮车需要考虑材料、结构、连接方式和承重能力。\n\n科学思维：\n1.能根据杠杆原理，合理设计车把长度和车斗位置，使小车更省力。\n2.能在测试后分析作品的问题（车斗太低、轮子太小、结构不牢），提出改进方案。\n\n探究实践：\n1.能小组合作，按设计制作一辆独轮车模型。\n2.能测试模型的承重能力和省力效果。\n3.能根据测试结果进行改进。\n\n态度责任：\n1.乐于动手，在失败中坚持改进。\n2.小组合理分工，人人都参与。\n3.体会劳动人民的智慧，尊重传统农具的价值。",
  "key": "小组合作制作一辆独轮车模型，在制作中应用杠杆原理，通过测试与改进提高作品性能。",
  "hard": "①模型制作中\"轮轴\"的实现是技术难点——轮子要能灵活转动，轴要固定牢。②车斗位置与车把长度的比例需要调试才能省力明显。③材料强度有限，承重测试时容易散架，需要加固。",
  "mat": "教师：独轮车实物或模型1辆（农用独轮车最佳）、热熔胶枪（教师操作）、剪刀、美工刀、透明胶带、扎带、教学课件、测试用重物（书本、钩码）、坡度板\n\n学生（四人小组）：废旧纸盒（做车斗）1个、塑料瓶盖或旧光盘（做轮子）2个、竹签或一次性筷子（做轴）2根、吸管（做轴套）2段、硬纸板或木条（做车架）若干、细绳、胶带、剪刀、记录单\n\n【低成本替代 —— 乡村学校重点】\n车斗：废旧纸盒、塑料瓶剪开、泡沫盒、竹编小筐（本地材料）。\n轮子：瓶盖、旧光盘、木头切片、厚纸板剪圆（多层粘合更结实）。\n车轴：竹签、一次性筷子、铁丝。\n轴套：吸管、细塑料管（套在轴上，让轮子转动更灵活——关键技术！）。\n车架：硬纸板条、竹片、木条。\n测试重物：书本、石头、装满水的瓶子。\n⚠ 美工刀使用注意安全；热熔胶由教师操作。",
  "proc": "一、明确任务（5分钟）\n材料准备：独轮车实物或图片\n\n1.复习：上节课我们研究了独轮车为什么省力（杠杆原理 + 轮轴）。\n\n2.发布任务：今天我们要**亲手做一辆独轮车模型**，要求：\n①有车斗、车架、车轮、车把；\n②车轮能灵活转动；\n③能承载一定重物（至少能装3本书）；\n④推动时比直接搬运省力。\n\n3.提问：制作前要先想清楚什么？\n预设：用什么材料、各部分多大、怎么连接。\n\n（板书课题：制作独轮车）\n\n二、设计与制作（24分钟）\n\n（一）方案讨论（4分钟）\n1.各组讨论并填写：\n·车斗用什么做？多大？（要能装下3本书）\n·轮子用什么做？多大？（轮子越大越容易越过障碍）\n·车轴怎么做才能转得灵活？（★ 轴套是关键 ★）\n·车把多长？（越长越省力，但要方便推行）\n\n2.教师提示关键技术：\n·**轴套做法**：把一小段吸管固定在车架上，竹签穿过吸管当轴，轮子固定在竹签两端——这样轮子能自由转动，摩擦力小；\n·**车斗位置**：车斗重心要靠近车轮（阻力臂短才省力）；\n·**车把长度**：适当长一些更省力。\n\n（二）动手制作（14分钟）\n材料准备：各组材料、工具\n\n1.学生分组制作，教师巡视提供技术支援：\n·热熔胶粘接（教师操作）；\n·轴套的固定与调整；\n·车架的加固（三角形结构最稳）。\n\n2.教师在各组间引导：\n·\"轮子转得灵活吗？不转的话检查一下轴套。\"\n·\"车斗位置合适吗？太靠前会费力。\"\n·\"结构稳不稳？加固了吗？\"\n\n3.提醒：先做到\"能推、能装\"，再追求美观。\n\n（三）测试与改进（6分钟）\n材料准备：测试重物（书本）、坡度板\n\n1.测试方法：\n①往车斗里放3—5本书，推行一段距离，感受是否省力；\n②试着推上一个小斜坡；\n③检查是否稳固（不散架、不侧翻）。\n\n2.记录问题，研讨改进：\n·轮子不转/卡住 → 轴太紧、轴套没固定好 → 调整轴套，加大间隙\n·推起来费力 → 车斗太靠前、车把太短 → 车斗后移、加长车把\n·不稳固/散架 → 连接不牢、没有加固 → 用胶带/热熔胶加固，加斜撑\n·车斗装不下 → 车斗太小 → 加大车斗或用更结实材料\n\n3.各组改进后再测。\n\n三、展示与总结（9分钟）\n1.各组展示作品，介绍：\n·我们的独轮车有什么特点？\n·制作中遇到什么问题？怎么解决的？\n·还能怎么改进？\n\n2.承重比赛（可选）：看哪组的车能装最多的书并推行1米。\n注意：以\"能完成\"为主，不强调名次，避免损坏作品。\n\n3.多元评价：\n·最省力奖 · 最牢固奖 · 最精美奖 · 最环保奖（废物利用）· 最佳协作奖\n\n4.教师提升：独轮车是中国农村沿用千年的传统农具，它结构简单却非常巧妙——一个轮子、两根车把，就把\"扛\"变成了\"推\"。这就是劳动人民的智慧，也是杠杆原理最朴素的应用。\n\n5.布置：回家观察身边的独轮车、手推车（或超市购物车、行李箱），找一找它们的支点、轮轴在哪里。\n\n【整理：剩余材料回收进材料箱；工具清点归位；废纸塑料分类投放】",
  "board": "                 3. 制作独轮车\n\n    一、任务要求\n        ① 车斗·车架·车轮·车把齐全\n        ② 车轮能灵活转动\n        ③ 能承重（≥3本书）\n        ④ 推行省力\n\n    二、结构\n        车斗（装货）· 车架（支撑）· 车轮+轴（滚动）\n        车把（施力·越长越省力）\n\n    三、★ 关键技术 ★\n        轴套做法：吸管固定在车架上 + 竹签穿过吸管当轴\n                  + 轮子固定在竹签两端 → 转动灵活\n        车斗位置：靠近车轮（阻力臂短 = 省力）\n        加    固：三角形结构最稳\n\n    四、问题诊断\n        轮子不转 → 轴太紧 → 调整轴套\n        推着费力 → 车斗靠前/车把短 → 后移/加长\n        散    架 → 连接不牢 → 加固+斜撑\n\n    五、材料（全废旧）\n        纸盒车斗 · 瓶盖轮子 · 竹签轴 · 吸管轴套 · 纸板车架",
  "reflect": ""
 },
 "5|工具与技术|6": {
  "goal": "科学观念：\n1.知道轮轴是一种简单机械，由\"轮\"（大圆）和\"轴\"（小圆）组成，绕共同的中心转动。\n2.知道在轮上用力可以省力，在轴上用力则费力——轮越大越省力。\n3.知道方向盘、门把手、水龙头、螺丝刀、辘轳等都利用了轮轴原理。\n\n科学思维：\n1.能通过对比\"转动大轮\"与\"转动小轴\"的用力差异，归纳出轮轴省力的规律。\n2.能判断生活中哪些工具是轮轴的应用。\n\n探究实践：\n1.能组装轮轴装置并完成对比实验。\n2.能给小车安装一个\"方向盘\"（轮轴转向装置），并测试其效果。\n3.能规范记录实验数据。\n\n态度责任：\n1.乐于动手制作，体会机械的巧妙。\n2.实验中爱护器材，注意安全（不把手伸进转动部件）。\n3.愿意观察生活中的机械，做个有心人。",
  "key": "通过轮轴实验认识\"在轮上用力省力\"的规律，并动手给小车安装方向盘，体验轮轴的应用。",
  "hard": "①轮轴省力原理（轮半径 > 轴半径）需要抽象理解，学生容易只看到\"轮子大\"而不理解\"半径比\"。②把轮轴原理迁移到\"方向盘控制转向\"这一具体应用时，学生容易混淆\"省力\"与\"改变方向\"两个功能。③给小车安装方向盘涉及转向机构，技术难度较高。",
  "mat": "教师：轮轴演示装置1套（大轮+小轴+绳+钩码）、教学课件（轮轴示意图、方向盘图片）、方向盘实物或图片、小车模型1辆、热熔胶枪（教师操作）\n\n学生（四人小组）：轮轴材料（线轴/胶带芯做轴 + 硬纸板圆盘做轮）1套、细绳、钩码或重物、小车模型（或自制小车）1辆、瓶盖或纸板圆盘（做方向盘）1个、竹签、吸管、胶带、剪刀、记录单\n\n【低成本替代】\n轮轴装置：用线轴（或胶带芯、笔杆）当\"轴\"，把硬纸板剪成圆盘（或用瓶盖、旧光盘）套在外面当\"轮\"，用橡皮泥固定即可。\n方向盘：瓶盖、厚纸板剪圆、旧光盘；中间钻孔固定在竹签上。\n小车：用上一单元做的小车，或纸盒+瓶盖轮子自制。\n⚠ 转向机构较复杂，可只做\"能转动的方向盘\"+\"简单连杆\"，重在体验轮轴，不追求转向精度。",
  "proc": "一、激趣导入（6分钟）\n材料准备：门把手、水龙头图片，或实物\n\n1.教师出示图片：门把手、水龙头、方向盘、螺丝刀。\n提问：这些东西有什么共同点？\n预设1：都要拧/转。\n预设2：都有一个能转的部分。\n\n2.教师演示：拧瓶盖（大的好拧）vs 拧细笔杆（难拧）。\n提问：为什么粗的瓶盖比细笔杆好拧？\n预设：粗的地方手好用力，省力。\n\n3.引入：这些工具都用到一种简单机械——轮轴。今天我们就来研究它，并给小车装一个方向盘。\n（板书课题：给小车安装方向盘）\n\n二、新课教学（28分钟）\n\n（一）认识轮轴（6分钟）\n材料准备：轮轴演示装置\n\n1.教师介绍：\n·**轮**：外面那个大的圆（手转动的部分）；\n·**轴**：中间那根细的圆柱（缠绕绳子、提起重物的部分）；\n·轮和轴固定在一起，绕同一个中心转动。\n\n2.演示：转动大轮，轴上的绳子把重物提起来。\n\n3.提问：轮子做得大一点，提同样的重物会更省力吗？\n学生猜想。\n\n（二）实验：轮轴省力吗（10分钟）\n材料准备：每组轮轴装置、细绳、钩码\n\n1.实验一：在**轴**上用力\n·把绳子缠在细轴上，挂上2个钩码；\n·用手直接转动细轴把钩码提起来；\n·感受：费不费力？\n预设：有点费力，手指要使劲捏。\n\n2.实验二：在**轮**上用力\n·把绳子仍缠在轴上（同样的重物）；\n·这次用手转动外面的大轮，把钩码提起来；\n·感受：和刚才比怎么样？\n预设：轻松多了！\n\n3.实验三：换更大的轮（可选）\n·换一个更大的轮盘，再提同样的重物；\n·感受：更省力了吗？\n预设：更省力了。\n\n4.归纳规律（板书）：\n·在**轮**上用力 → **省力**；\n·在**轴**上用力 → **费力**；\n·**轮越大（轮半径相对轴越大），越省力**。\n\n5.追问：省力的同时，有什么\"代价\"？\n预设：手要转更大的圈（费距离）。\n师：又是\"省力不省距离\"——和杠杆、斜面一样的道理。\n\n（三）生活中的轮轴（4分钟）\n1.提问：生活中哪些地方用到了轮轴？\n预设：方向盘、门把手、水龙头、螺丝刀、钥匙、辘轳（井边打水）、自行车脚踏、卷笔刀手摇柄。\n\n2.判断：它们是\"在轮上用力\"还是\"在轴上用力\"？\n·方向盘、门把手、水龙头、螺丝刀 → 在轮上用力（省力）\n·电风扇叶片、自行车轮（链条带动轴）→ 在轴上用力（目的是转速快/省距离）\n\n（四）动手：给小车装方向盘（8分钟）\n材料准备：每组小车、瓶盖/圆盘、竹签、吸管、胶带\n\n1.任务：给小车安装一个\"方向盘\"，要求：\n①方向盘能自由转动；\n②转动方向盘时，能带动前轮改变方向（能实现最好，实现不了也可只做能转动的方向盘）；\n③结构牢固。\n\n2.教师示范关键做法：\n·用竹签做转向柱（轴），穿过一段吸管（轴套）固定在车身上；\n·竹签上端装瓶盖或圆盘做\"方向盘\"（轮）；\n·竹签下端连接前轮支架（简易连杆）。\n\n3.简化方案（若转向机构太难）：\n只做一个能自由转动的方向盘，重点体验\"轮（方向盘）带轴（转向柱）\"的轮轴结构。\n\n4.学生制作，教师巡视协助（热熔胶由教师操作）。\n\n5.测试：转动方向盘，观察前轮是否跟着动。\n\n6.研讨：\n提问：方向盘为什么要做得比较大？\n预设：因为在轮上用力更省力，转起来轻松。\n提问：方向盘属于轮轴的哪一部分？\n预设：是\"轮\"，中间的转向柱是\"轴\"。\n\n三、课堂总结（5分钟）\n1.提问：轮轴由哪两部分组成？\n预设：轮和轴，绕共同中心转动。\n2.提问：怎样用力才省力？\n预设：在轮上用力；轮越大越省力。\n3.提问：生活中哪些是轮轴？\n预设：方向盘、门把手、水龙头、螺丝刀、辘轳。\n4.教师提升：轮轴、杠杆、斜面，这些简单机械有个共同特点——省力就不省距离。工程师根据需要选择不同的机械，或者把它们组合起来，就造出了复杂的机器。\n5.布置：回家找3件用到轮轴的东西，画出\"轮\"和\"轴\"分别在哪里。\n\n【整理：竹签、吸管回收；小车作品妥善保管，后续课还会用】",
  "board": "                6. 给小车安装方向盘\n\n    一、轮轴的结构\n        轮（外面的大圆）+ 轴（中间细圆柱）\n        固定在一起，绕同一中心转动\n\n    二、省力规律\n        ★ 在【轮】上用力 → 省力\n          在【轴】上用力 → 费力\n          轮越大（相对轴）→ 越省力 ★\n        代价：★ 省力不省距离（手要转更大的圈）★\n\n    三、生活中的轮轴\n        在轮上用力（省力）：\n          方向盘 · 门把手 · 水龙头 · 螺丝刀 · 辘轳 · 钥匙\n        在轴上用力（省距离/求快）：\n          电风扇叶片 · 自行车轮\n\n    四、制作要点\n        转向柱（轴）穿过吸管（轴套）固定在车身\n        上端装圆盘做方向盘（轮）\n        下端连前轮支架\n        ★ 方向盘做大一点 = 转起来更省力 ★",
  "reflect": ""
 },
 "5|工具与技术|7": {
  "goal": "科学观念：\n1.知道工具和技术的发展推动了人类社会的进步（从石器到青铜器、铁器，从手工到机器、智能）。\n2.知道重大的技术发明（如火、轮子、文字、印刷术、蒸汽机、电力、互联网）深刻改变了人类的生活方式。\n3.知道技术的发展也带来新的问题（如环境污染、资源消耗），需要负责任地使用技术。\n\n科学思维：\n1.能通过对比不同时代的生产生活方式，分析技术进步带来的改变。\n2.能辩证地看待技术的影响——既看到便利，也思考代价。\n\n探究实践：\n1.能通过阅读、讨论，梳理工具与技术发展的脉络。\n2.能制作一张\"技术发展时间轴\"或\"工具演变图\"。\n3.能就\"技术带来的问题\"提出自己的思考和建议。\n\n态度责任：\n1.体会人类智慧的伟大，增强民族自豪感（中国古代四大发明）。\n2.认识到技术要合理使用，树立可持续发展的意识。\n3.对未来的技术发展保持好奇与期待。",
  "key": "通过阅读与讨论，了解工具和技术的发展如何推动社会进步，辩证看待技术的影响。",
  "hard": "本课是单元总结课，以阅读讨论为主。难点在于：①跨越几千年的时间跨度，学生难以建立清晰的历史脉络——需要用时间轴辅助；②\"技术是一把双刃剑\"的辩证思考对小学生较抽象，需要具体案例支撑（如塑料的利与弊）。",
  "mat": "教师：教学课件（工具与技术发展史图片、时间轴模板、古代四大发明图片）、大白纸（每组1张）、彩色笔、便利贴\n\n学生（四人小组）：大白纸1张、彩色笔、便利贴若干、记录单\n\n【低成本替代】\n图片：可从旧课本、旧杂志剪取，或教师板画简图。\n时间轴：用长条纸画一条横线，贴上便利贴即可。\n实物：可让学生从家中带来\"老物件\"（如算盘、旧农具、煤油灯），对比现代工具，效果极好。\n⚠ 农村学校优势：可充分利用本地的传统农具（犁、耙、风车、石磨等）作为实物教材。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件（原始生活 vs 现代生活对比图）\n\n1.对比展示：\n·原始人：徒手采集、住山洞、步行；\n·现代人：机械耕种、住楼房、坐高铁飞机。\n\n2.提问：是什么让我们的生活发生了这么大的变化？\n预设：是工具、是技术、是科学。\n\n3.追问：你能举一个例子，说明\"有了某样东西以后，生活就不一样了\"吗？\n预设1：有了手机，能随时联系。\n预设2：有了电灯，晚上也能做事。\n预设3：有了汽车，出远门很快。\n\n4.引入：今天我们就沿着时间的长河，看看工具和技术是怎样一步步改变世界的。\n（板书课题：推动社会发展的工具和技术）\n\n二、新课教学（28分钟）\n\n（一）工具的发展历程（8分钟）\n材料准备：教学课件\n\n1.教师按时间顺序梳理（配合图片）：\n·**石器时代**：用石头做成石斧、石刀——人类第一次有了工具；\n·**青铜器、铁器时代**：金属工具更锋利、更耐用，农业大发展；\n·**古代重要发明**（中国四大发明）：\n  造纸术、印刷术（知识可以大量传播）\n  指南针（远洋航行成为可能）\n  火药（改变了战争与工程）\n·**蒸汽机（18世纪）**：用机器代替人力畜力，工厂出现——工业革命；\n·**电力（19世纪）**：电灯、电话、电动机，人类进入\"电气时代\"；\n·**计算机与互联网（20世纪）**：信息瞬间传递，地球变成\"地球村\"；\n·**人工智能（21世纪）**：机器开始\"学习\"，正在改变各行各业。\n\n2.提问：每一次工具的进步，都带来了什么变化？\n预设：干活更快、更省力；能做的事更多；生活更方便。\n\n（二）小组讨论：一项发明改变了什么（8分钟）\n材料准备：大白纸、便利贴\n\n1.任务：每组选一项发明（轮子、纸张、印刷术、指南针、蒸汽机、电灯、电话、互联网、手机、人工智能），讨论：\n·它出现之前，人们怎么做？\n·它出现之后，生活有什么变化？\n·如果没有它，今天会怎样？\n\n2.各组把讨论结果写在便利贴上，贴到大白纸上。\n\n3.全班交流（每组1—2分钟）。\n\n4.教师追问：轮子的发明为什么这么重要？\n预设：有了轮子才能造车，运输变得容易，人和货物能走很远。\n\n（三）技术是一把双刃剑（8分钟）\n1.提问：技术带来的一定都是好事吗？\n\n2.案例讨论（教师引导）：\n案例一：塑料\n·好处：轻便、便宜、用途广（保鲜膜、输液管、文具）；\n·坏处：几百年不降解，污染土地和海洋，危害动物。\n案例二：汽车、飞机\n·好处：出行快捷；\n·坏处：消耗石油、排放尾气、造成空气污染和温室效应。\n案例三：农药化肥\n·好处：粮食增产，养活更多人；\n·坏处：过量使用污染土壤和水源。\n案例四：手机、网络\n·好处：沟通方便、获取知识；\n·坏处：沉迷游戏、影响视力和学习，信息真假难辨。\n\n3.提问：面对这些问题，我们能做什么？\n预设1：少用一次性塑料，垃圾分类。\n预设2：多走路、骑车、坐公交，绿色出行。\n预设3：节约用电、节约用水。\n预设4：合理使用手机，不沉迷。\n\n师小结：技术本身没有对错，关键在于**我们怎么使用它**。负责任地使用技术，让技术服务于人类和地球，这才是智慧。\n\n（四）展望未来（4分钟）\n1.提问：你希望未来有什么样的新工具、新技术？\n预设：（自由畅想）会飞的汽车、能治百病的药、机器人老师、能净化空气的建筑、去火星的飞船……\n\n2.教师鼓励：这些想法，有些已经有人在研究了。未来的工具和技术，可能就由你们这一代人来创造。\n\n三、单元总结（6分钟）\n1.回顾本单元：我们认识了各种各样的工具，研究了斜面、滑轮、轮轴、杠杆等简单机械，知道了工具能省力、省时、做到徒手做不到的事。\n2.提问：这些简单机械有什么共同点？\n预设：都能省力（或改变方向），但都不省距离；省力与省距离不能兼得。\n3.教师提升：所有的机器，无论多复杂，都是由这些简单机械组合而成的。人类用智慧创造了工具，工具又改变了人类的生活——这就是\"技术与社会\"的故事。\n4.布置：制作一张\"工具与技术发展时间轴\"，贴在教室的科学角。\n\n【整理：大白纸、便利贴作品张贴展示】",
  "board": "          7. 推动社会发展的工具和技术\n\n    一、发展脉络\n        石器 → 青铜器/铁器 → 四大发明\n        → 蒸汽机（工业革命）→ 电力 → 计算机/互联网\n        → 人工智能\n\n    二、中国四大发明\n        造纸术 · 印刷术（知识传播）\n        指南针（远洋航行）· 火药\n\n    三、★ 技术是把双刃剑 ★\n        ┌──────┬────────────┬──────────────┐\n        │      │   好 处      │   问 题        │\n        ├──────┼────────────┼──────────────┤\n        │ 塑料 │ 轻便便宜    │ 难降解·污染海洋│\n        │ 汽车 │ 出行快捷    │ 尾气·温室效应  │\n        │ 农药 │ 粮食增产    │ 污染水土      │\n        │ 网络 │ 沟通·获取知识│ 沉迷·信息真假 │\n        └──────┴────────────┴──────────────┘\n\n    四、我们的行动\n        少用一次性塑料 · 垃圾分类 · 绿色出行\n        节约水电 · 合理使用手机\n\n    五、单元总结\n        简单机械：斜面·滑轮·轮轴·杠杆\n        ★ 都能省力，但都不省距离（省力≠省距离）★\n        复杂机器 = 简单机械的组合",
  "reflect": ""
