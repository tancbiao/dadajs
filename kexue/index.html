 "5|运动和力|2": {
  "goal": "科学观念：\n1.知道重力是由于地球吸引而使物体受到的力，方向竖直向下。\n2.知道利用重物的重力（下落）可以拉动小车前进，重物的重力是小车运动的动力来源。\n3.知道重物越重、下落高度越大，小车被拉动的距离越远。\n\n科学思维：\n1.能根据实验数据，建立\"重物重量→拉力大小→小车运动距离\"的对应关系。\n2.能运用控制变量的方法设计对比实验。\n\n探究实践：\n1.能组装\"重力驱动小车\"装置（绳子跨过滑轮，一端挂重物，一端连小车）。\n2.能通过改变重物数量（或下落高度），探究其对小车运动的影响。\n3.能规范记录数据并分析。\n\n态度责任：\n1.实验中注意安全，防止重物坠落砸伤。\n2.小组分工明确，人人动手。\n3.乐于通过实验验证自己的猜想。\n\n【简化说明】本单元部分内容学生在四年级旧教材中已接触过，按新教材衔接建议，本科可简化处理：重点放在\"控制变量\"与\"数据记录\"上，概念讲解从简。",
  "key": "组装重力驱动小车，通过改变重物重量或下落高度，探究重力作为动力使小车运动的规律。",
  "hard": "①装置组装（绳子、滑轮、重物的连接）是技术难点，绳子容易打滑或脱落。②控制变量：比较重物重量时，下落高度必须相同；比较高度时，重物重量必须相同——学生容易同时改变两个量。③摩擦力会干扰实验结果（小车轮子、桌面），需要在研讨时讨论。",
  "mat": "教师：滑轮（或光滑横杆）1个、细绳、钩码（或重物）1套、小车1辆、桌子、教学课件、记录单\n\n学生（四人小组）：小车1辆（可用上一课拆解后重新组装的小车）、细绳1根、钩码或重物（可用装满水的相同小瓶、石子袋）若干、滑轮或光滑横杆（可用圆木棍、笔杆代替）1个、书本（垫高用）若干、尺子1把、记录单\n\n【低成本替代】\n滑轮：可用圆木棍、粗笔杆、光滑的铁架台横杆代替（跨过绳子即可）。\n重物：装有水的相同小瓶（重量可控）、石子袋、螺母串。\n小车：用纸盒+瓶盖轮子自制，或上一课的玩具车。\n⚠ 安全：重物下方不能站人；重物不要过重，防止绳子断裂或小车失控。",
  "proc": "一、激趣导入（5分钟）\n材料准备：一个重物（钩码或小石头）\n\n1.教师手拿一个重物，松手让它落下。\n提问：重物为什么会往下掉？\n预设：因为地球有引力（重力）。\n\n2.追问：这个\"往下掉\"的力量，能不能被我们利用起来，让它帮我们干活？\n\n预设1：可以拉动东西。\n预设2：水力发电就是利用水往下流。\n\n3.引入：今天我们就用重物的重力，来驱动一辆小车。\n（板书课题：用重力驱动小车）\n\n二、新课教学（28分钟）\n\n（一）组装装置（8分钟）\n材料准备：每组小车、细绳、重物、滑轮、书本\n\n1.教师示范组装：\n①把桌子（或长木板）的一端用书本垫高，形成一个小斜坡；或把滑轮固定在桌边；\n②把细绳一端系在小车上，另一端跨过滑轮（或横杆）后挂上重物；\n③让重物悬挂在空中，松开手，重物下落，小车被拉动前进。\n\n2.学生分组组装，教师巡视协助（重点：绳子的固定、滑轮的位置）。\n\n3.测试：装置能工作吗？小车动了吗？\n\n（二）实验一：重物越重，小车跑得越远吗（10分钟）\n材料准备：每组装置、钩码、尺子\n\n1.提出问题：如果挂更重的物体，小车会跑得更远吗？\n\n2.强调控制变量（★本课重点）：\n·改变的条件：**重物的重量**（1个钩码 → 2个 → 3个）；\n·不变的条件：**下落高度相同**、同一辆小车、同一段路面、同样的释放方式（轻轻松手，不推）。\n\n3.学生实验：分别挂1、2、3个钩码，测量小车前进的距离，记录在表格里。\n\n4.交流：\n提问：得到什么结果？\n预设：挂的钩码越多（重物越重），小车跑得越远。\n\n5.追问：为什么？\n预设：重物越重，拉力越大，小车被拉得越快、越远。\n\n（三）实验二：下落高度越高，小车跑得越远吗（6分钟）\n1.提出问题：如果重物不变，让它从更高的地方落下呢？\n\n2.控制变量：\n·改变的条件：**重物下落的高度**（垫高书本的数量）；\n·不变的条件：**重物重量相同**、同一辆小车、同一段路面。\n\n3.学生实验，记录数据。\n\n4.交流：\n提问：结果怎样？\n预设：高度越高，小车跑得越远。\n\n5.追问：为什么？\n预设：重物下落得越久，拉动小车的时间越长，小车就跑得越远。\n\n（四）研讨（4分钟）\n1.提问：实验中，有没有什么因素在\"捣乱\"？\n预设1：小车轮子不灵活，跑不远。\n预设2：桌面不平。\n预设3：绳子松了。\n预设4：摩擦力——小车和桌面之间有摩擦，会让它停下来。\n\n2.教师引导：对，摩擦力（下一课会研究）会阻碍小车运动。我们做实验时要尽量让其他条件一致，这样才能公平比较。\n\n3.联系生活：重力驱动的例子——\n·水力发电（水从高处流下推动发电机）；\n·打桩机（重锤落下把桩打进地里）；\n·电梯的配重；\n·老式座钟的重锤。\n\n三、课堂总结（5分钟）\n1.提问：重力驱动小车的原理是什么？\n预设：重物下落产生拉力，拉动小车前进。\n2.提问：怎样让小车跑得更远？\n预设：增加重物重量、增加下落高度。\n3.提问：做这个实验最重要的是什么？\n预设：控制变量——每次只改变一个条件。\n4.布置：回家做一个\"重力小车\"的小实验，试试用不同的重物（如装满水的瓶子大小不同）看小车跑多远。\n\n【安全与整理：重物下方的空间清空；钩码清点归位；小车妥善保管】",
  "board": "                2. 用重力驱动小车\n\n    一、装置\n        小车 ──绳── 跨过滑轮 ── 重物（悬挂）\n        重物下落 → 拉动小车前进\n\n    二、实验一（改变重量）\n        ┌──────┬────────┬──────────┐\n        │ 重物  │ 下落高度│ 小车距离   │\n        ├──────┼────────┼──────────┤\n        │ 1个   │  相同   │   近      │\n        │ 2个   │  相同   │   中      │\n        │ 3个   │  相同   │   远      │\n        └──────┴────────┴──────────┘\n        ★ 重物越重 → 拉力越大 → 跑得越远 ★\n\n    三、实验二（改变高度）\n        改变：下落高度     不变：重物重量\n        ★ 高度越高 → 拉动时间越长 → 跑得越远 ★\n\n    四、控制变量（★关键★）\n        每次只改变【一个】条件，其余全部相同\n\n    五、干扰因素\n        轮子不灵活 · 桌面不平 · 绳子松 · ★摩擦力★\n\n    六、生活应用\n        水力发电 · 打桩机 · 电梯配重 · 座钟重锤",
  "reflect": ""
 },
 "5|运动和力|3": {
  "goal": "科学观念：\n1.知道像橡皮筋这样的物体，发生弹性形变后会产生一个要恢复原来形状的力，叫做弹力。\n2.知道被拉长（或压缩）的橡皮筋具有能量，可以驱动小车运动。\n3.知道橡皮筋缠绕的圈数越多、拉伸得越长，储存的能量越大，小车运动得越远。\n\n科学思维：\n1.能根据实验数据，归纳出\"橡皮筋形变程度→弹力→小车运动距离\"的关系。\n2.能运用控制变量的方法设计实验。\n\n探究实践：\n1.能组装\"橡皮筋驱动小车\"（把橡皮筋一端固定在车架上，另一端绕在车轴上）。\n2.能通过改变橡皮筋缠绕圈数，探究其对小车运动的影响。\n3.能规范记录并分析数据。\n\n态度责任：\n1.实验中注意安全，防止橡皮筋弹到眼睛。\n2.小组分工合作，轮流操作。\n3.乐于尝试和改进，体会动手的乐趣。\n\n【简化说明】本单元部分内容学生在四年级旧教材中已接触过，按新教材衔接建议，本课可简化处理：重点放在\"能量转化\"的理解和\"控制变量\"的落实上。",
  "key": "组装橡皮筋驱动小车，通过改变橡皮筋的形变程度（缠绕圈数），探究弹力驱动小车的规律。",
  "hard": "①橡皮筋的安装与缠绕是技术难点——如何让橡皮筋储存能量又能平稳释放，需要多次尝试。②缠绕圈数的计数标准要统一（绕几圈），否则数据不可比。③橡皮筋释放时小车容易打滑或侧翻，需要固定和调试。",
  "mat": "教师：橡皮筋驱动小车（成品或模型）1辆、粗细不同的橡皮筋若干、教学课件、记录单、尺子\n\n学生（四人小组）：小车1辆（纸盒+瓶盖轮自制亦可）、橡皮筋（粗细、长短不同）若干、竹签（做固定轴）1根、透明胶带、剪刀、尺子1把、记录单\n\n【低成本替代】\n橡皮筋：文具橡皮筋、扎头发的皮筋（粗细不同便于对比）。\n小车：纸盒车身 + 瓶盖轮子 + 竹签轴；或用上一课的玩具车改装。\n固定方式：橡皮筋一端用胶带固定在车头，另一端绕过车轴（后轴）后固定。\n⚠ 安全：拉伸橡皮筋时不要对着人（尤其眼睛）；不要拉到极限导致断裂弹伤。",
  "proc": "一、激趣导入（5分钟）\n材料准备：一根橡皮筋、一个小纸团\n\n1.教师拉伸橡皮筋，松手弹射纸团（注意不要对着学生）。\n提问：纸团为什么飞出去了？\n预设：橡皮筋把它弹出去了。\n\n2.追问：橡皮筋被拉长以后，有什么\"想法\"？\n预设：它想缩回去，恢复原来的样子。\n\n3.教师点明：物体发生弹性形变后，会产生一个要恢复原来形状的力，这就是**弹力**。今天我们用弹力来驱动小车。\n（板书课题：用弹力驱动小车）\n\n二、新课教学（28分钟）\n\n（一）组装橡皮筋小车（8分钟）\n材料准备：每组小车、橡皮筋、竹签、胶带\n\n1.教师示范组装（关键步骤）：\n①在后车轴上固定一根短竹签（或用胶带做一个\"挂钩\"）；\n②把橡皮筋的一端固定在车身前部（用胶带粘牢或绑在车头的横梁上）；\n③另一端套在后车轴的挂钩上；\n④转动后轮，让橡皮筋缠绕在车轴上（圈数越多，储存的能量越多）；\n⑤把小车放在地面，松手——橡皮筋恢复原状，带动车轴转动，小车前进。\n\n2.学生分组组装，教师巡视协助（重点：橡皮筋的固定、车轴的缠绕）。\n\n3.测试：小车能动吗？\n\n4.常见问题处理：\n·橡皮筋打滑 → 在车轴上缠一圈胶带增加摩擦；\n·小车原地打转 → 调整橡皮筋的方向，使其沿车身纵向施力；\n·橡皮筋脱落 → 固定端要绑紧。\n\n（二）实验：缠绕圈数与小车距离（10分钟）\n材料准备：每组装置、尺子、记录单\n\n1.提出问题：橡皮筋绕的圈数越多，小车会跑得越远吗？\n\n2.控制变量（★重点）：\n·改变的条件：**橡皮筋缠绕的圈数**（5圈 → 10圈 → 15圈）；\n·不变的条件：**同一根橡皮筋**、同一辆小车、同样的地面、同样的释放方式（轻轻放手，不推）。\n\n3.学生实验：分别绕5、10、15圈，测量小车行驶的距离，记录。\n\n4.交流：\n提问：结果怎样？\n预设：绕的圈数越多，小车跑得越远。\n\n5.追问：为什么圈数多就跑得远？\n预设：绕得越多，橡皮筋被拉伸得越长（形变越大），储存的能量越多，释放时产生的弹力越大、持续时间越长，小车就跑得越远。\n\n教师补充（能量视角）：拉长的橡皮筋里\"存\"着能量，松手时这些能量转化成小车的动能——这就是**能量的转化**。\n\n（三）拓展：换用不同的橡皮筋（6分钟）\n1.提问：换一根更粗（或更细）的橡皮筋，效果一样吗？\n\n2.学生尝试（控制圈数相同，只换橡皮筋）。\n预设：粗橡皮筋弹力更大，小车跑得更远（但可能更难绕）。\n\n3.交流发现，教师引导：不同的橡皮筋，弹力大小不同，这也是设计时需要考虑的因素。\n\n（四）研讨（4分钟）\n1.提问：实验中遇到什么困难？怎么解决的？\n预设：橡皮筋打滑、小车跑偏、圈数数不清……\n\n2.提问：要让小车跑得更远，可以怎么做？\n预设1：多绕几圈。\n预设2：换更粗的橡皮筋。\n预设3：让小车更轻。\n预设4：减少摩擦（轮轴加润滑油、让轮子更灵活）。\n\n3.联系生活：弹力驱动的例子——\n·弹弓、发条玩具、弹跳杆、蹦床、弓箭、弹簧门、圆珠笔的弹簧。\n\n三、课堂总结（5分钟）\n1.提问：什么是弹力？\n预设：物体发生弹性形变后，要恢复原状而产生的力。\n2.提问：怎样让橡皮筋小车跑得更远？\n预设：多绕几圈（增大形变）、换更粗的橡皮筋、减轻车身、减小摩擦。\n3.提问：能量是怎么转化的？\n预设：橡皮筋的弹性势能 → 小车的动能。\n4.布置：回家改装你的小车，试试用两根橡皮筋（并联或串联），看看能不能跑得更远。\n\n【安全与整理：橡皮筋不要对着人拉伸；清点回收；小车妥善保管，后续制作\"月球小车\"时还会用】",
  "board": "                3. 用弹力驱动小车\n\n    一、弹力\n        物体发生【弹性形变】后，要恢复原状而产生的力\n\n    二、装置组装\n        橡皮筋一端固定在车头\n        另一端套在后车轴的挂钩上\n        ★ 转动后轮 → 橡皮筋缠绕在轴上 → 松手 → 小车前进 ★\n\n    三、实验（改变缠绕圈数）\n        ┌──────┬────────┬──────────┐\n        │ 圈数  │ 橡皮筋  │ 小车距离   │\n        ├──────┼────────┼──────────┤\n        │  5 圈 │  同一根 │   近      │\n        │ 10 圈 │  同一根 │   中      │\n        │ 15 圈 │  同一根 │   远      │\n        └──────┴────────┴──────────┘\n        ★ 圈数越多 → 形变越大 → 储能越多 → 跑得越远 ★\n\n    四、控制变量\n        改变：缠绕圈数\n        不变：同一根橡皮筋 · 同一小车 · 同一地面 · 轻放不推\n\n    五、疑难处理\n        打滑 → 轴上缠胶带增摩擦\n        跑偏 → 调整橡皮筋方向（沿车身纵向）\n        脱落 → 固定端绑紧\n\n    六、能量转化\n        ★ 弹性势能 → 动能 ★\n        生活：弹弓 · 发条玩具 · 弓箭 · 蹦床 · 弹簧门",
  "reflect": ""
 },
 "5|运动和力|5": {
  "goal": "科学观念：\n1.知道一个物体在另一个物体表面运动时，接触面会产生摩擦力，摩擦力会阻碍物体的运动。\n2.知道摩擦力的大小与接触面的粗糙程度、物体的重量（压力）等因素有关：接触面越粗糙、物体越重，摩擦力越大。\n3.知道摩擦力有时是有益的（走路、刹车、握东西），有时是有害的（磨损、耗能），需要增大或减小它。\n\n科学思维：\n1.能根据弹簧测力计的读数，比较不同条件下摩擦力的大小。\n2.能运用控制变量的方法设计对比实验。\n\n探究实践：\n1.能用弹簧测力计测量物体在不同接触面上运动时的摩擦力。\n2.能通过改变接触面（桌面/毛巾/砂纸）或物体重量，探究影响摩擦力大小的因素。\n3.能规范记录数据并得出结论。\n\n态度责任：\n1.实验中匀速拉动，如实读数。\n2.小组分工明确，人人动手。\n3.认识到科学知识能解决实际问题（增大或减小摩擦）。\n\n【简化说明】学生四年级旧教材中已接触过摩擦力的初步概念，本课按新教材衔接建议简化处理：重点放在\"用测力计定量比较\"和\"控制变量\"上，概念讲授从简。",
  "key": "用弹簧测力计测量不同条件下摩擦力的大小，探究接触面粗糙程度和物体重量对摩擦力的影响。",
  "hard": "①匀速拉动是操作难点——学生往往拉动速度不均，导致读数跳动。需要在物体被拉动后、匀速运动过程中读数。②控制变量：比较接触面时要保持物体重量不变；比较重量时要保持接触面不变。③摩擦力有\"静摩擦\"与\"滑动摩擦\"之分，小学阶段只做初步体验，不深究。",
  "mat": "教师：弹簧测力计（5N）1个、木块（带挂钩）1个、长木板1块、毛巾1块、砂纸1张、钩码1套、教学课件、记录单\n\n学生（四人小组）：弹簧测力计（5N）1个、木块（或装重物的小纸盒，带挂钩）1个、长木板（或桌面）1块、不同粗糙程度的材料（毛巾、砂纸、棉布、塑料布）各1块、钩码（或相同重物）若干、记录单\n\n【低成本替代】\n测力计：橡皮筋自制测力计（挂已知重量标定刻度）；或用\"拉动难易程度\"做定性比较。\n木块：用装沙/装石子的纸盒、肥皂盒、砖块（打磨光滑面）代替，重要的是底面要平整。\n接触面材料：毛巾、砂纸、棉布、报纸、塑料薄膜——随手可得。\n⚠ 匀速拉动是关键，可先在桌面上练习几次再正式测量。",
  "proc": "一、激趣导入（5分钟）\n材料准备：教学课件（滑冰 vs 在水泥地上跑步的对比）\n\n1.提问：为什么在冰面上走路容易滑倒，在水泥地上却不会？\n预设：冰面太滑了，没有\"抓地力\"。\n\n2.追问：如果在水泥地上推一个很重的箱子，为什么推起来很费劲？\n预设：箱子和地面之间有摩擦，阻碍它动。\n\n3.引入：这种阻碍物体运动的力，叫做**摩擦力**。它的大小跟什么有关？今天我们就来量一量。\n（板书课题：摩擦力的比较）\n\n二、新课教学（28分钟）\n\n（一）感受摩擦力（4分钟）\n1.活动：把手掌平放在桌面上，用力往前推。\n提问：有什么感觉？\n预设：手心发热、有阻碍、推起来费劲。\n\n2.再把手掌放在光滑的塑料封面上推一推，比较。\n预设：在光滑的面上更轻松。\n\n3.教师点明：两个物体接触并发生相对运动时，接触面会产生一种阻碍运动的力，叫**摩擦力**。\n\n（二）学习测量摩擦力（6分钟）\n材料准备：测力计、木块\n\n1.教师示范：\n·用测力计水平拉动木块，让它**匀速**前进；\n·在匀速运动的过程中读数，这个读数就等于摩擦力的大小。\n\n2.强调（易错点）：\n·必须**匀速**拉动（太快太慢读数都不准）；\n·测力计要水平，不能斜着拉；\n·读数时视线与刻度齐平；\n·多测几次取稳定的值。\n\n3.学生练习测量木块在桌面上的摩擦力。\n\n（三）实验一：接触面粗糙程度的影响（10分钟）\n材料准备：每组测力计、木块、不同材料\n\n1.提出问题：在光滑的桌面和粗糙的毛巾上拉同一个木块，摩擦力一样吗？\n\n2.控制变量（★重点）：\n·改变的条件：**接触面的粗糙程度**（桌面 → 棉布 → 毛巾 → 砂纸）；\n·不变的条件：**同一个木块（重量不变）**、同样的拉动方式（匀速）。\n\n3.学生分组测量，记录数据。\n\n4.交流：\n提问：在哪种面上摩擦力最大？哪种最小？\n预设：砂纸上最大，桌面上最小。\n\n5.得出结论：\n**接触面越粗糙，摩擦力越大；接触面越光滑，摩擦力越小。**\n\n（四）实验二：物体重量的影响（8分钟）\n材料准备：每组测力计、木块、钩码\n\n1.提出问题：同一个接触面上，木块越重，摩擦力越大吗？\n\n2.控制变量：\n·改变的条件：**木块的重量**（不加钩码 → 加1个 → 加2个）；\n·不变的条件：**同一个接触面**（都在桌面上）、同样的拉动方式。\n\n3.学生测量并记录。\n\n4.交流：\n提问：结果怎样？\n预设：木块越重，摩擦力越大。\n\n5.得出结论：\n**物体越重（对接触面的压力越大），摩擦力越大。**\n\n6.教师补充（不深究）：摩擦力的大小主要与\"接触面的粗糙程度\"和\"压力大小\"有关，与接触面积的大小关系不大（这一点学生常误以为\"面积越大摩擦越大\"）。\n\n三、研讨与应用（6分钟）\n1.提问：摩擦力一定是有害的吗？\n预设：不一定，有时候很有用。\n\n2.分类讨论：\n**有益的摩擦（要增大）：**\n·走路（鞋底与地面的摩擦，否则寸步难行）；\n·汽车轮胎与地面（花纹就是为了增大摩擦）；\n·刹车（刹车片与轮毂的摩擦）；\n·握笔、拿东西（手与物体的摩擦）；\n·火柴划燃、鞋带打结。\n\n**有害的摩擦（要减小）：**\n·机器零件磨损（加润滑油、用滚珠轴承）；\n·拉重物费力（装轮子，用滚动代替滑动）；\n·滑雪、滑冰（减小摩擦滑得更快）；\n·生锈的门轴（加润滑油）。\n\n3.提问：怎样增大摩擦？怎样减小摩擦？\n预设：\n·增大：使接触面更粗糙（防滑垫、轮胎花纹）、增大压力；\n·减小：使接触面更光滑（加润滑油、打蜡）、用滚动代替滑动（装轮子、滚珠）、气垫/磁悬浮（隔离接触面）。\n\n4.小实验（可选）：在桌面上推一本书 vs 把书放在几支圆铅笔上推，比较省力程度（滚动比滑动省力）。\n\n四、课堂总结（4分钟）\n1.提问：摩擦力的大小与什么有关？\n预设：与接触面的粗糙程度、物体的重量有关。\n2.提问：怎样增大/减小摩擦？\n预设：增大——加粗糙、加压；减小——加润滑、用滚动代替滑动。\n3.教师提升：摩擦力既不是\"坏蛋\"也不是\"功臣\"。科学研究的意义，就是弄清楚它的规律，然后在该大的地方让它大，该小的地方让它小。\n4.布置：回家找3个\"增大摩擦\"和3个\"减小摩擦\"的例子，记录下来。\n\n【整理：测力计归零平放收纳；钩码、材料归位】",
  "board": "                  5. 摩擦力的比较\n\n    一、什么是摩擦力\n        两物体接触并相对运动时，接触面产生的【阻碍运动】的力\n\n    二、测量方法\n        测力计水平拉 → ★匀速前进时读数★\n        （匀速是关键 · 视线齐平 · 多测几次）\n\n    三、实验一（改变粗糙程度）\n        同一木块（重量不变）\n        桌面 < 棉布 < 毛巾 < 砂纸\n        ★ 越粗糙 → 摩擦力越大 ★\n\n    四、实验二（改变重量）\n        同一接触面\n        木块 < 木块+1钩码 < 木块+2钩码\n        ★ 越重（压力越大）→ 摩擦力越大 ★\n\n    五、控制变量\n        实验一改变\"接触面\"，实验二改变\"重量\"，其余不变\n\n    六、★ 有益 vs 有害 ★\n        增大：鞋底花纹·轮胎花纹·刹车·防滑垫·握笔\n        减小：润滑油·滚珠轴承·装轮子（滚动代替滑动）·打蜡\n\n    七、方法\n        增大摩擦：变粗糙 · 加压\n        减小摩擦：变光滑 · 加润滑 · ★滚动代替滑动★",
  "reflect": ""
 },
 "5|地球表面的变化|4": {
  "goal": "科学观念：\n1.知道岩石广泛分布在地球表面，是构成地壳的主要物质。\n2.知道不同的岩石在颜色、颗粒大小、硬度、有无层理、是否遇酸冒泡等方面存在差异。\n3.知道我们可以借助放大镜、小刀、稀盐酸等工具观察和辨别岩石的特征。\n\n科学思维：\n1.能通过有序观察，找出不同岩石的特征差异。\n2.能根据观察到的特征，对岩石进行简单的分类。\n\n探究实践：\n1.能规范使用放大镜、小刀、滴管等工具观察岩石。\n2.能从颜色、颗粒、硬度、层理、遇酸反应等方面观察并记录岩石特征。\n3.能对采集的岩石进行简单分类。\n\n态度责任：\n1.对身边的石头产生探究兴趣，体会\"处处皆科学\"。\n2.实验中注意安全（小刀、稀盐酸的正确使用）。\n3.愿意走进自然，观察家乡的岩石。",
  "key": "运用多种方法观察岩石的特征（颜色、颗粒、硬度、层理、遇酸反应），学习辨别和描述不同的岩石。",
  "hard": "①\"颗粒\"\"层理\"等特征需要借助放大镜才能看清，学生观察能力有限——需要教师示范并给足时间。②用稀盐酸检验是化学方法，学生对\"冒泡\"的原理不易理解（碳酸盐遇酸反应），只需观察现象即可。③岩石样本采集与准备是前提，农村学校可充分利用本地石头资源（这是优势）。",
  "mat": "教师：常见岩石标本（花岗岩、砂岩、石灰岩、大理岩、页岩等）各1块、放大镜1个、小刀1把、稀盐酸（稀释，教师保管）1瓶、滴管、铜钥匙、教学课件、记录单、白瓷板（划痕用）\n\n学生（四人小组）：从本地采集的岩石标本3—5块（提前布置）、放大镜1个、铜钥匙1把、小刀（教师保管分发）1把、滴管1支、稀释稀盐酸（教师统一管理）、白瓷板或瓷砖片1块、记录单\n\n【低成本替代 —— 乡村学校优势】\n岩石：发动学生从村头、河滩、山脚、田埂采集不同石头（本地喀斯特地区石灰岩极多）；教师可提前采几块有代表性的。\n工具：放大镜可用手机微距；小刀可用美工刀（教师保管）；白瓷板可用白色瓷砖碎片、白色碗底。\n稀盐酸：可用醋代替（石灰岩遇醋冒泡较慢，需耐心观察，但安全得多）。\n⚠ 安全：稀盐酸有腐蚀性，由教师统一滴取，学生不可自行取用；如沾到皮肤立即用清水冲洗；小刀用后即收回。",
  "proc": "一、激趣导入（6分钟）\n材料准备：几块不同颜色的石头\n\n1.教师出示几块不同的石头（颜色、颗粒明显不同）。\n提问：这些石头一样吗？它们有什么不同？\n\n预设1：颜色不一样，有灰的、有红的。\n预设2：有的光滑，有的粗糙。\n预设3：有的上面有小点点（颗粒）。\n\n2.追问：除了颜色，我们还能从哪些方面观察石头？\n\n3.引入：石头在科学上叫**岩石**。今天我们就当一回\"岩石侦探\"，用各种办法找出它们的不同。\n（板书课题：地球表面的岩石）\n\n二、新课教学（28分钟）\n\n（一）观察岩石的方法（6分钟）\n材料准备：放大镜、铜钥匙、小刀、瓷砖、稀盐酸\n\n1.教师逐一介绍观察\"工具箱\"：\n·**放大镜**：看颗粒的大小、形状；\n·**铜钥匙**：划一划，看硬度（能被钥匙划出痕迹的比较软）；\n·**小刀**：再划一划（能被小刀划动的更软）；\n·**白瓷板（瓷砖）**：在上面划，看留下的\"条痕\"颜色；\n·**稀盐酸**：滴一滴，看是否冒泡（含碳酸盐的岩石会冒泡）。\n\n2.观察顺序（教师板书）：\n①看颜色（是什么颜色？均匀吗？）\n②看颗粒（用放大镜：颗粒大还是小？能看清一粒粒吗？）\n③测硬度（用钥匙、小刀划：划得出痕迹吗？）\n④看层理（有没有一层一层的条纹？）\n⑤滴盐酸（冒泡吗？）\n\n3.强调：观察要有顺序，边观察边记录。\n\n（二）分组观察（14分钟）\n材料准备：每组岩石标本、工具、记录单\n\n1.学生分组观察本地采集的岩石，每项特征记录在表格里。\n\n2.教师巡视指导：\n·帮助使用放大镜找颗粒；\n·示范用钥匙、小刀划痕（注意安全）；\n·由教师统一滴稀盐酸，学生观察是否冒泡。\n\n3.安全提醒：\n·稀盐酸由教师滴取，学生不接触瓶口；\n·小刀用后立刻平放，不挥舞；\n·岩石不要用力敲击、不要砸。\n\n（三）交流发现（8分钟）\n1.各组汇报观察到的岩石特征。\n\n2.教师引导认识几种常见岩石（配合课件图片）：\n·**花岗岩**：颗粒较粗，能看到黑色（云母）、白色（石英）、肉红色（长石）的颗粒，很硬，常有斑点——常用于建筑外墙、台面；\n·**砂岩**：摸起来有沙粒感，颗粒较明显，有的能看到一层层的层理；\n·**石灰岩**：灰色或青灰色，比较致密，**滴稀盐酸会冒泡**（这是它最显著的特征）；我们天等这一带（喀斯特地区）最多的就是石灰岩；\n·**大理岩**：常有美丽的花纹，比较硬，也会冒泡（由石灰岩变质而来），常用作装饰石材；\n·**页岩**：有明显的薄层状（像书页一样一层层），比较软，容易裂成一片片。\n\n3.提问：为什么石灰岩滴盐酸会冒泡？\n教师简单说明（不深究）：石灰岩里含有碳酸盐，遇到酸会发生反应，产生二氧化碳气体，所以我们看到气泡。这是辨别石灰岩的好办法。\n\n4.联系乡土（★本地特色）：\n提问：我们天等的山上、河边，最常见的是什么岩石？\n预设：石灰岩（青灰色的石头）。\n教师补充：我们这里属于**喀斯特地貌**，石灰岩非常多。石灰岩容易被水溶蚀，所以形成了很多溶洞、地下河，也造就了我们这里\"山青、水秀、洞奇\"的独特风景。\n\n三、课堂总结（5分钟）\n1.提问：观察岩石可以从哪些方面入手？\n预设：颜色、颗粒、硬度、层理、遇酸是否冒泡。\n2.提问：哪种岩石遇到稀盐酸会冒泡？\n预设：石灰岩（和大理岩）。\n3.教师提升：石头看似普通，却记录着地球的故事——它的颗粒、层理、成分，都在告诉我们它是怎么形成的。下一课我们将研究岩石的类别与变化。\n4.布置：在家附近再采集2—3块不同的岩石，用今天学的方法观察记录，下节课带来交流。\n\n【安全与整理：稀盐酸由教师收回；小刀清点归位；岩石标本洗净晾干，放进班级\"岩石标本盒\"】",
  "board": "                4. 地球表面的岩石\n\n    一、观察五步法\n        ① 看颜色（均匀吗？）\n        ② 看颗粒（放大镜：大/小 · 能看清吗）\n        ③ 测硬度（钥匙划 → 小刀划）\n        ④ 看层理（有一层层的条纹吗）\n        ⑤ 滴盐酸（★冒泡吗★）\n\n    二、常见岩石特征\n        ┌──────┬────────────┬──────┬──────┐\n        │ 岩石  │   特征       │ 硬度 │ 冒泡 │\n        ├──────┼────────────┼──────┼──────┤\n        │花岗岩│ 颗粒粗·黑/白/肉红│ 很硬 │  否  │\n        │砂 岩│ 有沙粒感·可见层理│ 较硬 │  否  │\n        │石灰岩│ 青灰色·致密   │ 较软 │ ★是★ │\n        │大理岩│ 有花纹·美观   │  硬  │ ★是★ │\n        │页 岩│ 薄层状·像书页  │  软  │  否  │\n        └──────┴────────────┴──────┴──────┘\n\n    三、为什么冒泡？\n        碳酸盐 + 酸 → 二氧化碳气体（气泡）\n\n    四、★ 乡土：天等 = 喀斯特地貌 ★\n        石灰岩极多 → 易被水溶蚀\n        → 溶洞 · 地下河 · \"山青水秀洞奇\"\n\n    ⚠ 安全：盐酸由教师滴取 · 小刀用后即收",
  "reflect": ""
 },
 "5|地球表面的变化|5": {
  "goal": "科学观念：\n1.知道岩石可以按成因分为岩浆岩（火成岩）、沉积岩、变质岩三大类。\n2.知道岩石在温度、水、大气、生物等作用下会发生风化，变成碎屑和土壤。\n3.知道岩石与土壤之间可以相互转化，岩石的风化是土壤形成的基础。\n\n科学思维：\n1.能根据岩石的特征，推测其可能的成因（哪一类）。\n2.能通过模拟实验（如加热—浸冷的模拟风化），推理温度变化对岩石的破坏作用。\n\n探究实践：\n1.能观察并比较不同类别岩石的特征，尝试分类。\n2.能完成\"岩石风化\"的模拟实验（加热岩石后迅速浸冷水）。\n3.能观察土壤的组成，找出其中的岩石碎屑。\n\n态度责任：\n1.认识到岩石的变化是缓慢的，需要长期观察——培养耐心和坚持。\n2.意识到土壤来之不易，树立保护土壤的意识。\n3.对大自然的\"鬼斧神工\"产生敬畏。",
  "key": "认识岩石的三大类别及其成因，通过模拟实验认识风化作用，理解岩石与土壤的转化关系。",
  "hard": "①\"岩浆岩、沉积岩、变质岩\"三大类的成因涉及地质过程（岩浆冷却、沉积压实、高温高压变质），学生难以想象——需要借助图片和类比。②风化是一个极其缓慢的过程，模拟实验（加热—骤冷）是加速模拟，学生需要理解\"模拟\"与\"真实\"的区别。③岩石→土壤的转化需要长时间，课堂上只能观察结果。",
  "mat": "教师：三大类岩石标本（花岗岩—岩浆岩、砂岩/石灰岩—沉积岩、大理岩/片岩—变质岩）各1块、酒精灯（教师操作）1套、镊子、冷水杯、护目镜、教学课件、土壤样本1份、放大镜、记录单\n\n学生（四人小组）：岩石标本（各类）若干、酒精灯（教师统一操作）1套、小石块（质地较脆的，如页岩、砂岩）2—3块、镊子1把、冷水杯（或水槽）1个、护目镜（可选）、放大镜1个、土壤样本1小杯、白纸1张、记录单\n\n【低成本替代】\n岩石标本：本地采集即可（石灰岩—沉积岩；若有花岗岩—岩浆岩更好）。\n酒精灯：可用蜡烛代替（加热效果略差但安全易得），由教师操作。\n土壤样本：从校园花坛、田间取一杯即可。\n观察工具：放大镜、白纸（便于观察颗粒）。\n⚠ 安全：加热实验必须由教师操作或全程监督；石块加热后极烫，用镊子夹取，不可用手碰；浸冷水时可能有石块爆裂，保持距离并戴护目镜。",
  "proc": "一、激趣导入（6分钟）\n材料准备：一块完整的岩石、一杯土壤\n\n1.教师左手拿一块坚硬的岩石，右手拿一杯土壤。\n提问：这两样东西看起来毫不相干，它们之间有关系吗？\n\n预设1：没关系，一个是石头一个是土。\n预设2：有关系，土是石头变的！（少数学生能想到）\n\n2.追问：坚硬的石头，怎么会变成松软的泥土呢？需要多久？\n\n3.引入：今天我们就来研究岩石的\"身世\"和它的\"变化\"。\n（板书课题：岩石的类别与变化）\n\n二、新课教学（28分钟）\n\n（一）岩石的三大类（10分钟）\n材料准备：各类岩石标本、教学课件\n\n1.教师讲述（配合课件示意图和标本）：\n**① 岩浆岩（火成岩）**\n·成因：地下岩浆（熔化的岩石）上升、冷却凝固形成；\n·特点：常有明显的矿物颗粒，质地坚硬；\n·代表：**花岗岩**（还有玄武岩）。\n·类比：像\"豆浆冷却成豆腐\"——熔化变冷后重新凝固。\n\n**② 沉积岩**\n·成因：岩石风化后的碎屑、泥沙，被水或风搬运，一层层沉积，经过漫长的时间被压实、胶结而成；\n·特点：常有一层一层的**层理**，有的能找到化石；\n·代表：**砂岩、石灰岩、页岩**。\n·类比：像\"一本一页页叠起来的书\"。\n\n**③ 变质岩**\n·成因：已有的岩石（岩浆岩或沉积岩），在地壳深处受到高温、高压作用，发生\"变质\"而形成；\n·特点：常有片理（条纹状、片状构造）、结晶较粗、常有花纹；\n·代表：**大理岩**（由石灰岩变质而来）、**片岩、板岩**。\n·类比：像\"面团被反复揉压后变了性质\"。\n\n2.小活动：每组领到几块岩石，观察特征，判断它们可能属于哪一类，并说明理由。\n\n3.交流，教师点评（不要求百分百准确，重在观察与推理）。\n\n（二）模拟实验：岩石的风化（10分钟）\n材料准备：酒精灯、小石块、镊子、冷水、护目镜\n\n1.教师提出问题：坚硬的岩石会\"变\"吗？什么力量能让它破碎？\n\n2.介绍风化：在温度、水、大气、生物等长期作用下，岩石发生破碎、分解的过程，叫**风化**。\n\n3.演示实验（★教师操作为主，学生分组时全程监督）：\n①用镊子夹住一小块较脆的岩石（如页岩、砂岩）；\n②在酒精灯（或蜡烛）上加热1—2分钟（让它变热）；\n③迅速把它浸入冷水中（骤冷）；\n④反复几次，观察石块的变化。\n\n4.观察：\n提问：石块怎么了？\n预设1：裂开了！\n预设2：掉下了一些小碎屑。\n预设3：有的直接碎成了几块。\n\n5.追问（关键研讨）：为什么一冷一热，石头就裂了？\n引导：岩石受热膨胀、遇冷收缩，一胀一缩反复进行，内部结构就被\"拉\"裂了。\n\n6.教师说明模拟与真实的区别：\n·我们的实验是\"加速版\"——在几分钟内模拟了自然界中昼夜温差、四季交替长期反复作用的效果；\n·真实的自然风化，往往需要几十年、几百年甚至更久。\n\n7.补充其他风化因素（配合课件）：\n·**水**：雨水冲刷、水结冰膨胀撑裂岩石（冰劈作用）；\n·**植物**：树根长进岩石缝隙，把岩石撑开；\n·**生物**：地衣、苔藓分泌酸性物质腐蚀岩石；\n·**大气**：氧气、二氧化碳与水共同作用，使岩石发生化学分解。\n\n（三）岩石变成了什么（8分钟）\n材料准备：土壤样本、放大镜、白纸\n\n1.任务：观察一杯土壤，找一找里面有什么。\n\n2.学生用放大镜观察，把土壤摊在白纸上，挑出里面的颗粒。\n\n3.交流：\n提问：土壤里有什么？\n预设1：有黑色腐烂的叶子。\n预设2：有小石子、沙子。\n预设3：有细小的土。\n预设4：有小虫子（如蚯蚓、蚂蚁）。\n\n4.教师讲解土壤的组成：\n·矿物质颗粒：**岩石风化形成的碎屑**（沙、粉砂、黏土）——这是土壤的\"骨架\"；\n·腐殖质：动植物残体腐烂后形成的黑色物质——提供养分；\n·水、空气：存在于土壤颗粒间的空隙里；\n·生物：蚯蚓、蚂蚁、细菌等。\n\n5.追问：土壤是怎么来的？\n预设：岩石风化变成碎屑，加上动植物腐烂的物质，形成了土壤。\n\n6.情感提升：形成1厘米厚的土壤，大约需要几百年的时间。土壤来之不易，我们要珍惜、保护它（不乱扔垃圾、不乱倒废液、植树护土）。\n\n三、课堂总结（5分钟）\n1.提问：岩石按成因分哪三大类？\n预设：岩浆岩、沉积岩、变质岩。\n2.提问：什么是风化？有哪些因素会造成风化？\n预设：岩石在温度、水、大气、生物作用下破碎分解；温度冷热变化、水结冰、植物根、生物腐蚀。\n3.提问：土壤和岩石有什么关系？\n预设：岩石风化形成土壤的矿物质骨架。\n4.教师提升：我们脚下的土地，曾是坚硬的山岩。大自然用漫长的时间，一点一点把它变成了孕育生命的土壤。\n5.布置：在学校或家附近找一块裸露的岩石，观察它有没有裂缝、有没有长苔藓、有没有被树根撑开，记录下来。\n\n【安全与整理：酒精灯/蜡烛由教师熄灭；加热后的石块冷却后再处理；土壤倒在指定处，洗手】",
  "board": "              5. 岩石的类别与变化\n\n    一、三大类岩石\n        ┌────────┬─────────────┬────────┐\n        │  类别   │   成因        │  代表   │\n        ├────────┼─────────────┼────────┤\n        │岩浆岩  │ 岩浆冷却凝固   │ 花岗岩 │\n        │沉积岩  │ 碎屑沉积压实   │砂岩·石灰岩│\n        │变质岩  │ 高温高压变质   │ 大理岩 │\n        └────────┴─────────────┴────────┘\n        记忆：冷→岩浆岩 · 压→沉积岩 · 变→变质岩\n\n    二、★ 风化（模拟实验）★\n        加热 → 浸入冷水（反复）→ 石块裂开\n        原理：★ 热胀冷缩 → 反复胀缩 → 结构被拉裂 ★\n        模拟：几分钟 ≈ 自然界几十年甚至更久\n\n    三、其他风化因素\n        水冲刷 · 水结冰膨胀 · 植物根撑裂\n        地衣苔藓腐蚀 · 大气化学分解\n\n    四、土壤的组成\n        矿物质（★岩石风化的碎屑★）· 腐殖质\n        水 · 空气 · 生物\n\n    五、★ 形成 1 厘米土壤 ≈ 几百年 ★\n        → 珍惜土壤 · 植树护土\n\n    ⚠ 安全：加热由教师操作 · 石块烫不可碰",
  "reflect": ""
 },
 "5|地球表面的变化|6": {
  "goal": "科学观念：\n1.知道流水是改变地表的重要外力，能侵蚀、搬运和沉积泥沙，形成沟谷、河谷、平原、三角洲等地貌。\n2.知道水流速度越快、水量越大，侵蚀和搬运能力越强。\n3.知道植被能减缓水流对地表的侵蚀，起到保持水土的作用。\n\n科学思维：\n1.能通过模拟实验，把\"漫长缓慢的自然过程\"转化为\"短时间内可见的现象\"。\n2.能分析模拟实验与真实自然之间的对应关系（哪里像、哪里不像）。\n\n探究实践：\n1.能完成\"水流对地表的侵蚀\"模拟实验（沙土堆 + 喷水/倒水）。\n2.能通过改变水量、坡度、有无植被等条件进行对比实验。\n3.能画出实验前后的地表变化并描述。\n\n态度责任：\n1.认识到人类活动（如滥砍滥伐）会加剧水土流失，树立环保意识。\n2.愿意参与植树护土、保护环境的行动。\n3.体会\"保护植被=保护土地\"的科学道理。",
  "key": "通过模拟实验认识流水对地表的侵蚀、搬运和沉积作用，理解植被保持水土的重要性。",
  "hard": "①模拟实验的变量控制（水量、坡度、植被）较难，学生容易同时改变多个条件。②把\"几分钟的模拟\"与\"成千上万年的自然过程\"建立联系，需要充分的引导和想象。③\"侵蚀—搬运—沉积\"三个过程在实验中同时发生，学生不易区分观察。",
  "mat": "教师：大型模拟实验装置1套（长水槽/塑料槽、沙土、水、喷壶）、教学课件（河流、峡谷、三角洲图片与视频）、记录单\n\n学生（四人小组）：长方形塑料槽（或大塑料盒、托盘）1个、沙土（提前准备，可掺少量黏土增加黏性）1盆、喷壶（或去掉盖的矿泉水瓶扎孔）1个、水1瓶、小石子若干、草皮或碎草（模拟植被）1小把、书本（垫高用）若干、记录单\n\n【低成本替代】\n水槽：用大号塑料整理箱、泡沫箱（铺塑料布）、或直接在水泥地上堆沙土（室外效果更好，但要注意卫生）。\n沙土：工地沙 + 少量黄土/黏土（增加可塑性，便于观察沟谷）。\n喷水：矿泉水瓶盖扎几个小孔，装水后挤压即可（简易喷壶）；或用杯子缓慢倒水。\n植被：从校园拔一小把草（连根带土）、或用苔藓、碎草屑。\n⚠ 建议：条件允许可在室外水泥地上做，效果直观且便于清理；室内需在槽下铺报纸/塑料布。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件（峡谷、河流、三角洲图片）\n\n1.展示图片：深深的峡谷、弯弯的河道、入海口的三角洲。\n提问：这些地形是怎么形成的？是什么力量\"雕刻\"了大地的模样？\n预设1：是水冲出来的。\n预设2：是河流长期冲刷形成的。\n\n2.追问：水真的有这么大的力量吗？今天我们就用实验来\"亲眼看看\"。\n（板书课题：水对地表的作用）\n\n二、新课教学（28分钟）\n\n（一）模拟实验一：水流侵蚀地表（10分钟）\n材料准备：每组水槽、沙土、喷壶、水、书本\n\n1.装置搭建：\n①在塑料槽里堆起一层沙土（约3—5厘米厚），整平；\n②用书本把槽的一端垫高，形成一个小斜坡；\n③在坡顶准备\"降水\"（用喷壶喷水，或缓慢倒水）。\n\n2.实验步骤：\n①先观察并记录沙土堆的初始样子（可画图）；\n②用喷壶在坡顶均匀喷水（模拟降雨），持续1—2分钟；\n③观察沙土的变化：水往哪流？沙土怎么了？\n\n3.学生分组实验，教师巡视（提醒：水不要太多，避免溢出；注意观察水流的路径）。\n\n4.交流：\n提问：喷水后，沙土堆发生了什么变化？\n预设1：沙土被冲出了一条条小沟。\n预设2：沙子被水冲到下面去了，堆在了坡底。\n预设3：水变浑浊了（里面有泥沙）。\n\n5.教师点明三个过程（板书）：\n·**侵蚀**：水流把地表的泥沙\"啃\"下来（形成沟谷）；\n·**搬运**：水流带着泥沙一起流走（水变浑）；\n·**沉积**：水流变慢时，泥沙停下来堆积（坡底形成\"冲积堆\"）。\n\n师小结：流水就像一把刻刀，不停地侵蚀、搬运、沉积，塑造着地表的模样。\n\n（二）模拟实验二：什么影响侵蚀的强弱（10分钟）\n材料准备：同实验一，另备草皮、小石子\n\n1.提出问题：怎样才能让水流\"刻\"得更厉害？怎样能保护地表？\n\n2.对比实验（每组选做2组，或全班分工做不同组再做交流）：\n\n**对比一：水量大小**\n·控制不变：同样的坡度、同样的沙土；\n·改变：一次用小水量，一次用大水量；\n·观察：哪种冲出的沟更深？\n预设：水量大，侵蚀更厉害。\n\n**对比二：坡度大小**\n·控制不变：同样的水量、同样的沙土；\n·改变：一次坡度小（垫1本书），一次坡度大（垫3本书）；\n·观察：哪种侵蚀更厉害？\n预设：坡度大（水流急），侵蚀更厉害。\n\n**对比三：有无植被（★最重要）**\n·控制不变：同样的水量、同样的坡度；\n·改变：一半沙土上铺草皮（模拟有植被），一半裸露；\n·观察：哪边被冲走的沙土多？\n预设：裸露的一边被冲得厉害，有草的一边基本保住了。\n\n3.交流研讨：\n提问：为什么有草的沙土不容易被冲走？\n预设1：草挡住了水。\n预设2：草的根把土\"抓住\"了。\n教师补充：植被能减小水流速度，草根像网一样把土壤固定住——这就是**保持水土**。\n\n4.结论（板书）：\n·水流量越大 → 侵蚀越强；\n·坡度越大（水流越急）→ 侵蚀越强；\n·★ 有植被覆盖 → 侵蚀明显减弱 ★\n\n（三）研讨：模拟与真实（4分钟）\n1.提问：我们的实验和真实的自然界，哪里像？哪里不像？\n预设：\n·像：都是水冲走泥沙，都形成沟谷，都在低处沉积。\n·不像：我们只用了几分钟，真实的峡谷需要几百万年；我们的\"河流\"很小，真实的大江大河大得多；我们没有岩石，只有沙土。\n\n2.教师说明：模拟实验能帮我们理解\"发生了什么、为什么\"，但不能完全等同于真实。这是模拟实验的价值与局限。\n\n（四）联系生活与环保（4分钟）\n1.提问：生活中你见过水土流失吗？\n预设：下大雨后，田里的泥被冲到路上；山坡上出现沟壑；河水变黄。\n\n2.展示图片（可选）：黄土高原的沟壑、泥石流、河水泛滥。\n\n3.讨论：怎样减少水土流失？\n预设1：植树造林、种草（★最有效的方法★）。\n预设2：修梯田（减缓坡度）。\n预设3：修挡土墙、建水库。\n预设4：不乱砍滥伐。\n\n4.情感提升：我们天等是喀斯特山区，山多坡陡，一旦植被被破坏，雨水很容易把薄薄的土壤冲走，而且很难恢复。所以我们更要爱护山上的一草一木。\n\n三、课堂总结（5分钟）\n1.提问：流水对地表有哪些作用？\n预设：侵蚀、搬运、沉积。\n2.提问：什么情况下侵蚀更厉害？\n预设：水量大、坡度陡、没有植被。\n3.提问：怎样保护土地？\n预设：植树种草、修梯田、不乱砍滥伐。\n4.布置：回家观察下雨后，小区或村里的水流把泥沙冲到了哪里，画一画\"水的路径\"。\n\n【整理：剩余沙土倒入指定容器；水槽清洗；室外实验注意清扫干净】",
  "board": "                6. 水对地表的作用\n\n    一、流水的三个作用\n        ★ 侵蚀（啃下泥沙·形成沟谷）\n        → 搬运（带着泥沙流走·水变浑）\n        → 沉积（流速变慢·泥沙堆积）★\n\n    二、对比实验（控制变量）\n        ┌────────┬──────────┬──────────┐\n        │  条件   │   结果     │   结论    │\n        ├────────┼──────────┼──────────┤\n        │ 水量大  │ 沟更深    │ 水量大→侵蚀强│\n        │ 坡度大  │ 冲得更狠  │ 坡陡→侵蚀强 │\n        │ 有植被  │ 沙土保住了│★植被保水土★│\n        └────────┴──────────┴──────────┘\n\n    三、植被为什么能保水土？\n        茎叶减缓流速 · ★根系像网抓住土壤★\n\n    四、模拟 vs 真实\n        像：都冲出沟谷 · 都在低处沉积\n        不像：几分钟 vs 几百万年 · 沙土 vs 岩石\n\n    五、保护土地\n        ★ 植树种草（最有效）★ · 修梯田 · 不乱砍滥伐\n        天等喀斯特山区：山陡土薄，破坏后极难恢复",

 "5|地球表面的变化|7": {
  "goal": "科学观念：\n1.知道风也是改变地表的重要外力，能吹走（侵蚀）和堆积（沉积）沙尘。\n2.知道风速越大、地表越干燥松散、缺少植被时，风的侵蚀作用越明显。\n3.知道风力作用会形成风蚀地貌（如风蚀蘑菇、雅丹）和风积地貌（如沙丘、黄土高原）。\n\n科学思维：\n1.能通过模拟实验，观察风力对沙土的搬运与堆积作用。\n2.能对比流水与风力作用的异同，归纳外力作用的共同特点。\n\n探究实践：\n1.能完成\"风对沙土的搬运与堆积\"模拟实验（用扇子或吹风机吹沙）。\n2.能通过改变风力大小、地表状况（干燥/湿润、有无植被或障碍物）进行对比。\n3.能画出实验前后的地表变化。\n\n态度责任：\n1.认识到植树造林、防风固沙的重要性。\n2.关注沙尘暴等环境问题，树立环保意识。\n3.乐于通过实验探究自然现象。",
  "key": "通过模拟实验认识风对地表的侵蚀、搬运和沉积作用，了解风力地貌的形成及防风固沙的方法。",
  "hard": "①风的作用在实验中不如水直观（沙粒小、飘散快），课堂组织与卫生是难点。②\"风力沉积形成沙丘、黄土高原\"涉及长时间大尺度的过程，需要借助图片视频帮助想象。③风蚀与风积往往同时发生，学生不易区分。",
  "mat": "教师：模拟实验装置1套（浅盘、细沙、吹风机或扇子）、教学课件（风蚀蘑菇、雅丹地貌、沙丘、黄土高原图片视频）、防风林图片、记录单\n\n学生（四人小组）：浅盘（或大纸盒、托盘）1个、干燥细沙1小盆、扇子1把（或吹风机，教师统一管理）、小石子/积木（做障碍物）若干、喷壶（湿润沙土用）1个、碎草屑或棉絮（模拟植被）少许、记录单\n\n【低成本替代】\n风源：扇子（最安全易得）、打气筒（可用打气球的气吹）、或直接吹气（近距离吹沙）；吹风机效果最好但需教师统一管理（注意用电安全，用冷风档）。\n细沙：河沙晒干、建筑用沙过筛；也可用面粉、小米代替（更安全卫生，但效果略差）。\n障碍物：小石子、积木、橡皮、书本立起来。\n⚠ 卫生与安全：实验时提醒学生不要对着人吹，不要扬起沙尘迷眼；建议室外或通风处进行；结束后洗手、清扫。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件（沙漠、沙丘、风蚀蘑菇图片）\n\n1.展示图片：一望无际的沙漠、月牙形的沙丘、上大下小的\"风蚀蘑菇\"。\n提问：这些奇特的地貌是怎么形成的？在沙漠里，很少下雨，那是什么力量在\"雕刻\"大地？\n预设：是风。\n\n2.追问：风看不见摸不着，它真能搬动沙子、改变地形吗？\n\n3.引入：今天我们就用实验，把风的力量\"显形\"。\n（板书课题：风对地表的作用）\n\n二、新课教学（28分钟）\n\n（一）模拟实验一：风搬动了沙子（10分钟）\n材料准备：每组浅盘、细沙、扇子\n\n1.装置：在浅盘里铺一层干燥的细沙（约1—2厘米厚），整平。\n\n2.实验：\n①用扇子轻轻扇风，观察沙子；\n②再用大力扇风（或用吹风机），观察沙子。\n\n3.安全提醒：不要对着同学扇；不要扬起沙尘迷眼；不要吸进去。\n\n4.交流：\n提问：沙子怎么了？\n预设1：沙子被吹起来了，飘走了。\n预设2：风大的时候，沙子飞得更远。\n预设3：沙子被吹到了盘子的另一边，堆成了一小堆。\n\n5.教师点明（板书）：\n·**侵蚀（吹蚀）**：风把松散的沙粒吹起来、带走；\n·**搬运**：风带着沙粒移动；\n·**沉积**：风力减弱时，沙粒落下来堆积（形成沙堆）。\n\n6.追问：被吹走的沙粒去哪了？最后堆在哪里？\n预设：堆在了盘子边缘、或者障碍物后面。\n\n（二）模拟实验二：什么影响风的作用（10分钟）\n1.提出问题：怎样才能减小风对地表的破坏？\n\n2.对比实验（分组选做或分工）：\n\n**对比一：风力大小**\n·同样干燥的沙，一次轻扇、一次猛扇；\n·观察：哪种搬走的沙多？\n预设：风大，搬走的多。\n\n**对比二：干燥 vs 湿润**\n·一半沙喷水湿润，一半保持干燥，同样力度扇风；\n·观察：哪边被吹走的沙多？\n预设：干燥的沙被吹走得多，湿润的沙\"抱团\"不易被吹动。\n\n**对比三：有无障碍物/植被（★最重要）**\n·在沙面上放几块小石子或立起书本（模拟挡风墙/防风林），或在部分沙面上撒碎草屑；\n·同样力度扇风；\n·观察：障碍物后面、有草的地方，沙子怎样？\n预设：障碍物后面沙子堆积得多，被吹走的少；有草的地方沙子不容易被吹走。\n\n3.交流研讨：\n提问：障碍物和植被为什么能防风？\n预设1：挡住了风，风就变小了。\n预设2：草根把沙子抓住了。\n师：风被削弱后，搬运能力下降，沙粒就沉积下来——这也是\"防风固沙\"的原理。\n\n4.结论（板书）：\n·风力越大 → 侵蚀搬运越强；\n·地表干燥松散、缺少植被 → 更容易被风侵蚀；\n·★ 有植被、障碍物 → 能削减风力、固定沙土 ★\n\n（三）风力地貌与沙尘暴（5分钟）\n材料准备：教学课件\n\n1.介绍风力形成的地貌：\n·**风蚀地貌**：风蚀蘑菇（上大下小，因近地面风沙多、磨蚀强）、雅丹地貌（风蚀土墩与沟槽）、风蚀城堡；\n·**风积地貌**：沙丘（月牙形，会随风缓慢移动）、沙垄；\n·**黄土高原**：科学家认为，黄土高原的黄土主要是风力从远方搬运堆积形成的（风成说）。\n\n2.讨论沙尘暴：\n提问：什么是沙尘暴？它是怎么形成的？\n预设：大风把地面的沙尘吹起来，天空变黄，空气很脏。\n教师补充：沙尘暴的形成与气候干旱、植被稀少、地表松散、大风天气都有关系。\n\n3.提问：怎样减少沙尘暴？\n预设：植树造林、种草（防风固沙）、退耕还林还草、保护草地、建防护林（如\"三北防护林\"）。\n\n（四）对比：水与风（3分钟）\n1.提问：水的作用和风的作用，有什么相同和不同？\n预设：\n·相同：都能侵蚀、搬运、沉积，都能改变地表；都是\"外力作用\"。\n·不同：水往低处流，形成沟谷、河谷；风可以往各个方向吹，形成沙丘、风蚀地貌；水的作用更连续，风的作用更间歇（有风才有）。\n\n2.教师提升：火山、地震是来自地球**内部**的力量（内力），流水、风是来自地球**外部**的力量（外力）。地球表面，就是这两种力量共同\"塑造\"的结果。\n\n三、课堂总结（5分钟）\n1.提问：风对地表有哪些作用？\n预设：吹蚀（侵蚀）、搬运、沉积。\n2.提问：怎样防风固沙？\n预设：植树种草、建防护林、保持地表湿润、设置挡风墙。\n3.提问：火山地震与流水风的作用，有什么不同？\n预设：前者来自地球内部（内力），后者来自地球外部（外力）。\n4.布置：查一查\"三北防护林\"的资料，了解我国防风固沙的伟大工程，下节课分享。\n\n【卫生与整理：细沙回收装袋；清扫桌面地面；实验后洗手】",
  "board": "                7. 风对地表的作用\n\n    一、风的三个作用\n        ★ 吹蚀（吹走松散沙粒）\n        → 搬运（带着沙粒移动）\n        → 沉积（风力减弱·沙粒堆积）★\n\n    二、对比实验\n        ┌──────────┬──────────┬────────────┐\n        │   条件    │   结果     │   结论      │\n        ├──────────┼──────────┼────────────┤\n        │ 风力大    │ 沙飞得远  │ 风大→作用强 │\n        │ 干燥沙    │ 易被吹走  │ 干燥松散→易蚀│\n        │ 有障碍/植被│ 沙被挡住  │★防风固沙★  │\n        └──────────┴──────────┴────────────┘\n\n    三、风力地貌\n        风蚀：风蚀蘑菇（上大下小）· 雅丹 · 风蚀城堡\n        风积：沙丘（月牙形·会移动）· 黄土高原（风成说）\n\n    四、沙尘暴\n        干旱 + 植被少 + 地表松散 + 大风\n        防治：★植树种草·建防护林★（三北防护林）\n\n    五、★ 内力 vs 外力 ★\n        内力（地球内部）：火山 · 地震（隆起·断裂）\n        外力（地球外部）：流水 · 风 · 冰川（侵蚀·搬运·沉积）\n        → 地表 = 两种力量共同塑造",

  if(!S.rewards || !S.rewards.length) S.rewards = JSON.parse(JSON.stringify(SCI_REWARDS));

  if(!S.sciClass) S.sciClass = '';

  if(!S.sciPicks) S.sciPicks = [];

  if(!S.sciTab) S.sciTab = 'rank';
  if(!S.profile) S.profile = {};
  if(!S.profile.school) S.profile.school = '天等县城西小学';
  if(!S.profile.teacher) S.profile.teacher = '谭政';


  sciSeedLessons();
}



/* 教案种子填充：SEED_VER 变化时重新补齐空缺字段，绝不覆盖教师已写的内容 */
function sciSeedLessons(){
  const SEED_VER = 2;
  if(typeof SCI_LESSON_SEED==='undefined') return;
  const old = (typeof S.lesSeedVer==='number') ? S.lesSeedVer : (S.lesSeeded ? 1 : 0);
  if(old >= SEED_VER) return;
  Object.keys(SCI_LESSON_SEED).forEach(function(k){
    const src = SCI_LESSON_SEED[k];
    if(!S.les[k]) S.les[k] = {st:'done', c:{}};
    if(!S.les[k].c) S.les[k].c = {};
    Object.keys(src).forEach(function(f){
      if(!S.les[k].c[f]) S.les[k].c[f] = src[f];
    });
  });
  S.lesSeedVer = SEED_VER;
  save();
}
function sciKey(g,u,n){ return g+'|'+u+'|'+n; }

function sciRec(k){ return S.les[k] || {st:'todo', c:{}}; }

function sciState(k){ const r=S.les[k]; return (r && r.st) ? r.st : 'todo'; }

window.sciExportLes = function(){

  let txt = '科学教案进度表\n导出时间：' + new Date().toLocaleString('zh-CN') + '\n\n';

  ['4','5'].forEach(function(g){

    let tot=0, dn=0;

    txt += (g==='4'?'【四年级上册】':'【五年级上册】') + '\n';

    SCI_UNITS.forEach(function(u){

      if(u.g!==g) return;

      txt += '\n' + u.u2 + '\n';

      u.items.forEach(function(it){

        tot++;

        const st = sciState(sciKey(g,u.u,it.n));

        if(st==='done') dn++;

        txt += '  ' + it.n + '  ' + it.t + '  （' + it.k + '）[' + it.p + '级] ' + SCI_ST[st] + '\n';

      });

    });

    txt += '  小计：' + dn + ' / ' + tot + ' 已完成\n\n';

  });

  try{

    const b = new Blob([txt], {type:'text/plain;charset=utf-8'});

    const a = document.createElement('a');

    if(window.URL && URL.createObjectURL) a.href = URL.createObjectURL(b);

    else a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(txt);

    a.download = '教案进度_' + todayISO() + '.txt';

    document.body.appendChild(a); a.click(); document.body.removeChild(a);

    setTimeout(function(){ try{URL.revokeObjectURL(a.href)}catch(e){} }, 1500);

    toast('📄 进度表已导出');

  }catch(e){ toast('导出失败，请检查下载权限'); }

};



/* ---------- 5. 学生积分：包装原函数 ---------- */

function sciClassList(){

  S.students.forEach(function(s){ const g=(s.group||'').trim()||'未分组'; m[g]=1; });

  (S.classes||[]).forEach(function(c){ m[c.name]=1; });

  return Object.keys(m);

}

function sciStuOf(cls){ return S.students.filter(function(s){ return ((s.group||'').trim()||'未分组')===cls; }); }

window.sciTag = function(sid,tid){

  const s = S.students.filter(function(x){return x.id===sid})[0];

  const t = S.scoreTags.filter(function(x){return x.id===tid})[0];

  if(!s||!t) return;

  s.score = (s.score||0) + t.s;

  save(); closeModal();

  toast(s.name + ' ' + (t.s>0?'+':'') + t.s + ' 分 · ' + t.l);

window.sciCustom = function(sid){

  const d = parseInt(document.getElementById('sciD').value,10);

  if(isNaN(d) || d===0){ toast('请输入非 0 分值'); return; }

  const r = (document.getElementById('sciR').value||'').trim();

  const s = S.students.filter(function(x){return x.id===sid})[0];

  if(!s) return;

  s.score = (s.score||0) + d;

  S.scoreLogs.push({id:uid(), ts:Date.now(), sid:sid, delta:d, reason:r||'自定义'});

  save(); closeModal(); toast(s.name + ' ' + (d>0?'+':'') + d + ' 分');

};

      && list.some(function(s){return s.id===l.sid}); }).length;

  const tm = S.scoreLogs.filter(function(l){ return String(l.ts).slice(0,10)===td && l.delta<0

      && list.some(function(s){return s.id===l.sid}); }).length;



  let h = '<div class="cat-chips" style="margin-bottom:10px">'

    + clsList.map(function(c){

        return '<button class="chip'+(c===cls?' on':'')+'" onclick="sciPickClass(\''+escapeHtml(c)+'\')">'+escapeHtml(c)+' · '+sciStuOf(c).length+'</button>';}).join('')

    + '</div>'

    + '<div class="rstat" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">'

    + '<div class="s" style="flex:1;min-width:76px;text-align:center;background:#fff;border-radius:12px;padding:8px"><b>'+list.length+'</b><span>本班人数</span></div>'

    + '<div class="s" style="flex:1;min-width:76px;text-align:center;background:#fff;border-radius:12px;padding:8px"><b>'+tp+'</b><span>今日表扬</span></div>'

    + '<div class="s" style="flex:1;min-width:76px;text-align:center;background:#fff;border-radius:12px;padding:8px"><b>'+tm+'</b><span>今日提醒</span></div>'

    + '<div class="s" style="flex:1;min-width:76px;text-align:center;background:#fff;border-radius:12px;padding:8px"><b>'+(S.sciPicks||[]).length+'</b><span>已勾选</span></div></div>'

    + '<div class="row" style="margin-bottom:12px;gap:6px">'

    + '<button class="btn xs b-lav" onclick="sciImportCls()">📥 导入名单到班级</button>'

    + '<button class="btn xs b-cream" onclick="sciPickAll()">'+(list.length&&(S.sciPicks||[]).length===list.length?'取消全选':'全选本班')+'</button>'

    + '<button class="btn xs b-mint" onclick="sciBatch()">⭐ 批量加分</button>'

    + '<button class="btn xs b-blue" onclick="sciPraise()">🏆 表扬名单</button>'

    + '<button class="btn xs b-ghost" onclick="sciManageCls()">⚙️ 班级管理</button></div>';



  const tab = S.sciTab || 'rank';

  h += '<div class="tabs" style="margin-bottom:10px">'

    + '<button class="tab'+(tab==='rank'?' on':'')+'" onclick="sciSetTab(\'rank\')">🏅 排行榜</button>'

    + '<button class="tab'+(tab==='reward'?' on':'')+'" onclick="sciSetTab(\'reward\')">🎁 奖励兑换</button>'

    + '<button class="tab'+(tab==='log'?' on':'')+'" onclick="sciSetTab(\'log\')">📜 积分记录</button></div>';



  if(!list.length){

    h += '<div class="empty"><span class="pic">🐰</span>本班还没有学生</div>';

  } else if(tab==='rank'){

    const sorted = list.slice().sort(function(a,b){ return (b.score||0)-(a.score||0); }).slice(0,12);

    h += sorted.map(function(s,i){

      const nc = i===0?'n1':(i===1?'n2':(i===2?'n3':''));

      return '<div class="sci-rank"><div class="sci-rk '+nc+'">'+(i+1)+'</div>'

        + '<div class="sci-nm">'+escapeHtml(s.name)+'</div>'

        + '<div class="sci-sc">'+(s.score||0)+'</div></div>';

    }).join('');

  } else if(tab==='reward'){

    const sorted = list.slice().sort(function(a,b){ return (b.score||0)-(a.score||0); });

    h += '<label style="font-size:.78rem;color:var(--ink-l);font-weight:700">选择学生</label>'

      + '<select class="inp" id="sciRwStu" onchange="sciDrawRw()" style="margin:4px 0 10px">'

      + sorted.map(function(s){ return '<option value="'+s.id+'">'+escapeHtml(s.name)+'（'+(s.score||0)+' 分）</option>';}).join('')

      + '</select><div id="sciRwBox"></div>';

  } else {

    const ls = S.scoreLogs.filter(function(l){ return list.some(function(s){return s.id===l.sid}); })

      .sort(function(a,b){ return b.ts-a.ts; }).slice(0,40);

    if(!ls.length) h += '<div class="empty"><span class="tip">暂无积分记录</span></div>';

    else h += ls.map(function(l){

      const s = S.students.filter(function(x){return x.id===l.sid})[0];

      const col = l.delta>0 ? '#2F6B4F' : '#B03030';

      return '<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed #EFE7F0;font-size:.82rem">'

        + '<b style="color:'+col+';min-width:34px;text-align:right">'+(l.delta>0?'+':'')+l.delta+'</b>'

        + '<span style="flex:1"><b>'+escapeHtml(s?s.name:'已删除')+'</b> <span style="color:var(--ink-l)">'+escapeHtml(l.reason||'')+'</span></span>'

        + '<span style="color:var(--ink-l);font-size:.72rem">'+fmtDate(l.ts)+'</span>'

        + '<button class="btn xs b-ghost" onclick="sciUndo(\''+l.id+'\')">撤销</button></div>';

    }).join('');

  }

  box.innerHTML = h;

  if(tab==='reward') sciDrawRw();

};

window.sciDrawRw = function(){

  const sel = document.getElementById('sciRwStu'), box = document.getElementById('sciRwBox');

  if(!sel || !box) return;

  const s = S.students.filter(function(x){return x.id===sel.value})[0];

  if(!s) return;

  box.innerHTML = S.rewards.map(function(r){

    const ok = (s.score||0) >= r.c;

    return '<div class="sci-rw'+(ok?'':' off')+'" style="margin-bottom:8px">'

      + '<div style="display:flex;align-items:center;gap:8px">'

      + '<b style="font-size:.86rem;flex:1">'+escapeHtml(r.n)+'</b>'

      + '<span style="font-weight:800;color:#B8860B;font-size:.86rem">'+r.c+' 分</span>'

      + '<button class="btn xs '+(ok?'b-mint':'b-ghost')+'"'+(ok?'':' disabled')+' onclick="sciRedeem(\''+s.id+'\',\''+r.id+'\')">兑换</button></div>'

      + '<div style="font-size:.74rem;color:var(--ink-l)">'+escapeHtml(r.d||'')+'</div></div>';

  }).join('');

};

window.sciRedeem = function(sid,rid){

  const s = S.students.filter(function(x){return x.id===sid})[0];

  const r = S.rewards.filter(function(x){return x.id===rid})[0];

  if(!s||!r) return;

  if((s.score||0) < r.c){ toast('积分不足'); return; }

  if(!confirm('给「'+s.name+'」兑换「'+r.n+'」，扣除 '+r.c+' 分？')) return;

  s.score = (s.score||0) - r.c;

  S.redeems.push({id:uid(), ts:Date.now(), sid:sid, rid:rid, name:r.n, cost:r.c});

  save(); toast('🎁 '+s.name+' 兑换了「'+r.n+'」');

  drawStuGrid(); sciDrawPanel();

};

window.sciUndo = function(id){

  const l = S.scoreLogs.filter(function(x){return x.id===id})[0];

  if(!l) return;

  const s = S.students.filter(function(x){return x.id===l.sid})[0];

  if(!confirm('撤销这条记录？')) return;

  if(s) s.score = (s.score||0) - l.delta;

  S.scoreLogs = S.scoreLogs.filter(function(x){return x.id!==id});

  save(); toast('已撤销'); drawStuGrid(); sciDrawPanel();

};

window.sciSetTab = function(t){ S.sciTab=t; save(); sciDrawPanel(); };

window.sciPickClass = function(c){ S.sciClass=c; S.sciPicks=[]; save(); sciDrawPanel(); };

window.sciPickAll = function(){

  const list = sciStuOf(S.sciClass);

  const all = list.length && (S.sciPicks||[]).length===list.length;

  S.sciPicks = all ? [] : list.map(function(s){return s.id});

  save(); sciDrawPanel();

  toast(all ? '已取消全选' : '已全选 ' + list.length + ' 人');

};

window.sciBatch = function(){

  const ids = (S.sciPicks||[]).slice();

  if(!ids.length){ toast('请先在上方「全选本班」，或从学生卡片勾选'); return; }

  let body = '<p style="font-size:.82rem;color:var(--ink-l);margin:0 0 10px">已选 '+ids.length+' 人：'

    + ids.map(function(i){ const s=S.students.filter(function(x){return x.id===i})[0]; return escapeHtml(s?s.name:'?'); }).join('、') + '</p>'

    + '<div class="cat-chips" style="margin-bottom:12px">';

  S.scoreTags.forEach(function(t){

    body += '<button class="chip" onclick="sciDoBatch(\''+t.id+'\')">'+escapeHtml(t.l)+' '+(t.s>0?'+':'')+t.s+'</button>';});

  body += '</div><label style="font-size:.78rem;color:var(--ink-l);font-weight:700">或自定义</label>'

    + '<div class="row" style="margin-top:4px"><input class="inp" type="number" id="sciBD" placeholder="分值" style="max-width:96px">'

    + '<input class="inp" type="text" id="sciBR" placeholder="理由" style="flex:1"></div>'

    + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">'

    + '<button class="btn xs b-ghost" onclick="closeModal()">取消</button>'

    + '<button class="btn xs b-lav" onclick="sciDoBatch(null)">确认</button></div>';

  showModal({title:'⭐ 批量加分（'+ids.length+' 人）', bodyHtml: body});

};

window.sciDoBatch = function(tid){

  const ids = (S.sciPicks||[]).slice();

  if(!ids.length){ toast('没有选中学生'); return; }

  let d, rs;

  if(tid){ const t = S.scoreTags.filter(function(x){return x.id===tid})[0]; if(!t) return; d=t.s; rs=t.l; }

  else{

    d = parseInt(document.getElementById('sciBD').value,10);

    if(isNaN(d)||d===0){ toast('请输入非 0 分值'); return; }

    rs = (document.getElementById('sciBR').value||'').trim() || '批量加分';

  }

  let n=0;

  ids.forEach(function(i){

    const s = S.students.filter(function(x){return x.id===i})[0];

    if(s){ s.score=(s.score||0)+d; S.scoreLogs.push({id:uid(),ts:Date.now(),sid:i,delta:d,reason:rs}); n++; }

  });

  S.sciPicks = []; save(); closeModal();

  toast('⭐ 已为 '+n+' 名学生'+(d>0?'加':'扣')+Math.abs(d)+'分');

  drawStuGrid(); sciDrawPanel();

};

window.sciPraise = function(){

  const list = sciStuOf(S.sciClass);

  if(!list.length){ toast('本班暂无学生'); return; }

  const top = list.slice().sort(function(a,b){ return (b.score||0)-(a.score||0); }).slice(0,10);

  let txt = '【本周表扬名单】' + S.sciClass + '\n\n';

  top.forEach(function(s,i){ txt += (i+1) + '. ' + s.name + '　' + (s.score||0) + ' 分\n'; });

  const body = '<textarea class="inp" id="sciPraiseTxt" rows="10" style="font-size:.85rem">'+escapeHtml(txt)+'</textarea>'

    + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">'

    + '<button class="btn xs b-ghost" onclick="closeModal()">关闭</button>'

    + '<button class="btn xs b-mint" onclick="sciCopyPraise()">📋 复制</button></div>';

  showModal({title:'🏆 本周表扬名单', bodyHtml: body});

};

window.sciCopyPraise = function(){

  const t = document.getElementById('sciPraiseTxt');

  try{ t.select(); document.execCommand('copy'); toast('已复制到剪贴板'); }

  catch(e){ toast('复制失败，请手动选中复制'); }

};

window.sciImportCls = function(){

  const clsList = sciClassList();

  const body = '<label style="font-size:.78rem;color:var(--ink-l);font-weight:700">导入到班级（可直接输入新班名）</label>'

    + '<input class="inp" id="sciImpCls" list="sciClsList" value="'+escapeHtml(S.sciClass||'')+'" style="margin:4px 0 10px">'

    + '<datalist id="sciClsList">' + clsList.map(function(c){return '<option value="'+escapeHtml(c)+'">';}).join('') + '</datalist>'

    + '<label style="font-size:.78rem;color:var(--ink-l);font-weight:700">粘贴名单（每行一个）</label>'

    + '<p style="font-size:.74rem;color:var(--ink-l);margin:2px 0 4px">支持「01220607 李红」或「李红」，也支持 CSV「姓名,班级,备注」</p>'

    + '<textarea class="inp" id="sciImpTxt" rows="7" placeholder="张小明\n01220607 李红\n王芳"></textarea>'

    + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">'

    + '<button class="btn xs b-ghost" onclick="closeModal()">取消</button>'

    + '<button class="btn xs b-lav" onclick="sciDoImport()">导入</button></div>';

  showModal({title:'📥 导入名单到班级', bodyHtml: body});

};

window.sciDoImport = function(){

  const cls = (document.getElementById('sciImpCls').value||'').trim();

  if(!cls){ toast('请填写班级名'); return; }

  const raw = (document.getElementById('sciImpTxt').value||'').trim();

  if(!raw){ toast('请粘贴名单'); return; }

  if((S.classes||[]).indexOf(cls)<0 && S.classes.filter(function(c){return c.name===cls}).length===0){

    S.classes.push({id:uid(), name:cls});

  }

  const exist = {}; S.students.forEach(function(s){ exist[s.name]=1; });

  let n=0, dup=0;

  raw.split(/\r?\n/).forEach(function(ln){

    ln = ln.trim(); if(!ln) return;

    ln = ln.replace(/^\d+[\.、]\s*/,'');

    const parts = ln.split(/[,，]/);

    let name = parts[0].trim();

    const m = name.match(/^(\d+)\s+(.+)$/);

    let sid = '';

    if(m){ sid = m[1]; name = m[2].trim(); }

    if(!name) return;

    if(exist[name]){ dup++; return; }

    const st = {id:uid(), name:name, group:cls, note:parts[2]?parts[2].trim():'', score:0};

    if(sid) st.sid = sid;

    S.students.push(st);

    if(!S.studentData[st.id]) S.studentData[st.id] = {homework:[], exam:[], weakness:[], discipline:[]};

    exist[name]=1; n++;

  });

  S.sciClass = cls; save(); closeModal();

  toast('导入成功 '+n+' 人'+(dup?'，跳过重名 '+dup+' 人':''));

  drawStuGrid(); populateStuPicker(); sciDrawPanel();

};

window.sciManageCls = function(){

  const list = sciClassList();

  let body = '<p style="font-size:.8rem;color:var(--ink-l);margin:0 0 10px">班级即学生的「分组」。改名会同步更新该班所有学生。</p>';

  body += list.map(function(c){

    const n = sciStuOf(c).length;

    return '<div style="display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed #EFE7F0">'

      + '<b style="flex:1;font-size:.86rem">'+escapeHtml(c)+'</b>'

      + '<span style="font-size:.76rem;color:var(--ink-l)">'+n+' 人</span>'

      + '<button class="btn xs b-cream" onclick="sciRenameCls(\''+escapeHtml(c)+'\')">改名</button>'

      + '<button class="btn xs b-ghost" onclick="sciDelCls(\''+escapeHtml(c)+'\')">删除</button></div>';

  }).join('');

  body += '<div class="row" style="margin-top:12px"><input class="inp" id="sciNewCls" placeholder="新班级名，如 四（3）班" style="flex:1">'

    + '<button class="btn xs b-mint" onclick="sciAddCls()">+ 新增班级</button></div>';

  showModal({title:'⚙️ 班级管理', bodyHtml: body});

};

window.sciAddCls = function(){

  const n = (document.getElementById('sciNewCls').value||'').trim();

  if(!n){ toast('请输入班级名'); return; }

  S.classes.push({id:uid(), name:n}); S.sciClass = n;

  save(); closeModal(); toast('已新增班级 '+n); sciDrawPanel();

};

window.sciRenameCls = function(old){

  const n = prompt('把班级「'+old+'」改名为：', old);

  if(!n || n===old) return;

  S.students.forEach(function(s){ if(((s.group||'').trim()||'未分组')===old) s.group = n; });

  S.classes.forEach(function(c){ if(c.name===old) c.name = n; });

  if(S.sciClass===old) S.sciClass = n;

  save(); closeModal(); toast('已改名为 '+n);

  drawStuGrid(); sciDrawPanel();

};

window.sciDelCls = function(c){

  const n = sciStuOf(c).length;

  if(!confirm('删除班级「'+c+'」？该班 '+n+' 名学生及其积分记录将一并删除。')) return;

  const ids = sciStuOf(c).map(function(s){return s.id});

  S.students = S.students.filter(function(s){ return ids.indexOf(s.id)<0; });

  S.scoreLogs = S.scoreLogs.filter(function(l){ return ids.indexOf(l.sid)<0; });

  S.redeems = S.redeems.filter(function(l){ return ids.indexOf(l.sid)<0; });

  S.classes = S.classes.filter(function(x){ return x.name!==c; });

  S.sciClass = ''; S.sciPicks = [];

  save(); closeModal(); toast('已删除班级 '+c);

  drawStuGrid(); populateStuPicker(); sciDrawPanel();

};



/* ---------- 6. 把积分面板插进学生页 ---------- */

function sciInjectPanel(box){

  if(!box) return;

  if(document.getElementById('sciScoreCard')) return;

  const card = document.createElement('div');

  card.className = 'card t-mint';

  card.id = 'sciScoreCard';

  card.innerHTML = '<h3><span class="em">⭐</span>课堂积分 <span class="cnt">加分 · 排行 · 奖励兑换</span></h3>'

    + '<div id="sciPanel"></div>';

  const first = box.querySelector('.card');

  if(first && first.parentNode===box) box.insertBefore(card, first.nextSibling);

  else box.appendChild(card);

  sciDrawPanel();

}



/* ---------- 7. 包装原函数 ---------- */

(function(){

  const _drawStuGrid = drawStuGrid;

  drawStuGrid = function(){ sciEnsure(); _drawStuGrid.apply(null, arguments); sciEnhanceCards(); };



  const _renderStudents = renderStudents;

  renderStudents = function(box){ sciEnsure(); _renderStudents(box); sciInjectPanel(box); };



  const _rpb = renderPageBody;

  renderPageBody = function(id){

    sciEnsure();

    if(id==='lessons'){ renderLessons(document.getElementById('body-lessons')); return; }

    _rpb(id);

  };

})();
/* 教案弹窗关闭时解锁页面滚动 */
(function(){
  const _cm = window.closeModal || closeModal;
  closeModal = function(){
    try{ document.body.classList.remove('sci-modal-open'); }catch(e){}
    _cm();
  };
})();



</script>
