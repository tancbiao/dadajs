 "4|空气|2": {
  "goal": "科学观念：\n1.知道空气和固体、液体一样，能够占据一定的空间。\n2.知道空气占据的空间可以被\"让\"出来——空气跑掉后，水就能进去。\n\n科学思维：\n1.能根据\"纸团没有湿\"这一现象，推理出\"杯子里有空气挡住了水\"，建立基于证据的推理意识。\n2.能通过对比实验（竖直倒扣 vs 倾斜倒扣），找出实验现象不同的原因。\n\n探究实践：\n1.能规范完成\"纸团不湿\"实验，注意杯子要竖直、纸团要塞紧。\n2.能观察并记录实验现象，用\"因为…所以…\"的句式表达结论。\n3.能设计简单的验证方法，检验自己的猜想。\n\n态度责任：\n1.敢于对\"杯子是空的\"这一直觉判断提出质疑，乐于用实验验证。\n2.小组分工明确，如实记录，即使结果与别人不同也要如实汇报。",
  "key": "通过\"纸团不湿\"实验和倾斜对照实验，用看得见的现象证明空气能够占据空间，建立\"所有物质都占据空间\"的认识。",
  "hard": "学生凭直觉认为\"空杯子里面什么都没有\"，很难理解\"看不见的空气占住了地方\"。难点在于引导学生把\"水进不去\"和\"空气占着\"联系起来，并用\"空气跑出来、水才能进去\"的对比实验加以印证。",
  "mat": "教师：透明玻璃杯2个、水槽（或水盆）1个、水、干燥纸巾若干、教学课件、实验记录单\n\n学生（四人小组）：透明玻璃杯1个、水槽（水盆）1个、水、干燥纸巾2团、记录单\n\n【低成本替代】玻璃杯可用透明塑料杯、矿泉水瓶（剪开上半部）代替；水槽可用洗脸盆、塑料饭盒；没有纸巾可用一小团废纸、干树叶。",
  "proc": "一、激趣导入（5分钟）\n材料准备：教学课件、一杯水、一个空玻璃杯\n\n1.教师举起一个空玻璃杯。\n提问：老师手里这个杯子，里面有什么？\n\n预设1：什么都没有，是空的。\n预设2：有空气。\n\n2.教师不评判，请学生表决，把两种想法的人数写在黑板上。\n\n3.提问：怎样才知道谁说得对？——做实验。\n引入：今天我们就用一个有趣的实验来破案：空气到底占不占地方。\n（板书课题：空气能占据空间吗）\n\n二、新课教学（28分钟）\n\n（一）作出猜想（3分钟）\n1.如果把一团干燥的纸巾紧紧塞在杯底，然后把杯子竖直倒扣进水里，再拿出来，纸巾会湿吗？\n请把你的猜想和理由写在记录单上。\n\n预设1：会湿，因为杯子里是空的，水会进去。\n预设2：不会湿，因为杯子里有空气挡着。\n\n2.教师强调：两种猜想都有可能，关键是做完实验要看证据。\n\n（二）实验一：纸团会不会湿（12分钟）\n材料准备：每组透明杯1个、水槽1个、干燥纸团1个、记录单\n\n1.教师分步示范并强调操作要点：\n①把纸巾揉成团，紧紧塞到杯底，翻转杯子纸团不会掉下来；\n②水槽里装大半盆水；\n③杯子要竖直、杯口保持水平，慢慢倒扣进水里，一直压到盆底；\n④等几秒钟，再竖直地把杯子提出来；\n⑤用纸巾擦干杯子外壁的水，取出纸团摸一摸。\n\n2.提醒：杯子一定要竖直，不能歪；动作要慢，别把水晃得到处都是。\n\n3.学生分组实验，教师巡视，重点纠正杯子倾斜、纸团没塞紧的小组。\n\n4.全班交流。\n提问：纸团湿了吗？这说明什么？\n\n预设：纸团是干的！水没有进去。\n\n5.追问（关键研讨）：水明明就在杯子外面，为什么进不去？杯子里到底是什么？\n\n预设：杯子里面有空气，空气把地方占住了，水就进不去了。\n\n师小结：杯子看起来是空的，其实里面充满了空气。空气占住了杯子里的空间，水就进不去，所以纸团是干的。这说明——空气能够占据空间。\n（板书：空气能占据空间）\n\n（三）实验二：让空气跑出来（10分钟）\n材料准备：同实验一，另备1个干燥纸团\n\n1.提问：有什么办法能让水进到杯子里去？\n\n预设：把杯子倾斜一点。\n\n2.教师示范：把杯子倾斜着慢慢放进水里，请学生仔细观察杯口。\n\n提问：你看到了什么？\n\n预设1：有气泡从杯口冒出来了。\n预设2：水进到杯子里了。\n\n3.追问：冒出来的气泡是什么？气泡跑掉以后，发生了什么变化？\n\n预设：气泡是杯子里的空气。空气跑掉了，水就进去了，把空气原来的地方占了。\n\n4.学生分组重做倾斜实验，验证纸团是否变湿。\n\n5.教师引导对比：\n竖直倒扣：空气出不来 → 水进不去 → 纸团干\n倾斜倒扣：空气变成气泡跑出来 → 水进去 → 纸团湿\n\n师小结：这两个实验放在一起看，就能很清楚地证明：杯子里确实有空气，而且空气是占据空间的；空气让开了，别的东西才能进来。\n\n（四）联系生活（3分钟）\n1.提问：生活中还有哪些现象能说明空气占据空间？\n预设1：气球吹大以后鼓鼓的，是空气把气球撑开了。\n预设2：篮球、足球打足气以后会变硬。\n预设3：空瓶子盖紧盖子扔进水里，会浮在水面上。\n预设4：用吸管往水里吹气，会冒泡泡。\n\n师小结：空气占据空间的例子在生活中到处都是。\n\n三、课堂总结（5分钟）\n1.提问：今天我们是怎么证明空气占据空间的？\n预设：做了两个实验，看纸团湿不湿、看气泡。\n2.请用\"因为…所以…\"说一句话。\n预设示范：因为杯子里有空气占着地方，所以水进不去，纸团没有湿。\n3.教师提升：固体、液体、气体都会占据空间，这是所有物质的共同特点。下节课我们继续研究：空气占据的空间，大小会变吗？\n\n【提示学生把水槽里的水倒回水桶，桌面擦干净，器材归位】",
  "board": "                   2. 空气能占据空间吗\n\n    猜想：会湿 ？        不会湿 ？\n\n    实验一（竖直倒扣）          实验二（倾斜倒扣）\n    杯口朝下 · 慢慢压入         杯口倾斜 · 慢慢压入\n    ┌─────────┐                ┌─────────┐\n    │  空气   │                │ ↗气泡冒出│\n    │  ▓纸团  │                │  水进来了│\n    └────┬────┘                └────┬────┘\n         │水                        │水\n    现象：纸团没有湿            现象：冒气泡 · 纸团湿了\n\n    结论：空气能占据空间。空气跑掉，水才能进来。",
  "reflect": ""

 "4|空气|4": {
  "goal": "科学观念：\n1.知道空气虽然没有固定的形状，但是有一定的质量。\n2.知道空气很轻，但仍然可以被测量出来；充入的空气越多，质量越大。\n\n科学思维：\n1.能根据\"天平倾斜\"这一现象，推理出\"多出来的那部分就是空气的质量\"。\n2.能理解\"瓶子里的空气变多了\"与\"天平失去平衡\"之间的因果关系。\n\n探究实践：\n1.能自制或正确使用简易天平，学会先调平再实验。\n2.能规范记录实验前后天平的变化，基于现象得出结论。\n3.能在实验失败时（如气球漏气、天平不灵敏）主动查找原因并重做。\n\n态度责任：\n1.尊重实验事实，即使结果与猜想相反也要如实记录。\n2.实验中耐心细致，体会到\"微小的变化也需要认真观察\"的科学态度。",
  "key": "用简易天平比较\"瘪气球\"与\"充足气的气球\"的质量，通过天平倾斜的现象证明空气有质量。",
  "hard": "空气的质量非常小，实验现象不明显，天平稍有误差就测不出来。难点在于：①让天平足够灵敏并先调平；②引导学生理解天平倾斜不是\"变重了\"，而是\"多出了充进去的空气\"。此外，气球体积变大后浮力增加，会干扰实验结果，教师需要提前想到并用\"同一气球充气前后对比\"来控制。",
  "mat": "教师：简易天平（或自制杠杆天平）1套、气球2个、打气筒1个、细线、教学课件、记录单\n\n学生（四人小组）：自制简易天平1套（长直尺或细木棍1根、支架1个、细线、两个相同的小纸杯或塑料袋）、气球2个、打气筒1个\n\n【低成本替代】\n天平：用一根30厘米长的直尺或一次性筷子，中间系细线悬挂在支架（可用椅背、门框、铁架台）上，两端各挂一个相同的小纸杯或塑料袋即可。\n打气筒：可用篮球针＋自行车打气筒，或用嘴吹（注意提醒学生不要吹得过猛，气球大小要一致）。\n支架：可用叠高的书本＋铅笔搭成。",
  "proc": "一、激趣导入（5分钟）\n材料准备：教学课件、1个气球、1根羽毛\n\n1.教师左手拿一个充足气的气球，右手拿一根羽毛。\n提问：气球和羽毛，哪个重？\n\n预设：气球重（因为气球更大）。\n\n2.教师把气球里的气慢慢放掉，再问：现在呢？变轻了吗？\n预设：变轻了。\n\n3.追问：放掉的那些\"气\"，有重量吗？\n预设1：没有，空气轻飘飘的，没有重量。\n预设2：有一点点。\n\n4.引入：空气到底有没有质量？光凭感觉说不准，我们今天用天平来称一称。\n（板书课题：空气有质量吗）\n\n二、新课教学（28分钟）\n\n（一）认识并调平天平（6分钟）\n材料准备：每组简易天平1套\n\n1.教师介绍简易天平的结构：横梁、支点、两个托盘。\n\n2.示范调平：在两个托盘里放上相同的物体（两个相同的气球皮或纸杯），调节悬挂的位置或加减配重，直到横梁水平。\n\n3.强调：做对比实验前，天平必须先调平，两边完全一样重——这是实验公平的前提。\n\n4.学生分组调平，教师逐个检查。\n\n（二）作出猜想（2分钟）\n提问：如果一个天平左边放一个瘪气球、右边放一个一样的瘪气球，两边一样重。现在把左边的气球充足气，再放回天平，天平会怎样？\n预设1：还是平的，因为空气没有质量。\n预设2：左边会沉下去，因为空气有质量。\n把两种猜想记在黑板上。\n\n（三）实验：称一称空气（14分钟）\n材料准备：每组调平的天平1套、气球2个、打气筒1个、记录单\n\n1.步骤：\n①把两个相同的瘪气球分别挂在天平两端，调平，记录\"平衡\"；\n②取下左边的气球，用打气筒充足气（或用嘴吹大到相同大小）；\n③把充足气的气球重新挂回左边；\n④观察天平的变化，记录在记录单上。\n\n2.提醒：\n·只能用同一个气球充气前后对比，保证\"只改变一个条件\"；\n·气球口要扎紧，不能漏气；\n·观察时不要用手扶天平，也不要对着天平吹气。\n\n3.学生分组实验，教师巡视指导。\n\n4.全班交流。\n提问：天平发生了什么变化？这说明了什么？\n\n预设：挂了充足气的气球那一端沉下去了。\n\n5.追问（关键研讨）：左边为什么变重了？多出来的重量是从哪里来的？\n\n预设：多出来的就是充进去的空气。\n\n6.继续追问：如果我们再往气球里打更多气，天平会怎样？\n预设：会沉得更低，因为空气更多了，质量更大。\n\n7.学生验证：继续给气球打气，观察天平倾斜是否加大。\n\n师小结：天平倾斜了，说明充足气的气球比瘪气球重；多出来的这部分质量，就是充进去的空气的质量。所以——空气是有质量的。\n（板书：空气有质量）\n\n（四）研讨：为什么会这样（6分钟）\n1.提问：一个气球里的空气那么少都能称出来，那我们教室里的空气呢？\n预设：教室里空气很多，肯定也有质量，而且不小。\n\n2.教师补充（不要求计算，仅作感性认识）：科学家测算过，一间普通教室里的空气大约有200多千克，相当于好几个同学的体重。空气虽然很轻，但聚在一起就很可观了。\n\n3.提问：既然空气有质量，那它和木块、水有什么相同点？\n预设：都有质量，都占据空间，都是真实的物质。\n\n师小结：通过前面几课和今天的学习，我们知道空气占据空间、会流动、有质量——它确实是一种实实在在的物质。\n\n三、课堂总结（5分钟）\n1.提问：今天我们用什么证明了空气有质量？\n预设：用天平称气球充气前后的变化。\n2.提问：做这个实验，最关键的一步是什么？\n预设：天平要先调平；要用同一个气球对比。\n3.教师提升：科学研究中，很多差别是非常微小的，只有认真观察、反复验证，才能发现真相。\n4.布置：回家试试用塑料袋和衣架做一个天平，称一称一张纸的重量，看看能不能成功。\n\n【提醒：气球碎片不要乱扔，收进垃圾桶】",
  "board": "                     4. 空气有质量吗\n\n    器材：简易天平 + 两个相同气球 + 打气筒\n\n    第一步：两个瘪气球挂两边\n            ┌─────┬─────┐\n            │  🎈 │  🎈 │     → 平衡\n            └─────┴─────┘\n\n    第二步：左边气球充足气，再挂回去\n            ┌─────┬─────┐\n            ↓ 🎈  │  🎈 │     → 左边下沉\n            └─────┴─────┘\n\n    现象：充足气的一端沉下去\n    结论：多出来的质量 = 充进去的空气\n          ★ 空气有质量 ★\n\n    关键：①先调平 ②同一气球对比 ③扎紧不漏气",
  "reflect": ""
 },
 "4|空气|7": {
  "goal": "科学观念：\n1.知道空气受热会上升，受冷会下降（热空气轻、往上升；冷空气重、往下沉）。\n2.知道空气的冷热流动（对流）是自然界风形成的主要原因。\n3.知道风有力量，与人类的生活密切相关。\n\n科学思维：\n1.能根据\"香的烟飘动方向\"这一可见现象，推理出\"看不见的空气在流动\"。\n2.能建立\"蜡烛加热→空气变热上升→冷空气补充进来→形成风\"的因果链条。\n\n探究实践：\n1.能完成\"观察烟的流动\"模拟实验，正确放置蜡烛、香和观察窗。\n2.能准确画出空气流动的路线图，用箭头表示方向。\n3.能在实验中注意安全，规范使用蜡烛和香。\n\n态度责任：\n1.对自然现象的成因保持探究兴趣，乐于追问\"为什么\"。\n2.实验中严格遵守用火安全要求，不玩火、不触碰热源。\n3.意识到风既能造福人类（发电、传播花粉），也可能带来灾害（台风），学会辩证看待。",
  "key": "通过\"蜡烛加热空气、观察烟的流动方向\"的模拟实验，认识热空气上升、冷空气补充形成的空气流动，理解自然界风的成因。",
  "hard": "空气流动本身看不见，学生只能借助\"烟\"这个\"看得见的标记\"来推理空气的运动方向。难点在于理解\"烟往哪里飘，就说明空气往哪里流\"，以及建立完整的因果链：蜡烛加热→空气变热→热空气上升→周围的冷空气流过来补充→形成了风。此外，实验容易受外界气流干扰（开窗、学生走动、呼吸），需要控制。",
  "mat": "教师：透明整理箱（或大纸箱，一侧开口并贴透明塑料膜做观察窗）1个、蜡烛1支、火柴或打火机、线香3支、湿毛巾1块、教学课件、记录单\n\n学生（四人小组）：透明整理箱1个、蜡烛1支、线香2支、火柴、湿毛巾1块、记录单（含画空气流动路线图的方框）\n\n【低成本替代】\n透明整理箱：可用大号透明塑料收纳箱；没有的话，用纸箱在正面挖一个\"窗口\"并贴上透明塑料袋，侧面下方开一个小口即可。\n线香：可用蚊香、艾条代替（注意通风）。\n蜡烛：可用小蜡烛头，固定在瓶盖或锡纸上。\n安全提示：若学校不便用火，可改用\"热水杯＋冷毛巾\"观察水蒸气上升，或直接用课件中的实验视频演示。",
  "proc": "一、激趣导入（5分钟）\n材料准备：教学课件、1个小风车\n\n1.教师拿出一个小风车，不吹风，问：怎样才能让它转起来？\n预设：用嘴吹、用扇子扇、跑起来、用电风扇吹。\n\n2.教师用扇子扇，风车转起来。\n提问：是什么让风车转起来的？——风。\n\n3.追问：那风是从哪里来的呢？天空中可没有人拿着扇子在扇。\n预设1：是老天爷吹的。\n预设2：是空气自己动的。\n预设3：树摇的时候就有风。\n\n4.引入：风到底是怎么形成的？今天我们就来当一回\"造风的人\"，在教室里制造一次风。\n（板书课题：风的成因）\n\n二、新课教学（28分钟）\n\n（一）复习铺垫：空气会流动（3分钟）\n提问：前面我们学过，空气有什么特点？\n预设：会流动，空气流动形成风。\n追问：可是空气好端端的，为什么会自己流动起来呢？今天就来找原因。\n\n（二）模拟实验：制造风（18分钟）\n材料准备：每组透明箱1个、蜡烛1支、线香2支、火柴、湿毛巾、记录单\n\n1.教师介绍装置：箱子侧面下方开一个小口（进风口），上方开口或贴透明膜做观察窗。\n\n2.第一步：点燃线香，放在箱子侧面小口的外面，观察烟往哪里飘。\n提问：不点蜡烛的时候，烟是怎么飘的？\n预设：烟直直地往上飘，或者慢慢散开，不往箱子里跑。\n\n3.第二步：把点燃的蜡烛放进箱子里面，等一会儿，再把线香放在进风口外面。\n提问：现在烟去哪儿了？\n\n预设1：烟被吸进箱子里去了！\n预设2：烟从下面的小口钻进箱子，然后往上飘。\n\n4.追问（关键研讨）：烟为什么会跑进箱子里去？是谁把它\"拉\"进去的？\n\n引导分析：\n·箱子里的蜡烛在燃烧，把箱子里的空气加热了；\n·空气受热以后会怎样？——上升（热空气比较轻）；\n·箱子里的热空气跑掉了，箱子里的空气就变少了；\n·这时候外面的空气要做什么？——流进来补充；\n·空气流动进来，就带着烟一起进来了，所以我们看到烟被\"吸\"进去。\n\n5.学生分组实验，教师巡视，提醒：\n·注意用火安全，蜡烛要放稳，不要碰倒箱子；\n·观察时要蹲下来，视线与进风口平齐；\n·不要在箱子周围来回走动、不要对着箱子吹气，以免干扰实验；\n·湿毛巾放在手边备用。\n\n6.画一画：请学生在记录单上，用箭头画出空气的流动路线。\n（正确路线：冷空气从下方进风口流入 → 被蜡烛加热 → 热空气上升 → 从上方流出）\n\n7.全班交流路线图，教师点评并板书。\n\n8.教师演示：把手放在箱子上方开口处。\n提问：你有什么感觉？这说明了什么？\n预设：手感觉热热的，有热气往上冒——说明热空气在上升。\n\n师小结：蜡烛加热了空气，热空气变轻往上升，周围的冷空气就流过来补充，这样空气就流动起来了——空气流动形成了风。自然界里的风，也是这样形成的。\n（板书：冷热不同 → 空气流动 → 形成风）\n\n（三）联系自然：自然界的风是怎么来的（5分钟）\n1.提问：自然界里没有蜡烛，那是什么在加热空气？\n预设：太阳。\n\n2.教师讲解（配合课件）：\n太阳照着大地，有的地方照得多（比如空旷的沙地），温度升高得快，空气受热上升；有的地方照得少（比如树林、水面），温度低，冷空气就流过去补充——空气这样流动起来，就形成了风。海边的海陆风、山谷里的山谷风，都是这个道理。\n\n3.提问：风对我们有什么好处和坏处？\n预设好处：可以发电、可以帮助植物传播花粉和种子、夏天吹风扇很凉快、可以放风筝、帆船靠风航行。\n预设坏处：台风会把树吹倒、把房子吹坏；大风会把衣服吹跑。\n\n师小结：风既能帮助人类，也可能带来灾害，我们要学会利用它、也要学会防范它。\n\n三、课堂总结（5分钟）\n1.提问：今天我们是怎样在教室里\"造\"出风的？\n预设：用蜡烛加热箱子里的空气，热空气上升，外面的冷空气流进来补充。\n2.请学生用一句完整的话说说风的成因。\n示范：当空气冷热不同时，热空气上升，冷空气流过来补充，空气流动起来就形成了风。\n3.教师提升：今天我们做了一个模拟实验。模拟实验是用简单的材料，模仿大自然中很难直接观察的现象——这是我们研究科学的重要方法。\n4.布置：回家观察一次风（比如看树叶、看旗子、看水面），想一想今天的风是从哪个方向吹来的。\n\n【务必确认蜡烛和香已完全熄灭，湿毛巾覆盖，方可收拾器材】",
  "board": "                      7. 风 的 成 因\n\n    模拟实验装置（侧视）：\n\n              ↑ 热空气上升，从上方流出\n        ┌─────────────┐\n        │    🕯 蜡烛   │\n        │             │\n        │             │\n        └───────□─────┘\n             进风口 ↑\n           （烟被吸进来）\n\n    空气流动路线：\n    冷空气 → 从下方进风口流入 → 被蜡烛加热 → 变热上升 → 从上方流出\n    （循环不停，就形成了风）\n\n    结论：空气冷热不同 → 热空气上升 → 冷空气流过来补充\n          → 空气流动 → ★形成风★\n\n    自然界：太阳照射 → 各地受热不均 → 空气冷热不同 → 风",
  "reflect": ""
 },
 "4|呼吸与消化|1": {
  "goal": "科学观念：\n1.知道人体维持生命需要呼吸和进食，呼吸与消化是人体获取物质和能量的两条重要途径。\n2.知道呼吸摄取的是空气中的氧气，消化摄取的是食物中的营养。\n3.初步知道呼吸系统与消化系统各主要器官的名称和大致位置。\n\n科学思维：\n1.能通过\"憋气\"\"运动后喘气\"等亲身体验，感知呼吸是生命活动的必需。\n2.能用画图的方式把自己知道的器官表示出来，暴露并梳理前概念。\n\n探究实践：\n1.能完成\"憋气体验\"，感受人体对空气的需要。\n2.能在人体轮廓图上画出自己知道的呼吸器官和消化器官，并标注名称。\n3.能提出关于呼吸和消化想继续研究的问题，记录在问题树上。\n\n态度责任：\n1.对自己的身体产生探究兴趣，愿意了解并保护自己的器官。\n2.乐于分享自己已有的经验，也愿意接纳别人不同的想法。",
  "key": "通过憋气体验、画图暴露前概念等活动，整体感知人体的呼吸与消化两大系统，知道这两条途径为人体提供维持生命所需的物质，并激发后续探究的兴趣。",
  "hard": "呼吸与消化都发生在身体内部，学生平时看不见也想不到，前概念往往模糊甚至错误（如\"食物进到肚子里就没了\"\"气是吸到肚子里的\"）。难点在于把学生的零散经验梳理成\"两条途径\"的整体认识，同时不急于纠正错误前概念，而是把它们作为后续学习的起点。",
  "mat": "教师：人体轮廓图（大张，贴在黑板上）1张、呼吸系统与消化系统器官卡片（带磁吸或双面胶）1套、秒表、教学课件、班级问题树海报1张\n\n学生（四人小组）：人体轮廓图（A4，每人1张）、彩色笔、便签纸每人2张\n\n【低成本替代】人体轮廓图可由教师课前用粉笔在黑板上画出，或让学生躺着互相描画身体轮廓；器官卡片可用卡纸手写。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件、秒表\n\n1.体验活动：全体起立，捏住鼻子、闭紧嘴巴，我们一起憋气，看看能坚持多久。\n（教师计时，学生憋不住时可自行坐下，教师记录最后坚持的人数）\n\n2.提问：憋气的时候你有什么感觉？为什么忍不住？\n预设1：很难受，胸口闷。\n预设2：憋不住，必须要呼吸。\n预设3：感觉要喘不上气了。\n\n3.追问：如果一直不让我们呼吸，会怎么样？\n预设：会晕倒，甚至会有生命危险。\n\n4.引入：呼吸对我们这么重要，那我们吸进去的到底是什么？用在哪里？今天我们就要走进自己的身体，认识两条维持生命的重要通道——呼吸和消化。\n（板书课题：我们的呼吸与消化）\n\n二、新课教学（28分钟）\n\n（一）我们为什么需要呼吸（8分钟）\n1.提问：我们每时每刻都在呼吸，吸进去的是什么？\n预设：空气。\n\n2.追问：空气里有那么多东西，我们最需要的是哪一种？\n预设1：氧气。\n预设2：不知道。\n\n3.教师讲解（不展开，点到为止）：空气中大约有五分之一是氧气，我们的身体就像一个小火炉，需要氧气来帮助\"燃烧\"食物，产生能量，让我们有力气走路、思考、长身体。所以一停止呼吸，身体就会\"熄火\"。\n\n4.小活动：原地做20个深蹲或高抬腿，然后说说现在呼吸有什么变化。\n预设：呼吸变快了、变急了，喘不上气。\n追问：为什么运动后要喘气？\n预设：运动时身体需要更多氧气。\n\n（二）画一画：我知道的身体里的器官（12分钟）\n材料准备：每人一张人体轮廓图、彩色笔\n\n1.布置任务：请你把自己知道的、与呼吸有关的器官，和吃东西后食物会经过的地方，画在这张人体轮廓图上。知道多少画多少，不确定的也可以用\"？\"标出来。\n\n2.学生独立画图，教师巡视，**不纠正、不评价**，只观察学生画了什么。\n\n3.小组内交流：把你画的给组员看，互相补充。\n\n4.全班交流，教师选取2—3幅有代表性的作品贴在黑板上（**注意选择包含典型错误前概念的**）。\n\n提问：大家画出来的都一样吗？哪些地方不一样？\n\n预设1：我画了鼻子、喉咙、肺。\n预设2：我画了嘴巴、食道、胃、肠子。\n预设3：我画的是一个大口袋（胃），食物进去就装在那里。\n预设4：我画气是吸到肚子里的。\n\n5.教师梳理（**此处不判定对错**）：\n大家画的这些器官，有的跟呼吸有关，比如鼻、咽、喉、气管、肺；有的跟食物有关，比如口腔、食道、胃、小肠、大肠。看来我们身体里有两套\"流水线\"——一套负责呼吸，一套负责消化。\n\n6.教师在黑板上的人体轮廓图上，用不同颜色把学生提到的器官卡片贴上去（呼吸系统用蓝色，消化系统用橙色），形成一张初步的\"班级器官图\"。\n\n师小结：人体要维持生命，一条路是靠呼吸，把空气中的氧气请进身体；另一条路是靠吃东西，把食物中的营养留下来。这两条路，就是我们这个单元要研究的两大系统——呼吸系统和消化系统。\n\n（三）提出问题：我还想知道什么（8分钟）\n材料准备：班级问题树海报、便签纸\n\n1.提问：关于呼吸和消化，你现在最想知道什么？请把问题写在便签纸上。\n教师示范：比如\"食物在肚子里是怎么变的？\"\"我们一天要呼吸多少次？\"\n\n2.学生写问题，教师巡视帮助有困难的学生把问题写清楚。\n\n3.学生把便签贴在黑板上的\"问题树\"上，教师快速归类。\n典型问题预设：\n·我们吸进去的气到哪里去了？\n·肺长什么样？\n·食物是怎么变成营养的？\n·为什么有的人肺活量大、有的人小？\n·为什么跑步会肚子痛？\n·为什么要细嚼慢咽？\n\n4.教师引导：同学们的问题真多，这些问题都很有价值。接下来的几节课，我们一个一个来研究，先从\"认识呼吸器官\"开始。\n\n三、课堂总结（6分钟）\n1.提问：今天我们知道了什么？\n预设1：人要活着就必须呼吸，呼吸是为了得到氧气。\n预设2：身体里有呼吸系统和消化系统两套\"流水线\"。\n预设3：我们吸进氧气，吃进食物，都是为了得到维持生命的东西。\n\n2.提问：这两套系统有什么共同点？\n预设：都在身体里面，看不见；都很重要，少了哪一个都不行。\n\n3.教师提升：今天我们画的图不一定都对，但没关系——科学就是从\"我以为\"开始，通过不断观察和实验，一步一步变成\"我知道\"。这个单元的每一课，我们都会回来修正这张图。\n\n4.布置：把今天的人体轮廓图保存好，贴在科学记录本的最后一页，学完整个单元后，我们再画一张，比一比有什么变化。\n\n【提示：把学生的问题树海报贴在教室科学角，后续每节课末尾回来\"摘果子\"——看哪些问题已经解决】",
  "board": "                 1. 我们的呼吸与消化\n\n    体验：憋气 → 难受、忍不住 → 人离不开呼吸\n\n    人体需要的两条通道：\n    ┌──────────────┬──────────────┐\n    │  呼 吸 系 统  │  消 化 系 统  │\n    │  （蓝色）     │  （橙色）     │\n    ├──────────────┼──────────────┤\n    │  鼻·咽·喉     │  口腔·食道    │\n    │  气管·肺      │  胃·小肠·大肠 │\n    ├──────────────┴──────────────┤\n    │  吸取空气中的氧气  吸取食物中的营养 │\n    │        ↓                  ↓      │\n    │   ──→ 维持生命活动 ←─           │\n    └───────────────────────────────┘\n\n    我的问题树：（贴学生便签）",
  "reflect": ""

 "4|呼吸与消化|2": {
  "goal": "科学观念：\n1.知道人体呼吸系统的组成：鼻、咽、喉、气管、支气管、肺。\n2.知道肺是进行气体交换的主要器官，知道空气进出肺的通道顺序。\n3.知道呼吸时胸腔会扩张和收缩，是肺在随着胸廓的变化而吸气、呼气。\n\n科学思维：\n1.能根据模型和示意图，推理空气进入体内的路径。\n2.能把\"呼吸时胸廓起伏\"的外部现象与\"肺的扩张收缩\"的内部变化联系起来。\n\n探究实践：\n1.能观察呼吸系统模型或示意图，按顺序说出空气进出的路径。\n2.能完成\"呼吸时胸腔变化\"的测量与记录（用软尺量胸围）。\n3.能动手制作简易呼吸模型，模拟吸气与呼气的过程。\n\n态度责任：\n1.认识到呼吸器官的脆弱，愿意养成用鼻呼吸、不抠鼻子、远离烟尘等护肺习惯。\n2.在观察和交流中养成认真细致、基于事实表达的习惯。",
  "key": "认识人体呼吸系统的组成器官及其位置，知道空气进入肺的路径，并通过模型模拟理解呼吸时肺的扩张与收缩。",
  "hard": "呼吸器官都在体内，无法直接观察，学生很难建立\"空气一路走到肺\"的空间概念。难点在于：①记住各器官的名称和先后顺序；②理解肺是怎么\"自己\"吸气呼气的——这需要借助模型，把\"胸腔扩大→肺跟着扩大→空气被吸进来\"这个看不见的过程可视化。",
  "mat": "教师：呼吸系统教学挂图或模型1套、呼吸模拟装置（去底塑料瓶+气球+橡皮膜）1套、软尺2条、教学课件、记录单\n\n学生（四人小组）：呼吸系统示意图（每人1张）、软尺1条、制作呼吸模型的材料（大矿泉水瓶1个、气球2个、橡皮筋、剪刀、橡皮膜可用大气球剪开代替）\n\n【低成本替代】\n呼吸系统模型：可用透明塑料瓶＋气球自制（见教学过程）。\n挂图：可由教师在黑板上简笔画绘制呼吸道与肺的示意图。\n软尺：可用绳子量出长度后在直尺上比对。",
  "proc": "一、激趣导入（5分钟）\n材料准备：教学课件\n\n1.提问：上一节课我们憋过气，知道人离不开呼吸。那我们吸进去的空气，在身体里走过了一条怎样的路？\n\n预设1：从鼻子进去的。\n预设2：进到肚子里。\n预设3：到肺里面。\n\n2.追问：鼻子进去以后呢？中间还经过了哪些地方？到肺以后又去了哪里？\n\n3.引入：这条路我们看不见，今天我们就拿一张\"地图\"，把这条路走一遍。\n（板书课题：认识呼吸器官）\n\n二、新课教学（28分钟）\n\n（一）认识呼吸系统的组成（10分钟）\n材料准备：呼吸系统挂图或模型、每人一张示意图\n\n1.教师出示挂图，学生对照自己手中的示意图，从上往下认识各个器官。\n\n2.教师按顺序讲解并板书：\n·鼻：空气的入口，里面有鼻毛和黏液，能挡住灰尘、温暖空气；\n·咽：鼻子和嘴巴后面共同的通道；\n·喉：喉咙，里面有声带，我们说话的声音就是在这里产生的；\n·气管：一根管子，前面有好多\"C\"形的软骨环撑着，保证管子不会瘪掉；\n·支气管：气管到肺里以后分成两根，左一根、右一根，再不断分叉，像树枝一样；\n·肺：位于胸腔里，左右各一个，是气体交换的地方。\n\n3.小活动：同桌互相指一指——请一位同学说器官名，另一位在自己身上指出大致位置。\n\n4.提问：谁能按顺序说出空气进入身体的路线？\n预设：鼻 → 咽 → 喉 → 气管 → 支气管 → 肺\n（学生说完后，教师带领全班一起说两遍，并在板书上用箭头标出方向）\n\n5.强调：呼气的时候，路线正好反过来——肺 → 支气管 → 气管 → 喉 → 咽 → 鼻。\n\n（二）体验：呼吸时胸腔的变化（8分钟）\n材料准备：软尺、记录单\n\n1.提问：我们平时呼吸，有没有注意过胸口的变化？\n\n2.测量活动：两人一组，用软尺量一量同桌的胸围——深吸气时一次，深呼气时一次。\n提醒：软尺要水平绕一圈，位置保持在乳头（或腋下）水平线；不要勒太紧。\n\n3.记录并交流。\n提问：吸气和呼气时，胸围一样吗？\n预设：不一样，吸气时胸围更大。\n\n4.追问：吸气的时候，是什么把胸腔\"撑大\"的？\n预设1：是肺吸满了气。\n预设2：是肋骨动了。\n\n5.教师讲解：吸气时，肋骨向上向外抬、膈肌向下压，胸腔变大，肺也跟着被\"拉开\"，肺里的压力变小了，外面的空气就被\"压\"了进来；呼气时正好相反，胸腔变小，肺被挤小，气就被挤出去了。\n\n师小结：肺自己不会动，是胸腔的变化带动着肺一起变大变小——就像我们待会儿要做的这个模型一样。\n\n（三）制作并观察呼吸模型（10分钟）\n材料准备：每组大矿泉水瓶1个、气球2个、剪刀、橡皮筋\n\n1.教师示范制作步骤：\n①把大矿泉水瓶的底部剪掉（注意剪口要平滑，可用胶带包边防割手）；\n②把一个气球从瓶口塞进去，气球口翻过来套在瓶口上，用橡皮筋固定——这个气球代表\"肺\"；\n③把另一个气球剪开，撑平后蒙在瓶子剪开的底部，用橡皮筋扎紧——这层橡皮膜代表\"膈肌\"；\n④做成一个密封的瓶子。\n\n2.学生分组制作，教师巡视协助（剪瓶底和塞气球是难点，教师要多帮忙）。\n\n3.观察与思考：\n·用手向下拉底部的橡皮膜（膈肌下降），观察瓶内的气球（肺）有什么变化；\n·松手，再观察。\n\n提问：向下拉橡皮膜时，瓶里的气球怎么了？\n预设：气球鼓起来了（变大）。\n\n追问：为什么瓶子里面没吹气，气球却鼓起来了？\n引导：拉下橡皮膜，瓶内的空间变大了，压力变小，外面的空气就从瓶口进来，把气球吹鼓了。\n\n4.教师联系人体：向下拉橡皮膜 = 膈肌下降，胸腔变大 = 吸气；松手 = 膈肌上升，胸腔变小 = 呼气。\n\n师小结：我们用这个模型，把看不见的呼吸过程\"演\"出来了。科学中很多看不见的过程，都可以像这样用模型来研究。\n\n三、课堂总结（5分钟）\n1.提问：空气进入身体要经过哪些器官？请按顺序说一遍。\n预设：鼻 → 咽 → 喉 → 气管 → 支气管 → 肺。\n2.提问：吸气时，胸腔和肺发生了什么变化？\n预设：胸腔变大，肺也跟着变大，空气被吸进来。\n3.情感提升：肺是很娇嫩的器官，灰尘、细菌、香烟的烟雾都会伤害它。我们应该怎么做？\n预设：用鼻子呼吸、不抠鼻子、雾霾天戴口罩、远离吸烟的人、多运动。\n4.布置：回家用吸管和两个小纸杯，跟爸爸妈妈讲一讲空气在身体里走过的路。\n\n【提醒：制作模型时用剪刀要注意安全；气球碎片收进垃圾桶】",
  "board": "                   2. 认识呼吸器官\n\n    空气进入的路线：\n        鼻 → 咽 → 喉 → 气管 → 支气管 → 肺\n        ↑                                  ↓\n        └────────── 呼出时路线相反 ─────────┘\n\n    呼吸模型：\n        瓶口（气管）  ↓\n        瓶内气球   =  肺\n        瓶底橡皮膜 =  膈肌\n\n    向下拉橡皮膜 → 瓶内空间变大 → 气球鼓起 = 吸 气\n    松手         → 瓶内空间变小 → 气球瘪下 = 呼 气\n\n    保护肺：用鼻呼吸 · 不抠鼻子 · 戴口罩 · 远离香烟 · 多运动",
  "reflect": ""

 "4|呼吸与消化|4": {
  "goal": "科学观念：\n1.知道肺活量是指在不限时间的情况下，一次最大吸气后再尽最大能力呼出的气体量。\n2.知道肺活量的大小与年龄、性别、身高、体重、体育锻炼等因素有关。\n3.知道经常参加体育锻炼可以增大肺活量，增强呼吸功能。\n\n科学思维：\n1.能根据测量数据比较不同同学的肺活量大小，找出可能与肺活量相关的因素。\n2.能初步意识到测量需要重复进行、取较稳定的数值，理解\"多次测量求平均/取最大值\"的意义。\n\n探究实践：\n1.能规范使用肺活量测量袋（或自制排水法装置）完成测量，掌握\"深吸一口气—缓慢全部吹出—不留余气\"的操作要领。\n2.能准确读取并记录数据，制作小组数据对比表。\n3.能通过对比数据，发现自己肺活量的特点，并提出增强体质的锻炼计划。\n\n态度责任：\n1.愿意如实记录自己的真实数据，不因为数值小而感到难为情或篡改数据。\n2.认识到坚持锻炼能改善身体机能，愿意把锻炼落实到日常行动中。\n3.实验中注意卫生，使用一次性吹嘴或做好消毒，不与他人共用吹嘴。",
  "key": "学会用肺活量测量袋（或自制装置）规范测量肺活量，通过数据比较探究影响肺活量大小的因素，知道锻炼可以增大肺活量。",
  "hard": "①操作关：学生容易\"吹不干净\"或\"中途换气\"，导致数据偏小；也容易因紧张而吹得过快。②读数关：排水法装置读数时俯视、仰视会带来误差。③数据分析关：学生容易把\"谁大谁小\"当成结论，难以自主发现\"与体育锻炼有关\"这一规律，需要教师设计对比问题加以引导。",
  "mat": "教师：肺活量测量袋（或简易肺活量计）2—3套、一次性吹嘴若干（或用酒精棉片消毒）、记录单、汇总表（大张或课件）、教学课件\n\n学生（四人小组）：肺活量测量袋1套（或自制排水法装置1套）、一次性吹嘴每人1个、记录单、汇总表\n\n【低成本替代 —— 排水法自制肺活量装置】（器材不足时必用）\n材料：大号透明饮料瓶（2升或5升）1个、大水盆1个、长约50厘米的橡胶管或软管1根、记号笔、水。\n做法：①瓶内装满水，盖紧瓶盖，倒扣在水盆中，瓶口浸在水面以下再打开瓶盖（水不会流出）；②把软管从瓶口伸进瓶底；③向管内吹气，气体把水从瓶中排出，排出多少水就等于呼出多少气体。\n测量：吹完后，用记号笔在瓶上标出水面位置，倒过来用量杯装水测出\"被排出的水的体积\"，即肺活量（毫升）。\n注意：软管要伸到瓶底；瓶口始终要在水面以下。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件\n\n1.情境：学校运动会要举行游泳比赛和长跑比赛，体育老师想知道哪位同学的\"气\"更长。\n\n提问：你怎么判断一个人的\"气\"长不长？\n预设1：看他能憋气多久。\n预设2：看他一口气能吹多大一个气球。\n预设3：看他跑步累不累。\n\n2.追问：我们能不能用一个准确的数字，把\"一口气有多长\"表示出来？\n\n3.引入：今天我们来学习一项重要的身体指标——肺活量，并且亲自测一测。\n（板书课题：测量肺活量）\n\n二、新课教学（28分钟）\n\n（一）认识肺活量（4分钟）\n1.教师讲解：肺活量是指，尽你所能深吸一口气，然后尽最大力气把气全部吹出来，吹出的气体的总量就叫肺活量。单位通常用\"毫升\"（mL）。\n\n2.示范（关键动作）：\n①先做两三次深呼吸；\n②最后一次深深吸一口气，吸到不能再吸；\n③把吹嘴含紧（或用软管贴紧嘴），慢慢地、均匀地把气全部吹出去；\n④吹到感觉\"一点气都没有了\"为止，中间不能换气、不能漏风。\n\n3.强调：吹的时候要慢，不能\"噗\"地一下猛吹——猛吹容易头晕，也测不准。\n\n（二）学习使用测量工具（5分钟）\n材料准备：每组测量袋或自制装置\n\n1.教师介绍两种测量方法：\n方法一（有肺活量袋）：把袋子里的气全部排空，装上一次性吹嘴，深吸气后一次性吹入，读袋子上的刻度。\n方法二（排水法自制装置）：深吸气后通过软管向倒扣在水中的瓶子里吹气，看排出多少水。\n\n2.教师演示完整流程，特别强调：\n·吹嘴是一次性的，每人一个，不能混用（卫生）；\n·吹之前装置要\"归零\"（袋子排空气 / 瓶子装满水）；\n·吹的过程中手要捏紧接口，不能漏气；\n·读数时视线要与液面（或刻度）齐平。\n\n（三）分组测量（14分钟）\n材料准备：每组测量装置、吹嘴、记录单、汇总表\n\n1.四人小组分工：操作员1人、读数员1人、记录员1人、器材员1人（下一轮轮换）。\n\n2.测量要求：每人测量3次，取最大的那一次作为自己的肺活量。\n（解释：就像运动会跳远取最好的成绩一样，肺活量也取三次中最好的一次）\n\n3.学生分组测量，教师巡视，重点指导：\n·吸气不足的学生——提醒\"像闻花香一样深深吸，把肚子吸鼓\"；\n·漏气的学生——提醒嘴唇包紧吹嘴、用手捏住接口；\n·吹得太快的学生——提醒\"慢慢吹，像吹蜡烛但要吹很久\"；\n·排水法读数——提醒视线齐平、瓶子不能提出水面。\n\n4.个人记录，然后小组汇总，把四人的数据填进汇总表。\n\n5.全班汇总：各组报出本组最大的数值，教师写在黑板上形成全班数据表。\n\n（四）研讨：肺活量与什么有关（5分钟）\n材料准备：全班数据表\n\n1.提问：看看这些数据，谁的肺活量最大？谁的最小？相差多少？\n\n2.追问：为什么同学们的肺活量不一样大？请你猜一猜，可能和什么有关？\n预设1：和个子高矮有关，个子大的肺大。\n预设2：和胖瘦有关。\n预设3：和男生女生有关。\n预设4：和爱不爱运动有关。\n预设5：和年龄有关。\n\n3.教师引导验证：请班里最爱运动的几位同学报一报自己的肺活量，再请平时很少运动的同学报一报。\n提问：发现了什么？\n预设：爱运动的同学肺活量普遍大一些。\n\n4.教师补充：肺活量的大小和年龄、性别、身高体重都有关系，但**体育锻炼是我们可以自己改变的因素**。经常跑步、游泳、跳绳的同学，肺活量会明显增大，因为锻炼让呼吸肌更有力，肺也更\"能装气\"。\n\n5.追问：怎样做才能让自己的肺活量变大？\n预设：坚持跑步、游泳、跳绳、打球，每天坚持锻炼。\n\n师小结：肺活量不是一成不变的，它可以通过锻炼来改变。今天我们测的是\"现在的自己\"，坚持锻炼一个学期，我们再测一次，看看谁进步最大。\n\n三、课堂总结（6分钟）\n1.提问：什么是肺活量？怎么测才准？\n预设：深吸一口气再全部吹出的气体量；要深吸慢吹、吹三次取最大值、不能漏气。\n2.提问：肺活量大有什么好处？\n预设：运动时不容易累，身体更健康。\n3.情感提升：今天我们测出的数值有大有小，这都很正常——它只是告诉你\"现在的身体状态\"。重要的是从今天开始，为自己定一个小目标：每天坚持锻炼半小时。\n4.布置：制作一张\"我的锻炼打卡表\"，记录每天的锻炼内容，一个学期后再测一次肺活量，比一比进步了多少。\n\n【卫生要求：一次性吹嘴用后集中丢弃；非一次性器材用酒精棉片擦拭消毒；排水法的水盆使用后倒净】",
  "board": "                    4. 测量肺活量\n\n    什么是肺活量？\n    尽最大力吸气 → 尽最大力全部吹出 → 吹出的气体总量\n          单位：毫升（mL）\n\n    测量步骤（三字诀）：\n      ① 深 —— 深吸一口气，吸到不能再吸（肚子鼓起）\n      ② 慢 —— 慢慢均匀吹出，不能猛吹、不能换气\n      ③ 尽 —— 吹到一点不剩，取三次中最大的一次\n\n    注意事项：\n      · 吹嘴一次性，不混用（卫生）\n      · 装置先用前归零（袋排空 / 瓶装满水）\n      · 接口不漏气，读数视线齐平\n\n    排水法装置（器材不足时自制）：\n      装满水的瓶子倒扣水中 → 软管伸到瓶底 → 吹气排水\n      排出多少水 = 呼出多少气\n\n    结论：肺活量与年龄、性别、身高体重有关，\n          ★ 坚持体育锻炼可以增大肺活量 ★",
  "reflect": ""
 },
 "4|声音|1": {
  "goal": "科学观念：\n1.知道声音是由物体振动产生的，振动停止，声音就消失了。\n2.知道发声的物体都在振动，只是有些振动明显、有些不明显。\n3.知道声音有强弱、高低等不同特征（本课只感知，后续深入）。\n\n科学思维：\n1.能通过\"看得见的振动\"（音叉溅水、鼓上纸屑跳动）推理出\"看不见的振动\"（钢尺抖动）也在发生。\n2.能根据\"按住振动的物体，声音立刻消失\"这一反证，确认振动与发声的因果关系。\n\n探究实践：\n1.能完成钢尺、橡皮筋、音叉、鼓面等多个发声实验，观察并记录振动现象。\n2.能运用\"放大法\"（借助水面、纸屑、泡沫球等）观察不明显的振动。\n3.能规范使用音叉，掌握敲击与止振的方法。\n\n态度责任：\n1.乐于动手尝试身边的各种材料，乐于发现\"原来它也在振动\"。\n2.小组实验时能做到轻声、有序，避免制造过大噪声影响他人。",
  "key": "通过钢尺、橡皮筋、音叉、鼓面等一系列发声实验，观察物体发声时的振动现象，并用\"振动停止声音消失\"加以反证，建立\"声音是由物体振动产生的\"这一核心概念。",
  "hard": "很多物体的振动肉眼看不见（如钢尺快速抖动、空气柱振动），学生难以把\"声音\"和\"振动\"联系起来。难点在于：①引导学生用\"放大法\"把看不见的振动变成看得见的现象；②通过\"止振即止声\"的反证，让学生确信是振动产生了声音，而不是\"敲一下就响了\"。",
  "mat": "教师：音叉1套（带共鸣箱和音锤）、水槽（装水）、鼓1面、纸屑若干、教学课件、慢动作视频（吉他弦振动）\n\n学生（四人小组）：钢尺1把、橡皮筋2根、空纸盒1个、小鼓（或碗＋气球皮自制）1个、纸屑一小撮、水槽（装半盆水）1个、记录单\n\n【低成本替代】\n音叉：可用金属调羹、不锈钢筷子代替（轻敲后接触水面同样溅起水花）。\n鼓：用碗口蒙上气球皮、用橡皮筋扎紧即可。\n共鸣箱：可用空纸盒代替，把音叉或振动的物体放在上面放大声音。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件、一个能发声的物品（如小鼓）\n\n1.听一听：请全班安静，闭上眼睛，听30秒钟。\n提问：你听到了什么声音？\n预设1：有同学说话的声音。\n预设2：外面操场上的声音。\n预设3：风扇转动的声音。\n预设4：自己的心跳声。\n\n2.追问：这些声音是哪里来的？是谁在\"发\"出来的？\n\n预设1：人说话是嘴巴发出的。\n预设2：风扇是转动的时候响的。\n预设3：敲桌子就有声音。\n\n3.教师敲一下鼓，\"咚\"的一声。\n提问：敲一下鼓，鼓就响了。那\"响\"是怎么产生的？鼓在响的时候，它自己是什么状态？\n\n4.引入：今天我们就来揭开声音的秘密。\n（板书课题：声音是怎样产生的）\n\n二、新课教学（28分钟）\n\n（一）活动一：让钢尺发出声音（7分钟）\n材料准备：每组钢尺1把\n\n1.任务：想办法让桌上的钢尺发出声音。\n\n2.学生尝试（预设：拨动、弹、敲桌面、用嘴吹）。\n\n3.提问：钢尺发声的时候，你看到了什么？\n\n预设1：钢尺在上下抖动。\n预设2：钢尺在快速地来回动。\n预设3：看不清楚，只看见模糊的影子。\n\n4.追问：钢尺不动的时候有声音吗？——没有。\n继续追问：那声音和\"动\"有什么关系？\n\n5.教师引出科学词汇：钢尺这种快速的、来回反复的运动，科学上叫做\"振动\"。\n（板书：振动）\n\n6.小活动：拨动钢尺让它发声，然后用手按住钢尺。\n提问：按住以后发生了什么？\n预设：声音马上没有了。\n追问：为什么声音没有了？\n预设：因为钢尺不动了，不振动了。\n\n师小结：钢尺振动 → 有声音；振动停止 → 声音消失。看来声音和振动关系密切。\n\n（二）活动二：橡皮筋和\"纸盒吉他\"（7分钟）\n材料准备：每组橡皮筋2根、空纸盒1个\n\n1.任务：把橡皮筋套在纸盒上，拨动它，让它发声。\n\n2.提问：橡皮筋发声时，它在振动吗？你是怎么知道的？\n预设1：能看到橡皮筋在抖。\n预设2：手摸上去麻麻的。\n\n3.追问：怎样让正在响的橡皮筋立刻安静下来？\n学生操作：用手按住橡皮筋。\n预设：一按住，声音就没了。\n\n4.教师小结（反证）：按住 → 振动停止 → 声音立刻消失。这个现象反过来证明了：声音确实是振动产生的。\n\n（三）活动三：看不见的振动，怎么\"看\"见（8分钟）\n材料准备：音叉、水槽（装水）、鼓、纸屑\n\n1.教师拿出音叉，敲击后靠近耳边。\n提问：听到声音了吗？音叉在振动吗？你怎么知道的？\n预设1：听到了声音，但看不见它在动。\n预设2：手摸上去有点麻。\n\n2.提问：有什么办法能\"看见\"音叉在振动？\n\n预设1：放在水里看。\n预设2：上面放点轻的东西。\n\n3.演示一（水花法）：教师敲击音叉后，把音叉的顶端轻轻接触水面。\n提问：看到了什么？\n预设：水面溅起了水花，还有一圈圈波纹。\n\n4.演示二（纸屑法）：在鼓面上撒一些碎纸屑，敲击鼓面。\n提问：纸屑怎么了？\n预设：纸屑在鼓面上跳起来了。\n\n5.追问：纸屑为什么跳起来？\n预设：是鼓面在振动，把纸屑弹起来了。\n\n6.教师点明方法：像水花、纸屑这样，把不容易看见的振动变成容易看见的现象，科学上叫\"放大法\"，这是研究微小变化的好办法。\n\n7.学生分组体验：用音叉接触水面（或用不锈钢调羹代替），观察水花。\n\n（四）研讨：声音到底是怎么产生的（6分钟）\n1.提问：我们做了钢尺、橡皮筋、音叉、鼓面的实验，它们有什么共同点？\n预设：发声的时候都在振动；不振动就没有声音。\n\n2.追问：能不能说一句话，把\"声音\"和\"振动\"的关系说清楚？\n预设示范：声音是由物体振动产生的，振动停止，声音就消失了。\n（带领全班齐说两遍，教师板书）\n\n3.提问：人说话的声音是怎么产生的？\n预设1：嘴巴动。\n预设2：是声带在振动。\n\n4.小活动：把手轻轻按在自己的喉咙上，说\"啊——\"，感受一下。\n提问：有什么感觉？\n预设：手感觉到麻麻的、在抖动。\n师：这就是声带在振动。说话时声带振动，我们就发出了声音。\n\n5.拓展（配合慢动作视频）：吉他、二胡的弦振动，笛子里的空气柱振动，蜜蜂翅膀振动——它们都在振动，都在发声。\n\n三、课堂总结（6分钟）\n1.提问：今天我们用哪些方法，把\"看不见的振动\"变成了\"看得见的现象\"？\n预设：用水花、用纸屑、用手摸、用慢动作视频。\n2.请用自己的话说说：声音是怎么产生的？\n预设：声音是由物体振动产生的，振动停止声音就消失。\n3.教师提升：今天我们用的\"放大法\"和\"反证法\"（按住就不响），是科学探究中非常重要的两种方法，以后研究别的问题也能用得上。\n4.布置：回家找三样能发声的东西，做一做\"让它发声—让它停下\"的小实验，看看是不是所有发声的物体都在振动。\n\n【提醒：音叉用后放回盒中，不要互相敲击；水面实验后擦干桌面】",
  "board": "                 1. 声音是怎样产生的\n\n    实验记录：\n    ┌──────────┬────────────┬──────────┐\n    │  物 体    │ 发声时的现象 │ 停止振动后 │\n    ├──────────┼────────────┼──────────┤\n    │  钢 尺    │ 上下抖动     │ 声音消失   │\n    │  橡皮筋   │ 来回颤动     │ 声音消失   │\n    │  音 叉    │ 溅起水花     │ 声音消失   │\n    │  鼓 面    │ 纸屑跳动     │ 声音消失   │\n    │  声 带    │ 手摸发麻     │ 声音消失   │\n    └──────────┴────────────┴──────────┘\n\n    方法：放大法（水花·纸屑）  反证法（按住即止声）\n\n    ★ 结论：声音是由物体振动产生的。\n            振动停止 → 声音消失 ★",
  "reflect": ""

 "4|声音|3": {
  "goal": "科学观念：\n1.知道声音有高、低之分，声音的高低叫做\"音高\"。\n2.知道物体振动得越快，发出的声音越高；振动得越慢，声音越低。\n3.知道物体的长短、粗细、松紧等会影响振动的快慢，从而改变声音的高低。\n\n科学思维：\n1.能通过对比实验找出\"振动快慢\"与\"声音高低\"的对应关系。\n2.能运用\"控制变量\"的思想，理解在比较长短不同的物体时，要用力相同、材料相同。\n\n探究实践：\n1.能完成\"钢尺伸出长短不同\"的对比实验，规范操作（用相同的力拨动）。\n2.能观察管子长短、橡皮筋松紧对声音高低的影响，并记录。\n3.能尝试用自制小乐器（水瓶琴、橡皮筋琴）演奏一段简单的音阶。\n\n态度责任：\n1.对声音的奥秘保持好奇，乐于用身边的材料探索。\n2.实验中注意控制音量，不影响其他小组；学会轮流操作、倾听他人。",
  "key": "通过钢尺长短、管子长短、橡皮筋松紧等对比实验，探究振动快慢与声音高低的关系，知道振动越快声音越高，振动越慢声音越低。",
  "hard": "①\"高低\"与\"强弱\"极易混淆——学生常把\"声音大\"说成\"声音高\"。教学时必须在同一物体上反复对比：轻轻拨（弱）与用力拨（强）是强弱；长尺与短尺是高低。②\"振动快慢\"看不见，需要引导学生观察钢尺抖动的\"影子\"或用慢动作视频辅助。③控制变量是难点：拨动钢尺的力度必须相同，否则学生会把\"用力大\"误当成\"声音高\"。",
  "mat": "教师：钢尺1把、装水玻璃试管（或玻璃杯）7支、水、教学课件（含吉他弦振动慢动作视频）、铝板琴或木琴1台、记录单\n\n学生（四人小组）：钢尺1把、相同玻璃杯（或试管）4—5个、水、橡皮筋（粗细不同）若干、空纸盒1个、记录单\n\n【低成本替代】\n玻璃试管：可用相同的玻璃杯、瓷碗、矿泉水瓶（剪齐）代替，装入不同高度的水。\n铝板琴：可用几根长度不同的金属条、竹片悬挂起来自制。\n橡皮筋琴：纸盒＋不同粗细的橡皮筋即可。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件（播放一段音阶或简单旋律）\n\n1.教师播放一段上行音阶（do re mi fa sol la si）。\n提问：这些声音有什么不一样？\n预设：有的尖、有的粗；有的高、有的低。\n\n2.教师再播放同一段旋律，但音量调大。\n提问：现在变的是什么？——声音变大了。\n追问：声音\"变大\"和刚才的\"变高\"，是同一回事吗？\n预设：不是，一个是大小，一个是高低。\n\n3.教师点明：声音的大小叫\"强弱\"，我们上一课研究过；声音的\"尖\"和\"低沉\"叫\"高低\"，科学上称为\"音高\"。今天我们就专门研究声音的高低。\n（板书课题：声音的高低）\n\n二、新课教学（28分钟）\n\n（一）活动一：钢尺的长短与声音高低（12分钟）\n材料准备：每组钢尺1把、记录单\n\n1.教师示范：把钢尺一端紧压在桌边，另一端伸出桌面。\n\n2.对比实验一：钢尺伸出桌面约15厘米，用同样的力拨动，听声音，看振动。\n对比实验二：钢尺只伸出桌面约5厘米，用**同样的力**拨动，听声音，看振动。\n\n3.强调（控制变量）：两次拨动的力量要一样大；钢尺要压紧在桌边，不能晃动。\n\n4.提问：两次的声音有什么不同？\n预设1：伸出来长的时候，声音比较低沉。\n预设2：伸出来短的时候，声音比较尖、比较高。\n\n5.追问：钢尺的振动有什么不同？\n预设1：伸出来的部分长，抖得慢。\n预设2：伸出来的部分短，抖得快。\n\n6.引导归纳（教师板书对应关系）：\n伸出长 → 振动慢 → 声音低\n伸出短 → 振动快 → 声音高\n\n7.教师讲解：物体振动得越快，发出的声音就越高；振动得越慢，声音就越低。\n\n8.小活动：同桌两人一组，一人改变钢尺伸出长度，另一人闭眼听，判断\"高\"还是\"低\"，轮换进行。\n\n（二）活动二：管子（水杯）的长短与声音高低（8分钟）\n材料准备：每组相同的玻璃杯4—5个、水、记录单\n\n1.任务：在几个相同的杯子里倒入不同高度的水，用筷子依次敲击杯口，听听声音有什么变化。\n\n2.学生实验，教师巡视。\n提问：水多的杯子和水少的杯子，声音有什么不同？\n\n预设1：水多的杯子声音低。\n预设2：水少的杯子声音高。\n\n3.追问：为什么会这样？\n引导：敲击杯子，振动的是杯壁和水。水越多，整体越\"重\"、振动越慢，声音就越低；水越少，振动越快，声音越高。\n\n4.拓展：让学生试着按\"水从多到少\"的顺序排列杯子，敲击出一串由低到高的音，演奏一小段旋律。\n\n5.教师补充：这就是\"水瓶琴\"的原理。想让声音更高，可以怎么做？——把水倒掉一些。\n\n（三）活动三：橡皮筋的松紧与声音高低（8分钟）\n材料准备：每组纸盒1个、粗细不同的橡皮筋若干\n\n1.任务：把橡皮筋套在纸盒上，想办法让它发出高低不同的声音。\n\n2.学生尝试，教师引导发现三种方法：\n方法一：把橡皮筋拉得更紧或放松；\n方法二：换用更细或更粗的橡皮筋；\n方法三：改变橡皮筋振动部分的长度（用手指按住不同位置）。\n\n3.提问：怎样让橡皮筋发出更高的声音？\n预设1：把它拉紧一些。\n预设2：换一根细的。\n预设3：手指按住，让振动的部分变短。\n\n4.追问：为什么拉紧了声音就变高？\n引导：拉紧以后，橡皮筋绷得更紧，振动得更快，所以声音更高。\n\n5.教师联系乐器（配合慢动作视频）：吉他、二胡、古筝就是这样调音的——手指按在弦的不同位置，改变弦的长短；拧动琴轴，改变弦的松紧。弦越短、越细、越紧，声音就越高。\n\n6.研讨（本单元最关键的辨析）：\n提问：用力拨和轻轻拨，改变的是声音的什么？\n预设：用力拨声音大（强），轻轻拨声音小（弱）——这是强弱。\n提问：把弦按短一点，改变的是声音的什么？\n预设：声音变尖了（高）——这是高低。\n教师强调：**强弱是\"用力大小\"决定的，高低是\"振动快慢\"决定的，两者完全不同。**\n\n三、课堂总结（6分钟）\n1.提问：声音的高低和什么有关？\n预设：和物体振动的快慢有关，振动越快声音越高。\n2.提问：怎样让一个物体发出的声音变高？\n预设：让它振动得更快——变短、变细、变紧。\n3.辨析小测：教师拨钢尺，学生判断\"变高了还是变强了\"，巩固强弱与高低的区别。\n4.布置：回家用几个相同的杯子做一杯\"水瓶琴\"，试着敲出一首简单的歌，下节课带来展示。\n\n【提醒：玻璃杯要轻拿轻放；实验时控制音量，不要影响隔壁班级】",
  "board": "                    3. 声音的高低\n\n    一、钢尺实验（控制变量：用力相同）\n        伸出长（15cm） → 振动慢 → 声音低 ↘低沉\n        伸出短（ 5cm） → 振动快 → 声音高 ↗尖细\n\n    二、水杯实验\n        水多 → 振动慢 → 声音低\n        水少 → 振动快 → 声音高\n\n    三、橡皮筋实验\n        拉紧 · 变细 · 变短 → 振动快 → 声音高\n        放松 · 变粗 · 变长 → 振动慢 → 声音低\n\n    ★ 结论：物体振动越快 → 声音越高（音高越高）★\n\n    ⚠ 易混辨析：\n        强弱 ← 用力大小（振幅）\n        高低 ← 振动快慢（频率）",
  "reflect": ""

 "4|声音|7": {
  "goal": "科学观念：\n1.知道声音的传播需要物质（介质），固体、液体、气体都能传播声音。\n2.知道真空不能传播声音。\n3.知道声音在不同物质中传播的效果不同，一般固体传声效果最好，气体最差。\n\n科学思维：\n1.能根据\"听不到声音\"或\"声音变小\"的现象，推理出介质在传播中的作用。\n2.能运用\"逐渐抽出空气→声音逐渐变小\"的思路，合理外推到\"真空不能传声\"。\n\n探究实践：\n1.能完成\"土电话\"（固体传声）、\"水中敲石块\"（液体传声）等实验，观察并描述现象。\n2.能观察\"真空罩闹铃\"实验（实物或视频），记录声音随空气减少的变化。\n3.能制作一个简易土电话，并探究怎样让它听得更清楚。\n\n态度责任：\n1.乐于动手制作学具，体会\"科学就在身边\"。\n2.能基于实验事实得出结论，即使现象不明显也如实记录、不编造。\n3.了解宇航员在太空中需要无线电通话，感受科学知识的应用价值。",
  "key": "通过土电话（固体传声）、水中传声、真空罩实验，认识声音的传播需要介质，固体、液体、气体都能传声，真空不能传声。",
  "hard": "①\"声音靠什么传过来\"这个问题，学生的直觉是\"声音自己飞过来的\"，很难想到需要\"中间的东西\"。②真空罩实验是\"理想实验\"——现实中无法抽成绝对真空，需要引导学生从\"空气越少声音越小\"合理外推到\"没有空气就听不到\"，这是一种重要的科学推理方法。③土电话的棉线必须拉直才能传声，学生容易忽略这个关键条件。",
  "mat": "教师：真空罩实验装置（或实验视频）、闹钟或电铃1个、水槽（装水）、石块2块、教学课件、航天员太空通话视频片段\n\n学生（四人小组）：纸杯（或一次性塑料杯）2个、棉线（约3—5米）1团、牙签或小木棍2根、水槽（装大半盆水）1个、石块2块、记录单\n\n【低成本替代】\n真空罩：若学校没有，可用\"注射器＋小音乐贺卡\"代替——把发声的小元件放进大号注射器，堵住出口，拉动活塞让内部空气变稀薄，声音会明显变小；也可直接用课件中的真空罩实验视频。\n土电话：纸杯可用酸奶杯、竹筒代替；棉线可用缝纫线、尼龙线（棉线效果最好）。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件\n\n1.情境：教师在教室后面轻轻敲一下桌子（或拍一下手），问前排同学：听到声音了吗？\n预设：听到了。\n\n2.追问：声音是怎么从教室后面\"跑\"到我耳朵里的？中间经过了什么？\n预设1：声音自己飞过来的。\n预设2：通过空气传过来的。\n预设3：不知道，中间什么都没有啊。\n\n3.教师点出问题核心：中间真的\"什么都没有\"吗？我们和桌子之间，其实充满了——空气。\n提问：如果没有空气，还能听到声音吗？\n\n4.引入：今天我们就来研究声音是靠什么\"跑\"过来的。\n（板书课题：声音的传播）\n\n二、新课教学（28分钟）\n\n（一）活动一：声音能在空气中传播吗（4分钟）\n1.提问：我们平时能听到老师讲课、听到鸟叫、听到广播，这些声音是靠什么传来的？\n预设：空气。\n\n2.教师小结：像空气这样可以传播声音的物质，科学上叫做\"介质\"。\n（板书：介质）\n\n3.追问：除了气体（空气），还有哪些东西可能传播声音？\n预设：固体、水。\n\n（二）活动二：声音能在固体中传播吗 —— 土电话（10分钟）\n材料准备：每组纸杯2个、棉线、牙签\n\n1.制作土电话：\n①在两个纸杯底部各戳一个小孔；\n②把棉线的两端分别从杯底的小孔穿进杯内，各系在一小段牙签上（防止滑出）；\n③两个同学各拿一个纸杯，把线拉直。\n\n2.使用：一人对着杯子说话，另一人把杯子扣在耳朵上听。\n提醒：**棉线一定要拉直，不能松垮，也不能碰到别的东西。**\n\n3.提问：听到了吗？声音是靠什么传过来的？\n预设：听到了，是靠那根棉线传过来的。\n\n4.追问：为什么一定要把线拉直？如果线是松的、垂着的，还能听清吗？\n学生试验：让线松下来，再试一次。\n预设：松了以后听不清，或者听不到了。\n\n5.引导：拉直的棉线能把振动从一端传到另一端；线松了，振动就传不过去了。这说明——固体（棉线）可以传播声音。\n\n6.拓展体验（固体传声更强）：\n①把耳朵贴在桌面上，请同桌轻轻挠桌面另一端，听听声音；\n②对比：耳朵离开桌面，再听一次。\n提问：哪一次听得更清楚？\n预设：贴在桌面上听得更清楚，声音更大。\n师小结：固体不仅能传声，而且传声效果往往比空气更好。\n\n（三）活动三：声音能在液体中传播吗（6分钟）\n材料准备：每组水槽（装水）、石块2块\n\n1.任务：把两块石块浸没在水里，在水下互相敲击，请一位同学把耳朵贴在水槽外壁听。\n（或：一位同学在水下敲，其他同学在水槽边听）\n\n2.提问：在水里能听到敲击声吗？\n预设：能听到，声音闷闷的，但确实听到了。\n\n3.追问：这说明了什么？\n预设：水（液体）也能传播声音。\n\n4.教师联系生活：潜水员在水下能听到声音，渔民敲击船体会惊跑鱼群，钓鱼时要保持安静——这些都是液体传声的例子。\n\n（四）活动四：真空能传声吗（8分钟）\n材料准备：真空罩装置或实验视频、闹钟\n\n1.实验（或用视频演示）：\n①把一个正在响的闹钟放进玻璃罩里，此时能清楚地听到铃声；\n②用抽气机逐渐抽出罩内的空气；\n③观察铃声的变化。\n\n2.提问：随着空气被抽出，铃声发生了什么变化？\n预设：铃声越来越小，最后几乎听不见了。\n\n3.追问：闹钟还在响吗？——还在响（可以看到闹钟的部件在动）。\n继续追问：闹钟一直在振动、一直在发声，我们却听不到了，为什么？\n预设：因为中间没有空气了，声音传不出来。\n\n4.科学推理（重要）：\n提问：如果罩里一点空气都没有（真正的真空），会怎样？\n预设：完全听不到声音。\n教师点明：现实中抽气机很难把空气抽得一干二净，所以我们会听到一点点微弱的声音。但根据\"空气越少、声音越小\"这个规律，我们可以合理地推想：**如果完全没有空气（真空），声音就完全传不出来。**这种在实验基础上合理推想的方法，科学上叫做\"科学推理\"。\n\n5.联系应用：播放航天员在太空中的视频片段。\n提问：宇航员在月球上（或太空舱外）能直接对话吗？他们是怎么通话的？\n预设：不能直接对话，因为没有空气；他们用无线电。\n\n师小结：声音的传播需要介质——气体、液体、固体都能传声，真空不能传声。\n\n三、课堂总结（6分钟）\n1.提问：声音靠什么传播？\n预设：靠气体、液体、固体这些介质。\n2.提问：真空能不能传声？为什么？\n预设：不能，因为真空里没有任何物质可以传声。\n3.提问：固体、液体、气体相比，哪个传声效果最好？\n预设：固体最好，比如我们趴在桌上听得更清楚。\n4.教师提升：今天我们研究\"看不见\"的传声过程，用的是\"看现象—找规律—合理推想\"的办法。科学上很多重要的发现，都是这样一步步推理出来的。\n5.布置：回家做一个\"改进的土电话\"——试试用不同材料的线（棉线、尼龙线、铁丝、毛线）、不同的杯子（纸杯、塑料杯、金属杯），比一比哪种听得更清楚，把结果记下来。\n\n【提醒：水槽实验后把水倒掉、桌面擦干；土电话的线回收整理】",
  "board": "                    7. 声音的传播\n\n    一、气体传声：平时听到的一切 → 靠空气（介质）\n\n    二、固体传声：土电话\n        说话杯 —— 棉线（拉直！）—— 听筒杯\n        松线 → 传不过去\n        耳朵贴桌面 → 比空气中听得更清楚\n\n    三、液体传声：水中敲石块 → 能听到（声音发闷）\n\n    四、真空罩实验（科学推理）：\n        有空气 → 铃声清晰\n        抽出空气 → 铃声越来越小\n        推想：完全没有空气（真空）→ 完全听不到\n\n    ★ 结论：声音的传播需要介质。\n            固体 · 液体 · 气体都能传声；\n            ★ 真空不能传声 ★\n    应用：宇航员在太空中用无线电通话",
  "reflect": ""

 "5|微小世界|1": {
  "goal": "科学观念：\n1.知道放大镜是一种常见的观察工具，它的镜片特点是透明、中间厚、边缘薄，这样的镜片叫凸透镜。\n2.知道放大镜具有放大图像的作用，镜片凸度越大，放大倍数越大。\n3.知道观察工具能拓展人的视野，帮助人类看到肉眼看不见的细节。\n\n科学思维：\n1.能通过对比多块镜片，归纳出凸透镜\"中间厚、边缘薄\"的共同特征。\n2.能辨析\"放大倍数由凸度决定\"与\"镜片大小决定\"的易混点，破除\"镜片越大放得越大\"的错误前概念。\n\n探究实践：\n1.能规范使用放大镜（镜头对准物体，上下移动调整距离直到图像最清晰）。\n2.能对比肉眼观察与放大镜观察的效果差异，并如实画图记录。\n3.能利用身边材料（水滴、透明塑料片）自制简易放大镜，体会\"中间厚边缘薄就能放大\"。\n\n态度责任：\n1.对微小世界产生好奇心，乐于观察身边的细微之处。\n2.养成如实记录的习惯——只画真实看到的，不凭想象添加。\n3.知道放大镜是精密的光学工具，要轻拿轻放、用布擦拭，不能用手指或硬物刮擦镜片。",
  "key": "通过对比观察不同镜片、探究凸度与放大倍数的关系，认识放大镜（凸透镜）\"透明、中间厚、边缘薄\"的结构特点，知道凸度越大放大倍数越大。",
  "hard": "①易混点：学生普遍认为\"镜片越大，放得越大\"，必须设计对比实验（两块直径相同但凸度不同的放大镜）加以破除。②\"凸度\"这个概念比较抽象，需要让学生用手指触摸、侧面观察来感知。③自制放大镜（水滴）时，学生容易滴得太多或太少，需要教师示范\"刚好形成一个小鼓包\"。",
  "mat": "教师：不同凸度的放大镜若干（至少3块，其中两块直径相同、凸度不同）、凹透镜1块、平面镜1块、烧杯（装水）、教学课件、放大镜结构示意图\n\n学生（四人小组）：放大镜2—3块（凸度不同）、透明塑料片（或保鲜膜）1张、滴管1个、水、报纸（带小字）1张、树叶1片、布块、记录单\n\n【低成本替代】\n放大镜：可用老花镜片、手机微距镜头配件、装水的圆形透明瓶（横向观察）、滴在透明片上的水滴代替。\n凹透镜：可用近视眼镜片（教师保管，提醒学生不要随意触摸镜片）。\n平面镜：可用小镜子代替。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件、一片树叶\n\n1.教师出示一片树叶（或一张报纸的小字），请前排同学看。\n提问：你看到了什么？\n预设：叶脉、叶片上的纹路。\n\n2.追问：想看清叶片上更细小的纹路、报纸上字的小细节，怎么办？\n预设1：凑近一点看。\n预设2：用放大镜。\n\n3.教师发给每组一个放大镜，请学生用它观察同样的树叶。\n提问：现在看到了什么？和刚才有什么不同？\n预设1：叶脉变粗了，看得更清楚了。\n预设2：能看到叶片上有小绒毛。\n预设3：字变得很大。\n\n4.引入：放大镜是我们最常用的观察工具。可是，放大镜为什么能把东西\"变大\"？它到底有什么秘密？今天我们就来研究它。\n（板书课题：研究放大镜）\n\n二、新课教学（28分钟）\n\n（一）活动一：肉眼观察与放大镜观察对比（6分钟）\n材料准备：每组放大镜、报纸（小字）、树叶、记录单\n\n1.任务：先用肉眼观察报纸上的一行小字，再用放大镜观察同一行字，把两次看到的样子分别画在记录单上。\n\n2.强调观察方法（教师示范）：\n·放大镜要正对物体；\n·慢慢上下移动放大镜，直到看到的图像最大、最清楚；\n·眼睛、放大镜、物体三者要在一条直线上。\n\n3.学生活动，教师巡视纠正姿势。\n\n4.交流：两次观察有什么不同？\n预设：放大镜下的字更大、细节更清楚，能看到笔画边缘的毛刺、纸的纤维。\n\n师小结：放大镜能够帮助我们看到肉眼看不见的细微之处，它拓展了我们的观察能力。\n\n（二）活动二：研究放大镜的镜片有什么特点（8分钟）\n材料准备：每组放大镜2—3块、凹透镜、平面镜、记录单\n\n1.任务：看一看、摸一摸放大镜的镜片，找找它们的共同特点。\n提醒：摸的时候要轻，用指腹轻轻划过，不要用指甲刮。\n\n2.提问：放大镜的镜片有什么共同特点？\n预设1：透明的。\n预设2：中间鼓起来、厚一些，边上薄一些。\n预设3：表面是弯的（不是平的）。\n\n3.教师给出科学名称：像放大镜这样，透明、中间厚、边缘薄的镜片，叫做**凸透镜**。\n（板书：凸透镜——透明、中间厚、边缘薄）\n\n4.对比：教师出示凹透镜和平面镜，请学生分组观察、触摸。\n提问：它们和放大镜的镜片有什么不同？能放大吗？\n预设1：凹透镜是中间薄、边缘厚，不放大，反而变小。\n预设2：平面镜是平的，只能照出自己，不放大。\n\n5.学生试验：分别用凹透镜、平面镜看报纸上的字，验证是否放大。\n\n师小结：只有\"透明、中间厚、边缘薄\"的镜片才有放大作用，这就是凸透镜。\n\n（三）活动三：什么决定了放大的倍数（8分钟）\n材料准备：每组两块**直径相同、凸度不同**的放大镜、报纸\n\n1.提出猜想：教师出示两块大小一样、但一块更\"鼓\"的放大镜。\n提问：这两块放大镜，哪一块放得更大？\n预设1：一样大，因为它们一样大。\n预设2：更鼓的那块放得更大。\n\n2.实验验证：学生用两块放大镜分别看同一行字，比较放大效果。\n\n3.交流结果。\n预设：更鼓（凸度更大）的那块，字放得更大。\n\n4.追问：如果两块放大镜一样鼓，但一大一小呢？\n学生试验（教师提供直径不同、凸度相同的两块）。\n预设：放大效果差不多，一样大。\n\n5.教师点明易错点（重点）：\n★放大倍数是由镜片的**凸度**决定的，不是由镜片的大小决定的。镜片越大，只是能看到的\"范围\"更大，但放大的倍数并没有变大。\n\n师小结：凸度越大 → 放大倍数越大；镜片大小 → 只影响观察范围，不影响放大倍数。\n（板书：凸度越大 → 放大倍数越大；镜片大小 ✗ 不决定放大倍数）\n\n（四）活动四：自制放大镜（6分钟）\n材料准备：每组透明塑料片、滴管、水、报纸\n\n1.提问：如果没有放大镜，你能自己做出一个\"放大镜\"吗？\n\n2.教师示范：在透明塑料片（或保鲜膜）上滴一滴水，水滴会自然形成\"中间厚、边缘薄\"的形状。\n\n3.学生尝试：把滴了水的塑料片放在报纸上，透过水滴看字。\n提问：字放大了吗？\n预设：放大了！\n\n4.追问：为什么一滴水也能放大？\n引导：水滴是透明的，而且由于表面张力，它自然形成了中间厚、边缘薄的形状——所以它就是一枚小小的凸透镜。\n\n5.引申：生活中还有哪些东西有放大作用？\n预设：装水的圆形玻璃杯（从侧面看）、老花镜、手机镜头、露珠。\n\n师小结：只要满足\"透明、中间厚、边缘薄\"，就能放大。这也是人类最早发现放大镜的方式。\n\n三、课堂总结（6分钟）\n1.提问：放大镜的镜片有什么特点？\n预设：透明、中间厚、边缘薄，叫凸透镜。\n2.提问：什么决定了放大的倍数？\n预设：镜片的凸度，凸度越大放大倍数越大，与镜片大小无关。\n3.提问：怎样正确使用放大镜？\n预设：正对物体，慢慢移动直到图像最清晰；轻拿轻放，用布擦镜片。\n4.教师提升：放大镜是人类发明的第一件观察工具，它帮我们打开了通往微小世界的第一扇门。下节课我们会继续追问：如果放大镜还不够用，怎样才能放得更大？\n5.布置：回家找一找，家里有哪些东西具有放大作用，把它们记下来，下节课分享。\n\n【提醒：放大镜用软布擦拭，不要用手指或纸巾干擦；凹透镜（近视镜片）用后交回教师保管】",
  "board": "                     1. 研究放大镜\n\n    一、肉眼 vs 放大镜\n        肉眼：看到轮廓、大纹路\n        放大镜：看到细节、小绒毛、纸纤维\n\n    二、镜片的特点\n        凸透镜：透明 · 中间厚 · 边缘薄  ✔ 能放大\n        凹透镜：透明 · 中间薄 · 边缘厚  ✘ 变小\n        平面镜：平的表面              ✘ 只反光\n\n    三、什么决定放大倍数？\n        直径相同、凸度不同 → 更鼓的放得更大 ✔\n        凸度相同、直径不同 → 放大效果一样\n        ★ 凸度越大 → 倍数越大\n        ✗ 镜片大小不决定放大倍数（只影响范围）\n\n    四、自制放大镜\n        塑料片 + 一滴水 → 中间厚边缘薄 = 放大镜\n\n    使用要点：正对物体 · 慢慢移动 · 轻拿轻放 · 软布擦拭",
  "reflect": ""
 },
 "5|微小世界|4": {
  "goal": "科学观念：\n1.知道光学显微镜的主要结构：目镜、物镜、转换器、载物台、通光孔、压片夹、反光镜、粗准焦螺旋、细准焦螺旋、镜臂、镜座。\n2.知道显微镜的放大倍数 = 目镜倍数 × 物镜倍数。\n3.知道光学显微镜比简易显微镜放大倍数更高、成像更稳定，但需要制作玻片标本才能观察。\n\n科学思维：\n1.能通过对比简易显微镜与光学显微镜，分析两种工具各自的优点与不足。\n2.能理解\"放大倍数提高后，看到的视野会变小\"这一权衡关系。\n\n探究实践：\n1.能按\"安放 → 对光 → 放片 → 调焦 → 观察\"五步规范操作光学显微镜。\n2.能独立完成对光，获得明亮均匀的视野。\n3.能正确调焦，避免物镜压碎玻片。\n4.能画图记录显微镜下观察到的图像。\n\n态度责任：\n1.认识到显微镜是精密仪器，养成轻拿轻放、规范操作的习惯。\n2.小组内合理分工（操作员、记录员、器材员），轮流操作，人人动手。\n3.如实绘制观察到的图像，不照搬课本插图。",
  "key": "认识光学显微镜的结构，掌握\"安放—对光—放片—调焦—观察\"五步规范操作，能观察玻片标本并画图记录。",
  "hard": "①对光是最大的拦路虎——学生常常怎么转都看不到明亮的视野，需要教师一对一指导\"眼睛看目镜、同时慢慢转动反光镜\"。②调焦时镜筒下降必须**眼睛盯着物镜**，防止压碎玻片，这个动作与学生\"想看目镜里图像\"的本能相反，需要反复强调和示范。③器材不足时分组轮换，要保证每人都有操作机会，课堂组织是难点。",
  "mat": "教师：光学显微镜（演示用）1台、玻片标本若干（花粉、头发、字母\"e\"装片）、操作示范视频、结构挂图、教学课件\n\n学生：光学显微镜（2—4人1台，器材不足时分组轮换）、永久玻片标本（花粉／蛛丝／字母装片）每组2—3片、擦镜纸、记录单（含画图方框）\n\n【低成本替代 —— 器材不足应对方案（乡村学校重点）】\n1. 分组轮换法：全班分6—8组，每组操作8分钟，其余时间做\"结构认知\"\"画图练习\"\"显微镜结构拼图\"等任务，保证一节课内每组至少完整操作一轮。\n2. 替代工具：手持式简易显微镜、手机微距镜头（夹在手机摄像头上）可同步使用，让学生先建立\"放大的图像\"的直观印象。\n3. 演示优先：教师先用实物投影或手机投屏，把显微镜下的画面投到大屏幕上，全班一起观察，再分组动手。\n4. 标本自制：花粉、头发、洋葱表皮、纸纤维都可自制临时装片，成本极低。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件、手持简易显微镜、光学显微镜\n\n1.回顾：上节课我们用放大镜观察了树叶和报纸。\n提问：如果想看清更细小的东西，比如一根头发上的鳞片、一粒花粉，放大镜还够用吗？\n\n预设：不够，要放得更大。\n\n2.教师出示手持简易显微镜和光学显微镜。\n提问：这两样工具，你们认识吗？在哪见过？\n预设1：在医院见过。\n预设2：在科学书上见过。\n\n3.引入：今天我们就要学会使用实验室里这件最重要的仪器——光学显微镜。\n（板书课题：用光学显微镜观察）\n\n二、新课教学（28分钟）\n\n（一）认识显微镜的结构（7分钟）\n材料准备：显微镜结构挂图、每组显微镜1台\n\n1.教师对照挂图，逐一介绍结构（学生对照自己桌上的实物找一找）：\n·目镜：靠近眼睛的镜头，上面写着倍数（如10×）；\n·物镜：靠近物体的镜头，装在转换器上，有低倍（10×）和高倍（40×）之分；\n·转换器：转动它可以换来换去换物镜；\n·载物台：放玻片的地方，中间有一个小孔叫通光孔；\n·压片夹：夹住玻片，防止滑动；\n·反光镜：在下面，把光反射上去照亮标本；\n·粗准焦螺旋：大螺旋，升降镜筒幅度大；\n·细准焦螺旋：小螺旋，升降幅度小，用来调得更清楚；\n·镜臂、镜座：手握的地方和底座。\n\n2.计算放大倍数（教师板书）：\n提问：如果目镜是10×，物镜也是10×，一共放大多少倍？\n预设：10 × 10 = 100倍。\n教师补充：如果换成40×的物镜呢？——10 × 40 = 400倍。\n\n3.小活动：同桌互相指认结构，一人说名称，一人指出位置，然后轮换。\n\n（二）学习五步规范操作（10分钟）\n材料准备：演示显微镜（或用实物投影／手机投屏示范）\n\n教师完整示范，每步强调要领和易错点：\n\n第一步 安放\n·右手握住镜臂，左手托住镜座（双手！）；\n·把显微镜放在桌面偏左的位置，离桌边约一拳，镜臂朝向自己。\n\n第二步 对光（★最难点，务必慢示范）\n·转动转换器，让**低倍物镜**对准通光孔（听到\"咔\"的一声）；\n·左眼贴住目镜，右眼保持睁开（不要眯眼）；\n·慢慢转动反光镜，直到目镜里看到**明亮均匀**的圆形光圈。\n⚠ 易错：对不上光时，先检查物镜是否对准通光孔、光线是否被遮挡，再转动反光镜。\n\n第三步 放片\n·把玻片标本放在载物台上，要观察的部分正对通光孔中央；\n·用压片夹夹住。\n\n第四步 调焦（★安全要点）\n·眼睛**从侧面盯着物镜**，慢慢转动粗准焦螺旋，让镜筒下降到物镜距离玻片约2—3毫米（**绝不能碰到玻片**）；\n·然后眼睛看目镜，慢慢向**上**转动粗准焦螺旋，让镜筒缓缓上升，直到看到模糊的像；\n·再轻轻转动细准焦螺旋，直到图像最清晰。\n⚠⚠ 关键强调：**镜筒下降时，眼睛必须看物镜，不能看目镜！否则物镜会压碎玻片，甚至损坏镜头。**\n\n第五步 观察记录\n·双眼睁开观察；\n·把看到的图像画在记录单上。\n\n（三）分组操作：观察玻片标本（11分钟）\n材料准备：每组显微镜1台、玻片标本2—3片、记录单\n\n1.分工：操作员1人、记录员1人、器材员1人、监督员1人（负责提醒安全），**每观察完一片轮换一次**，保证人人都能操作。\n\n2.任务：\n①用低倍物镜观察\"字母e\"装片（或头发装片），画图记录；\n②再观察花粉装片，画图记录；\n③有余力的组，试着换高倍物镜观察。\n\n3.教师巡视，重点帮助：\n·对光不成功的小组（一对一指导）；\n·调焦过猛、眼看目镜就下降镜筒的小组（立即制止，重新示范）；\n·找不到物像的小组（提示：先降到最低，再慢慢上升寻找）。\n\n4.交流研讨：\n提问：显微镜下看到的\"e\"，和玻片上的方向一样吗？\n预设：不一样，是倒过来的（上下左右都颠倒）。\n\n追问：这说明显微镜成的是什么像？\n预设：倒立的像。\n\n提问：和简易显微镜比，光学显微镜有什么优点和不足？\n预设1：优点——放大倍数更高、图像更清楚、成像稳定。\n预设2：不足——操作步骤多、需要玻片标本、要调焦、不方便携带。\n\n师小结：光学显微镜是生物学研究最重要的工具之一，它能把我们带到肉眼完全看不到的微观世界。规范操作、爱护仪器，是每一位使用者的责任。\n\n三、课堂总结（6分钟）\n1.提问：使用显微镜分哪五步？\n预设：安放、对光、放片、调焦、观察。\n2.提问：哪一步最容易出错？要注意什么？\n预设：对光容易对不上；调焦时下降镜筒眼睛必须看物镜，防止压碎玻片。\n3.提问：显微镜下看到的图像有什么特点？\n预设：是倒立的、放大倍数等于目镜乘物镜。\n4.教师提升：今天我们学会了使用显微镜。下一课，我们将用它来观察一个更神奇的东西——构成生物体的基本单位：细胞。\n5.布置：在记录本上默写显微镜的五步操作，并画出显微镜结构图，标注各部分的名称。\n\n【下课前检查：物镜是否转回低倍、镜筒是否降下、玻片是否取下、显微镜是否归位、是否切断电源（若使用内置光源）】",
  "board": "               4. 用光学显微镜观察\n\n    一、结构（从上到下）\n        目镜（10×）→ 镜筒 → 转换器 → 物镜（10×／40×）\n        → 载物台（通光孔·压片夹）→ 反光镜\n        → 粗准焦螺旋 · 细准焦螺旋 → 镜臂 · 镜座\n\n    二、放大倍数 = 目镜 × 物镜\n        10× × 10× = 100 倍\n        10× × 40× = 400 倍\n\n    三、五步操作\n        ① 安放：右手握臂 · 左手托座 · 偏左放\n        ② 对光：低倍物镜对孔 · 左眼看 · 转反光镜 → 明亮光圈\n        ③ 放片：标本正对通光孔 · 压片夹夹住\n        ④ 调焦：★眼盯物镜下降★ → 眼看目镜上升 → 细准焦调清\n        ⑤ 观察：双眼睁开 · 画图记录\n\n    ⚠ 安全：镜筒下降时，眼睛必须看物镜！\n\n    四、成像特点：倒立的像（上下左右都颠倒）",
  "reflect": ""
 },
 "5|微小世界|5": {
  "goal": "科学观念：\n1.知道细胞是绝大多数生物体的基本结构单位（也是功能单位）。\n2.知道洋葱表皮是由一个个排列紧密的\"小格子\"（细胞）组成的。\n3.知道不同生物的细胞形状、大小各不相同，但都具有细胞的基本结构。\n\n科学思维：\n1.能通过观察洋葱表皮细胞，归纳出\"植物体是由细胞构成的\"。\n2.能通过对比动植物细胞图，找出它们的异同，初步建立\"结构多样性\"的认识。\n\n探究实践：\n1.能学会制作洋葱表皮临时装片（滴—撕—展—盖—染—吸六步）。\n2.能用显微镜观察洋葱表皮细胞，并规范绘制所看到的细胞图像。\n3.能区分视野中的细胞与气泡（气泡边缘黑、中间亮、形状圆且大小不一）。\n\n态度责任：\n1.体会科学发现来之不易（罗伯特·胡克发现细胞的故事），尊重观察证据。\n2.如实绘制观察到的图像——只画真实看到的，不照抄课本插图。\n3.实验中注意安全，规范使用刀片、镊子和碘酒。",
  "key": "学习洋葱表皮临时装片的制作方法，用显微镜观察洋葱表皮细胞，认识细胞是生物体的基本结构单位。",
  "hard": "①撕取洋葱内表皮要\"薄而透明\"，学生往往撕得太厚（带有叶肉），导致视野里一片模糊、看不到细胞。②盖盖玻片时极易产生气泡，气泡常被误认为细胞，必须教会区分方法。③画图是难点：学生容易照抄课本插图而非如实描绘，需要反复强调\"显微镜里看到什么就画什么\"。",
  "mat": "教师：显微镜1台（演示）、洋葱1个、载玻片、盖玻片、滴管、镊子、刀片、碘酒、吸水纸、清水、装片制作示范视频、动植物细胞对比图、教学课件\n\n学生（四人小组）：显微镜1台、洋葱（提前切成小块）1份、载玻片2片、盖玻片2片、滴管1个、镊子1把、刀片1片（教师保管、分发）、碘酒（稀释）1小瓶、吸水纸、清水、记录单（含画图方框）\n\n【低成本替代】\n洋葱：可用任何植物的薄表皮代替——大白菜叶表皮、蚕豆叶下表皮、番茄果肉、甚至自己的口腔上皮细胞（用牙签轻刮脸颊内侧）。\n碘酒：可用稀释的红墨水、亚甲基蓝（若生物实验室有）代替，染色效果略差但可用。\n盖玻片：可用极薄的透明塑料片、指甲大小的透明胶带临时替代（效果有限，优先保证正品）。\n刀片：可用新的美工刀片，由教师统一保管，用后即收回。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件（罗伯特·胡克与软木切片的故事）\n\n1.故事导入（配合课件）：\n三百多年前，英国科学家罗伯特·胡克用自己制作的显微镜观察一片软木（树皮）的薄片。他惊讶地发现，软木上布满了一个个像小房间一样的小格子。他把这些小格子命名为\"细胞\"（cell，就是\"小房间\"的意思）。\n\n2.提问：胡克看到的是软木，那我们身边活的植物，是不是也由这样的小格子构成呢？\n\n预设1：是的，书上说过。\n预设2：不知道，植物看上去是一整片的。\n\n3.引入：今天我们就要亲手做一张装片，到显微镜下去找一找这些\"小房间\"。\n（板书课题：观察细胞）\n\n二、新课教学（28分钟）\n\n（一）学习制作临时装片（10分钟）\n材料准备：每组洋葱、载玻片、盖玻片、滴管、镊子、刀片、碘酒、吸水纸、清水\n\n教师分步示范，学生同步操作（**建议教师做一步、学生跟一步，不要一次讲完**）：\n\n第一步 滴（滴清水）\n·用滴管在载玻片中央滴一滴清水。\n·提醒：一滴就够，太多会溢出。\n\n第二步 撕（撕取表皮）——★最难点\n·把洋葱鳞片掰成小块，在内表面（凹面）用刀片轻轻划一个\"井\"字（约5毫米见方）；\n·用镊子从\"井\"字的角上夹住，轻轻撕下一小片薄膜。\n·⚠ 关键：要撕得**薄而透明**。如果撕下来的膜是白的、厚的，说明带上了叶肉，要重撕。\n·检验方法：把撕下的膜对着光看一看，能透光的才是合格的。\n\n第三步 展（展平）\n·把撕下的表皮放入载玻片的水滴中，用镊子把它展平，不能皱、不能重叠。\n\n第四步 盖（盖盖玻片）——★易产生气泡\n·用镊子夹起盖玻片，让它的**一边先接触水滴的边缘**；\n·然后慢慢地、轻轻地放下，让水慢慢把空气赶出去。\n·⚠ 关键：不能\"啪\"地直接盖下去，那样会产生大量气泡。\n·补救：如果已有气泡，可用镊子柄轻轻按压盖玻片，把气泡赶出来。\n\n第五步 染（染色）\n·在盖玻片的一侧滴一滴稀释碘酒。\n\n第六步 吸（吸引染液）\n·在盖玻片的**另一侧**用吸水纸吸引，让碘酒慢慢渗进标本。\n·目的：染色后细胞的结构（尤其是细胞核）看得更清楚。\n\n师小结：六步口诀——\"滴、撕、展、盖、染、吸\"，记住了吗？我们一起说一遍。\n\n（二）观察洋葱表皮细胞（10分钟）\n材料准备：每组显微镜、自制装片、记录单\n\n1.学生用显微镜观察（按上一课的五步操作：安放—对光—放片—调焦—观察）。\n\n2.教师巡视，重点帮助：\n·看不到细胞的小组 → 多半是撕得太厚，请重撕一片；\n·视野里一片气泡的小组 → 教他们区分气泡和细胞。\n\n3.研讨：怎样区分气泡和细胞？（本环节重点）\n提问：视野里有很多圆圆的东西，哪些是细胞，哪些是气泡？\n引导学生观察对比（教师板书）：\n·细胞：排列规则、像砖墙一样整齐、有较明显的边界和里面的小点（细胞核）、大小比较一致；\n·气泡：边缘特别黑、中间很亮很透、形状是圆的、大小不一、用镊子轻压会变形或移动。\n\n4.画图记录（强调如实描绘）：\n·在记录单的圆圈里，画出你**真实看到**的细胞；\n·只画看到的，不照抄课本；\n·标出你认为是细胞核的部分。\n\n5.交流：请几位同学展示自己的图，说说看到了什么。\n预设：看到了很多长方形的小格子，排得很整齐，里面还有一个小圆点。\n\n师小结：洋葱表皮是由一个个排列紧密的长方形\"小格子\"组成的，这些小格子就是细胞。\n\n（三）认识细胞是生物体的基本单位（8分钟）\n材料准备：动植物细胞对比图、教学课件\n\n1.提问：洋葱是植物，它由细胞构成。那动物、我们人呢？\n预设：也是由细胞构成的。\n\n2.教师出示多种细胞图：洋葱表皮细胞、叶肉细胞、人的口腔上皮细胞、血细胞、神经细胞。\n提问：这些细胞长得一样吗？\n预设：不一样，有的长方形、有的圆、有的有突起。\n师：不同生物的细胞形态、大小各不相同，但它们都有共同的基本结构。\n\n3.讲解细胞的基本结构（点到为止，不深究）：\n·细胞壁（植物有，动物没有）：在外面，起支持和保护作用；\n·细胞膜：很薄的一层，控制物质进出；\n·细胞质：里面的胶状物质；\n·细胞核：里面有个小圆点，是\"指挥中心\"。\n\n4.提升：\n提问：从胡克发现细胞到现在，科学家们得出了一个什么重要结论？\n预设：绝大多数生物体都是由细胞构成的。\n\n5.教师总结：细胞是绝大多数生物体结构和功能的基本单位。我们身体里有数不清的细胞，一棵大树也是由一个一个细胞构成的——这就是生命的统一性。\n\n三、课堂总结（6分钟）\n1.提问：制作临时装片分哪六步？\n预设：滴、撕、展、盖、染、吸。\n2.提问：哪两步最容易失败？要注意什么？\n预设：撕——要薄而透明；盖——要一边先接触水滴，避免气泡。\n3.提问：怎样区分气泡和细胞？\n预设：气泡边缘黑、中间亮、圆的、会变形；细胞排列整齐、有细胞核。\n4.教师提升：今天我们通过亲手制作装片，亲眼看到了细胞。科学发现最重要的不是\"听说过\"，而是\"我看到了\"。\n5.布置：用家中的材料（如番茄果肉、白菜叶）再自制一张装片，观察一下，画下来，下节课交流。\n\n【安全与整理：刀片由教师统一收回；碘酒不要沾到衣服和皮肤，如沾上立即用清水冲洗；用过的载玻片、盖玻片放入指定容器，不要随意丢弃】",
  "board": "                     5. 观察细胞\n\n    一、临时装片六步口诀\n        滴（清水） → 撕（薄！透明！） → 展（展平不皱）\n        → 盖（一边先接触水滴） → 染（碘酒） → 吸（对侧吸引）\n\n    二、易错点\n        撕得太厚 → 视野模糊，看不到细胞 → 重撕\n        直接盖下 → 大量气泡 → 一边先接触，慢慢放\n\n    三、气泡 vs 细胞\n        ┌────────┬──────────────┬────────────┐\n        │        │     气 泡     │    细 胞    │\n        ├────────┼──────────────┼────────────┤\n        │ 边  缘 │ 特别黑、很粗  │ 较细、规则  │\n        │ 中  间 │ 很亮、空      │ 有小点（核）│\n        │ 形  状 │ 圆的、大小不一│ 长方形、整齐│\n        │ 按压后 │ 会变形、移动  │ 不动        │\n        └────────┴──────────────┴────────────┘\n\n    四、细胞基本结构\n        细胞壁（植物有）· 细胞膜 · 细胞质 · 细胞核\n\n    ★ 结论：细胞是绝大多数生物体结构和功能的基本单位 ★",
  "reflect": ""

 "5|工具与技术|1": {
  "goal": "科学观念：\n1.知道工具是人类为了完成某些任务而发明制造的器具，能延伸人的能力。\n2.知道不同的工具有不同的用途，完成同一任务可以选用不同工具，合适的工具能省力、省时、做得更好。\n3.知道技术的发展推动工具的进步，工具又反过来改变人类的生活方式。\n\n科学思维：\n1.能根据不同的标准（用途、结构、动力、是否省力等）对工具进行分类。\n2.能针对具体任务分析\"为什么选这件工具\"，建立\"任务—工具—效果\"的对应关系。\n\n探究实践：\n1.能收集身边的常见工具，观察它们的结构特点并描述用途。\n2.能完成\"用不同工具完成同一任务\"的对比活动，体验工具带来的差异。\n3.能设计并填写工具分类表，尝试用多种标准分类。\n\n态度责任：\n1.乐于观察生活中的工具，体会\"工具是人类智慧的结晶\"。\n2.养成安全使用工具的意识，知道工具使用不当可能造成伤害。\n3.愿意倾听同伴的分类理由，接纳不同的分类方式。",
  "key": "收集并观察身边的常见工具，按不同标准进行分类，通过对比实验体验\"合适的工具能省力、省时、做得更好\"。",
  "hard": "①学生对工具很熟悉，但往往只停留在\"叫什么、干什么用\"，难以说出\"为什么这样设计\"。②分类是难点：学生容易只按\"用途\"一种标准分，需要引导他们发现还可以按动力（手动／电动）、按是否省力、按材料等多种标准分。③\"省力\"的体验需要设计可操作的对比活动，否则只是空谈。",
  "mat": "教师：工具实物若干（锤子、螺丝刀、钳子、扳手、开瓶器、剪刀、指甲刀、镊子、卷尺）、教学课件（含工具发展史图片）、大白纸、分类表\n\n学生（四人小组）：从家中带来的安全工具（每人带1—2件，**禁止带刀具、尖锐利器、电器**）、记录单、分类卡纸\n\n【⚠ 安全要求（课前必须向学生强调）】\n可带：螺丝刀、扳手、钳子、卷尺、开瓶器、剪刀（圆头）、指甲刀、镊子、夹子、勺子、刷子等。\n禁止带：菜刀、美工刀、针、锥子、打火机、电器（电吹风、电钻等）、任何尖锐锋利物品。\n教师课前要逐一检查学生带来的工具。\n\n【低成本替代】\n工具来源：全部由学生从家中带来，不花一分钱；学校可常备一个小\"工具箱\"（锤子、螺丝刀、钳子、扳手各1件）。\n分类卡纸：可用废纸背面、旧作业本代替。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件（原始人徒手与现代人使用工具对比图）\n\n1.挑战：请一位同学上来，不用任何工具，把这颗螺丝钉拧进木板里。\n（学生尝试，多半拧不进去或非常费力）\n\n2.再请他用螺丝刀试一次。\n提问：两次有什么不同？\n预设：用螺丝刀轻松多了，徒手根本拧不动。\n\n3.追问：为什么用工具就容易了？工具帮我们做了什么？\n预设1：工具比手硬。\n预设2：工具把力气\"集中\"起来了。\n\n4.引入：从古至今，人类一直在发明和使用工具。工具让我们的手变得更强、更巧。今天我们就来认识身边的这些\"好帮手\"。\n（板书课题：各种各样的工具）\n\n二、新课教学（28分钟）\n\n（一）认识工具：我带来了什么（8分钟）\n材料准备：学生自带的工具\n\n1.小组交流：每人拿出自己带来的工具，向组员介绍：\n·它叫什么名字？\n·它是用来做什么的？\n·它是什么样子的（什么材料做的、有什么特别的结构）？\n\n2.全班展示：请几位同学上台介绍自己带来的、比较特别的工具。\n\n3.教师补充介绍几件典型工具，引导学生观察\"结构\"：\n·螺丝刀：头部有一字／十字形，能卡进螺丝的槽里；\n·钳子：有咬合的\"嘴\"，能夹紧东西；\n·开瓶器：有一个\"钩子\"，能钩住瓶盖边缘；\n·指甲刀：有两片刀刃和一个杠杆压板。\n\n4.追问（引导关注结构与功能的关系）：\n提问：螺丝刀的头为什么要做成十字形？\n预设：能卡进螺丝里，不容易打滑。\n提问：钳子的\"嘴\"上为什么有纹路？\n预设：增加摩擦力，夹得更牢。\n\n师小结：工具的形状和结构，都是为完成特定任务而设计的——**结构决定了功能**。\n\n（二）活动：用不同的工具完成同一件事（10分钟）\n材料准备：木板、螺丝钉、螺丝刀、硬币、小瓶子（带盖）、开瓶器、铁丝、钳子\n\n1.设置三个任务，请学生分别用\"徒手\"和\"工具\"两种方式尝试：\n任务一：把一颗螺丝钉拧进木板；\n任务二：打开一个盖得很紧的瓶盖；\n任务三：把一根铁丝弯成一个直角（或剪断）。\n\n2.学生分组体验（注意安全，教师巡视）。\n\n3.研讨：\n提问：徒手做和用工具做，有什么不一样？\n预设1：徒手做很费力，用工具很轻松。\n预设2：徒手有的根本做不到，用工具能做到。\n预设3：用工具做得更快、做得更漂亮。\n\n4.追问：是不是随便拿一件工具都行？比如用勺子拧螺丝？\n学生尝试（或想象）。\n预设：不行，要用对的工具才行。\n\n师小结：工具可以**省力、省时、提高质量、做到徒手做不到的事**；但前提是要选对工具——不同的任务要用不同的工具。\n\n（三）给工具分类（10分钟）\n材料准备：工具实物、分类卡纸、记录单\n\n1.任务：给桌上的这些工具分分类，把分类结果写在卡纸上。\n提问：你打算按什么来分？\n\n2.学生分组分类，教师巡视，鼓励用不同的标准。\n\n3.全班交流，教师把不同的分类标准板书出来：\n·按用途分：拧的（螺丝刀、扳手）、夹的（钳子、镊子、夹子）、切的（剪刀、刀）、测量的（尺子、卷尺）……\n·按动力分：手动的（锤子、螺丝刀）、电动的（电钻、电锯）\n·按材料分：金属的、塑料的、木头的\n·按是否省力分：省力的（开瓶器、钳子）、不省力的（镊子、筷子）\n·按使用场所分：厨房用的、修理用的、学习用的、医疗用的\n\n4.追问：哪种分法更好？\n预设：没有哪种更好，看你要研究什么问题——分类标准是根据需要确定的。\n\n5.教师补充一个有趣的分类（引出后续学习）：\n提问：镊子和开瓶器，都是用手拿的，它们有什么不同？\n引导学生发现：镊子\"费力\"但省距离、夹得准；开瓶器\"省力\"。\n师：这就是我们后面几课要研究的\"简单机械\"——为什么有的工具省力，有的不省力。\n\n三、课堂总结（6分钟）\n1.提问：工具给我们带来哪些好处？\n预设：省力、省时、做得更好、能做到徒手做不到的事。\n2.提问：我们可以按哪些标准给工具分类？\n预设：用途、动力、材料、是否省力、使用场所。\n3.情感提升：工具的发明和改进，凝聚着一代又一代人的智慧。从石头做的斧头，到今天的机器人，工具的发展就是人类文明的发展。\n4.安全提示：工具是我们的好帮手，但使用不当也会伤到自己或别人。使用任何工具前，都要先想清楚\"怎么用才安全\"。\n5.布置：回家观察爸爸妈妈工作时用到的工具（做饭、修东西、种地、缝衣服），选一件画下来，明天介绍它的\"结构和功能\"。\n\n【课前必须检查学生带来的工具，危险物品一律暂由教师保管，课后归还】",
  "board": "                  1. 各种各样的工具\n\n    一、工具的好处\n        省力 · 省时 · 做得更好 · 做到徒手做不到的事\n\n    二、结构与功能\n        螺丝刀头十字形 → 卡住螺丝不打滑\n        钳子嘴有纹路   → 增加摩擦夹得牢\n        ★ 结构决定功能 ★\n\n    三、分类标准（可以有很多种）\n        按用途：拧 · 夹 · 切 · 测量\n        按动力：手动 · 电动\n        按材料：金属 · 塑料 · 木头\n        按省力：省力的（开瓶器）· 费力的（镊子）\n        按场所：厨房 · 修理 · 学习 · 医疗\n\n    四、安全：用前先想\"怎么用才安全\"\n\n    思考：为什么有的工具省力，有的不省力？（下节课研究）",
  "reflect": ""

 "5|工具与技术|4": {
  "goal": "科学观念：\n1.知道斜面是一种简单机械，使用斜面可以省力。\n2.知道斜面的坡度越小（越平缓），越省力；坡度越大（越陡），越费力。\n3.知道斜面在生活中的应用：盘山公路、无障碍坡道、螺丝钉、刀刃、斧头等。\n\n科学思维：\n1.能根据弹簧测力计的读数变化，推理出\"斜面省力\"及\"坡度与省力的关系\"。\n2.能理解对比实验中\"控制变量\"的必要性——比较不同坡度时，被拉动的物体、接触面、拉动方式都必须相同。\n\n探究实践：\n1.能规范使用弹簧测力计（检查指针是否指零、读数时视线与刻度齐平、匀速拉动）。\n2.能搭建不同坡度的斜面，完成对比实验并记录数据。\n3.能根据实验数据绘制简单的柱状图或折线图，归纳结论。\n\n态度责任：\n1.尊重数据，即使数据不理想也如实记录，不随意修改。\n2.小组分工协作，做到人人参与、轮流操作。\n3.体会到工程技术要\"权衡\"——省了力就要多走距离，没有十全十美的方案。",
  "key": "通过对比实验，用弹簧测力计测量在不同坡度斜面上拉动小车所需的力，认识斜面能省力，且坡度越小越省力。",
  "hard": "①控制变量是本课最大的难点：学生容易在改变坡度的同时，也改变了小车、接触面或拉动方式，导致数据混乱。必须在实验前明确\"只改变坡度，其他一切都不变\"。②弹簧测力计读数时要**匀速拉动**，学生往往猛地一拉，读数跳动不准。③\"省力但不省距离\"这个权衡取舍比较抽象，需要结合生活实例（盘山公路绕远路）帮助理解。",
  "mat": "教师：弹簧测力计（5N）1个、木板（长约60厘米）1块、小车1辆、书本若干（用于垫高）、教学课件、记录单、柱状图模板\n\n学生（四人小组）：弹簧测力计（5N）1个、光滑长木板1块、小车（或装重物的小纸盒）1辆、书本若干、记录单\n\n【低成本替代】\n弹簧测力计：可用橡皮筋自制测力计（挂上已知重量的物体标定刻度），或用简易杠杆天平比较\"拉动所需力的大小\"（定性判断）。\n木板：可用硬纸板、塑料板、甚至课桌面板斜靠代替。\n小车：可用装有钩码（或石子）的小纸盒、玩具车代替，重要的是**底部要光滑一致**。\n注意：若无测力计，本课可改为定性体验——用手感受不同坡度拉动的难易程度，重点放在\"坡度越小越省力\"的定性认识上。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件（工人往卡车上搬重物的图片/视频）\n\n1.情境：工人叔叔要把一桶很重的水搬上卡车，他一个人搬不动，怎么办？\n\n预设1：找人帮忙一起抬。\n预设2：用吊车。\n预设3：搭一块木板，从木板上推上去。\n\n2.追问：为什么搭一块木板推上去，就比直接抬上去省力？\n\n预设：因为木板是斜的，可以一边推一边往上走。\n\n3.引入：这块斜搭的木板，其实就是一种非常古老、非常有用的简单机械——斜面。它到底能省多少力？今天我们用量的方法来研究。\n（板书课题：巧用斜面）\n\n二、新课教学（28分钟）\n\n（一）认识测力计与实验方法（6分钟）\n材料准备：弹簧测力计、小车\n\n1.复习测力计的使用（教师示范）：\n·使用前检查指针是否指在\"0\"刻度，不在就调零；\n·读数时视线要与刻度线**齐平**（不能俯视也不能仰视）；\n·拉动时要**匀速、缓慢**，读数才稳定。\n\n2.测量小车的重力：\n提问：直接把小车提起来，需要多大的力？\n学生测量并记录（这是\"不用斜面时需要的力\"，作为对比基准）。\n\n3.介绍实验装置：\n·用书本垫起木板的一端，搭成一个斜面；\n·用测力计**沿着斜面匀速向上拉**小车；\n·读取测力计的示数。\n\n4.强调控制变量（★本课最关键）：\n提问：我们要研究\"坡度大小与省力的关系\"，那么实验中只能改变什么？\n预设：只能改变坡度的大小。\n追问：还有哪些条件必须保持不变？\n预设：同一辆小车、同一块木板、同样的拉动方式（匀速）、同样拉到顶端。\n（教师板书\"改变的条件\"和\"不变的条件\"，贴在黑板上提醒）\n\n（二）分组实验：不同坡度的斜面（14分钟）\n材料准备：每组测力计、木板、小车、书本、记录单\n\n1.实验设计：搭三种不同坡度的斜面\n·坡度1（最缓）：垫1本书\n·坡度2（中等）：垫3本书\n·坡度3（最陡）：垫5本书\n每次都要把小车拉到**相同的高度**（这一点很重要，可事先在墙上或桌边标出高度线）。\n\n2.学生分组实验，每种坡度测量3次，记录数据。\n\n3.教师巡视，重点纠正：\n·拉动不匀速、猛拉猛停的组；\n·读数时视线不平的组；\n·每次改变了小车或木板的组（提醒控制变量）。\n\n4.数据汇总：各组把数据报到黑板上，形成全班数据表。\n\n5.研讨：\n提问：三种坡度，哪种最省力？哪种最费力？\n预设：垫1本书（最缓）最省力，垫5本书（最陡）最费力。\n\n追问：把这三个数据和\"直接提起小车\"的数据比一比，你发现了什么？\n预设：用斜面都比直接提起来省力，而且坡度越小越省力。\n\n师小结：①使用斜面能省力；②斜面的坡度越小（越平缓），越省力；坡度越大（越陡），越费力。\n（板书结论）\n\n6.追问（思维提升）：既然坡度越小越省力，那我们为什么不把斜坡修得无限长、无限平？\n预设1：那样太占地方了。\n预设2：走的路太远了，浪费时间。\n师：这就是工程中的\"权衡\"——斜面省力，但要多走距离。现实中我们要根据场地、时间、成本，找到一个最合适的坡度。\n\n（三）联系生活：斜面在哪里（8分钟）\n材料准备：教学课件\n\n1.提问：生活中哪些地方用到了斜面？\n预设1：无障碍通道的坡道。\n预设2：盘山公路，绕着山一圈一圈往上开。\n预设3：楼梯（其实是台阶状的斜面）。\n预设4：滑梯。\n预设5：菜刀、斧头的刃。\n预设6：螺丝钉的螺纹。\n\n2.重点讲解两个\"变形的斜面\"：\n①螺丝钉：螺纹其实就是卷起来的斜面，拧螺丝的时候，我们沿着\"斜面\"往上走，所以很省力。\n②刀刃、斧头：越薄越锋利，因为斜面越\"缓\"，切开东西越省力。\n\n3.小活动（可选）：\n·用同一把刀切橡皮泥，比较用刀刃和用刀背，哪个更省力；\n·观察螺丝钉的螺纹，想象把它\"展开\"成一条斜线。\n\n师小结：斜面是最古老、最简单的机械之一，它藏在生活的角角落落，帮助我们省力地完成工作。\n\n三、课堂总结（6分钟）\n1.提问：使用斜面有什么好处？\n预设：能省力。\n2.提问：坡度大小与省力有什么关系？\n预设：坡度越小越省力，坡度越大越费力，但都比直接提起来省力。\n3.提问：做这个实验，最重要的是注意什么？\n预设：控制变量——只改变坡度，其他条件都不变；匀速拉动；视线平齐读数。\n4.教师提升：今天我们不仅得出了结论，更重要的是学会了\"用数据说话\"。科学研究中，感觉会骗人，数据不会。\n5.布置：回家找一找家里和小区里的斜面，拍下来（或画下来），注明它的作用是什么。\n\n【整理：测力计用完要让指针归零、平放收纳；书本、木板归位】",
  "board": "                     4. 巧用斜面\n\n    一、实验设计（控制变量）\n        改变的条件：斜面的坡度（垫1本 / 3本 / 5本书）\n        不变的条件：同一小车 · 同一木板 · 拉到同一高度 · 匀速拉动\n\n    二、实验数据（示例）\n        ┌──────────┬──────────┬────────┐\n        │  方  式   │ 测力计读数 │ 省力？ │\n        ├──────────┼──────────┼────────┤\n        │ 直接提起  │  3.0 N    │  ——    │\n        │ 坡度陡(5本)│  2.2 N    │  省力  │\n        │ 坡度中(3本)│  1.5 N    │ 更省力 │\n        │ 坡度缓(1本)│  0.8 N    │ 最省力 │\n        └──────────┴──────────┴────────┘\n\n    ★ 结论：斜面能省力；\n            坡度越小（越平缓）→ 越省力 ★\n\n    三、权衡：省力 ≠ 省距离（坡缓了要走更远的路）\n\n    四、生活中的斜面\n        盘山公路 · 无障碍坡道 · 楼梯 · 滑梯\n        螺丝钉（卷起来的斜面）· 刀刃 · 斧头",
  "reflect": ""
 },
 "5|工具与技术|5": {
  "goal": "科学观念：\n1.知道滑轮是一种简单机械，分为定滑轮和动滑轮。\n2.知道定滑轮能改变力的方向，但不能省力；动滑轮能省一半的力，但不能改变力的方向。\n3.知道滑轮组（定滑轮与动滑轮组合）既能省力，又能改变力的方向。\n\n科学思维：\n1.能通过测力计读数的对比，判断定滑轮与动滑轮在\"省力\"和\"改变方向\"上的差异。\n2.能理解\"定滑轮不省力\"的原因——它只是改变了用力的方向，本质上相当于一个等臂杠杆。\n\n探究实践：\n1.能正确组装定滑轮和动滑轮装置。\n2.能用弹簧测力计测量不同方式提升重物所需的力，规范记录数据。\n3.能尝试组装简单的滑轮组，体验\"既省力又改变方向\"的效果。\n\n态度责任：\n1.实验中小心操作，防止重物坠落伤人。\n2.尊重实验数据，如实记录，不迁就\"应该\"的结果。\n3.体会技术与工程的巧妙，乐于动手尝试和改进。",
  "key": "通过组装和测量，认识定滑轮能改变力的方向但不省力，动滑轮能省力但不能改变方向，滑轮组则两者兼得。",
  "hard": "①动滑轮\"省一半力\"是理论值，实际因摩擦和动滑轮自重，测出的数值往往大于一半，学生容易困惑——需要教师提前说明\"理论上省一半，实际因摩擦会略大一些\"。②动滑轮实验中，测力计要**连同动滑轮一起被提起**，操作时容易忘记把动滑轮的重量计入或忽略。③\"为什么定滑轮不省力\"比较抽象，可用\"相当于等臂杠杆\"帮助理解。",
  "mat": "教师：铁架台1套、定滑轮1个、动滑轮1个、细绳（结实，约1.5米）、钩码（或重物）1套、弹簧测力计1个、滑轮组演示装置1套、教学课件、记录单\n\n学生（四人小组）：铁架台（或用桌椅、门框代替）1个、定滑轮1个、动滑轮1个、细绳2根、钩码（或用装满水的瓶子、石块代替）1组、弹簧测力计1个、记录单\n\n【低成本替代】\n滑轮：可用线轴（缝纫机线轴、胶带芯）穿在铁丝上做成简易滑轮；也可用光滑的木棍、圆笔杆代替（摩擦力较大，定性演示尚可）。\n铁架台：可用课桌边缘、门框横梁、树枝代替，只要能固定滑轮即可。\n钩码：可用装有水的塑料瓶（重量已知，如500毫升水约0.5千克≈5N）、沙袋、石块代替。\n测力计：同前课，可用橡皮筋测力计替代做定性比较。\n安全提醒：悬挂的重物下方不能站人，防止坠落伤人。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件（升国旗、工地吊物、窗帘拉绳的图片）\n\n1.提问：升国旗的时候，旗手在下面往下拉绳子，国旗却往上升——这是为什么？\n预设：因为旗杆顶上有一个轮子。\n\n2.追问：工地上的吊车能把很重的水泥板吊到楼顶，人哪来这么大的力气？\n预设1：用机器。\n预设2：用了很多轮子。\n\n3.引入：这些\"轮子\"有个共同的名字——滑轮。它们不仅能改变力的方向，有的还能省力。今天我们就来研究滑轮的秘密。\n（板书课题：妙用滑轮）\n\n二、新课教学（28分钟）\n\n（一）认识滑轮：定滑轮与动滑轮（5分钟）\n材料准备：定滑轮、动滑轮\n\n1.教师出示两种滑轮，介绍：\n·定滑轮：使用时**位置固定不动**的滑轮（如旗杆顶部的轮子）；\n·动滑轮：使用时**位置随重物一起移动**的滑轮。\n\n2.提问：怎样判断一个滑轮是定滑轮还是动滑轮？\n预设：看它用的时候位置动不动——固定的就是定滑轮，跟着重物一起动的就是动滑轮。\n\n（二）实验一：研究定滑轮（8分钟）\n材料准备：铁架台、定滑轮、细绳、钩码、测力计\n\n1.组装：把定滑轮固定在铁架台（或桌边）上，绳子绕过滑轮，一端挂钩码，另一端挂测力计。\n\n2.测量：\n①先用测力计直接提起钩码，读数（这是基准）；\n②再通过定滑轮，向下拉动绳子提起钩码，读数。\n\n3.学生分组实验，记录数据。\n\n4.研讨：\n提问：两次读数一样吗？定滑轮省力吗？\n预设：读数差不多，定滑轮不省力。\n\n追问：那定滑轮有什么用？\n预设：可以站在地上往下拉，就把东西提上去了——改变了用力的方向。\n\n师小结：定滑轮**不省力，但能改变力的方向**。往下拉比往上提方便、安全，这就是它的价值。\n（板书：定滑轮——不省力，能改变方向）\n\n5.教师补充（可选，视学生情况）：定滑轮相当于一个\"等臂杠杆\"，动力臂和阻力臂一样长，所以不省力。\n\n（三）实验二：研究动滑轮（8分钟）\n材料准备：铁架台、动滑轮、细绳、钩码、测力计\n\n1.组装：绳子的一端固定在铁架台上，另一端绕过动滑轮后向上拉；钩码挂在动滑轮下面。\n（教师必须示范清楚绕线方式）\n\n2.测量：用测力计**竖直向上**匀速拉动绳子，把钩码提起来，读数。\n提醒：测力计提起的是\"绳子的一端\"，动滑轮和重物一起被两段绳子分担着。\n\n3.学生分组实验，记录数据。\n\n4.研讨：\n提问：这次的读数和直接提起相比，有什么变化？\n预设：读数变小了，大约是直接提起的一半。\n\n追问：动滑轮省力吗？省了多少？\n预设：省力，差不多省一半。\n\n追问：用动滑轮的时候，我们是往上拉还是往下拉？\n预设：往上拉——不能改变方向。\n\n5.教师说明误差：理论上动滑轮省一半的力，但我们测出来的数往往会比一半**略大一点**，这是因为绳子有摩擦、动滑轮本身也有重量。这很正常，科学测量中要允许合理的误差。\n\n师小结：动滑轮**能省力（约省一半），但不能改变用力的方向**。\n（板书：动滑轮——能省力，不能改变方向）\n\n（四）实验三：滑轮组（7分钟）\n材料准备：滑轮组演示装置（或每组两套滑轮）\n\n1.提问：有没有办法，既能省力，又能改变方向？\n预设：把定滑轮和动滑轮组合起来用。\n\n2.教师演示组装滑轮组：动滑轮在下（省力），定滑轮在上（改变方向）。\n\n3.学生尝试组装并测量。\n提问：这次拉力是多少？方向是怎样的？\n预设：比直接提起小（省力），而且可以往下拉（改变方向）。\n\n师小结：把定滑轮和动滑轮组合起来，就成了**滑轮组**——它既能省力，又能改变力的方向。工地上的吊车、电梯、健身器材，用的都是滑轮组。\n\n4.联系生活：\n提问：生活中哪些地方用到了滑轮？\n预设：旗杆、窗帘、吊车、电梯、晾衣架、健身器材、井里的辘轳。\n\n三、课堂总结（6分钟）\n1.填表小结（师生共同完成）：\n·定滑轮：不省力，能改变方向\n·动滑轮：能省力（约一半），不能改变方向\n·滑轮组：既省力，又能改变方向\n\n2.提问：做这些实验时，最重要的是注意什么？\n预设：匀速拉动、视线平齐读数、重物下方不能站人。\n\n3.教师提升：今天我们研究的滑轮，和上一课的斜面一样，都是\"简单机械\"。它们每一个都很简单，但组合起来，就能完成非常复杂的工程——这就是技术的力量。\n\n4.布置：回家找一找家里的滑轮（窗帘、晾衣架、健身器材），观察它是定滑轮还是动滑轮，画下来并说明理由。\n\n【安全：实验过程中重物下方严禁站人；拆卸装置时先托住重物再松绳；铁架台要放稳】",
  "board": "                     5. 妙用滑轮\n\n    一、两种滑轮\n        定滑轮：位置固定不动（旗杆顶部）\n        动滑轮：随重物一起移动\n\n    二、实验对比\n    ┌────────┬──────────┬────────────┐\n    │        │  是否省力  │ 是否改变方向 │\n    ├────────┼──────────┼────────────┤\n    │ 定滑轮 │   ✗ 不省力 │    ✔ 能改变  │\n    │ 动滑轮 │   ✔ 约省一半│   ✗ 不能改变 │\n    │ 滑轮组 │   ✔ 省力   │    ✔ 能改变  │\n    └────────┴──────────┴────────────┘\n\n    三、定滑轮为什么不省力？\n        相当于\"等臂杠杆\"，动力臂 = 阻力臂\n\n    四、动滑轮为什么省力？\n        重物的重量由两段绳子共同承担\n\n    ⚠ 实测值比理论值略大：绳子有摩擦 · 动滑轮有自重\n\n    生活应用：旗杆 · 窗帘 · 吊车 · 电梯 · 晾衣架 · 健身器材",
  "reflect": ""
 },
 "5|运动和力|1": {
  "goal": "科学观念：\n1.知道小车通常由动力部分、传动部分、行驶部分（车轮车轴）、支撑部分（车架）等组成。\n2.知道不同结构承担不同的功能，结构决定功能。\n3.知道小车的运动需要动力，动力通过传动装置传到车轮，使小车运动起来。\n\n科学思维：\n1.能通过拆解实物，分析各个部件的作用，建立\"结构—功能\"的对应关系。\n2.能通过对比不同小车的构造，归纳出交通工具的共同特征。\n\n探究实践：\n1.能安全、有序地拆解玩具小车，观察并记录其内部结构。\n2.能画出小车的结构示意图，标注各部件的名称与作用。\n3.能按原样把小车重新组装回去（或画出组装图）。\n\n态度责任：\n1.对机械结构产生探究兴趣，乐于动手拆解和复原。\n2.养成\"先观察、再拆解、做记录、能复原\"的规范习惯。\n3.小组内合理分工，爱护器材，不随意丢弃零件。",
  "key": "通过拆解玩具小车，观察其内部结构，认识小车各组成部分的名称与作用，建立\"结构决定功能\"的认识，为后续设计和制作小车打下基础。",
  "hard": "①学生拆的时候往往\"只顾拆、不看结构\"，拆完说不出各部件的作用——必须强求\"拆一步、记一步\"。②拆解后装不回去是常见问题，需要引导学生拆解时按序摆放零件、拍照或画图记录位置。③从\"看得见的零件\"抽象出\"四大系统\"（动力、传动、行驶、支撑）需要教师的归纳引导。",
  "mat": "教师：玩具小车（回力车、惯性车、电动车各1辆）、拆解工具（小螺丝刀、尖嘴钳）1套、教学课件（真实汽车结构图）、结构示意图、记录单、零件托盘\n\n学生（四人小组）：可拆解的玩具小车1—2辆（提前布置学生从家中带来，**以废旧玩具为主**）、小螺丝刀1把、尖嘴钳1把、零件托盘（可用纸盒代替）、放大镜1个、记录单（含结构示意图方框）\n\n【低成本替代】\n小车来源：发动学生收集家里的废旧玩具车（回力车、惯性车、四驱车均可），成本为零；也可到废品回收站按斤购买。\n托盘：用月饼盒、鞋盒盖代替，防止零件丢失。\n工具：小螺丝刀可由教师统一提供，用后收回。\n⚠ 拆前提醒：电池驱动的玩具车拆前必须先取出电池；带发条的回力车拆时要缓慢释放发条，防止弹开伤人。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件（各种车辆图片）、回力玩具车1辆\n\n1.提问：老师手里这辆小玩具车，往后一拉、松手，它就会自己往前跑。你知道它肚子里藏着什么秘密吗？\n预设1：里面有弹簧。\n预设2：有电池。\n预设3：不知道，没拆开看过。\n\n2.追问：我们每天都在坐车、看车，汽车为什么能跑？它由哪些部分组成的？\n\n预设：有轮子、有发动机、有方向盘、有座椅……\n\n3.引入：今天我们就当一次\"机械师\"，把小车拆开，看看里面到底有什么。\n（板书课题：拆解我的小车模型）\n\n二、新课教学（28分钟）\n\n（一）拆解前的准备（4分钟）\n材料准备：每组玩具车、工具、托盘、记录单\n\n1.强调拆解规范（板书四条）：\n·看：先整体观察小车的外形，想想它可能由几部分组成；\n·记：每拆一步，就把零件的样子、位置画在记录单上；\n·放：拆下的零件按顺序摆在托盘里，不要混在一起；\n·回：记清楚顺序，等会儿要能装回去。\n\n2.安全教育：\n·使用螺丝刀时不要对着人；\n·有电池的车先取出电池；\n·有发条的车慢慢拆，防止发条弹开；\n·细小零件不要放进嘴里。\n\n（二）动手拆解，观察结构（14分钟）\n材料准备：每组玩具车、工具、托盘、放大镜、记录单\n\n1.学生分组拆解，教师巡视，提醒学生边拆边记录。\n\n2.教师在各组之间引导提问：\n·你拆下来的是什么？它在哪儿？（在什么位置）\n·猜猜它是干什么用的？\n·它和旁边的零件是怎么连在一起的？\n\n3.全班交流：你拆出了哪些零件？它们有什么作用？\n（教师随学生的汇报板书，逐步归类）\n\n预设零件及作用：\n·车轮、车轴：让小车能滚动前进（行驶部分）；\n·齿轮、传动杆：把动力传到轮子上（传动部分）；\n·发条／弹簧／电机／飞轮：提供动力（动力部分）；\n·车壳、底盘：把各个部分连接固定起来（支撑部分）；\n·弹簧：减震、储能；\n·开关、电线：控制电流（电动车）。\n\n4.教师归纳（板书四大系统）：\n师小结：虽然小车种类很多，但基本都可以分成四个部分——\n·**动力部分**：提供力量（发条、弹簧、电池＋电机、飞轮）；\n·**传动部分**：把力量传送过去（齿轮、皮带、传动轴）；\n·**行驶部分**：让车跑起来（车轮、车轴）；\n·**支撑部分**：把它们连成一个整体（车架、车壳、底盘）。\n\n5.追问：如果缺少其中某一部分，小车还能跑吗？\n预设：不能——没有动力跑不起来；没有车轮跑不动；没有传动，动力传不到轮子上。\n\n师小结：小车的每一个部分都很重要，它们分工合作，小车才能跑起来。**结构决定功能，部分服从整体。**\n\n（三）尝试复原（6分钟）\n材料准备：每组零件、工具\n\n1.任务：请根据刚才的记录，把小车重新装回去。\n\n2.学生复原，教师巡视帮助遇到困难的小组。\n\n3.研讨：\n提问：哪些小组成功复原了？有什么经验？\n预设1：拆的时候按顺序摆好零件，装的时候就容易了。\n预设2：我们画了图，照着图装回去的。\n提问：装不回去的小组遇到了什么困难？\n预设：零件混在一起了、忘记顺序了、有个小弹簧不知道装哪儿。\n\n4.教师提升：拆解和组装，是工程师研究产品的重要方法。做好记录，是工程师的基本功。\n\n（四）拓展：从玩具车到真汽车（4分钟）\n材料准备：教学课件（真实汽车结构图）\n\n1.提问：真汽车和我们的玩具车，结构上有什么相同和不同？\n预设：\n·相同：都有车轮、传动、动力（发动机）、车架；\n·不同：真汽车还有转向系统（方向盘）、刹车系统、悬挂减震、座椅、车灯等，复杂得多。\n\n2.引入后续任务：接下来的几节课，我们不但要研究小车怎么动起来，还要**自己设计制作一辆小车**——它是要开到月球上去的\"月球小车\"。今天拆车的经验，到时候都用得上。\n\n三、课堂总结（6分钟）\n1.提问：小车主要由哪几部分组成？\n预设：动力部分、传动部分、行驶部分、支撑部分。\n2.提问：每个部分的作用是什么？\n预设：动力提供力量，传动传递力量，行驶让车跑起来，支撑把各部分连成整体。\n3.提问：今天拆解时，最重要的是养成了什么好习惯？\n预设：边拆边记录、按顺序摆放、能装回去。\n4.教师提升：今天我们只是\"拆开看看\"。接下来的课，我们要反过来——从零开始，设计、制作一辆真正能跑的小车。\n5.布置：回家再找一件带机械结构的废旧物品（玩具、闹钟、笔、文具盒），试着拆解并画出它的结构图，下节课分享。\n\n【整理：所有零件装回托盘；工具清点收回；不能复原的小车零件统一收集，可用于后续制作课】",
  "board": "               1. 拆解我的小车模型\n\n    一、拆解规范\n        看（整体） → 记（画图） → 放（按顺序） → 回（能复原）\n\n    二、小车的四个部分\n    ┌──────────┬──────────────┬──────────────┐\n    │   部  分   │   包含什么     │    作  用     │\n    ├──────────┼──────────────┼──────────────┤\n    │ 动力部分  │ 发条·弹簧·电机│ 提供力量       │\n    │ 传动部分  │ 齿轮·皮带·轴  │ 把力传出去     │\n    │ 行驶部分  │ 车轮·车轴     │ 让车跑起来     │\n    │ 支撑部分  │ 车架·底盘·车壳│ 连接成整体     │\n    └──────────┴──────────────┴──────────────┘\n\n    ★ 结构决定功能，部分服从整体 ★\n\n    安全：先取电池 · 慢放发条 · 工具不对人 · 小零件不入口",
  "reflect": ""
 },
 "5|运动和力|4": {
  "goal": "科学观念：\n1.知道力有大小，力的单位是牛顿，符号是\"N\"。\n2.知道弹簧测力计是利用\"弹簧受力越大、伸得越长\"的原理制成的测量工具。\n3.知道1牛顿大约相当于用手托起两个鸡蛋（约100克物体）所用的力。\n\n科学思维：\n1.能理解\"弹簧伸长量与所受拉力成正比\"，初步建立\"可测量的量之间成正比例关系\"的意识。\n2.能通过对比不同力的测量数据，判断力的大小差异。\n\n探究实践：\n1.能正确识别弹簧测力计的各部分结构（提环、弹簧、指针、刻度板、挂钩）。\n2.能规范使用弹簧测力计：检查量程、调零、视线平齐读数、不超量程。\n3.能用测力计测量多种物体的重力，并记录数据。\n\n态度责任：\n1.养成先检查量程再测量的习惯，爱护精密仪器。\n2.如实记录数据，不臆造；发现异常数据主动重测。\n3.小组内轮流操作，人人动手。",
  "key": "认识弹簧测力计的结构与原理，学会正确使用测力计测量力的大小，建立\"牛顿\"这个力的单位的感性认识。",
  "hard": "①单位\"牛顿\"很抽象，学生没有感性认识——必须通过\"1N≈托起两个鸡蛋\"和亲手感触来建立。②读数时要视线与指针**齐平**，学生常俯视或仰视。③容易超过量程（用5N的测力计去称很重的物体），会损坏弹簧，必须强调先看量程、先估测。",
  "mat": "教师：弹簧测力计（1N、2.5N、5N各1个）、演示用大测力计1个、钩码1套、鸡蛋2个（或100克重物）、教学课件、记录单\n\n学生（四人小组）：弹簧测力计（5N）1个、钩码（50克若干个）1套、待测物体若干（文具盒、书本、石块、装满水的瓶子、塑料袋等）、记录单\n\n【低成本替代】\n弹簧测力计：可用橡皮筋＋硬纸板自制测力计——在纸板上画刻度，挂上已知重量的物体（如50克钩码、100克的食盐袋）标出对应刻度，即可粗略测量。虽不精确，但能帮助学生理解原理。\n钩码：可用已知重量的物品代替（一袋盐500克≈5N，一个鸡蛋约50克≈0.5N，一瓶500毫升水约5N）。\n待测物体：文具盒、课本、石头、装满水的瓶子，随手可得。",
  "proc": "一、激趣导入（6分钟）\n材料准备：两个大小不同的物体（如一本厚书和一个空塑料袋）\n\n1.提问：老师左手拿一本厚书，右手拿一个空塑料袋。托起它们，哪只手更用力？\n预设：拿书的那只手更用力。\n\n2.追问：那\"用力\"到底有多大？我们能不能想办法把它测出来？\n预设1：用秤称。\n预设2：不知道怎么测。\n\n3.教师点明：我们平时用秤称的是\"质量\"（多少克、多少千克），而\"用了多大的力\"要用专门的仪器来测——弹簧测力计。\n（板书课题：测量力的大小）\n\n二、新课教学（28分钟）\n\n（一）认识弹簧测力计（8分钟）\n材料准备：测力计、教学课件\n\n1.教师出示测力计，介绍各部分名称（学生对照自己桌上的实物找一找）：\n·提环：手拿的地方；\n·弹簧：里面的弹簧，是核心部件；\n·指针：指示读数；\n·刻度板：上面有刻度，标着\"N\"；\n·挂钩：挂被测物体。\n\n2.认识单位：\n提问：刻度板上写的\"N\"是什么意思？\n预设：是力的单位。\n教师讲解：力的单位叫\"牛顿\"，符号是\"N\"，是为了纪念科学家牛顿。\n追问：1牛顿有多大？\n教师演示：用测力计挂起两个鸡蛋（约100克），读数大约是1N。\n师：1牛顿，大约就是用手托起两个鸡蛋所用的力。\n\n3.体验1牛顿：\n学生活动：每人用手托起两个鸡蛋（或100克的物体），感受1牛顿有多大。\n\n4.讲解原理（教师拉伸弹簧演示）：\n提问：用力拉弹簧，弹簧会怎样？力越大呢？\n预设：弹簧会伸长；力越大，伸得越长。\n师：弹簧测力计就是利用\"弹簧受力越大，伸得越长\"这个规律来测量力的。\n\n（二）学习使用方法（6分钟）\n材料准备：测力计、钩码\n\n教师示范并强调四条规范（板书）：\n\n①看量程：先看测力计最多能测多少牛（如5N），被测的力**不能超过**它，否则会损坏弹簧。\n②先调零：测量前检查指针是否指在\"0\"，不在就调整到0。\n③匀速测：测量时让物体静止悬挂（或匀速拉动），等指针稳定了再读。\n④平视读：读数时，视线要与指针所指的刻度线**齐平**，不能俯视也不能仰视。\n⑤会记录：记录数值时一定要带上单位\"N\"。\n\n教师演示错误示范（让学生判断）：俯视读数、超过量程、未调零。\n\n（三）分组测量（10分钟）\n材料准备：每组测力计、钩码、待测物体、记录单\n\n1.任务一：测量钩码的重力\n分别挂上1个、2个、3个钩码，记录读数。\n提问：钩码越多，读数怎么变？\n预设：读数越来越大，而且成倍增加（1个0.5N，2个1N，3个1.5N）。\n\n2.任务二：测量身边物体的重力\n每组选3—5样东西（文具盒、课本、石块、装满水的瓶子、书包等），先估测，再实测，记录在表格里。\n教师提醒：估测后再实测，是为了培养\"估计\"的能力；重的物体（如装满书的书包）要先估一估，超过量程就不要硬测。\n\n3.学生分组测量，教师巡视，重点纠正：\n·超过量程的测量（立即制止）；\n·读数时视线不平；\n·没有调零就开始测量。\n\n4.数据交流：各组汇报测量结果，教师板书几个典型数据。\n\n（四）研讨（4分钟）\n1.提问：测量中你遇到了什么困难？\n预设1：指针一直在晃，读不准。\n预设2：超过了量程，指针到顶了。\n预设3：不知道该看哪条刻度线。\n\n2.追问：怎么解决？\n预设：等指针稳定再读；超过量程就换大量程的测力计；视线要平。\n\n3.教师总结：测量是一项需要耐心和细心的工作。数据不准，后面的分析就全错了。\n\n三、课堂总结（6分钟）\n1.提问：力的单位是什么？1牛顿大概有多大？\n预设：牛顿（N）；大约相当于托起两个鸡蛋的力。\n2.提问：使用测力计要注意哪几点？\n预设：看量程、先调零、匀速测、平视读、带单位。\n3.提问：测力计为什么能测出力？\n预设：因为弹簧受力越大，伸得越长。\n4.教师提升：今天我们学会了一种非常重要的科学技能——测量。从今天起，我们研究力的时候，就不再凭\"感觉\"，而是用\"数据\"说话了。\n5.布置：回家用测力计（或自制橡皮筋测力计）测一测家里的5样物品，记录下来，明天比一比谁估得最准。\n\n【整理：测力计用完要让指针归零、平放收纳，不能挂在钩码上存放（会使弹簧疲劳）】",
  "board": "                   4. 测量力的大小\n\n    一、力的单位\n        牛顿，符号 N（纪念科学家牛顿）\n        1 N ≈ 用手托起两个鸡蛋（约100克）所用的力\n\n    二、测力计的结构\n        提环 → 弹簧 → 指针 → 刻度板 → 挂钩\n\n    三、原理\n        ★ 弹簧受力越大，伸得越长 ★\n\n    四、使用五要点\n        ① 看量程 —— 不能超过最大刻度\n        ② 先调零 —— 指针不对0要调整\n        ③ 匀速测 —— 等指针稳定再读\n        ④ 平视读 —— 视线与刻度线齐平\n        ⑤ 带单位 —— 数值后面要写\"N\"\n\n    五、数据记录表示例\n        ┌────────┬────────┬────────┐\n        │  物 体  │ 估 测  │ 实 测  │\n        ├────────┼────────┼────────┤\n        │ 文具盒 │ 1.5 N  │ 1.8 N  │\n        │ 课本   │ 2.0 N  │ 2.4 N  │\n        └────────┴────────┴────────┘",
  "reflect": ""

 "5|运动和力|6": {
  "goal": "科学观念：\n1.知道工程设计的基本流程：明确问题 → 设计方案 → 制作模型 → 测试改进 → 展示评价。\n2.知道\"月球小车\"需要针对月球表面的特殊环境（低重力、崎岖地形、无大气）进行针对性设计。\n3.知道力可以使物体运动起来，不同动力方式（重力、弹力、反冲力等）各有特点。\n\n科学思维：\n1.能根据任务要求（能在模拟月面行驶、能越过障碍、能保持稳定）进行有针对性的设计。\n2.能在测试后分析失败原因，提出具体的改进方案，经历迭代优化。\n\n探究实践：\n1.能以小组为单位完成\"月球小车\"的设计方案（含设计图、材料清单、分工）。\n2.能利用废旧材料制作月球小车模型。\n3.能进行多次测试，根据测试结果改进作品。\n\n态度责任：\n1.乐于与同伴合作，能倾听不同意见，共同解决问题。\n2.面对失败不气馁，愿意反复尝试和改进。\n3.养成节约材料、垃圾分类的习惯，体会\"废物利用\"的价值。",
  "key": "以小组为单位，针对月球环境的特点，设计并制作一辆\"月球小车\"模型，经历\"设计—制作—测试—改进\"的完整工程实践过程。",
  "hard": "①学生容易\"直接动手做\"而跳过设计环节，导致做出来与需求不符——必须强制要求\"先画图、后制作\"。②测试中暴露的问题（跑偏、动力不足、轮子打滑、过不了障碍）需要学生自己分析原因并改进，而不是教师直接给答案。③材料以废旧物为主，粘接不牢、结构松散是常见问题，需要提前准备合适的连接方式（热熔胶、胶带、扎带）。",
  "mat": "教师：月球表面图片/视频、工程设计流程海报、热熔胶枪（教师操作）1把、多种废旧材料（纸盒、瓶盖、吸管、竹签、橡皮筋、气球、CD片、旧玩具车轮等）、工具（剪刀、美工刀、尺子、胶带）、测试跑道（长约2米，含小坡和障碍物）、评价量表\n\n学生（四人小组）：设计图纸（A3）、铅笔、彩色笔、自备废旧材料（纸盒、瓶盖、吸管、气球、橡皮筋、旧玩具零件等）、剪刀、胶带、记录单\n\n【低成本替代 —— 乡村学校重点】\n车身：废旧纸盒、塑料瓶、泡沫板、一次性餐盘。\n车轮：瓶盖、旧光盘、硬纸板剪圆、木塞、线轴。\n车轴：竹签、一次性筷子、吸管、铁丝。\n动力：气球（反冲力）、橡皮筋（弹力）、重物下落（重力）、斜坡（重力）。\n连接：透明胶带、双面胶、热熔胶（教师操作）、扎带、绳线。\n月面模拟：用沙土＋石块铺成跑道，或用皱起的硬纸板模拟崎岖地面。\n⚠ 材料全生活化，成本可控制在每组几元以内；建议提前一周布置学生收集材料。",
  "proc": "一、明确任务（6分钟）\n材料准备：月球表面图片/视频、工程流程海报\n\n1.播放月球表面的图片或视频。\n提问：月球表面是什么样的？和我们这里有什么不同？\n预设1：有很多坑（环形山）。\n预设2：地面高低不平，有很多石头。\n预设3：没有空气，也没有水。\n预设4：重力比地球上小。\n\n2.发布任务：\n我们要为宇航员设计制作一辆**月球小车**，用来在月球表面运送物资。\n要求：\n①能自己行驶（不能用电池马达，用我们学过的力——重力、弹力、反冲力等）；\n②能在崎岖的路面上前进至少1米；\n③能越过一个小障碍（约2厘米高）；\n④行驶过程中不能散架、不能侧翻。\n\n3.提问：要完成这个任务，第一步该做什么？\n预设：先想清楚怎么做，画个图。\n教师强调：工程师做东西，一定是**先设计、后制作**，不能边做边想。\n\n（板书课题：制作\"月球小车\"）\n\n二、设计方案（8分钟）\n材料准备：每组设计图纸、彩色笔\n\n1.小组讨论，填写设计方案（教师提供框架）：\n·我们打算用什么做动力？（气球反冲 / 橡皮筋弹力 / 重物下落 / 斜坡）\n·车身用什么材料？什么样子的？（考虑：要轻，但要结实）\n·车轮用什么？怎样让轮子转得灵活？（轴和轮子的连接）\n·怎样让它不容易翻车？（车身低一点、轮子宽一点）\n·小组分工：谁负责车身、谁负责轮子、谁负责动力、谁负责记录。\n\n2.画出设计图：\n要求：画出小车的样子，标注各部分用什么材料，标明尺寸（大概多少厘米）。\n提醒：设计图要画得让别人看得懂，因为别的小组要提建议。\n\n3.小组间交流：相邻两组互相看设计图，提一条改进建议。\n\n4.教师巡视，重点引导学生思考：\n·轮子会不会打滑？\n·动力够不够把车推动？\n·车身太重会不会跑不动？\n\n三、制作模型（14分钟）\n材料准备：废旧材料、工具\n\n1.学生按设计图制作，教师巡视。\n\n2.教师提供技术支援：\n·热熔胶粘接由教师操作（安全）；\n·轮子与轴的连接：轴要固定，轮子要能自由转动（这是常见的技术难点，教师可示范\"吸管做轴套\"的方法——把吸管固定在车身上，竹签穿过吸管当轴，轮子固定在竹签两端）；\n·动力装置的安装：气球要固定牢，气嘴朝后。\n\n3.教师在各组间引导提问（帮助学生自我检查）：\n·你的车现在能跑吗？先试一试。\n·轮子转得灵活吗？\n·车身稳不稳？\n\n4.提醒：时间是有限的，先把\"能跑起来\"做到，再去追求跑得更远。\n\n四、测试与改进（8分钟）\n材料准备：测试跑道（含小坡和障碍）、记录单\n\n1.第一次测试：各组在跑道上测试，记录：\n·跑了多远？（厘米）\n·能否越过障碍？\n·有没有散架或侧翻？\n\n2.研讨：出现了什么问题？\n预设问题及可能原因：\n·跑不动 / 跑得近 → 动力不足、车身太重、摩擦力太大；\n·跑偏 → 左右轮子不一样大、轴装歪了；\n·轮子打滑 → 轮子太光滑、地面太滑、车身太轻；\n·过不了障碍 → 轮子太小、障碍太高、动力不够；\n·侧翻 → 车身太高、轮距太窄。\n\n3.改进：各组根据问题制定改进方案，动手修改（时间允许的话当场改，否则课后改进，下节课再测）。\n提醒：改进要针对具体问题，不要推倒重来。\n\n师小结：这就是工程设计的常态——很少有作品一次就成功，正是\"测试—发现问题—改进—再测试\"这个循环，让作品越来越好。\n\n五、课堂总结（4分钟）\n1.提问：今天经历了哪些步骤？\n预设：明确任务 → 设计方案 → 制作 → 测试 → 改进。\n2.教师提升：这五个步骤，是全世界工程师都在用的方法。今天我们做的是月球小车，明天你们可以用它解决任何问题。\n3.预告：下节课我们将举行\"月球小车发布会\"，对各组的作品进行评价和展示。\n\n【整理：剩余材料分类回收（纸类、塑料类），工具清点归位；未完成的小车妥善保管，下节课继续】",
  "board": "             6. 制作\"月球小车\"\n\n    一、任务要求\n        ① 自己行驶（用重力/弹力/反冲力，不用马达）\n        ② 崎岖路面前进 ≥ 1 米\n        ③ 越过约 2 厘米障碍\n        ④ 不散架 · 不侧翻\n\n    二、工程流程\n        ★ 明确问题 → 设计方案 → 制作模型 → 测试改进 → 展示评价 ★\n\n    三、设计要点\n        动力：气球反冲 · 橡皮筋弹力 · 重物下落\n        车身：轻而结实（纸盒 · 塑料瓶 · 泡沫）\n        车轮：瓶盖 · 光盘 · 线轴（要能灵活转动）\n        车轴：吸管做轴套 + 竹签当轴（关键技巧！）\n        防翻：车身低 · 轮距宽\n\n    四、问题诊断表\n        ┌──────────┬──────────────────┐\n        │  现  象    │   可能原因         │\n        ├──────────┼──────────────────┤\n        │ 跑不动    │ 动力小·车太重·摩擦大│\n        │ 跑  偏    │ 轮不一样大·轴装歪   │\n        │ 轮子打滑  │ 轮太滑·车太轻       │\n        │ 过不了障碍│ 轮太小·动力不够     │\n        │ 侧  翻    │ 车身高·轮距窄       │\n        └──────────┴──────────────────┘",

 "5|运动和力|7": {
  "goal": "科学观念：\n1.知道对工程作品的评价需要从多个维度进行（功能、可靠性、创新性、工艺、成本等）。\n2.知道评价需要有明确的标准和可测量的数据，不能只凭\"好看不好看\"。\n3.知道改进是在评价的基础上进行的，工程产品往往需要多次迭代才能完善。\n\n科学思维：\n1.能依据评价量表对作品进行客观评价，并用数据支撑自己的判断。\n2.能辨析\"优点\"与\"不足\"，提出有针对性、可操作的改进建议。\n\n探究实践：\n1.能参与制定评价量表，明确各评价维度的标准。\n2.能使用测量工具（尺、测力计、秒表）收集评价数据。\n3.能根据评价结果，对自己的作品提出具体的改进方案。\n\n态度责任：\n1.能客观看待自己和他人的作品，虚心接受批评意见。\n2.学会欣赏他人的创意，不贬低别人的成果。\n3.体会\"没有最好，只有更好\"的工程精神。",
  "key": "制定评价量表，对\"月球小车\"进行多维度测试与评价，根据评价结果提出改进方案，完成工程实践的完整闭环。",
  "hard": "①学生评价容易停留在\"好看/不好看\"\"我喜欢/不喜欢\"的主观层面，需要量表引导到\"用数据说话\"。②测试过程容易混乱（多组同时测、数据记不准），需要明确的分工和流程。③改进建议容易空泛（\"要做得更好\"），需要引导学生提出具体可操作的方案（\"把轮子换成更大的瓶盖以增加通过性\"）。",
  "mat": "教师：评价量表（大张或课件）、测试跑道（2米，含障碍）、卷尺1个、秒表1个、电子秤（可选）、评分表（每组若干）、教学课件、获奖证书模板\n\n学生（四人小组）：本组的月球小车、记录单、评分表（给其他组打分用）、笔\n\n【低成本替代】\n测量工具：卷尺可用米尺、绳子＋直尺代替；秒表可用手机秒表。\n跑道：用课桌拼成，或用粉笔在水泥地上画线，用砖块、书本做障碍。\n评价量表：手绘在黑板上或打印若干份。",
  "proc": "一、导入：为什么要评价（4分钟）\n材料准备：教学课件\n\n1.提问：汽车出厂前要经过什么？\n预设：检查、测试、试驾。\n\n2.追问：为什么要测试和检查？\n预设：怕有毛病，要保证能开、安全。\n\n3.引入：今天我们就是\"月球小车验收小组\"，要给各组的小车做一次全面体检。\n（板书课题：评价\"月球小车\"）\n\n二、制定评价量表（7分钟）\n材料准备：评价量表\n\n1.提问：一辆好的月球小车，应该从哪些方面来评价？\n\n预设：跑得远、跑得稳、好看、有创意、结实、材料省、能过障碍……\n\n2.教师引导归纳，形成评价维度（师生共同制定量表）：\n\n| 维度 | 标准 | 分值 |\n|---|---|---|\n| ① 行驶距离 | 能跑1米得15分，每多20厘米加5分，最高30分 | 30 |\n| ② 越障能力 | 能越过2厘米障碍得20分，过不了得0分 | 20 |\n| ③ 稳定性 | 行驶中不散架、不侧翻 | 20 |\n| ④ 创新性 | 动力方式或结构有独特之处 | 15 |\n| ⑤ 工艺与环保 | 制作精细、废物利用好、材料节约 | 15 |\n\n（教师说明：这个量表是大家一起定的，标准明确，大家都按同一把尺子量，评价才公平。）\n\n3.提问：为什么要用尺子量、用秒表计时，而不是\"我看它跑得挺快\"？\n预设：因为数据是准确的，感觉会骗人。\n\n三、分组测试与评价（18分钟）\n材料准备：测试跑道、卷尺、秒表、评分表\n\n1.测试流程（教师明确规则）：\n·各组按序号依次测试，其他组当\"观察员\"并打分；\n·每组有2次测试机会，取较好的一次；\n·测试员（学生担任）负责量距离、计时、记录；\n·扣分与加分都要有事实依据。\n\n2.逐组测试，各组填写评分表。\n\n3.每组测试后，留2分钟进行\"答辩\"：\n·请该组介绍：你们的设计亮点是什么？\n·其他组提问或提出改进建议（要求：先说一个优点，再提一条具体建议）。\n\n教师示范提建议的方式：\n✗ 不好：\"你的车跑得不够远。\"\n✔ 好：\"你的车跑得挺稳的（优点），如果把气球换大一点、车身再减轻一些，可能会跑得更远（具体建议）。\"\n\n4.教师巡视，引导评价聚焦到\"数据与结构\"，避免人身评价。\n\n四、数据分析与改进方案（7分钟）\n材料准备：评分汇总表\n\n1.汇总各组得分，公布结果（不排名次，只公布各项得分）。\n\n2.研讨：\n提问：得分高的小组，哪些方面做得好？\n预设：轮子大、车身轻、动力足、连接牢固。\n提问：普遍存在的问题是什么？\n预设：轮子打滑、动力不足、跑偏、车身太重。\n\n3.各小组填写\"改进方案单\"：\n·我们作品的得分：___分，其中最强项是___，最弱项是___。\n·我们发现的3个问题：①___ ②___ ③___\n·我们的改进方案（要具体）：①___ ②___ ③___\n·改进后预期效果：___\n\n教师要求：改进方案必须具体、可操作，比如\"把前轮换成大瓶盖，增加通过性\"，而不是\"改进一下\"。\n\n4.教师提升：工程设计没有终点。真正的工程师，永远在\"评价—改进—再评价\"的循环里前进。今天的分数不重要，重要的是你找到了改进的方向。\n\n五、总结与表彰（4分钟）\n1.教师总结：从拆解小车，到研究动力，再到设计制作、测试评价，我们完整地经历了一次工程实践。你们现在已经像真正的工程师一样思考和工作了。\n\n2.多元表彰（不只看分数，让每个孩子都有成就感）：\n·最远距离奖\n·最佳越障奖\n·最稳如泰山奖\n·最有创意奖\n·最美工艺奖\n·最大进步奖（改进幅度最大的组）\n·最佳协作奖\n\n3.情感提升：这些小车是用废旧材料做的，成本几乎为零，但它们背后是你们的思考、合作和坚持——这才是最宝贵的。\n\n4.布置：课后完成\"改进方案单\"，有条件的组可以在课后服务时间继续改进，我们将举办一次\"月球小车改进版\"展示。\n\n【整理：拆解可用零件回收进材料箱，供下次制作课使用；废纸、塑料分类投放】",
  "board": "              7. 评价\"月球小车\"\n\n    一、为什么要评价？\n        检验是否达标 · 发现问题 · 明确改进方向\n\n    二、评价量表（师生共同制定）\n        ┌──────────┬──────────────────┬──────┐\n        │  维  度    │      标  准        │ 分值 │\n        ├──────────┼──────────────────┼──────┤\n        │ 行驶距离  │ 1米15分，每+20cm加5│  30 │\n        │ 越障能力  │ 越过2cm障碍        │  20 │\n        │ 稳定性    │ 不散架·不侧翻      │  20 │\n        │ 创新性    │ 动力/结构有独特之处 │  15 │\n        │ 工艺环保  │ 精细·废物利用·节约 │  15 │\n        └──────────┴──────────────────┴──────┘\n\n    三、提建议的句式\n        ✔ \"优点是……，如果把……，可能会……\"\n        ✗ \"你的车不好 / 跑得不够远\"\n\n    四、改进方案单\n        得分___  最强项___  最弱项___\n        发现的问题：①___ ②___ ③___\n        具体改进：①___ ②___ ③___\n\n    ★ 工程精神：没有最好，只有更好 ★",
  "reflect": ""

 "5|地球表面的变化|1": {
  "goal": "科学观念：\n1.知道地球表面是高低起伏、多种多样的，有平原、高原、山地、丘陵、盆地等主要地形。\n2.知道地形图是用等高线（或分层设色）来表示地表高低起伏的。\n3.知道我们居住的地方也有其独特的地形特征。\n\n科学思维：\n1.能通过阅读地形图（分层设色图、等高线图），判断一个地区的大致地形和海拔高低。\n2.能通过对比不同地区的地形图，归纳出各类地形的特征。\n\n探究实践：\n1.能在中国地形图（或世界地形图）上找出主要的高原、平原、山地、盆地。\n2.能制作一个简单的地形模型（用橡皮泥或泡沫板），表示山地、平原、河流等地貌。\n3.能观察家乡的地形特征，并尝试在图上找到自己的家乡。\n\n态度责任：\n1.对地球表面的多样性产生惊叹与好奇。\n2.建立\"家乡—祖国—地球\"的空间观念，增强对家乡的认同感。\n3.意识到人类要因地制宜、与自然和谐相处。",
  "key": "认识地球表面的主要地形类型及其特征，学会阅读地形图（分层设色图、等高线图）判断地表高低起伏，并观察了解家乡的地形。",
  "hard": "①地形图（尤其等高线图）对小学生来说非常抽象，把\"平面图上的线圈\"与\"立体的山\"对应起来是最大难点——必须用立体模型辅助。②\"分层设色\"的颜色含义（绿色=低，黄色=较高，褐色=高，白色=雪线以上）需要记忆，可编口诀。③学生对家乡以外的地形缺乏直观经验，要多用图片和视频。",
  "mat": "教师：中国地形图（挂图或大幅打印）1张、世界地形图1张、本地（天等县／广西）地形图或卫星图1张、教学课件（含各类地形实景照片和视频）、地形模型（橡皮泥或3D打印）1个\n\n学生（四人小组）：橡皮泥（或泡沫板）1份、中国地形图（A3）1张、彩色笔、记录单、本地地形照片（提前布置学生拍）\n\n【低成本替代】\n地形图：可从网络地图截图打印（黑白亦可）；也可用脚本地图、旅游图代替。\n立体模型：用黄泥巴、沙子、泡沫板堆塑，比橡皮泥更便宜且效果好。\n等高线演示：用萝卜或土豆切成\"山\"，逐层切片画圈，最直观。\n\n【乡土资源利用（本课重点）】\n天等县地处广西西南部，属典型的**喀斯特（岩溶）地貌**：石灰岩广布，山峰林立、溶洞众多、地下河发育。\n建议在\"观察家乡地形\"环节重点使用本地素材：\n·学生从家中带来的本地山地、溶洞、梯田照片；\n·教师准备天等县卫星地形图（可从网络地图截图打印）；\n·如条件允许，可结合本地著名的喀斯特景观（如都康田园、龙茗一带）进行讨论。\n这样能让学生真切感受到\"科学就在身边\"。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件（从太空拍摄的地球照片）\n\n1.播放从太空拍摄的地球照片。\n提问：从太空看，地球是什么样子的？\n预设1：蓝色的，很漂亮。\n预设2：有白色的云。\n预设3：能看到陆地和海洋。\n\n2.追问：如果我们坐飞机往下看，或者坐车在路上走，看到的地面都一样吗？\n预设：不一样，有的地方平，有的地方是山。\n\n3.引入：地球表面并不是平平的一块，而是高低起伏、千姿百态的。今天我们就来看看，地球表面到底长什么样。\n（板书课题：地球的表面）\n\n二、新课教学（28分钟）\n\n（一）认识主要的地形类型（10分钟）\n材料准备：教学课件（各类地形实景图）、地形模型\n\n1.教师逐一出示五种主要地形的实景图，引导学生观察特征：\n\n①平原：又平又广，一眼望不到边，海拔低（如东北平原、华北平原）。\n提问：平原适合做什么？——种地、建城市、修路。\n\n②高原：面积很大、顶面比较平坦，但海拔很高（如青藏高原，\"世界屋脊\"）。\n提问：高原和平原看起来都是平的，有什么不同？——高原海拔高，空气稀薄，气候寒冷。\n\n③山地：地势高、起伏大，有高高的山峰和深深的山谷（如喜马拉雅山脉、秦岭）。\n提问：山地和平原比，最大的特点是什么？——高高低低、起伏很大。\n\n④丘陵：比山地矮一些，起伏比较和缓，像一个个小土包（如东南丘陵）。\n提问：丘陵和山地怎么区分？——丘陵更矮、更平缓。\n\n⑤盆地：四周高、中间低，像个大盆子（如四川盆地、塔里木盆地）。\n\n2.小活动：教师说地形名称，学生用手势比划（平原：手掌平放；山地：手做个尖；盆地：双手围成圈）。\n\n3.教师补充：这五种是最基本的地形类型，实际的地表往往由它们组合而成。\n\n（二）学会看地形图（10分钟）\n材料准备：中国地形图（每组1张）、教学课件\n\n1.提问：怎样在一张平面的纸上，表示出高低起伏的地面呢？\n\n2.介绍方法一：分层设色（最常见）\n讲解：地形图上用不同的颜色表示不同的高度——\n·绿色：海拔低（平原）；\n·黄色、橙色：海拔较高（高原、丘陵）；\n·褐色、棕色：海拔高（山地）；\n·白色：很高，终年积雪；\n·蓝色：水域（海洋、湖泊、河流，颜色越深水越深）。\n口诀（教师带领齐读）：\"绿低黄高褐更高，白色山顶雪飘飘，蓝色地方都是水。\"\n\n3.小活动：在地图下方找到\"高度表\"（图例），对照颜色看高度。\n\n4.介绍方法二：等高线（简要）\n教师出示等高线图（可用课件）。\n讲解：把地面上高度相同的点连成线，画在地图上，就是等高线。\n·等高线越密 → 坡越陡；\n·等高线越稀 → 坡越缓；\n·一圈套一圈，中心高 → 是山峰；\n·一圈套一圈，中心低 → 是盆地。\n\n5.难点突破（用立体模型）：\n教师出示橡皮泥做的山，把它\"切片\"，每切一层就在纸上画一个圈——这一个个圈，就是等高线。\n（教师演示切片画圈的过程，学生观察）\n师：等高线，就是把立体的山\"压扁\"画在纸上的办法。\n\n（三）在中国地形图上找一找（8分钟）\n材料准备：每组中国地形图1张、彩色笔、记录单\n\n1.任务：在中国地形图上找出并圈出：\n·我国四大高原：青藏高原、内蒙古高原、黄土高原、云贵高原；\n·我国三大平原：东北平原、华北平原、长江中下游平原；\n·我国主要山脉：喜马拉雅山脉、昆仑山脉、秦岭、大兴安岭；\n·我国最大的盆地：塔里木盆地。\n\n2.提问：看看我国的地形，整体有什么特点？\n预设：西边高（青藏高原，褐色），东边低（平原，绿色）。\n师：我国地势西高东低，像三级台阶，所以大江大河大多向东流。\n\n3.找家乡（★乡土环节）：\n提问：我们的家乡广西（天等县）在哪里？在地图上是什么颜色？属于什么地形？\n学生在中国地形图上找到广西。\n预设：在南部，颜色偏黄绿，说明海拔不高不低。\n\n4.展示本地地形照片/卫星图：\n师：我们天等县属于**喀斯特地貌**（也叫岩溶地貌）——地上有很多石灰岩山峰，地下有溶洞和地下河。大家在照片里看到的那些\"一座座拔地而起、圆圆的山\"，就是喀斯特山峰。\n\n5.提问：这样的地形，对我们的生活有什么影响？\n预设1：山多平地少，种地要修梯田。\n预设2：风景很美，可以发展旅游。\n预设3：石头多，可以用来盖房子、烧石灰。\n预设4：雨水容易渗到地下，地表缺水。\n\n师小结：地形影响着我们的生产和生活，人们也在长期适应中形成了独特的生活方式——这就是\"因地制宜\"。\n\n三、课堂总结（6分钟）\n1.提问：地球表面主要有哪几种地形？\n预设：平原、高原、山地、丘陵、盆地。\n2.提问：在分层设色地形图上，颜色代表什么？\n预设：绿低、黄较高、褐高、白最高、蓝是水。\n3.提问：我们家乡属于什么地形？\n预设：喀斯特地貌，石灰岩山峰多。\n4.教师提升：地球表面的这些高山、平原、盆地，并不是自古以来就这样的，它们在漫长的时间里一直在变化。是什么力量在改变它们？接下来的几节课我们就来研究。\n5.布置：用橡皮泥做一座\"山\"，把它切成片、画出等高线，下节课带来展示。\n\n【提示：地形图要轻拿轻放，用后卷好或平放收纳】",
  "board": "                  1. 地球的表面\n\n    一、五种基本地形\n        ┌────┬──────────────┬──────────┐\n        │地形 │    特  征      │  举  例   │\n        ├────┼──────────────┼──────────┤\n        │平原 │ 平坦广阔·海拔低│ 东北平原  │\n        │高原 │ 面积大·顶面平·高│ 青藏高原  │\n        │山地 │ 高耸·起伏大    │ 喜马拉雅山│\n        │丘陵 │ 较低·起伏和缓  │ 东南丘陵  │\n        │盆地 │ 四周高·中间低  │ 四川盆地  │\n        └────┴──────────────┴──────────┘\n\n    二、地形图怎么看？\n        分层设色口诀：\n        ★ 绿低 · 黄较高 · 褐更高 · 白是雪 · 蓝是水 ★\n\n        等高线：\n        线密 → 坡陡    线稀 → 坡缓\n        圈中高 → 山峰   圈中低 → 盆地\n\n    三、我国地势\n        西高东低（三级阶梯）→ 大江东流\n\n    四、家乡地形（天等）\n        ★ 喀斯特（岩溶）地貌 ★\n        石灰岩山峰 · 溶洞 · 地下河\n        影响：山多田少→修梯田 · 风景美→发展旅游\n              雨水易渗→地表缺水",
  "reflect": ""

 "5|地球表面的变化|2": {
  "goal": "科学观念：\n1.知道火山喷发是地球内部能量释放的一种方式，喷发时岩浆、火山灰、气体从火山口喷出。\n2.知道火山喷发会改变地表形态：形成火山锥、火山口湖、熔岩台地，也可能摧毁原有地貌。\n3.知道火山喷发既带来灾害，也带来肥沃土壤、矿产资源和地热资源。\n\n科学思维：\n1.能通过模拟实验，把\"看不见的地球内部过程\"转换成\"看得见的现象\"。\n2.能在模拟实验与真实火山之间建立对应关系，理解模拟实验的\"像\"与\"不像\"。\n\n探究实践：\n1.能完成\"土豆泥＋番茄酱\"模拟火山喷发实验，观察并记录现象。\n2.能通过改变变量（如\"岩浆\"的稀稠、封口的松紧）观察喷发的不同。\n3.能画出火山的结构示意图，标注火山口、火山锥、岩浆通道。\n\n态度责任：\n1.认识到自然灾害的威力，树立防灾避险意识。\n2.体会模拟实验的价值，也知道它的局限——模拟不等于真实。\n3.辩证看待自然现象：火山既有害也有利。",
  "key": "通过模拟火山喷发的实验，认识火山喷发的过程及其对地表形态的改变，理解火山喷发是地球内部力量作用的结果。",
  "hard": "①模拟实验容易\"只顾热闹\"，学生看完就忘，必须在实验前明确观察任务、实验中记录、实验后研讨。②学生容易把模拟实验等同于真实火山，需要引导讨论\"哪里像、哪里不像\"（如：真实的岩浆来自地下深处，温度上千度；我们的番茄酱只是被\"挤\"出来的）。③火山喷发的\"双面性\"（灾害与资源）需要辩证引导。",
  "mat": "教师：模拟实验材料1套（土豆泥或橡皮泥、番茄酱、小苏打、白醋、洗洁精、小塑料瓶、托盘、漏斗）、火山结构示意图、火山喷发实景视频、教学课件\n\n学生（四人小组）：小塑料瓶（如100毫升的矿泉水瓶）1个、土豆泥（提前蒸熟，约200克）或橡皮泥1份、番茄酱（或红墨水＋洗洁精调成的\"岩浆\"）适量、小苏打1勺、白醋半杯、托盘（或大塑料盘）1个、漏斗1个、记录单\n\n【低成本替代 —— 乡村学校重点】\n\"山体\"：土豆泥最佳（可塑形、便宜），也可用橡皮泥、黄泥巴、湿沙子堆成锥形。\n\"岩浆\"：番茄酱；或用红墨水（红曲粉、辣椒面染色）＋洗洁精＋水调成糊状。\n\"气体\"：小苏打＋白醋产生二氧化碳（这是喷发动力的关键，比单纯加热效果好得多）。\n托盘：用大塑料盆、月饼盒、硬纸板围边代替。\n瓶子：小矿泉水瓶、药瓶，剪去上部即可。\n⚠ 若不便使用白醋小苏打，也可采用加热法（需酒精灯，教师操作，注意安全）。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件（火山喷发实景视频片段，1分钟）\n\n1.播放火山喷发的实景视频（选择有明显岩浆流淌、烟柱冲天的片段）。\n提问：这是什么？你看到了什么？\n预设1：火山爆发。\n预设2：有火红的岩浆流下来。\n预设3：有黑色的烟冲上天。\n预设4：很壮观，也很可怕。\n\n2.追问：岩浆是从哪里来的？地下为什么会有这么烫的、能流动的东西？\n\n预设1：地底下有火。\n预设2：地球里面很热。\n\n3.引入：地球内部确实非常热，那里的岩石被高温熔化成了岩浆。当岩浆沿着地壳的裂缝往上冲，冲出地表，就是火山喷发。今天我们就用实验来模拟这个过程。\n（板书课题：火山喷发对地表的作用）\n\n二、新课教学（28分钟）\n\n（一）认识火山的结构（5分钟）\n材料准备：火山结构示意图\n\n1.教师出示示意图，介绍：\n·火山口：山顶上的凹陷处，岩浆从这里喷出；\n·火山锥：喷出的物质堆积成的小山；\n·岩浆通道：地下连接岩浆库和火山口的管子；\n·岩浆库：地下储存岩浆的地方。\n\n2.小活动：请学生在记录单上画一座火山，标注这四个部分。\n\n（二）模拟实验：火山喷发（14分钟）\n材料准备：每组实验材料、记录单\n\n1.教师明确观察任务（实验前必讲）：\n★观察三个问题：\n①\"岩浆\"是从哪里喷出来的？\n②喷出来以后，\"岩浆\"流到了哪里？堆成了什么形状？\n③喷发前后，\"山\"的样子有什么变化？\n\n2.制作\"火山\"：\n①把小塑料瓶放在托盘中央；\n②用土豆泥（或橡皮泥）围绕瓶子堆成一座小山的形状，**注意不要把瓶口堵住**；\n③瓶口就是\"火山口\"。\n\n3.准备\"岩浆\"：\n①向瓶里加入约2勺小苏打；\n②滴几滴洗洁精（让\"岩浆\"更容易起泡）；\n③倒入番茄酱（或红色糊状液）至瓶子的三分之二处。\n\n4.喷发（关键步骤）：\n教师口令：把白醋沿着漏斗快速倒入瓶中，然后**立刻退开观察**。\n（提醒：不要凑太近看，防止液体溅到眼睛）\n\n5.学生分组实验，教师巡视，提醒边观察边记录。\n\n6.现象交流：\n提问：你看到了什么？\n预设1：红色的\"岩浆\"从瓶口冒出来，流下了山坡。\n预设2：有很多泡沫涌出来。\n预设3：流下来的\"岩浆\"在山坡上堆成了一条一条的痕迹。\n\n7.追问（关键研讨）：\n①\"岩浆\"为什么会自己喷出来？\n预设：因为小苏打和白醋产生了气体，气体把\"岩浆\"顶了出去。\n师：真实的火山喷发也是这样——岩浆里溶解着大量气体，压力很大，一旦找到出口，就会猛烈喷发。\n\n②喷出来的\"岩浆\"流到哪里去了？堆积成了什么？\n预设：顺着山坡往下流，流到托盘里，在山坡上留下了痕迹，堆高了山。\n\n③喷发前后，\"山\"的样子变了吗？\n预设：变了，山坡上多了\"岩浆\"流过的地方，山好像被\"加高\"了一点。\n\n师小结：喷发出的岩浆冷却以后会变成坚硬的岩石，堆积在火山口周围，日积月累就形成了高高的**火山锥**；熔岩流过的低洼地方，会形成平坦的**熔岩台地**。\n\n（三）研讨：模拟实验和真实火山的\"像\"与\"不像\"（5分钟）\n提问：我们的实验，哪些地方像真的火山？\n预设1：都是从\"山顶\"的口子喷出来的。\n预设2：都是因为里面有气体、有压力。\n预设3：岩浆都会沿着山坡往下流，都能堆成山。\n\n提问：哪些地方不像？\n预设1：我们的\"岩浆\"不烫，真的岩浆有上千度。\n预设2：真的火山是从地下很深的地方喷出来的，我们的瓶子很浅。\n预设3：真的火山喷发时间很长，我们几秒钟就结束了。\n预设4：真的岩浆是熔化的岩石，我们是番茄酱。\n\n师小结（重要）：模拟实验是用容易操作的材料，模仿大自然的某个过程。它能帮我们理解\"发生了什么\"，但不能完全等同于真实。这就是模拟实验的价值与局限。\n\n（四）火山的\"好\"与\"坏\"（4分钟）\n材料准备：教学课件\n\n1.提问：火山喷发会带来什么危害？\n预设：烧毁房屋和森林、掩埋村庄、火山灰影响呼吸和航班、引发海啸和地震。\n\n2.追问：火山有没有好处？\n预设1：火山灰很肥沃，庄稼长得好。\n预设2：能形成温泉，可以泡澡、发电。\n预设3：有矿产，比如硫磺、宝石。\n预设4：火山风景很美，能发展旅游。\n\n3.教师补充：很多火山附近的土地非常肥沃，人们明知道有危险还是愿意住在那里——这就是\"权衡\"。\n\n三、课堂总结（6分钟）\n1.提问：火山喷发是怎样形成的？\n预设：地球内部压力大，岩浆沿着通道冲出地表。\n2.提问：火山喷发会怎样改变地表？\n预设：形成火山锥、熔岩台地、火山口湖；也会摧毁原有地貌。\n3.提问：做模拟实验时，最关键的是什么？\n预设：明确观察任务；知道哪里像、哪里不像。\n4.教师提升：火山喷发是**地球内部力量**（内力作用）改变地表的方式之一。下节课我们再研究另一种内力作用——地震。\n5.布置：查一查世界上著名的火山（如富士山、维苏威火山、长白山天池），选一座做一张小资料卡。\n\n【安全与整理：实验后桌面要擦拭；醋和小苏打残渣倒入下水道并冲水；土豆泥按垃圾分类处理】",
  "board": "              2. 火山喷发对地表的作用\n\n    一、火山的结构\n              ⊙ 火山口（喷出口）\n             ╱  ╲\n            ╱ 锥 ╲   ← 火山锥（喷出物堆积）\n           ╱______╲\n              ┃        ← 岩浆通道\n             ▓▓▓      ← 岩浆库（地下深处）\n\n    二、模拟实验\n        瓶子 = 岩浆通道    瓶口 = 火山口\n        土豆泥 = 山体      番茄酱 = 岩浆\n        小苏打 + 白醋 = 产生气体（压力来源）\n\n        现象：气泡涌出 → \"岩浆\"喷出 → 顺坡流淌 → 堆积成锥\n\n    三、喷发改变了地表\n        火山锥（堆积加高）· 熔岩台地（填平低洼）\n        火山口湖（积水成湖）· 摧毁原有地貌\n\n    四、像 vs 不像\n        像：从山顶口喷出·气体推动·沿坡流淌\n        不像：不烫·很浅·时间短·材料不同\n\n    五、灾害与资源（辩证看）\n        害：烧毁·掩埋·火山灰·引发海啸\n        利：肥沃土壤·地热·矿产·旅游",

 "5|地球表面的变化|3": {
  "goal": "科学观念：\n1.知道地震是地壳运动导致的地表震动，多发生在板块交界处或断裂带上。\n2.知道强烈的地震会改变地表：地面断裂、隆起、下陷，形成断层、地裂缝，还可能引发山体滑坡、堰塞湖等。\n3.知道地震是可以监测和预警的，掌握基本的避险自救方法。\n\n科学思维：\n1.能通过模拟实验，理解\"岩层受力弯曲—超过限度—突然断裂—产生震动\"的过程。\n2.能建立\"能量积累—突然释放\"的因果模型，理解为什么地震是突发性的。\n\n探究实践：\n1.能完成\"泡沫板（或海绵）弯曲断裂\"模拟实验，观察并记录现象。\n2.能完成\"积木（或纸盒）抗震测试\"，比较不同结构的抗震能力。\n3.能设计并演练地震避险的正确动作。\n\n态度责任：\n1.认识到地震灾害的严重性，树立\"宁可千日不震，不可一日不防\"的意识。\n2.掌握科学的避险方法，不恐慌、不传谣。\n3.体会工程抗震的重要性，尊重建筑科学。",
  "key": "通过模拟实验认识地震的成因（岩层受力断裂），了解地震对地表的改变，学习科学的避险自救方法。",
  "hard": "①地震成因涉及\"板块\"\"断层\"\"应力积累\"等抽象概念，学生难以想象——必须用\"掰断尺子/泡沫板\"的模拟实验建立直观认识。②\"能量缓慢积累、突然释放\"是理解难点，可用\"慢慢压弯尺子直到啪地断了\"来类比。③讨论地震灾害时要注意心理疏导，避免造成恐慌，重点落在\"科学避险\"。",
  "mat": "教师：泡沫板（或海绵、毛巾）1块、木片/塑料尺1把、地震模拟装置（可选）、教学课件（含地震实景与避险动画）、积木（或纸盒）若干、震动台（可用桌面代替）\n\n学生（四人小组）：泡沫板（约20×8×2厘米）1块、不同颜色的橡皮泥（做\"地层\"）若干、小积木（或方形纸盒）8块、记录单、毛巾1条\n\n【低成本替代】\n泡沫板：可用厚海绵、多片湿毛巾叠起来、或干脆用一把塑料尺（弯折断裂演示更直观）。\n\"地层\"：用不同颜色的橡皮泥叠成层，或用彩色纸条贴在泡沫板侧面。\n抗震材料测试：用纸盒、积木搭\"楼房\"，在桌下用手轻拍桌面模拟震动。\n⚠ 本课可用\"掰断塑料尺\"作为最简演示：慢慢用力弯，尺子先弯曲，再\"啪\"地断，同时手感到震动——一个动作讲清全部原理。",
  "proc": "一、激趣导入（6分钟）\n材料准备：教学课件（地震后的道路裂缝、房屋倒塌图片）\n\n1.出示地震后的照片。\n提问：这些照片里的地面和房屋怎么了？可能发生了什么？\n预设：发生了地震，地面裂开了，房子倒了。\n\n2.教师讲述（结合学生的生活经验）：\n地震是一种非常严重的自然灾害。我们国家是一个地震比较多的国家，比如2008年的汶川大地震，很多人因此失去了家园。\n\n3.追问：好端端的地面，为什么会突然剧烈震动？地底下到底发生了什么？\n\n4.引入：今天我们就来揭开地震的秘密，更重要的是——学会怎样保护自己。\n（板书课题：地震对地表的作用）\n\n二、新课教学（28分钟）\n\n（一）模拟实验一：岩层为什么会断裂（10分钟）\n材料准备：每组泡沫板1块（或塑料尺）、记录单\n\n1.教师演示（★本课核心，务必做足）：\n拿出一把塑料尺（或泡沫板），请学生注意观察和听。\n\n①缓慢用力，让尺子慢慢弯曲。\n提问：现在尺子怎么了？——弯曲了。\n师：这时候我还在用力，但尺子没有断，它在\"忍着\"，里面憋着一股劲。\n\n②继续用力，直到尺子\"啪\"地一声断了。\n提问：发生了什么？\n预设：尺子断了，发出响声，还震动了一下。\n提问：断的那一刻，你的手有什么感觉？\n预设：手感觉震了一下。\n\n2.学生分组体验（用泡沫板或海绵）：\n任务：慢慢用力弯泡沫板，一直弯到它断裂，注意观察：\n·断裂前，泡沫板发生了什么变化？（弯曲）\n·断裂的瞬间，你看到了什么、听到了什么、手感觉到了什么？\n\n3.交流研讨：\n提问：为什么泡沫板（尺子）是\"突然\"断的，而不是慢慢断的？\n预设：因为力量越攒越大，到了它承受不住的时候，就一下子断了。\n\n4.教师讲解（建立模型）：\n地球的表面并不是一整块，而是由很多\"板块\"拼起来的。这些板块一直在非常缓慢地运动，互相挤压、拉扯。\n·板块慢慢挤压 → 地下的岩层像我们手里的尺子一样，慢慢弯曲、变形，能量越攒越多；\n·攒到岩石实在承受不住的时候 → 岩层突然断裂、错动；\n·一瞬间释放出巨大的能量 → 产生强烈的震动，传到地面，就是地震。\n\n（板书：板块挤压 → 岩层弯曲（能量积累）→ 突然断裂（能量释放）→ 地震）\n\n5.补充：断裂的地方叫\"断层\"，地震往往就发生在断层附近。所以，有断层的地方，更容易发生地震。\n\n（二）模拟实验二：地震怎样改变地表（8分钟）\n材料准备：每组彩色橡皮泥（叠成\"地层\"）、泡沫板\n\n1.制作\"地层模型\"：用几种颜色的橡皮泥叠成三层（代表不同的岩层），放在泡沫板上。\n\n2.模拟\"断裂\"：\n①先让泡沫板慢慢弯曲，观察\"地层\"发生什么变化？\n预设：地层也跟着弯曲了，有的地方翘起来，有的地方凹下去。\n\n②继续用力让泡沫板突然断裂，观察\"地层\"。\n提问：地层怎么了？\n预设：地层被错开了，上下两截对不齐了，有的地方鼓起来，有的地方陷下去。\n\n3.教师对照真实照片讲解：\n地震时，地表会出现：\n·地裂缝：地面裂开长长的口子；\n·断层：地层错开，一边高一边低，形成陡坎；\n·隆起与下陷：有的地方被抬高成小丘，有的地方塌陷成洼地；\n·山体滑坡、泥石流：山上的土石滚落下来；\n·堰塞湖：滑落的土石堵住河流，积水成湖。\n\n师小结：一次强烈的地震，能在几十秒内彻底改变一片土地的样子。\n\n（三）模拟实验三：怎样让房子更抗震（6分钟）\n材料准备：每组小积木8块（或纸盒）、毛巾\n\n1.任务：用积木搭两座\"房子\"，想办法让它们更抗震。\n\n2.学生搭建，教师引导思考：\n·房子搭得高好还是矮好？\n·底面大一点好还是小一点好？\n·用什么办法能让房子更结实？\n\n3.测试：用手轻拍桌面（或用书本轻轻敲），模拟震动，看哪座房子不倒。\n\n4.研讨：怎样的建筑更抗震？\n预设1：矮一点、底盘大一点（上轻下重）更稳。\n预设2：结构对称，不歪。\n预设3：用韧性好的材料，能晃而不倒。\n\n5.教师联系真实建筑（配合课件）：\n现代建筑采用\"框架结构\"\"减震支座\"\"阻尼器\"等技术，让房子在地震时能\"摇晃而不倒\"。这就是为什么有些地方地震后，高楼还在，老房子却塌了。\n\n（四）学会避险（4分钟）\n材料准备：教学课件（避险动画）\n\n1.提问：如果正在上课时发生地震，我们该怎么做？\n\n2.教师讲解（室内避险要点）：\n·**趴下、掩护、稳住**（Drop, Cover, Hold on）：\n①迅速躲到课桌（或坚固家具）下面；\n②用书包或双手护住头颈；\n③抓牢桌腿，跟着桌子一起移动；\n④**不要**急着往外跑，不要跳楼，不要乘电梯。\n\n3.主震过后：听从老师指挥，有序撤离到操场等空旷地带，不推挤、不返回取物。\n\n4.简短演练：教师发出\"地震了\"的口令，全班练习一次\"趴下—掩护—稳住\"的动作。\n\n师小结：地震虽然可怕，但只要我们掌握正确的方法、平时认真演练，就能最大程度保护自己。\n\n三、课堂总结（6分钟）\n1.提问：地震是怎么形成的？\n预设：板块运动使岩层弯曲，能量积累到一定程度，岩层突然断裂，释放能量产生震动。\n2.提问：地震会怎样改变地表？\n预设：地裂缝、断层、地面隆起下陷、山体滑坡、堰塞湖。\n3.提问：地震来了怎么办？\n预设：趴下、掩护、稳住；躲桌下、护头颈、抓牢桌腿；震后有序撤离。\n4.教师提升：火山和地震，都是来自**地球内部的力量**（内力作用）在改变地表。那么，除了内部力量，还有没有来自地球外部的力量也在改变地表呢？下节课我们继续研究。\n5.布置：和家人一起制定一份\"家庭地震避险计划\"，说一说家里哪个地方最安全。\n\n【心理引导：本课涉及灾害，注意语气平和，强调\"可防可控、科学避险\"，避免引起学生恐慌】",
  "board": "               3. 地震对地表的作用\n\n    一、地震的成因（模拟：掰弯尺子）\n        ★ 板块挤压 → 岩层弯曲（能量慢慢积累）\n          → 突然断裂（能量瞬间释放）→ 地 震 ★\n\n        类比：慢慢弯尺子 → 弯曲 → \"啪\"地断了 + 手感到震动\n\n    二、地表的变化\n        地裂缝 · 断层（地层错开）\n        地面隆起 / 下陷\n        山体滑坡 · 泥石流 · 堰塞湖\n\n    三、抗震建筑\n        上轻下重 · 底盘宽 · 结构对称 · 韧性好\n        技术：框架结构 · 减震支座 · 阻尼器\n\n    四、避险三字诀\n        ★ 趴 下 · 掩 护 · 稳 住 ★\n        躲桌下 · 护头颈 · 抓桌腿\n        ✗ 不急着跑 · 不跳楼 · 不乘电梯\n        震后：听指挥 · 有序撤到空旷处\n\n    五、本课为\"内力作用\"（地球内部力量）",
  "reflect": ""
 },
 "4|空气|3": {
  "goal": "科学观念：\n1.知道空气占据的空间大小是可以改变的——空气可以被压缩，也可以被扩张。\n2.知道空气被压缩时体积变小、被扩张时体积变大，但空气的量（多少）没有变。\n3.知道压缩空气有弹性，这一性质在生活中有广泛应用。\n\n科学思维：\n1.能通过对比空气与水的压缩实验，归纳出\"气体容易被压缩、液体不容易被压缩\"的差异。\n2.能根据注射器活塞的变化，推理空气微粒之间距离的变化。\n\n探究实践：\n1.能规范完成注射器压缩空气与压缩水的对比实验。\n2.能准确观察并记录活塞位置的变化，用简单的图示表示。\n3.能举例说明压缩空气在生活中的应用。\n\n态度责任：\n1.乐于动手操作，对\"看不见的变化\"保持探究兴趣。\n2.实验如实记录，即使现象不明显也不编造。\n3.体会到科学就在身边，养成观察生活现象的习惯。",
  "key": "通过注射器压缩空气与压缩水的对比实验，认识空气占据的空间可以改变，空气容易被压缩和扩张，而水不容易被压缩。",
  "hard": "空气看不见，学生难以想象\"微粒之间距离变小\"。难点在于引导学生从\"活塞能被推动\"这一可见现象，推理出\"空气被压缩了、微粒间距变小了\"这一不可见的本质；同时要通过与水的对比，突出气体与液体的差异，避免学生认为\"所有东西都能被压缩\"。",
  "mat": "教师：大号注射器（60毫升）2支、水、烧杯、橡皮（堵口用）、教学课件、记录单\n\n学生（四人小组）：注射器（20毫升或60毫升）2支、水、小烧杯1个、橡皮1小块、记录单\n\n【低成本替代】\n注射器：可用去掉针头的注射器（药店有售，几毛钱一支）；也可用带活塞的粗吸管＋棉签自制简易\"压缩管\"。\n堵口：可用一小块橡皮泥、湿纸巾团代替橡皮。\n水：清水即可，可加一滴红墨水便于观察。",
  "proc": "一、激趣导入（5分钟）\n材料准备：注射器1支（不堵口）\n\n1.教师拉动注射器活塞，再推回去。\n提问：现在注射器里装的是什么？——空气。\n演示：用手指堵住注射器出口，用力推活塞。\n提问：推得动吗？手有什么感觉？\n\n预设1：推得动，但推到底有点费劲。\n预设2：感觉里面有东西在顶着，像弹簧一样。\n预设3：手一松开，活塞又弹回来了。\n\n2.引入：为什么堵住口以后，活塞还能推动一点点，松手又会弹回来？今天我们研究这个问题。\n（板书课题：空气占据的空间会改变吗）\n\n二、新课教学（28分钟）\n\n（一）实验一：压缩空气（10分钟）\n材料准备：每组注射器1支、橡皮\n\n1.步骤：\n①拉开活塞，让注射器吸满空气（记住活塞位置，用记号标出）；\n②用橡皮紧紧堵住注射器的出口（关键：不能漏气）；\n③用力向下推活塞，观察活塞位置的变化；\n④松开手，观察活塞的变化。\n\n2.学生分组实验，教师巡视，重点帮助堵口不严密的小组。\n\n3.交流：\n提问：推动活塞时，你看到了什么？\n预设1：活塞往下走了一点，注射器里的空间变小了。\n预设2：推到一定程度就推不动了。\n提问：松手后呢？\n预设：活塞又弹回原来的位置。\n\n4.追问（关键研讨）：注射器里的空气并没有跑掉（口是堵住的），可它占的地方却变小了。这说明什么？\n预设：说明空气占据的空间是可以被压缩变小的。\n\n师小结：空气可以被压缩。压缩时，空气占据的空间变小了，但空气的多少没有变——只是空气里的小颗粒挨得更近了。\n（板书：空气可以被压缩 → 空间变小）\n\n5.讲解弹性：松手后活塞弹回，说明压缩空气像弹簧一样有弹性，会努力恢复原来的大小。\n\n（二）实验二：压缩水（对比实验）（10分钟）\n材料准备：每组另一支注射器、水、烧杯、橡皮\n\n1.提问：如果注射器里装的是水，还能像空气一样被压缩吗？\n\n2.学生猜想并记录。\n\n3.步骤：\n①用注射器吸满水（注意排出气泡）；\n②用橡皮堵住出口；\n③用力推活塞，观察。\n\n4.交流：\n提问：水的活塞推动了吗？和空气比有什么不同？\n预设1：几乎推不动，水不像空气那样能被压缩。\n预设2：只能推动非常非常少的一点点。\n\n5.教师点明：通过对比我们发现——**气体（空气）容易被压缩，液体（水）很难被压缩**。这是气体和液体的一个重要区别。\n\n6.强调控制变量：两个实验都堵住了口、都用同样的力推，改变的是\"里面装的是空气还是水\"。\n\n（三）联系生活（8分钟）\n材料准备：教学课件\n\n1.提问：生活中哪些地方用到了\"空气可以被压缩\"？\n预设1：篮球、足球打气后鼓起来，拍下去会弹回来。\n预设2：自行车轮胎、汽车轮胎。\n预设3：打气筒给轮胎打气。\n预设4：充气沙发、充气城堡、游泳圈。\n预设5：喷雾瓶、喷漆罐。\n\n2.追问：篮球为什么拍下去能弹起来？\n引导：球里的空气被压缩了，压缩空气有弹性，要恢复原状，就把球顶起来了。\n\n3.小活动（可选）：用手按压充满气的篮球（或气球），感受弹性。\n\n师小结：压缩空气有弹性、能恢复原状，这个性质被人类广泛利用，从轮胎到充气玩具，到处都是。\n\n三、课堂总结（5分钟）\n1.提问：今天我们用注射器做了什么实验？发现了什么？\n预设：分别压缩了空气和水，发现空气容易被压缩，水很难被压缩。\n2.提问：空气被压缩时，什么变了？什么没变？\n预设：占据的空间变小了，但空气的多少没变。\n3.提问：压缩空气有什么特点？\n预设：有弹性，松手会恢复。\n4.布置：回家找一找家里用到了\"压缩空气\"的东西，记录下来，下节课分享。\n\n【整理：注射器里的水倒回水桶；橡皮、器材归位；提醒不要对着人推注射器】",
  "board": "            3. 空气占据的空间会改变吗\n\n    实验对比（都堵口 · 同样用力推）\n\n        空气（气体）              水（液体）\n        ┌──────┐                 ┌──────┐\n        │      │  ← 能推动        │      │  ← 推不动\n        │▓▓▓▓▓│    空间变小      │▓▓▓▓▓│    空间几乎不变\n        └──┬───┘                 └──┬───┘\n           ↑                        ↑\n        容易被压缩                很难被压缩\n\n    松手 → 活塞弹回 = 压缩空气有弹性\n\n    ★ 结论：空气占据的空间可以改变（可压缩 · 可扩张）★\n      空间变了，空气的多少没变（只是微粒挨得更近）\n\n    生活应用：轮胎 · 篮球 · 打气筒 · 游泳圈 · 喷雾罐",
  "reflect": ""
