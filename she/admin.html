<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="Qt101OOBE0w6r1bFkpAuHG">
<head data-page-node-id="6gzDTzMPPsZB9kNZ15iDlD">
<meta charset="UTF-8" data-page-node-id="qWl4JMSghx2FNzHFDeS2RG">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="9Zgn8v5vsN2gZIoaOF8FOt">
<title>社团选课 · 管理后台</title>
<style>
:root{ --bg:#FDF6EC; --card:#fff; --line:#F0E4D4; --ink:#4A3B32; --sub:#9A8878; --red:#F4696B; --green:#7EC8A9; }
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
.wrap{max-width:1100px;margin:0 auto;padding:16px 20px 60px;}
.topbar{background:linear-gradient(135deg,#F4696B,#F7A6C1);color:#fff;padding:16px 24px;border-radius:0 0 20px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.topbar h1{font-size:19px;}
.card{background:var(--card);border-radius:16px;padding:18px 20px;box-shadow:0 3px 12px rgba(74,59,50,.08);margin-bottom:16px;}
.card h2{font-size:16px;margin-bottom:12px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.chip{padding:7px 15px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;}
.chip.on{border-color:var(--red);background:#FEECEC;color:var(--red);}
table{border-collapse:collapse;width:100%;}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);font-size:13.5px;text-align:center;}
th{color:var(--sub);background:#FBF4E9;white-space:nowrap;}
td.l{text-align:left;}
.ov-over{background:#FDEDED;color:#D64545;border-radius:6px;font-weight:700;}
.btn{padding:9px 18px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-weight:600;background:var(--red);color:#fff;}
.btn.green{background:var(--green);}
.btn.gray{background:#F3EDE4;color:var(--sub);}
.btn.ghost{background:#fff;color:var(--red);border:2px solid var(--red);}
.btn.small{padding:4px 10px;font-size:12.5px;}
input[type=text],input[type=password],input[type=number]{padding:8px 10px;border:2px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;}
.num{width:60px;text-align:center;}
.muted{color:var(--sub);font-size:13px;}
.badge{display:inline-block;padding:4px 14px;border-radius:999px;font-size:13.5px;font-weight:700;}
.b-open{background:#E6F7EF;color:#2F9E6E;}
.b-closed{background:#FDEDED;color:#D64545;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#4A3B32;color:#fff;padding:11px 22px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:99;}
.toast.show{opacity:.95;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
</style>
</head>
<body data-page-node-id="K8KnuGpsXmVyIrTQAOBNE9">
<div class="topbar" data-page-node-id="axpnJPl2pk0wsnt35gxmCd"><h1 data-page-node-id="sajI2oyjgnM7CFsrMMWSqU">🛠 社团选课 · 管理后台</h1><span id="stateBadge" data-page-node-id="MdAc0jeija7kX5NIIlZAyo"></span></div>
<div class="wrap" id="app" data-page-node-id="6mJEnYF1K3cRHWC32r64FA"></div>
<div class="toast" id="toast" data-page-node-id="La1DX3mky0zwT1cf5tSQxA"></div>
<script>
"use strict";
var app = document.getElementById("app");
var data = null;        // /api/admin all 结果
var pw = localStorage.getItem("cx_admin_pw") || "";
var sel = { group:"g12" };
/* 后端地址自适应：
   - 双击打开(file://) → 指向线上服务器（可在登录页切换）
   - dadajs.cn / github.io 静态托管 → 指向腾讯云后端
   - 其它（api.kexvefuxi.cn/she/ 或 localhost）→ 同源，用相对地址 */
var DEFAULT_API = "https://api.kexvefuxi.cn/she";
var LOCAL_MODE = location.protocol === "file:";
var API = (function(){
  if (LOCAL_MODE) return localStorage.getItem("cx_admin_api") || DEFAULT_API;
  var h = location.hostname;
  if (/(^|\.)dadajs\.cn$/i.test(h) || /\.github\.io$/i.test(h)) return DEFAULT_API;
  return "";
})();
function esc(x){ return String(x==null?"":x).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];}); }
function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._tm); t._tm=setTimeout(function(){t.classList.remove("show");},2500); }
/* 兼容新旧数据：取学生名下的社团数组 [{n, fixed}] */
function stuClubs(s){
  if (Array.isArray(s.clubs)) return s.clubs;
  return s.c ? [{ n: s.c, fixed: !!s.fixed }] : [];
}
function admin(body){
  body.pw = pw;
  var url = API ? (API.replace(/\/+$/,"") + "/api/admin") : "api/admin";
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .catch(function(e){ throw new Error("连不上服务器（"+(API||"本页")+"），请确认网络或服务器地址"); });
}
function refresh(){ return admin({action:"all"}).then(function(d){ data=d; render(); }); }

/* ============ 登录 ============ */
function renderLogin(){
  var html = '<div class="card" style="max-width:420px;margin:60px auto"><h2>请输入管理密码</h2>';
  if (LOCAL_MODE) {
    html += '<p class="muted" style="margin-bottom:8px">📎 双击打开模式：正在连接 <b id="apiShow">'+esc(API)+'</b></p>';
    html += '<div class="row" style="margin-bottom:10px"><input type="text" id="apiInput" value="'+esc(API)+'" placeholder="服务器地址" style="flex:1"><button class="btn gray" id="apiBtn">切换</button></div>';
  }
  html += '<div class="row"><input type="password" id="pwInput" placeholder="管理密码" style="flex:1"><button class="btn" id="loginBtn">进入</button></div>'+
    '<p class="muted" style="margin-top:10px">仅限管理人员使用，请勿外传</p></div>';
  app.innerHTML = html;
  if (LOCAL_MODE) {
    document.getElementById("apiBtn").onclick = function(){
      var v = document.getElementById("apiInput").value.trim().replace(/\/+$/,"");
      if (!/^https?:\/\//.test(v)) { toast("地址要以 http:// 或 https:// 开头"); return; }
      API = v; localStorage.setItem("cx_admin_api", v);
      document.getElementById("apiShow").textContent = v;
      toast("服务器已切换");
    };
  }
  function go(){
    pw = document.getElementById("pwInput").value.trim();
    admin({action:"login"}).then(function(r){
      if (r.ok) { localStorage.setItem("cx_admin_pw", pw); refresh(); }
      else toast("密码不对");
    }).catch(function(e){ toast(e.message); });
  }
  document.getElementById("loginBtn").onclick = go;
  document.getElementById("pwInput").addEventListener("keydown", function(e){ if(e.key==="Enter") go(); });
}

/* ============ 主面板 ============ */
function render(){
  var badge = document.getElementById("stateBadge");
  badge.innerHTML = data.open ? '<span class="badge b-open">● 选课开放中</span>' : '<span class="badge b-closed">● 已关闭</span>';
  var g = data.groups.find(function(x){return x.id===sel.group;});
  var CN = {1:"一",2:"二",3:"三",4:"四",5:"五",6:"六"};
  function key(gr,c){ return "g"+gr+"c"+c; }
  function list(gr,c){ return data.selections[key(gr,c)]||[]; }

  var html = '';
  /* 开关 + 总览操作 */
  html += '<div class="card"><div class="row">';
  html += '<button class="btn '+(data.open?"gray":"green")+'" id="toggleBtn">'+(data.open?"⏸ 关闭选课入口":"▶ 开放选课")+'</button>';
  html += '<button class="btn ghost" id="csvBtn">📥 导出全校总表 CSV</button>';
  html += '<button class="btn gray" id="resetBtn">🗑 清空全部选课记录</button>';
  html += '<span class="muted">共 <b>'+Object.keys(data.selections).reduce(function(a,k){return a+data.selections[k].length;},0)+'</b> 人已选</span>';
  html += '</div></div>';

  /* 名额总览矩阵 */
  html += '<div class="card"><h2>名额总览（红色=该班超额）</h2><div class="chips">';
  data.groups.forEach(function(x){ html += '<button class="chip '+(x.id===sel.group?"on":"")+'" data-grp="'+x.id+'">'+x.name+'</button>'; });
  html += '</div><div style="overflow-x:auto"><table><tr><td class="l" style="font-weight:700">社团</td><td>类型</td>';
  g.grades.forEach(function(gr){
    var n = data.classCounts[gr]||0;
    for (var c=1;c<=n;c++) html += '<th>'+CN[gr]+'('+c+')</th>';
    html += '<th style="background:#FBEAE0">名额/班</th><th style="background:#FBEAE0">合计</th>';
  });
  html += '</tr>';
  g.clubs.forEach(function(c){
    html += '<tr><td class="l" style="white-space:nowrap;font-weight:600">'+(c.hidden?'🔒 ':'')+esc(c.n)+'</td><td>'+c.t+'</td>';
    g.grades.forEach(function(gr){
      var q = c.q[gr];
      var n = data.classCounts[gr]||0, sum=0;
      for (var k=1;k<=n;k++){
        var used = list(gr,k).filter(function(s){return stuClubs(s).some(function(x){return x.n===c.n;});}).length; sum+=used;
        html += '<td class="'+(q!==null&&used>q?"ov-over":"")+'">'+used+'</td>';
      }
      html += '<td>'+(q===null?"不限":q)+'</td><td style="font-weight:700">'+sum+'</td>';
    });
    html += '</tr>';
  });
  html += '<tr><td class="l" style="font-weight:700" colspan="2">各班未分配</td>';
  g.grades.forEach(function(gr){
    var n = data.classCounts[gr]||0, t=0;
    for (var k=1;k<=n;k++){ var u=list(gr,k).length; }
    /* 未分配无法从选课数据看出（家长没注册就没有记录），显示已选人数 */
    t=0; for (var k2=1;k2<=n;k2++){ t+=list(gr,k2).length; }
    html += '<td style="font-weight:700" colspan="'+(n+2)+'">'+CN[gr]+'年级各班已选人数见上表，合计 '+t+' 人</td>';
  });
  html += '</tr></table></div></div>';

  /* 查找/修改/删除学生选课 */
  html += '<div class="card"><h2>🔍 查找学生（可删除或改选）</h2><div class="row">';
  html += '<input type="text" id="searchName" placeholder="输入学生姓名" style="flex:1;min-width:160px"><button class="btn" id="searchBtn">查找</button></div><div id="searchResult" class="mt"></div></div>';

  /* 🔒 内定社团管理（鼓号队 + 3 个科创社团，家长端不可见不可选） */
  var hiddenClubs = [];
  data.groups.forEach(function(x){ x.clubs.forEach(function(cb){ if (cb.hidden) hiddenClubs.push(cb.n); }); });
  var fixedMembers = [];
  Object.keys(data.selections).forEach(function(k){
    data.selections[k].forEach(function(s){
      stuClubs(s).forEach(function(cb){
        if (cb.fixed && hiddenClubs.indexOf(cb.n) >= 0) {
          var m = k.match(/^g(\d)c(\d+)$/);
          fixedMembers.push({ gr:+m[1], cls:+m[2], n:s.n, c:cb.n });
        }
      });
    });
  });
  html += '<div class="card"><h2>🔒 内定社团管理（家长端不可见，名单由学校统一安排）</h2>';
  html += '<div class="row"><select id="fixClub" style="padding:8px;border:2px solid var(--line);border-radius:9px">';
  hiddenClubs.forEach(function(cn0){ html += '<option value="'+esc(cn0)+'">'+esc(cn0)+'</option>'; });
  html += '</select>';
  html += '<select id="fixGrade" style="padding:8px;border:2px solid var(--line);border-radius:9px">' +
    [1,2,3,4,5,6].map(function(gr){ return '<option value="'+gr+'">'+CN[gr]+'年级</option>'; }).join("") + '</select>';
  html += '<select id="fixCls" style="padding:8px;border:2px solid var(--line);border-radius:9px"></select>';
  html += '<input type="text" id="fixNames" placeholder="姓名，多人用逗号或换行隔开" style="flex:1;min-width:180px">';
  html += '<button class="btn" id="fixAddBtn">加入内定</button></div>';
  html += '<table style="margin-top:12px"><tr><th>社团</th><th>年级</th><th>班</th><th>姓名</th><th>操作</th></tr>';
  if (!fixedMembers.length) html += '<tr><td colspan="5" class="muted">暂无内定学生（鼓号队 60 人已在系统首次启动时自动预置）</td></tr>';
  fixedMembers.sort(function(a,b){ return a.c===b.c ? a.gr-b.gr : (a.c<b.c?-1:1); }).forEach(function(m0){
    html += '<tr><td>'+esc(m0.c)+'</td><td>'+CN[m0.gr]+'</td><td>'+m0.cls+'</td><td style="font-weight:600">'+esc(m0.n)+'</td>' +
      '<td><button class="btn small gray" data-unfix="1" data-gr="'+m0.gr+'" data-cls="'+m0.cls+'" data-name="'+esc(m0.n)+'" data-club="'+esc(m0.c)+'">移出内定</button></td></tr>';
  });
  html += '</table></div>';

  /* 名额微调 */
  html += '<div class="card"><h2>⚙ 名额微调（人/班）</h2><div style="overflow-x:auto"><table><tr><td class="l" style="font-weight:700">社团</td>';
  g.grades.forEach(function(gr){ html += '<th>'+CN[gr]+'年级名额</th>'; });
  html += '</tr>';
  g.clubs.forEach(function(c){
    html += '<tr><td class="l" style="white-space:nowrap">'+esc(c.n)+'</td>';
    g.grades.forEach(function(gr){
      html += '<td><input class="num" type="number" min="0" value="'+(c.q[gr]===null?"":c.q[gr])+'" placeholder="不限" data-club="'+esc(c.n)+'" data-gr="'+gr+'"></td>';
    });
    html += '</tr>';
  });
  html += '</table></div><p class="muted" style="margin-top:8px">留空=不限名额。修改即时生效，家长端下次刷新即可看到。</p></div>';

  /* 全校名单核对 */
  html += '<div class="card"><h2>📋 全校学生名单核对（家长选课时按此名单校验）</h2><div style="overflow-x:auto"><table><tr><th>年级</th>';
  var maxCls = 0, totalStu = 0;
  Object.keys(data.rosterStats||{}).forEach(function(g0){ Object.keys(data.rosterStats[g0]).forEach(function(c0){ totalStu += data.rosterStats[g0][c0]; if (+c0>maxCls) maxCls=+c0; }); });
  for (var ci=1; ci<=Math.max(maxCls,5); ci++) html += '<th>'+ci+'班</th>';
  html += '<th>小计</th></tr>';
  [1,2,3,4,5,6].forEach(function(g1){
    var rs = (data.rosterStats||{})[String(g1)] || {};
    var sum = 0;
    html += '<tr><td style="font-weight:600">'+CN[g1]+'年级</td>';
    for (var ci2=1; ci2<=Math.max(maxCls,5); ci2++){ var v0=rs[String(ci2)]; html += '<td>'+(v0===undefined?'-':v0)+'</td>'; if(v0) sum+=v0; }
    html += '<td style="font-weight:700">'+sum+'</td></tr>';
  });
  html += '</table></div><p class="muted" style="margin-top:8px">全校共 <b>'+totalStu+'</b> 人（来自《在校生名单.xls》在校生花名册）。家长输入的姓名+班级必须与名单一致才能选课；如需替换某班名单请联系管理员更新 roster.json。</p></div>';

  /* 班级数 + 改密码 */
  html += '<div class="card"><h2>⚙ 其他设置</h2><div class="row">';
  [1,2,3,4,5,6].forEach(function(gr){
    html += '<span class="muted">'+CN[gr]+'年级</span><input class="num" type="number" min="1" max="20" value="'+(data.classCounts[gr]||5)+'" data-cls="'+gr+'">';
  });
  html += '</div><div class="row mt"><input type="password" id="newPw" placeholder="设置新的管理密码" style="min-width:200px"><button class="btn gray" id="pwBtn">修改密码</button></div></div>';

  app.innerHTML = html;

  document.getElementById("toggleBtn").onclick = function(){ admin({action:"toggle"}).then(function(r){ data.open=r.open; render(); toast(r.open?"已开放选课":"已关闭选课"); }); };
  document.getElementById("resetBtn").onclick = function(){ if(confirm("⚠️ 确定清空全部学生的选课记录？此操作不可恢复！")) admin({action:"reset"}).then(function(){ toast("已清空"); refresh(); }); };
  document.getElementById("csvBtn").onclick = exportCsv;
  app.querySelectorAll(".chip[data-grp]").forEach(function(b){ b.onclick=function(){ sel.group=b.dataset.grp; render(); }; });
  app.querySelectorAll("input[data-club]").forEach(function(inp){
    inp.onchange = function(){
      admin({action:"setQuota", groupId:g.id, club:inp.dataset.club, grade:+inp.dataset.gr, q: inp.value===""?null:+inp.value})
        .then(function(){ toast("名额已更新"); refresh(); });
    };
  });
  app.querySelectorAll("input[data-cls]").forEach(function(inp){
    inp.onchange = function(){ admin({action:"setClsCount", grade:+inp.dataset.cls, n:+inp.value}).then(function(){ toast("班级数已更新"); refresh(); }); };
  });
  document.getElementById("pwBtn").onclick = function(){
    var np = document.getElementById("newPw").value.trim();
    if (np.length<4) { toast("密码至少4位"); return; }
    admin({action:"setPw", newPw:np}).then(function(r){ if(r.error){toast(r.error);return;} pw=np; localStorage.setItem("cx_admin_pw",pw); toast("密码已修改"); });
  };
  document.getElementById("searchBtn").onclick = doSearch;
  document.getElementById("searchName").addEventListener("keydown", function(e){ if(e.key==="Enter") doSearch(); });

  /* 内定社团添加表单 */
  function drawFixCls(){
    var gr = +document.getElementById("fixGrade").value;
    var n = data.classCounts[gr]||5;
    var sc = document.getElementById("fixCls");
    sc.innerHTML = "";
    for (var i=1;i<=n;i++){ var o=document.createElement("option"); o.value=i; o.textContent=CN[gr]+"（"+i+"）班"; sc.appendChild(o); }
  }
  drawFixCls();
  document.getElementById("fixGrade").onchange = drawFixCls;
  document.getElementById("fixAddBtn").onclick = function(){
    var club = document.getElementById("fixClub").value;
    var gr = +document.getElementById("fixGrade").value;
    var c0 = +document.getElementById("fixCls").value;
    var names = document.getElementById("fixNames").value.split(/[\n,，、;；\t]+/).map(function(x){return x.trim();}).filter(Boolean);
    if (!names.length) { toast("请先输入学生姓名"); return; }
    var chain = Promise.resolve(); var done = 0;
    names.forEach(function(nm){
      chain = chain.then(function(){ return admin({action:"move", grade:gr, cls:c0, name:nm, club:club}).then(function(){ done++; }); });
    });
    chain.then(function(){ toast("已内定 "+done+" 人到「"+club+"」"); refresh(); })
         .catch(function(e){ toast("部分失败："+e); refresh(); });
  };
  app.querySelectorAll("button[data-unfix]").forEach(function(b){
    b.onclick = function(){
      if (confirm("把 "+b.dataset.name+" 移出「"+b.dataset.club+"」内定？移出后该生的这个社团被删除（名额随之释放）。")) {
        admin({action:"unfix", grade:+b.dataset.gr, cls:+b.dataset.cls, name:b.dataset.name, club:b.dataset.club}).then(function(){ toast("已移出"); refresh(); });
      }
    };
  });

  function doSearch(){
    var name = document.getElementById("searchName").value.trim();
    if(!name) return;
    var results = [];
    [1,2,3,4,5,6].forEach(function(gr){
      var n = data.classCounts[gr]||0;
      for (var c=1;c<=n;c++){
        list(gr,c).forEach(function(s){ if(s.n.indexOf(name)>=0) results.push({gr:gr,cls:c,s:s}); });
      }
    });
    var box = document.getElementById("searchResult");
    if (!results.length) { box.innerHTML = '<p class="muted">没有找到「'+esc(name)+'」的选课记录</p>'; return; }
    var gAll = {};
    data.groups.forEach(function(x){ x.clubs.forEach(function(cb){ gAll[x.id]=x.clubs; }); });
    box.innerHTML = '<table><tr><th>年级</th><th>班</th><th>姓名</th><th>当前社团</th><th>操作</th></tr>' +
      results.map(function(r){
        var grp = data.groups.find(function(x){return x.grades.indexOf(r.gr)>=0;});
        var opts = grp.clubs.map(function(cb){ return '<option value="'+esc(cb.n)+'" '+(cb.n===r.s.c?"selected":"")+'>'+esc(cb.n)+'</option>'; }).join("");
        return '<tr><td>'+CN[r.gr]+'</td><td>'+r.cls+'</td><td style="font-weight:600">'+(r.s.fixed?'🔒 ':'')+esc(r.s.n)+(r.s.fixed?'（内定）':'')+'</td>'+
          '<td><select class="moveSel" data-gr="'+r.gr+'" data-cls="'+r.cls+'" data-name="'+esc(r.s.n)+'" style="padding:5px;border:2px solid var(--line);border-radius:8px">'+opts+'</select></td>'+
          '<td><button class="btn small" data-del="1" data-gr="'+r.gr+'" data-cls="'+r.cls+'" data-name="'+esc(r.s.n)+'">删除记录</button></td></tr>';
      }).join("") + '</table>';
    box.querySelectorAll(".moveSel").forEach(function(s){
      s.onchange = function(){ admin({action:"move", grade:+s.dataset.gr, cls:+s.dataset.cls, name:s.dataset.name, club:s.value}).then(function(){ toast("已改选"); refresh(); }); };
    });
    box.querySelectorAll("button[data-del]").forEach(function(b){
      b.onclick = function(){ if(confirm("确定删除 "+b.dataset.name+" 的选课记录？")) admin({action:"remove", grade:+b.dataset.gr, cls:+b.dataset.cls, name:b.dataset.name}).then(function(){ toast("已删除"); refresh(); }); };
    });
  }
}

/* ============ CSV 导出 ============ */
function exportCsv(){
  var CN = {1:"一",2:"二",3:"三",4:"四",5:"五",6:"六"};
  var rows = [["年级","班级","姓名","社团","五小类型","辅导教师","场地","备注"]];
  data.groups.forEach(function(g){
    g.grades.forEach(function(gr){
      var n = data.classCounts[gr]||0;
      for (var c=1;c<=n;c++){
        (data.selections["g"+gr+"c"+c]||[]).forEach(function(s){
          var cl = g.clubs.find(function(x){return x.n===s.c;});
          rows.push([CN[gr]+"年级", c, s.n, s.c, cl?cl.t:"", cl?cl.tc:"", cl?cl.pl:"", cl?cl.note:""]);
        });
      }
    });
  });
  var csv = "\ufeff" + rows.map(function(r){ return r.map(function(x){ x=String(x==null?"":x); return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }).join(","); }).join("\r\n");
  var blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "社团选课总表-" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
}

if (pw) {
  admin({action:"login"}).then(function(r){ if (r.ok) refresh(); else renderLogin(); });
} else renderLogin();
