<style>
:root{ --bg:#FDF6EC; --card:#fff; --line:#F0E4D4; --ink:#4A3B32; --sub:#9A8878; --red:#F4696B; --green:#7EC8A9; }

body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
.wrap{max-width:1100px;margin:0 auto;padding:16px 20px 60px;}

.topbar h1{font-size:19px;}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.chip{padding:7px 15px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--sub);cursor:pointer;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#4A3B32;color:#fff;padding:11px 22px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:99;}
.toast.show{opacity:.95;}

<body data-page-node-id="K8KnuGpsXmVyIrTQAOBNE9">
<div class="topbar" data-page-node-id="axpnJPl2pk0wsnt35gxmCd"><h1 data-page-node-id="sajI2oyjgnM7CFsrMMWSqU">🛠 社团选课 · 管理后台</h1><span id="stateBadge" data-page-node-id="MdAc0jeija7kX5NIIlZAyo"></span></div>
<div class="wrap" id="app" data-page-node-id="6mJEnYF1K3cRHWC32r64FA"></div>
<div class="toast" id="toast" data-page-node-id="La1DX3mky0zwT1cf5tSQxA"></div>
<script>
"use strict";
var app = document.getElementById("app");
var data = null;        // /api/admin all 结果
var pw = localStorage.getItem("cx_admin_pw") || "";
var sel = { group:"g12" };
/* 后端地址自适应：
   - 双击打开(file://) → 指向线上服务器（可在登录页切换）
   - dadajs.cn / github.io 静态托管 → 指向腾讯云后端
   - 其它（api.kexvefuxi.cn/she/ 或 localhost）→ 同源，用相对地址 */
var DEFAULT_API = "https://api.kexvefuxi.cn/she";
var LOCAL_MODE = location.protocol === "file:";
var API = (function(){
  if (LOCAL_MODE) return localStorage.getItem("cx_admin_api") || DEFAULT_API;
  var h = location.hostname;
  if (/(^|\.)dadajs\.cn$/i.test(h) || /\.github\.io$/i.test(h)) return DEFAULT_API;
  return "";
})();
function esc(x){ return String(x==null?"":x).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];}); }
function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._tm); t._tm=setTimeout(function(){t.classList.remove("show");},2500); }
/* 兼容新旧数据：取学生名下的社团数组 [{n, fixed}] */
function stuClubs(s){
  if (Array.isArray(s.clubs)) return s.clubs;
  return s.c ? [{ n: s.c, fixed: !!s.fixed }] : [];
}
/* ===== ★ 社团身份解析（2026-09-14 按谭谭口径重构） =====
   铁律：**社团身份 = 名字 + 定义它的组**，不是只看名字。
   同一个名字可能在多个年级段各开一个（各年级段独立，如「足球」在三四年级组和六年级组
   各有一份、「足球社团」在一二年级组和五年级组各有一份），也可能只开在一个年级段
   但别的年级段有队员（真·跨年级，目前**只有鼓号队**）。
   旧代码只按社团名聚合，导致这些同名社团被误判成"跨年级"，
   并且导出 Excel 时把三四年级的足球串到六年级那份（教师/场地张冠李戴）。 */
function groupOfGrade(gr){
  for (var i=0;i<data.groups.length;i++){
    if (data.groups[i].grades.indexOf(gr) >= 0) return data.groups[i];
  }
  return null;
}
/* 解析「某年级的学生选了社团 name」到底属于哪一份社团定义
   1) 先在该生自己所属的组里找同名  → 命中即用（正常情况）
   2) 本组没有 → 再在别的组找同名    → 真跨年级（如鼓号队定义在六年级组，五年级队员）
   3) 都没有 → null（幽灵记录，导出/统计时会标出来） */
function resolveClub(name, gr){
  var og = groupOfGrade(gr);
  if (og) {
    var hit = null;
    og.clubs.forEach(function(c){ if (!hit && c.n === name) hit = c; });
    if (hit) return { c: hit, g: og, cross: false };
  }
  for (var i=0;i<data.groups.length;i++){
    var gx = data.groups[i], h2 = null;
    gx.clubs.forEach(function(c){ if (!h2 && c.n === name) h2 = c; });
    if (h2) return { c: h2, g: gx, cross: true };
  }
  return null;
}
/* 该社团名在全校是否唯一（唯一则导出/展示直接用名字，重名才加年级段后缀区分） */
function clubNameIsUnique(name){
  var n = 0;
  data.groups.forEach(function(g){ g.clubs.forEach(function(c){ if (c.n === name) n++; }); });
  return n <= 1;
}
function admin(body){
  body.pw = pw;
  var url = API ? (API.replace(/\/+$/,"") + "/api/admin") : "api/admin";
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .catch(function(e){ throw new Error("连不上服务器（"+(API||"本页")+"），请确认网络或服务器地址"); });
}
function refresh(){ return admin({action:"all"}).then(function(d){ data=d; render(); }); }

/* ============ 登录 ============ */
function renderLogin(){
  var html = '<div class="card" style="max-width:420px;margin:60px auto"><h2>请输入管理密码</h2>';
  if (LOCAL_MODE) {
    html += '<p class="muted" style="margin-bottom:8px">📎 双击打开模式：正在连接 <b id="apiShow">'+esc(API)+'</b></p>';
    html += '<div class="row" style="margin-bottom:10px"><input type="text" id="apiInput" value="'+esc(API)+'" placeholder="服务器地址" style="flex:1"><button class="btn gray" id="apiBtn">切换</button></div>';
  }
  html += '<div class="row"><input type="password" id="pwInput" placeholder="管理密码" style="flex:1"><button class="btn" id="loginBtn">进入</button></div>'+
    '<p class="muted" style="margin-top:10px">仅限管理人员使用，请勿外传</p></div>';
  app.innerHTML = html;
  if (LOCAL_MODE) {
    document.getElementById("apiBtn").onclick = function(){
      var v = document.getElementById("apiInput").value.trim().replace(/\/+$/,"");
      if (!/^https?:\/\//.test(v)) { toast("地址要以 http:// 或 https:// 开头"); return; }
      API = v; localStorage.setItem("cx_admin_api", v);
      document.getElementById("apiShow").textContent = v;
      toast("服务器已切换");
    };
  }
  function go(){
    pw = document.getElementById("pwInput").value.trim();
    admin({action:"login"}).then(function(r){
      if (r.ok) { localStorage.setItem("cx_admin_pw", pw); refresh(); }
      else toast("密码不对");
    }).catch(function(e){ toast(e.message); });
  }
  document.getElementById("loginBtn").onclick = go;
  document.getElementById("pwInput").addEventListener("keydown", function(e){ if(e.key==="Enter") go(); });
}

/* ============ 主面板 ============ */
/* 本地时间戳 → "9月14日 20:00" */
function fmtTs(ms){
  if (!ms) return "";
  var d = new Date(ms);
  function p(n){ return (n<10?"0":"")+n; }
  return (d.getMonth()+1)+"月"+d.getDate()+"日 "+p(d.getHours())+":"+p(d.getMinutes());
}
function render(){
  var badge = document.getElementById("stateBadge");
  /* 徽标要说清「为什么关」和「什么时候会开」 */
  var badgeText, badgeCls;
  if (data.open) { badgeText = "● 选课开放中"; badgeCls = "b-open"; }
  else if (data.closed === "before") { badgeText = "● 未到开放时间（"+fmtTs(data.openAt)+" 自动开）"; badgeCls = "b-closed"; }
  else if (data.closed === "after")  { badgeText = "● 已过截止时间（"+fmtTs(data.closeAt)+"）"; badgeCls = "b-closed"; }
  else { badgeText = "● 已手动关闭"; badgeCls = "b-closed"; }
  badge.innerHTML = '<span class="badge '+badgeCls+'">'+badgeText+'</span>';

  var g = data.groups.find(function(x){return x.id===sel.group;});
  var CN = {1:"一",2:"二",3:"三",4:"四",5:"五",6:"六"};
  function key(gr,c){ return "g"+gr+"c"+c; }
  function list(gr,c){ return data.selections[key(gr,c)]||[]; }
  function toLocalInput(ms){
    if (!ms) return "";
    var d = new Date(ms);
    function p(n){ return (n<10?"0":"")+n; }
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());
  }
  var hasWindow = !!(data.openAt || data.closeAt);

  var html = '';

  /* ===== 选课开关 + 时间设置（最重要的两张卡，放最前） ===== */
  html += '<div class="card"><h2>🎛 选课开关</h2>';
  html += '<div class="row">';
  html += '<button class="btn '+(data.open?"gray":"green")+'" id="toggleBtn">'+(data.open?"⏸ 立即关闭选课":"▶ 立即开放选课")+'</button>';
  html += '<span class="muted">共 <b>'+Object.keys(data.selections).reduce(function(a,k){return a+data.selections[k].length;},0)+'</b> 人已选</span>';
  html += '</div>';
  if (hasWindow) {
    html += '<p class="muted" style="margin-top:10px">⏰ 已设定时：'
         + (data.openAt ? fmtTs(data.openAt) : "不限")
         + ' 自动开 → ' + (data.closeAt ? fmtTs(data.closeAt) : "不限")
         + ' 自动关。<b>定时优先于上方按钮</b>；想在定时窗口外临时开关，点按钮会连定时一起取消（会弹确认）。</p>';
  } else {
    html += '<p class="muted" style="margin-top:10px">当前由上方按钮手动控制，没有定时限制。</p>';
  }
  html += '</div>';

  html += '<div class="card"><h2>⏰ 选课开始 / 关闭时间（到点自动开、自动关）</h2>';
  html += '<p class="muted">设定后到点自动开放、到点自动关闭，无需值守。时间按<b>你电脑的时区</b>填写，两个都可留空 = 不限制。</p>';
  html += '<div class="row mt">';
  html += '<span class="muted">开始</span><input type="datetime-local" id="winOpen" value="'+toLocalInput(data.openAt)+'" style="padding:8px;border:2px solid var(--line);border-radius:9px">';
  html += '<span class="muted">关闭</span><input type="datetime-local" id="winClose" value="'+toLocalInput(data.closeAt)+'" style="padding:8px;border:2px solid var(--line);border-radius:9px">';
  html += '<button class="btn" id="winSave">保存</button>';
  html += '<button class="btn gray" id="winClear">清除（改回手动）</button></div>';
  if (hasWindow) {
    html += '<div class="mt" style="font-size:14px;color:#c2446a"><b>当前生效：</b>'
         + (data.openAt ? fmtTs(data.openAt) + " 开放" : "立即开放")
         + ' ｜ ' + (data.closeAt ? fmtTs(data.closeAt) + " 截止" : "长期开放")
         + '　（现在是 ' + fmtTs(data.now) + '）</div>';
  } else {
    html += '<div class="mt muted" style="font-size:14px">当前未设定时间限制，由「选课开关」控制。</div>';
  }
  html += '</div>';

  html += '<div class="card"><h2>📥 导出 / 🗑 清空</h2><div class="row">';
  html += '<button class="btn ghost" id="csvBtn">📥 导出 Excel（总表+各社团子表）</button>';
  html += '<button class="btn gray" id="resetBtn">🗑 清空全部选课记录</button>';
  /* 清空会自动留一份快照，所以这里给一个反悔的入口——只在真的有快照时出现 */
  if (data.canUndoReset) {
    html += '<button class="btn" id="undoResetBtn" style="background:linear-gradient(135deg,#7bc9a6,#5bb98c)">↩️ 撤销上次清空（恢复 '+ (data.lastResetCount||0) +' 条）</button>';
  }
  html += '</div>';
  if (data.canUndoReset) {
    html += '<p class="muted" style="margin-top:10px">上次清空时间：<b>' + fmtTs(data.lastResetAt) + '</b>，共 <b>'+ (data.lastResetCount||0) +'</b> 条记录。'
         + '快照同时留存在服务器 <code>_backups/</code> 目录，重启服务也不会丢。</p>';
  } else {
    html += '<p class="muted" style="margin-top:10px">清空前会自动留一份快照（服务器 <code>_backups/</code> 目录），万一误点可以撤销最近一次。</p>';
  }
  html += '</div>';

  /* 名额总览矩阵 */
  /* 某社团在某年级的人数（该年级所有班之和） */
  function clubInGrade(cn0, gr){
    var n = data.classCounts[gr]||0, t=0;
    for (var k=1;k<=n;k++){
      t += list(gr,k).filter(function(s){ return stuClubs(s).some(function(x){return x.n===cn0;}); }).length;
    }
    return t;
  }
  /* 某社团「这一份」的全校分布：{by:{年级:{t:人数, det:[{cls,n}]}}, tot:全校人数}
     ★ ownerGroup：限定"这一份"是谁定义的。别的年级段**自己也有同名社团**时，
       那段学生归他们自己那份，不算到本份头上 ——
       于是「足球」(三四年级) 与「足球」(六年级)、「足球社团」(一二年级) 与「足球社团」(五年级)
       互不串户；而鼓号队只在六年级组定义，五年级队员仍会被正确计入。 */
  function clubSpread(cn0, ownerGroup){
    var by = {}, tot = 0;
    [1,2,3,4,5,6].forEach(function(gr){
      if (ownerGroup) {
        var og = groupOfGrade(gr), shared = false;
        if (og && og.id !== ownerGroup.id) {
          og.clubs.forEach(function(c){ if (c.n === cn0) shared = true; });
          if (shared) return;   /* 该年级段有自己同名的一份 → 不归本份 */
        }
      }
      var n = data.classCounts[gr]||0, det = [], t = 0;
      for (var k=1;k<=n;k++){
        var u = list(gr,k).filter(function(s){ return stuClubs(s).some(function(x){return x.n===cn0;}); }).length;
        if (u) { det.push({cls:k, n:u}); t += u; }
      }
      if (t) { by[gr] = {t:t, det:det}; tot += t; }
    });
    return {by:by, tot:tot};
  }

  html += '<div class="card"><h2>名额总览（红色=该班超额）</h2><div class="chips">';
  data.groups.forEach(function(x){ html += '<button class="chip '+(x.id===sel.group?"on":"")+'" data-grp="'+x.id+'">'+x.name+'</button>'; });
  html += '</div><div style="overflow-x:auto"><table><tr><td class="l" style="font-weight:700">社团</td><td>类型</td>';
  /* 多年级组时「名额/班」「合计」会重复出现，所以带上年级前缀，避免看不明白 */
  var multiG = g.grades.length > 1;
  /* ★ 主表除了本组社团，还要把「别的组定义、但在本组年级有人」的**真·跨年级**社团一并列出
     （典型：鼓号队定义在六年级组，五年级也有队员；不列的话五年级视图看不到它）
     ★ 但「本组也有同名社团」的不算跨年级 —— 那是各年级段各开一个（足球/篮球/手工社团等）。
       把它们列进来只会让两份不同社团的数据混成一份。
       2026-09-14 谭谭口径：**跨年级社团只有鼓号队**。 */
  var extraClubs = [];
  data.groups.forEach(function(gx){
    if (gx.id === g.id) return;
    gx.clubs.forEach(function(cx){
      var sameHere = false;
      g.clubs.forEach(function(cc){ if (cc.n === cx.n) sameHere = true; });
      if (sameHere) return;      /* 本组有同名社团 → 各段独立，不算跨年级 */
      var tot = 0;
      g.grades.forEach(function(gr){
        var n = data.classCounts[gr]||0;
        for (var k=1;k<=n;k++){
          tot += list(gr,k).filter(function(s){ return stuClubs(s).some(function(x){return x.n===cx.n;}); }).length;
        }
      });
      if (tot > 0) extraClubs.push({ c: cx, other: gx.name, owner: gx, cnt: tot });
    });
  });
  var viewClubs = g.clubs.map(function(c){ return { c:c, other:"", owner:g }; })
                  .concat(extraClubs.map(function(x){ return { c:x.c, other:x.other, owner:x.owner }; }));

  g.grades.forEach(function(gr){
    var n = data.classCounts[gr]||0;
    for (var c=1;c<=n;c++) html += '<th>'+CN[gr]+'('+c+')</th>';
    html += '<th style="background:#FBEAE0">'+(multiG?CN[gr]+"<br>":"")+'名额/班</th>'
         +  '<th style="background:#FBEAE0">'+(multiG?CN[gr]+"<br>":"")+'小计</th>';
  });
  html += '<th style="background:#FBEAE0">全校<br>合计</th></tr>';
  viewClubs.forEach(function(item){
    var c = item.c;
    var isOther = !!item.other;
    var sp = clubSpread(c.n, item.owner);   /* ★ 只算「这一份」的成员，同名社团不互相串户 */
    var viewSum = g.grades.reduce(function(a,gr){ return a + clubInGrade(c.n, gr); }, 0);
    html += '<tr><td class="l" style="white-space:nowrap;font-weight:600">'
         +  (c.hidden?'🔒 ':'')+esc(c.n)
         +  (isOther?'<div style="font-size:11px;font-weight:400;color:#c2446a">跨年级 · 定义于「'+esc(item.other)+'」</div>':'')
         +  '</td><td>'+(isOther?"—":c.t)+'</td>';
    g.grades.forEach(function(gr){
      var q = c.q[gr];
      var n = data.classCounts[gr]||0, sum=0;
      for (var k=1;k<=n;k++){
        var used = list(gr,k).filter(function(s){return stuClubs(s).some(function(x){return x.n===c.n;});}).length; sum+=used;
        html += '<td class="'+(q!==null&&q!==undefined&&used>q?"ov-over":"")+'">'+used+'</td>';
      }
      /* 跨年级列进来的社团，本组没有它的名额定义，显示「—」而不是「不限」免得误导 */
      var qTxt = (q===null||q===undefined) ? (isOther?"—":"不限") : q;
      html += '<td>'+(isOther?"—":qTxt)+'</td><td style="font-weight:700">'+sum+'</td>';
    });
    var extra = sp.tot - viewSum;
    html += '<td style="font-weight:700;background:#FFF7F2;color:'+(extra>0?"#c2446a":"#333")+'">'+sp.tot

    chain.then(function(){ toast("已内定 "+done+" 人到「"+club+"」"); refresh(); })
         .catch(function(e){ toast("部分失败："+e); refresh(); });
  };
  app.querySelectorAll("button[data-unfix]").forEach(function(b){
    b.onclick = function(){
      if (confirm("把 "+b.dataset.name+" 移出「"+b.dataset.club+"」内定？移出后该生的这个社团被删除（名额随之释放）。")) {
        admin({action:"unfix", grade:+b.dataset.gr, cls:+b.dataset.cls, name:b.dataset.name, club:b.dataset.club}).then(function(){ toast("已移出"); refresh(); });
      }
    };
  });

  /* 借读 / 插班生：添加与移除 */
  function drawExCls(){
    var gr = +document.getElementById("exGrade").value;
    var n = data.classCounts[gr]||5;
    var sc = document.getElementById("exCls");
    sc.innerHTML = "";
    for (var i=1;i<=n;i++){ var o=document.createElement("option"); o.value=i; o.textContent=CN[gr]+"（"+i+"）班"; sc.appendChild(o); }
  }
  drawExCls();
  document.getElementById("exGrade").onchange = drawExCls;
  document.getElementById("exAddBtn").onclick = function(){
    var gr = +document.getElementById("exGrade").value;
    var c0 = +document.getElementById("exCls").value;
    var names = document.getElementById("exNames").value.split(/[\n,，、;；\t]+/).map(function(x){return x.trim();}).filter(Boolean);
    if (!names.length) { toast("请先输入学生姓名"); return; }
    admin({action:"addExtra", grade:gr, cls:c0, names:names}).then(function(r){
      if (r.error) { toast(r.error); return; }
      toast("已添加 " + (r.addedCount||0) + " 人" + (r.skipped ? "（"+r.skipped+" 人已在名单中，跳过）" : ""));
      refresh();
    });
  };
  app.querySelectorAll("button[data-exdel]").forEach(function(b){
    b.onclick = function(){
      if (confirm("把 " + b.dataset.name + " 从 " + CN[+b.dataset.gr] + "（" + b.dataset.cls + "）班的借读名单移除？\n\n注意：该生已选的社团记录不会自动删除，需要的话请到「查找学生」里单独处理。")) {
        admin({action:"removeExtra", grade:+b.dataset.gr, cls:+b.dataset.cls, names:[b.dataset.name]}).then(function(r){
          if (r.error) { toast(r.error); return; }
          toast("已移除"); refresh();
        });
      }
    };
  });

  function doSearch(){
    var name = document.getElementById("searchName").value.trim();
    if(!name) return;
    var results = [];
    [1,2,3,4,5,6].forEach(function(gr){
      var n = data.classCounts[gr]||0;
      for (var c=1;c<=n;c++){
        list(gr,c).forEach(function(s){ if(s.n.indexOf(name)>=0) results.push({gr:gr,cls:c,s:s}); });
      }
    });
    var box = document.getElementById("searchResult");
    if (!results.length) { box.innerHTML = '<p class="muted">没有找到「'+esc(name)+'」的选课记录</p>'; return; }
    var gAll = {};
    data.groups.forEach(function(x){ x.clubs.forEach(function(cb){ gAll[x.id]=x.clubs; }); });
    box.innerHTML = '<table><tr><th>年级</th><th>班</th><th>姓名</th><th>当前社团</th><th>操作</th></tr>' +
      results.map(function(r){
        var grp = data.groups.find(function(x){return x.grades.indexOf(r.gr)>=0;});
        var opts = grp.clubs.map(function(cb){ return '<option value="'+esc(cb.n)+'" '+(cb.n===r.s.c?"selected":"")+'>'+esc(cb.n)+'</option>'; }).join("");
        return '<tr><td>'+CN[r.gr]+'</td><td>'+r.cls+'</td><td style="font-weight:600">'+(r.s.fixed?'🔒 ':'')+esc(r.s.n)+(r.s.fixed?'（内定）':'')+'</td>'+
          '<td><select class="moveSel" data-gr="'+r.gr+'" data-cls="'+r.cls+'" data-name="'+esc(r.s.n)+'" style="padding:5px;border:2px solid var(--line);border-radius:8px">'+opts+'</select></td>'+
          '<td><button class="btn small" data-del="1" data-gr="'+r.gr+'" data-cls="'+r.cls+'" data-name="'+esc(r.s.n)+'">删除记录</button></td></tr>';
      }).join("") + '</table>';
    box.querySelectorAll(".moveSel").forEach(function(s){
      s.onchange = function(){ admin({action:"move", grade:+s.dataset.gr, cls:+s.dataset.cls, name:s.dataset.name, club:s.value}).then(function(){ toast("已改选"); refresh(); }); };
    });
    box.querySelectorAll("button[data-del]").forEach(function(b){
      b.onclick = function(){ if(confirm("确定删除 "+b.dataset.name+" 的选课记录？")) admin({action:"remove", grade:+b.dataset.gr, cls:+b.dataset.cls, name:b.dataset.name}).then(function(){ toast("已删除"); refresh(); }); };
    });
  }
}

/* ============ 导出：全校总表 + 每社团子表（真 xlsx，多工作表） ============ */

/* 社团名 → 定义（跨年级段全局索引，同名社团取第一条非 hidden 优先） */
/* 汇总所有选课记录 → 扁平行（一个学生一个社团一行，多社团展开多行）
   ★ 2026-09-14：社团信息一律走 resolveClub（名字 + 定义组），
     不再用「全校按名字建索引」——那会让三四年级的「足球」取到六年级那本的教师/场地。 */
function collectRows(){
  var CN6 = {1:"一",2:"二",3:"三",4:"四",5:"五",6:"六"};
  var out = [];
  [1,2,3,4,5,6].forEach(function(gr){
    var n = data.classCounts[gr]||0;
    for (var c=1;c<=n;c++){
      (data.selections["g"+gr+"c"+c]||[]).forEach(function(s){
        stuClubs(s).forEach(function(sc){
          var rv = resolveClub(sc.n, gr);
          var cl = rv ? rv.c : null;
          out.push({
            grade: gr, cls: c, gradeName: CN6[gr]+"年级",
            name: s.n, club: sc.n,
            ownerId: rv ? rv.g.id : "",
            ownerName: rv ? rv.g.name : "",
            cross: !!(rv && rv.cross),
            type: cl ? cl.t : "",
            teacher: cl ? cl.tc : "",
            place: cl ? cl.pl : "",
            note: cl ? cl.note : "",
            fixed: !!sc.fixed,
            hidden: !!(cl && cl.hidden)
          });
        });
      });
    }
  });
  return out;
}

/* ---- 极简 XLSX 生成器（零依赖，手写 ZIP + OOXML） ---- */
var XLSX = (function(){
  var enc = new TextEncoder();
  function u16(n){ return [n & 255, (n >> 8) & 255]; }
  function u32(n){ return [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >> 24) & 255]; }
  /* CRC32 */
  var CRC_T = (function(){
    var t = new Uint32Array(256);
    for (var i=0;i<256;i++){ var c=i; for (var k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[i]=c>>>0; }
    return t;
  })();
  function crc32(buf){
    var c = 0xFFFFFFFF;
    for (var i=0;i<buf.length;i++) c = CRC_T[(c ^ buf[i]) & 255] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zip(files){
    /* files: [{name, data:Uint8Array}] */
    var chunks = [], central = [], offset = 0;
    files.forEach(function(f){
      var nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
      var lh = [].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
                          u32(crc), u32(sz), u32(sz), u16(nm.length), u16(0));
      var lhb = new Uint8Array(lh);
      chunks.push(lhb, nm, f.data);
      var ch = [].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
                          u32(crc), u32(sz), u32(sz), u16(nm.length), u16(0), u16(0),
                          u16(0), u16(0), u32(0), u32(offset));
      central.push(new Uint8Array(ch), nm);
      offset += lhb.length + nm.length + sz;
    });
    var cdSize = central.reduce(function(a,b){ return a+b.length; }, 0);
    var eocd = new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0),
      u16(files.length), u16(files.length), u32(cdSize), u32(offset), u16(0)));
    var total = offset + cdSize + eocd.length;
    var out = new Uint8Array(total), p = 0;
    chunks.concat(central, [eocd]).forEach(function(b){ out.set(b, p); p += b.length; });
    return out;
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"]/g, function(m){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];
    }).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
  }
  function colName(i){
    var s = "";
    i++;
    while (i > 0){ var m = (i-1)%26; s = String.fromCharCode(65+m) + s; i = Math.floor((i-1)/26); }
    return s;
  }
  /* sheet: {name, rows:[[cell,...]], widths:[n,...], headRows:1} */
  function sheetXml(sh){
    var w = (sh.widths||[]).map(function(n,i){
      return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+n+'" customWidth="1"/>';
    }).join("");
    var body = (sh.rows||[]).map(function(row, ri){
      var cells = row.map(function(v, ci){
        var ref = colName(ci) + (ri+1);
        var isHead = ri < (sh.headRows||0);
        var style = isHead ? ' s="1"' : ' s="2"';
        if (typeof v === "number" && isFinite(v)) return '<c r="'+ref+'"'+style+'><v>'+v+'</v></c>';
        return '<c r="'+ref+'"'+style+' t="inlineStr"><is><t xml:space="preserve">'+esc(v)+'</t></is></c>';
      }).join("");
      return '<row r="'+(ri+1)+'">'+cells+'</row>';
    }).join("");
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      (w ? '<cols>'+w+'</cols>' : "") +
      '<sheetData>'+body+'</sheetData></worksheet>';
  }
  function build(sheets){
    var files = [];
    function add(name, str){ files.push({ name: name, data: enc.encode(str) }); }
    add("[Content_Types].xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheets.map(function(s,i){
        return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
      }).join("") + '</Types>');
    add("_rels/.rels",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>');
    add("xl/workbook.xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      sheets.map(function(s,i){
        return '<sheet name="'+esc(s.name).slice(0,31)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';
      }).join("") + '</sheets></workbook>');
    add("xl/_rels/workbook.xml.rels",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map(function(s,i){
        return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';
      }).join("") +
      '<Relationship Id="rIdSty" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>');
    /* 样式：0=默认 1=表头(加粗+底色+居中+边框) 2=正文(居中+边框) */
    add("xl/styles.xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="2"><font><sz val="11"/><name val="等线"/></font>' +
      '<font><b/><sz val="11"/><name val="等线"/></font></fonts>' +
      '<fills count="3"><fill><patternFill patternType="none"/></fill>' +
      '<fill><patternFill patternType="gray125"/></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FFFDF2E4"/><bgColor indexed="64"/></patternFill></fill></fills>' +
      '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>' +
      '<border><left style="thin"><color rgb="FFD9C9B0"/></left><right style="thin"><color rgb="FFD9C9B0"/></right>' +
      '<top style="thin"><color rgb="FFD9C9B0"/></top><bottom style="thin"><color rgb="FFD9C9B0"/></bottom><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="3">' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
      '</cellXfs></styleSheet>');
    sheets.forEach(function(s,i){ add("xl/worksheets/sheet"+(i+1)+".xml", sheetXml(s)); });
    return new Blob([zip(files)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  }
  return { build: build, colName: colName };
})();

/* 导出主入口：全校总表 + 每社团一个子表 */
function exportCsv(){
  var all = collectRows();
  if (!all.length) { toast("当前没有任何选课记录，无法导出"); return; }

  var HEAD = ["年级","班级","姓名","社团名称","五小类型","辅导教师","场地","级别","来源"];
  function toRow(r){
    return [r.gradeName, r.cls+"班", r.name, r.club, r.type, r.teacher, r.place, r.note,
            r.fixed ? (r.hidden ? "内定" : "已定") : "自选"];
  }
  var sheets = [];

  /* 子表 1：全校总表（按年级、班级、姓名排序） */
  all.sort(function(a,b){
    return a.grade-b.grade || a.cls-b.cls || (a.name<b.name?-1:a.name>b.name?1:0);
  });
  sheets.push({
    name: "全校总表",
    headRows: 1,
    widths: [9, 8, 12, 20, 10, 26, 22, 8, 8],
    rows: [HEAD].concat(all.map(toRow))
  });

  /* 子表 2..N：每个**社团**一张（含内定社团；有人的才出表）
     ★ 分组键 = 社团名 + 定义组（2026-09-14）：
       同名社团各出各的表，不会把三四年级的足球和六年级的足球混成一张。 */
  var byClub = {};
  all.forEach(function(r){
    var k = r.club + "\u0000" + (r.ownerId || "");
    (byClub[k] = byClub[k] || []).push(r);
  });
  var order = Object.keys(byClub).sort(function(a,b){
    return byClub[b].length - byClub[a].length || (a<b?-1:1);
  });
  order.forEach(function(k){
    var list = byClub[k];
    list.sort(function(a,b){
      return a.grade-b.grade || a.cls-b.cls || (a.name<b.name?-1:a.name>b.name?1:0);
    });
    var c0 = list[0], cn0 = c0.club;
    /* 全校重名的社团，表名补上年级段，避免两张表同名分不清 */
    var nm = cn0 + (clubNameIsUnique(cn0) ? "" : "（" + (c0.ownerName || "?") + "）");
    var sub = [["社团名称", cn0, "", "年级段", c0.ownerName || "", "", "五小类型", c0.type, "",
                "辅导教师", c0.teacher, "", "场地", c0.place, "", "级别", c0.note, "",
                "合计", list.length + " 人"]];
    /* 第二行起：明细表头 */
    sub.push(["序号","年级","班级","姓名","社团名称","五小类型","辅导教师","场地","级别","来源"]);
    list.forEach(function(r, i){
      sub.push([i+1, r.gradeName, r.cls+"班", r.name, r.club, r.type, r.teacher, r.place, r.note,
                r.fixed ? (r.hidden ? "内定" : "已定") : "自选"]);
    });
    sheets.push({
      name: nm.replace(/[\\\/\?\*\[\]:]/g, "").slice(0, 28) || "社团",
      headRows: 0,
      widths: [6, 9, 8, 12, 20, 10, 26, 22, 8, 8],
      rows: sub
    });
  });

  /* 子表末：名额占用与余量统计 */
  /* 名额占用：★ 按「名字 + 定义组」统计（2026-09-14）
     同名社团各算各的，上限 = Σ(该年级名额/班 × 该年级班数)，比原来"取第一个 q 乘年级数"准确。 */
  var quotaRows = [["社团","年级段","五小类型","辅导教师","场地","级别","名额上限","已选人数","状态"]];
  data.groups.forEach(function(g){
    var mine = all.filter(function(r){ return r.ownerId === g.id; });
    g.clubs.forEach(function(c){
      var used = mine.filter(function(r){ return r.club === c.n; }).length;
      if (!used) return;
      var limit = 0, unlimited = false;
      g.grades.forEach(function(gr){
        var v = (c.q || {})[gr];
        if (v === null) unlimited = true;
        else if (typeof v === "number") limit += v * (data.classCounts[gr] || 0);
      });
      quotaRows.push([c.n, g.name, c.t, c.tc, c.pl, c.note,
                      unlimited ? "不限" : limit, used,
                      (!unlimited && used > limit) ? "超" : "正常"]);
    });
  });
  sheets.push({ name: "名额占用统计", headRows: 1, widths: [20, 10, 10, 26, 22, 8, 10, 10, 8], rows: quotaRows });

  var blob = XLSX.build(sheets);
  var a = document.createElement("a");
  var d = new Date();
  function p(n){ return (n<10?"0":"")+n; }
  a.href = URL.createObjectURL(blob);
  a.download = "社团选课总表-" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + ".xlsx";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  toast("已导出 Excel：" + (sheets.length-2) + " 个社团子表 + 总表 + 统计");
}

if (pw) {
  admin({action:"login"}).then(function(r){ if (r.ok) refresh(); else renderLogin(); });
} else renderLogin();
