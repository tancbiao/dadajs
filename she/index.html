<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>城西小学社团选课 · 家长入口</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4696B">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="社团选课">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --bg:#FDF6EC; --card:#fff; --line:#F0E4D4; --ink:#4A3B32; --sub:#9A8878;
  --red:#F4696B; --green:#7EC8A9; --blue:#8FB8E8; --pink:#F7A6C1; --purple:#C9A6E8; --orange:#F5C97B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:40px;}
.wrap{max-width:520px;margin:0 auto;padding:16px;}
.hero{background:linear-gradient(135deg,#F4696B,#F7A6C1);border-radius:20px;color:#fff;padding:22px 20px;text-align:center;margin-bottom:16px;}
.hero h1{font-size:21px;font-weight:700;}
.hero p{font-size:13px;opacity:.92;margin-top:6px;}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 3px 12px rgba(74,59,50,.08);margin-bottom:14px;}
.card h2{font-size:15px;margin-bottom:12px;color:var(--ink);}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:9px 16px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;}
.chip.on{border-color:var(--red);background:#FEECEC;color:var(--red);}
input[type=text]{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;font-size:17px;font-family:inherit;outline:none;}
input[type=text]:focus{border-color:var(--red);}
.btn{width:100%;padding:14px;border:none;border-radius:14px;background:var(--red);color:#fff;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:active{opacity:.85;}
.btn.green{background:var(--green);}
.btn.ghost{background:#fff;color:var(--red);border:2px solid var(--red);font-weight:600;}
.btn.gray{background:#F3EDE4;color:var(--sub);font-size:14px;padding:10px;}
.banner{background:#FFF3CD;color:#8a6d1a;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px;text-align:center;}
.club{border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:#fff;}
.club.full{opacity:.55;}
.club .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.club .nm{font-size:16px;font-weight:700;}
.club .meta{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.5;}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;}
.typecolor-小百灵{background:var(--pink);} .typecolor-小健将{background:var(--green);}
.typecolor-小创客{background:var(--blue);} .typecolor-小书虫{background:var(--purple);}
.typecolor-小主人{background:var(--orange);}
.qbar{height:9px;border-radius:999px;background:#F3EDE4;overflow:hidden;margin:9px 0 7px;}
.qbar i{display:block;height:100%;border-radius:999px;}
.qrow{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);}
.pickbtn{width:100%;padding:11px;border:none;border-radius:11px;background:var(--red);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px;}
.pickbtn:disabled{background:#D8CFC4;color:#fff;cursor:not-allowed;}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;}
.tag-ok{background:#E6F7EF;color:#2F9E6E;}
.tag-full{background:#FDEDED;color:#D64545;}
.tag-hot{background:#FFF0E0;color:#D07C1F;}
.mine{background:linear-gradient(135deg,#E6F9F0,#FDF6EC);border:2px solid var(--green);border-radius:20px;padding:22px 18px;text-align:center;margin-bottom:14px;}
.mine .who{font-size:14px;color:var(--sub);}
.mine .clublock{margin-top:12px;}
.mine .clublock+.clublock{border-top:1px dashed rgba(47,158,110,.35);padding-top:12px;}
.mine .lb{font-size:13px;font-weight:700;color:#2F9E6E;letter-spacing:1px;}
.mine .big{font-size:22px;font-weight:800;color:#2F9E6E;margin:4px 0;}
.mine .meta{font-size:13.5px;color:var(--sub);line-height:1.7;margin-top:6px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#4A3B32;color:#fff;padding:11px 22px;border-radius:12px;font-size:14.5px;opacity:0;transition:.3s;pointer-events:none;z-index:99;max-width:86vw;text-align:center;}
.toast.show{opacity:.95;}
.muted{color:var(--sub);font-size:13px;text-align:center;}
.mt{margin-top:12px;}
/* ===== 添加到桌面引导 ===== */
[hidden]{display:none !important;}
.a2hs{background:#FFF0F0;border:1.5px dashed #F7A6C1;border-radius:16px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:#B4474A;line-height:1.5;}
.a2hs .txt{flex:1;}
.a2hs .go{flex:none;background:#F4696B;color:#fff;border:none;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;}
.a2hs .x{flex:none;background:none;border:none;color:#C9A6A6;font-size:20px;line-height:1;padding:2px 4px;cursor:pointer;font-family:inherit;}
.sheet-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(74,59,50,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#fff;border-radius:22px 22px 0 0;padding:22px 20px 26px;width:100%;max-width:520px;}
.sheet h3{font-size:17px;margin-bottom:8px;}
.sheet-sub{font-size:13.5px;color:var(--sub);margin-bottom:14px;line-height:1.6;}
.sheet ol{margin:0 0 18px 20px;font-size:14.5px;line-height:2;}
.sheet li{margin-bottom:2px;}
.sheet .tip{background:#FFF3CD;color:#8a6d1a;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.6;margin-bottom:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🐰 城西小学社团选课</h1>
    <p>2026年秋季学期 · 名额有限，先到先得</p>
  </div>
  <div id="a2hsBar" class="a2hs" hidden>
    <div class="txt">把选课入口放到手机桌面，下次一点就开</div>
    <button class="go" id="a2hsOpen">怎么加</button>
    <button class="x" id="a2hsClose" aria-label="关闭">×</button>
  </div>
  <div id="app"><p class="muted">加载中…</p></div>
</div>
<div class="toast" id="toast"></div>

<div id="a2hsSheet" class="sheet-mask" hidden>
  <div class="sheet">
    <h3>把「社团选课」放到手机桌面</h3>
    <p class="sheet-sub" id="a2hsHint"></p>
    <ol id="a2hsSteps"></ol>
    <div class="tip" id="a2hsTip" hidden></div>
    <button class="btn" id="a2hsDone">我知道了</button>
  </div>
</div>

<script>
"use strict";
var app = document.getElementById("app");
var my = null;            // {grade, cls, name}
var config = null;        // /api/config 结果
var pickTimer = null;     // 名额刷新定时器

try { my = JSON.parse(localStorage.getItem("cx_my") || "null"); } catch(e) { my = null; }

function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.classList.remove("show"); }, 2800);
}
function esc(x){ return String(x==null?"":x).replace(/[&<>"']/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; }); }

/* 把服务端返回的开放状态转成家长看得懂的话。
   时间戳由浏览器按**本地时区**格式化，避免服务器时区不同导致显示差 8 小时。 */
function fmtTs(ms){
  if (!ms) return "";
  var d = new Date(ms);
  return (d.getMonth()+1)+"月"+d.getDate()+"日 "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
}
function closedText(closed, openAt, closeAt){
  if (closed === "before") return "选课将于 "+fmtTs(openAt)+" 开放，请到时再来～9月13日测试阶段选择的不会存在记录";
  if (closed === "after")  return "选课已于 "+fmtTs(closeAt)+" 截止，如需调整请联系老师";
  return "选课暂未开放，请等待老师通知后再来～";
}
/* 统一的错误提示：优先用服务端给出的「未开放」精确文案 */
function errText(r){
  if (r && r.closed) return closedText(r.closed, r.openAt, r.closeAt);
  return (r && r.error) || "操作失败，请重试";
}
/* ---- 后端地址自适应 ----
   同一份页面要能在三个地方跑：
   1) 后端服务器上（https://api.kexvefuxi.cn/she/）→ 同源，用相对地址
   2) dadajs.cn / github.io 静态托管 → 指向腾讯云后端
   3) 双击本地文件打开 → 指向腾讯云后端
   相对地址不带开头的斜杠，这样挂在 /she/ 子路径下也能正确解析。 */
var API_ROOT = (function(){
  if (location.protocol === "file:") return localStorage.getItem("cx_api") || "https://api.kexvefuxi.cn/she";
  var h = location.hostname;
  if (/(^|\.)dadajs\.cn$/i.test(h) || /\.github\.io$/i.test(h)) return "https://api.kexvefuxi.cn/she";
  return "";
})();
function api(path, opt){
  var url = API_ROOT ? (API_ROOT.replace(/\/+$/,"") + path) : path.replace(/^\//, "");
  return fetch(url, opt).then(function(r){ return r.json(); });
}

/* ========= 第一步：选班级 + 填名字 ========= */
function renderChoose(){
  stopRefresh();
  var sel = { grade:1, cls:1 };
  var html = '';
  if (config && !config.open) html += '<div class="banner">⏳ '+esc(closedText(config.closed, config.openAt, config.closeAt))+'</div>';
  html += '<div class="card"><h2>① 选择孩子所在年级</h2><div class="chips" id="gradeChips"></div></div>';
  html += '<div class="card"><h2>② 选择班级</h2><div class="chips" id="clsChips"></div></div>';
  html += '<div class="card"><h2>③ 输入孩子姓名</h2><input type="text" id="nameInput" placeholder="请输入学生姓名" maxlength="12" autocomplete="off">';
  html += '<div class="muted mt">请手动输入孩子姓名，系统会与学校学籍名单核对；姓名写错将无法进入</div>';
  html += '<div class="mt"><button class="btn" id="goBtn">进入选课 →</button></div></div>';
  app.innerHTML = html;

  var CN = {1:"一",2:"二",3:"三",4:"四",5:"五",6:"六"};
  function drawGrades(){
    var g = document.getElementById("gradeChips");
    g.innerHTML = [1,2,3,4,5,6].map(function(gr){
      return '<button class="chip '+(sel.grade===gr?"on":"")+'" data-g="'+gr+'">'+CN[gr]+'年级</button>';
    }).join("");
    g.querySelectorAll(".chip").forEach(function(b){
      b.onclick = function(){ sel.grade = +b.dataset.g; sel.cls = 1; drawGrades(); drawCls(); };
    });
  }
  function drawCls(){
    var n = (config && config.classCounts[sel.grade]) || 5;
    if (sel.cls > n) sel.cls = 1;
    var c = document.getElementById("clsChips");
    c.innerHTML = "";
    for (var i=1;i<=n;i++){
      var b = document.createElement("button");
      b.className = "chip" + (sel.cls===i?" on":"");
      b.textContent = CN[sel.grade]+"（"+i+"）班";
      b.dataset.c = i;                       /* 用 dataset 传值，避免闭包共享变量 */
      b.onclick = function(){ sel.cls = +this.dataset.c; drawCls(); };
      c.appendChild(b);
    }
  }
  drawGrades(); drawCls();
  document.getElementById("goBtn").onclick = function(){
    var name = document.getElementById("nameInput").value.trim();
    if (!/^[\u4e00-\u9fa5a-zA-Z·]{2,12}$/.test(name)) { toast("请输入正确的学生姓名"); return; }
    my = { grade: sel.grade, cls: sel.cls, name: name };
    localStorage.setItem("cx_my", JSON.stringify(my));
    checkMine();
  };
}

/* ========= 查询该学生是否已选 ========= */
function checkMine(){
  api("/api/my?grade="+my.grade+"&cls="+my.cls+"&name="+encodeURIComponent(my.name)).then(function(r){
    /* 姓名与学籍名单不一致 → 拦在门外，且**保留输入框**让家长直接改 */
    if (r && r.notInRoster) {
      my = null; localStorage.removeItem("cx_my");
      toast(r.error || "姓名与学校名单不一致，请核对后重试");
      return;
    }
    if (r.clubs && r.clubs.length) renderMine(r);
    else renderPick([]);
  }).catch(function(){ app.innerHTML = '<div class="card"><p class="muted">网络开小差了，请刷新重试</p></div>'; });
}

/* ========= 选课结果页 ========= */
function renderMine(data){
  stopRefresh();
  var CN = {1:"一",2:"二",3:"三",4:"四",5:"五",6:"六"};
  var clubs = data.clubs || [];
  var html = '<div class="mine">';
  html += '<div class="who">'+CN[my.grade]+'年级（'+my.cls+'）班 · '+esc(my.name)+'</div>';
  clubs.forEach(function(c){
    html += '<div class="clublock">';
    html += '<div class="lb">'+(c.fixed?'您已入选':'🎉 已选')+'</div>';
    html += '<div class="big">'+esc(c.n)+'</div>';
    if (c.fixed) html += '<div class="tag tag-hot" style="display:inline-block">学校统一安排 · 不可自行调整</div>';
    else if (c.cross) html += '<div class="tag tag-ok" style="display:inline-block">跨年级社团 · 不占本年级名额</div>';
    if (c.tc) html += '<div class="meta">👨‍🏫 辅导教师：'+esc(c.tc)+'<br>📍 活动场地：'+esc(c.pl)+'</div>';
    html += '</div>';
  });
  html += '</div>';

  var freeOnes = clubs.filter(function(c){ return !c.fixed; });
  /* 冷静期：刚选好的社团 10 分钟内不能取消（与服务端 COOL_MS 保持一致） */
  var COOL_MS = 10 * 60 * 1000;
  var leftMs = data.at ? (COOL_MS - (Date.now() - data.at)) : 0;
  var cooling = freeOnes.length > 0 && leftMs > 0;

  if (data.canAddNormal) {
    html += '<div class="card"><div class="muted" style="margin-bottom:10px">你还可以再选一个本年级社团</div>';
    html += '<button class="btn green" id="moreBtn">+ 再选一个社团</button></div>';
  } else {
    html += '<div class="card"><p class="muted">你的社团已经确定啦，如需调整请联系老师～</p></div>';
  }
  html += '<div class="card">';
  if (freeOnes.length) {
    if (cooling) {
      html += '<button class="btn gray" id="cancelBtn" disabled>取消「'+esc(freeOnes[0].n)+'」（'+Math.ceil(leftMs/60000)+' 分钟后可取消）</button>';
      html += '<div class="muted mt">刚选好不久，为防止误触，10 分钟内不能取消</div>';
    } else {
      html += '<button class="btn gray" id="cancelBtn">取消「'+esc(freeOnes[0].n)+'」</button>';
    }
  }
  html += '<div class="mt"><button class="btn gray" id="otherBtn">帮另一个孩子选课</button></div></div>';
  app.innerHTML = html;

  if (document.getElementById("moreBtn")) document.getElementById("moreBtn").onclick = function(){ renderPick(clubs); };
  if (document.getElementById("cancelBtn")) document.getElementById("cancelBtn").onclick = function(){
    var target = freeOnes[0];
    if (!confirm("确定取消「"+target.n+"」吗？名额会立即释放给别人。")) return;
    api("/api/release", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({grade:my.grade, cls:my.cls, name:my.name, club:target.n})})
      .then(function(r){
        if (r.error) { toast(errText(r)); return; }
        toast("已取消，可以重新选择"); checkMine();
      });
  };
  document.getElementById("otherBtn").onclick = function(){
    localStorage.removeItem("cx_my"); my = null; renderChoose();
  };
}

/* ========= 选课页：社团卡片列表（实时名额） ========= */
function renderPick(mineClubs){
  var CN = {1:"一",2:"二",3:"三",4:"四",5:"五",6:"六"};
  var mine = mineClubs || [];
  var mineNames = mine.map(function(c){ return c.n; });
  var hasOwn = mine.some(function(c){ return !c.cross; });
  var TYPECOLOR = {小百灵:"#F7A6C1",小健将:"#7EC8A9",小创客:"#8FB8E8",小书虫:"#C9A6E8",小主人:"#F5C97B"};
  function draw(st){
    var html = '';
    if (!st.open) html += '<div class="banner">⏳ 选课暂未开放，请等待老师通知～</div>';
    html += '<div class="card"><h2>🙋 '+CN[my.grade]+'年级（'+my.cls+'）班 · '+esc(my.name)+'</h2>';
    if (mine.length) html += '<div class="muted">已有：'+mine.map(function(c){return esc(c.n);}).join('、')+'</div>';
    html += '<div class="muted">每人只能报一个社团，名额先到先得。名额每 5 秒自动刷新。</div></div>';
    st.clubs.forEach(function(c){
      var isMine = mineNames.indexOf(c.n) >= 0;
      var q = c.q;
      var full = (q!==null && c.used>=q);
      var blocked = isMine || hasOwn;
      var remain = q===null ? "不限" : (q-c.used);
      var pct = (q===null||q===0) ? 100 : Math.min(100, Math.round(c.used/q*100));
      var color = TYPECOLOR[c.t] || "#F4696B";
      var tag;
      if (isMine) tag = '<span class="tag tag-ok">已选</span>';
      else if (full) tag = '<span class="tag tag-full">已满</span>';
      else if (blocked) tag = '<span class="tag" style="background:#F3EDE4;color:#9A8878">不可选</span>';
      else if (q!==null && q-c.used<=1) tag = '<span class="tag tag-hot">仅剩 1 个</span>';
      else tag = '<span class="tag tag-ok">可报</span>';
      var btnText, disabled;
      if (isMine) { btnText = "取消这个社团"; disabled = false; }
      else if (full) { btnText = "名额已满"; disabled = true; }
      else if (blocked) { btnText = "名额已占用"; disabled = true; }
      else { btnText = "选它！"; disabled = false; }
      html += '<div class="club'+(full&&!isMine?" full":"")+'">';
      html += '<div class="hd"><span class="nm"><span class="dot" style="background:'+color+'"></span>'+esc(c.n)+'</span>'+tag+'</div>';
      html += '<div class="meta">👨‍🏫 '+esc(c.tc)+'<br>📍 '+esc(c.pl)+'（'+esc(c.note)+'）</div>';
      html += '<div class="qbar"><i style="width:'+pct+'%;background:'+(full?"#D64545":color)+'"></i></div>';
      html += '<div class="qrow"><span>本班名额：'+c.used+' / '+(q===null?"不限":q)+'</span><span>'+(q===null?"":"剩余 "+remain+" 个")+'</span></div>';
      html += '<button class="pickbtn" data-club="'+esc(c.n)+'" data-mine="'+(isMine?1:0)+'" '+(disabled?"disabled":"")+'>'+btnText+'</button>';
      html += '</div>';
    });
    html += '<div class="card"><button class="btn gray" id="backBtn">← 返回修改班级/姓名</button></div>';
    app.innerHTML = html;
    app.querySelectorAll(".pickbtn").forEach(function(b){
      b.onclick = function(){
        var club = b.dataset.club;
        var isMine = b.dataset.mine === "1";
        b.disabled = true; b.textContent = "处理中…";
        var url = isMine ? "/api/release" : "/api/select";
        var payload = isMine ? {grade:my.grade, cls:my.cls, name:my.name, club:club}
                             : {grade:my.grade, cls:my.cls, name:my.name, club:club};
        api(url, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)})
        .then(function(r){
          if (r.error) { toast(errText(r)); checkMine(); return; }
          toast(r.msg || "操作成功！");
          checkMine();
        }).catch(function(){ toast("网络开小差了，请重试"); b.disabled=false; });
      };
    });
    document.getElementById("backBtn").onclick = function(){
      stopRefresh();
      localStorage.removeItem("cx_my"); my = null; renderChoose();
    };
  }
  function refresh(){
    api("/api/status?grade="+my.grade+"&cls="+my.cls).then(draw);
  }
  refresh();
  stopRefresh();
  pickTimer = setInterval(refresh, 5000);
}
function stopRefresh(){ if (pickTimer) { clearInterval(pickTimer); pickTimer = null; } }

/* ========= 添加到桌面引导（按微信 / iOS / 安卓分别给步骤） ========= */
(function(){
  var KEY = "cx_a2hs_hide", KEEP = 5*24*3600*1000;
  var bar = document.getElementById("a2hsBar");
  var sheet = document.getElementById("a2hsSheet");
  var hintEl = document.getElementById("a2hsHint");
  var stepsEl = document.getElementById("a2hsSteps");
  var tipEl = document.getElementById("a2hsTip");
  var deferred = null;

  function standalone(){
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
        || window.navigator.standalone === true;   /* iOS 从主屏图标打开 */
  }
  function env(){
    var ua = navigator.userAgent || "";
    if (/MicroMessenger/i.test(ua)) return "wechat";
    if (/iPhone|iPad|iPod/i.test(ua)) return "ios";
    if (/Android/i.test(ua)) return "android";
    return "desktop";
  }
  var STEPS = {
    wechat:  ["点右上角「···」按钮","选「在浏览器打开」","在浏览器菜单里选「添加到主屏幕」","回到桌面，就能看到「社团选课」图标"],
    ios:     ["点底部中间的「分享」按钮（方框加箭头）","下滑找到「添加到主屏幕」","右上角点「添加」","桌面就多出一个「社团选课」图标"],
    android: ["点浏览器右上角或右下角的「⋮」菜单","选「添加到主屏幕」或「添加到桌面」","确认「添加」","桌面就多出一个「社团选课」图标"],
    desktop: ["手机上打开本页面时，会看到「添加到桌面」的分步指引"]
  };
  var HINT = {
    wechat:  "微信里不能直接添加，需要先切到浏览器，两步就好。",
    ios:     "请用 Safari 打开本页面，再按下面四步操作。",
    android: "在浏览器菜单里就能找到「添加到主屏幕」。",
    desktop: "电脑上用不上这个功能。"
  };
  var TIP = {
    wechat:  "加好桌面图标后，下次直接从桌面点开，不用再翻聊天记录找链接。",
    ios:     "必须用 Safari，微信和部分第三方浏览器里没有这个选项。",
    android: "不同品牌手机说法略有差别，找「添加到主屏幕」这五个字就对了。"
  };

  function hiddenRecently(){
    try {
      var t = parseInt(localStorage.getItem(KEY) || "0", 10);
      return t > 0 && (Date.now() - t) < KEEP;
    } catch(e){ return false; }
  }
  function hideForever(){
    try { localStorage.setItem(KEY, String(Date.now())); } catch(e){}
    bar.hidden = true;
  }
  function openSheet(){
    var e = env();
    hintEl.textContent = HINT[e] || "";
    stepsEl.innerHTML = (STEPS[e] || []).map(function(s){ return "<li>" + s + "</li>"; }).join("");
    if (TIP[e]) { tipEl.textContent = TIP[e]; tipEl.hidden = false; } else { tipEl.hidden = true; }
    sheet.hidden = false;
  }
  function closeSheet(){ sheet.hidden = true; }

  document.getElementById("a2hsOpen").onclick = function(){
    if (deferred) { deferred.prompt(); deferred = null; return; }   /* 安卓 Chrome 可直接唤起安装 */
    openSheet();
  };
  document.getElementById("a2hsClose").onclick = hideForever;
  document.getElementById("a2hsDone").onclick = function(){ closeSheet(); hideForever(); };
  sheet.onclick = function(ev){ if (ev.target === sheet) closeSheet(); };

  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred = e; });
  window.addEventListener("appinstalled", function(){
    closeSheet(); hideForever(); toast("已添加到桌面，下次一点就开");
  });

  var FORCE = /[?&]a2hs=1/.test(location.search);        /* 调试：网址后加 ?a2hs=1 强制显示 */
  if (standalone()) { bar.hidden = true; return; }       /* 已从桌面图标打开 */
  if (!FORCE && hiddenRecently()) return;
  setTimeout(function(){
    if (FORCE || (!standalone() && env() !== "desktop")) bar.hidden = false;
  }, 1200);
})();

/* ========= 启动 ========= */
api("/api/config").then(function(c){
  config = c;
  if (my) checkMine(); else renderChoose();
}).catch(function(){
  var alt = API_ROOT ? '<p class="muted" style="margin-top:12px">如果一直连不上，请改用备用入口：<br><a href="https://api.kexvefuxi.cn/she/">https://api.kexvefuxi.cn/she/</a></p>' : '';
  app.innerHTML = '<div class="card"><h2>😅 连不上选课服务器</h2><p class="muted">请检查手机网络后刷新重试。</p>' + alt + '</div>';
});
</script>
