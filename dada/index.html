/* ============== 教研助手 · 记忆闪卡（遗忘曲线复习） ============== */
function initCards(){
  if(S.cardsInit || !Array.isArray(S.cards) || S.cards.length>0) return;
  S.cards = CARD_DECK.map(c=>({id:uid(), tag:c.tag, q:c.q, a:c.a, box:0, due:todayISO(), n:0}));
  S.cardsInit = true;
  save();
}
function dueCards(){
  const t = todayISO();
  return (S.cards||[]).filter(c=>c.box<6 && c.due<=t);
}
function drawFlashCards(){
  const el = document.getElementById('flashPanel');
  if(!el) return;
  const due = dueCards();
  const total = (S.cards||[]).length;
  const mastered = (S.cards||[]).filter(c=>c.box>=6).length;
  el.innerHTML = `
    <div class="fc-stats">
      <div class="st"><b>${due.length}</b><span>今日待复习</span></div>
      <div class="st"><b>${total}</b><span>卡组总数</span></div>
      <div class="st"><b>${mastered}</b><span>已掌握</span></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
      <button class="btn b-mint" onclick="openCardStudy()">🧠 开始复习（${due.length}）</button>
      <button class="btn b-ghost" onclick="openCardManager()">🗂️ 卡组管理</button>
      <span class="checkin-note" style="align-self:center">记得 → 拉长复习间隔；忘了 → 重新学</span>
    </div>`;
}
let studyQueue = [], studyIdx = 0, studyOK = 0;
window.openCardStudy = function(){
  const due = dueCards();
  if(due.length===0){
    const total = (S.cards||[]).length;
    showModal({title:'🧠 记忆闪卡', bodyHtml:`<div style="text-align:center;padding:10px">
      ${total===0?'<p>卡组还是空的～点"卡组管理"添加第一张卡吧</p>':'<p style="font-size:1.1rem">🎉 今天该复习的都复习完啦！</p><p class="tip">已掌握 '+(S.cards||[]).filter(c=>c.box>=6).length+' 张 · 共 '+total+' 张</p>'}
      <button class="btn b-mint" style="margin-top:10px" onclick="closeModal();openCardManager()">🗂️ 卡组管理</button>
    </div>`});
    return;
  }
  studyQueue = due.slice().sort((a,b)=>(a.due||'').localeCompare(b.due||''));
  studyIdx = 0; studyOK = 0;
  showCardModal();
};
function showCardModal(){
  const c = studyQueue[studyIdx];
  if(!c) return;
  const gap = c.box>=6 ? '—' : (CARD_STAGES[Math.min(c.box,5)]+' 天后');
  showModal({
    title:'🧠 记忆闪卡 · 第 '+(studyIdx+1)+'/'+studyQueue.length+' 张',
    bodyHtml:`
      <div class="fc-card" id="fcCard">
        <span class="badge pink">${escapeHtml(c.tag)} · 已复习 ${c.n||0} 次</span>
        <div class="fc-q">${escapeHtml(c.q)}</div>
        <div class="fc-a" id="fcAnswer" style="display:none">${escapeHtml(c.a)}</div>
      </div>
      <div style="text-align:center;margin-top:14px">
        <button class="btn b-blue" id="fcFlip" onclick="flipCard()">👀 显示答案</button>
        <div id="fcRate" style="display:none;margin-top:12px">
          <button class="btn b-mint" onclick="cardRate(1)">✓ 记得 · 下次 ${gap} 复习</button>
          <button class="btn danger" onclick="cardRate(0)">✗ 忘了 · 重新学</button>
        </div>
      </div>`
  });
}
window.flipCard = function(){
  const ans = document.getElementById('fcAnswer');
  const flip = document.getElementById('fcFlip');
  if(!ans || !flip) return;
  ans.style.display = 'block';
  flip.style.display = 'none';
  document.getElementById('fcRate').style.display = 'block';
};
window.cardRate = function(know){
  const c = studyQueue[studyIdx];
  if(!c) return;
  if(know){
    c.box = Math.min((c.box||0)+1, 6);
    studyOK++;
  } else {
    c.box = 0;
  }
  c.n = (c.n||0)+1;
  const d = new Date();
  d.setDate(d.getDate() + (c.box>=6 ? 9999 : CARD_STAGES[Math.min(c.box,5)]));
  c.due = fmtDate(d);
  save();
  studyIdx++;
  if(studyIdx >= studyQueue.length){
    showModal({title:'🧠 本组复习完成', bodyHtml:`<div style="text-align:center;padding:10px">
      <p style="font-size:1.15rem">${studyOK===studyQueue.length?'🎉 全对，太棒了！':'👍 完成 '+studyOK+'/'+studyQueue.length+'，加油！'}</p>
      <p class="tip">忘记的卡会回到第 1 级重新学，明天见～</p>
      <button class="btn b-mint" style="margin-top:10px" onclick="closeModal()">完成</button>
    </div>`});
    drawFlashCards();
    drawHomeAlerts();
    return;
  }
  showCardModal();
};
window.openCardManager = function(){
  const cards = S.cards||[];
  showModal({
    title:'🗂️ 记忆闪卡 · 卡组管理（'+cards.length+' 张）',
    bodyHtml:`
      <div class="fc-add">
        <input class="inp" id="newQ" placeholder="✍️ 知识点问题（如：什么是最近发展区？）" style="margin-bottom:6px">
        <input class="inp" id="newA" placeholder="答案要点（如：维果茨基提出，教学要走在发展前面……）">
        <button class="btn sm b-mint" style="margin-top:8px" onclick="addCard()">＋ 添加自定义卡</button>
      </div>
      <div style="max-height:330px;overflow:auto;margin-top:10px">
        ${cards.map(c=>`<div class="rule-row" style="position:relative;padding-right:56px">
          <div style="font-weight:bold"><span class="badge pink">${escapeHtml(c.tag)}</span> ${escapeHtml(c.q)}</div>
          <div style="font-size:.76rem;color:var(--ink-l);margin:3px 0 4px">${c.box>=6?'✅ 已掌握 · 复习 '+c.n+' 次':'📅 下次 '+c.due+' · 等级 '+(c.box+1)+'/6 · 已复习 '+(c.n||0)+' 次'}</div>
          <button class="btn xs danger" style="position:absolute;right:0;top:0" onclick="delCard('${c.id}')">删除</button>
        </div>`).join('')}
      </div>`
  });
};
window.addCard = function(){
  const q = (document.getElementById('newQ')||{}).value||'';
  const a = (document.getElementById('newA')||{}).value||'';
  if(!q.trim()){ toast('请先填写问题'); return; }
  if(!a.trim()){ toast('请填写答案要点'); return; }
  S.cards.push({id:uid(), tag:'自定义', q:q.trim(), a:a.trim(), box:0, due:todayISO(), n:0});
  save();
  toast('✅ 已添加记忆卡');
  openCardManager();
  drawFlashCards();
  drawHomeAlerts();
};
window.delCard = function(id){
  if(!confirm('删除这张记忆卡？')) return;
  S.cards = (S.cards||[]).filter(c=>c.id!==id);
  save();
  openCardManager();
  drawFlashCards();
  drawHomeAlerts();
};

function drawStreakDots(){
  const el = document.getElementById('streakDots');
  if(!el) return;
  let html = '<div class="lab">最近 14 天</div>';
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = fmtDate(d);
    const on = !!S.learn.checks[iso];
    html += `<div class="sdot ${on?'on':''} ${i===0?'tdy':''}" title="${iso}">${d.getDate()}</div>`;
  }
  el.innerHTML = html;
}

function drawCheckinLog(){
  const el = document.getElementById('checkinLog');
  if(!el) return;
  const keys = Object.keys(S.learn.checks).sort().reverse().slice(0,6);
  if(keys.length===0){
    el.innerHTML = `<div class="empty" style="padding:10px"><span class="pic">🌱</span>还没有打卡记录<br><span class="tip">读完今日共读，点上面的小兔子打卡吧～</span></div>`;
    return;
  }
  let html = '';
  for(const k of keys){
    const c = S.learn.checks[k];
    const a = articleById(c.id);
    html += `<div class="lg"><span class="d">${k.slice(5)}</span><span class="t">${a?escapeHtml(a.title):'打卡'}${c.note?' · '+escapeHtml(c.note.slice(0,30)):''}</span></div>`;
  }
  el.innerHTML = html;
}

function drawLibCats(){
  const cur = S.learn.cat || '全部';
  const html = LEARN_CATS.map(c=>`<button class="chip ${c===cur?'on':''}" onclick="pickLibCat('${escapeHtml(c)}')">${escapeHtml(c)}</button>`).join('');
  document.getElementById('libCats').innerHTML = html;
}
window.pickLibCat = function(c){
  S.learn.cat = c; save();
  drawLibCats(); drawLibGrid();
};

function drawLibGrid(){
  const cur = S.learn.cat || '全部';
  const list = cur==='全部' ? LEARN_LIB : LEARN_LIB.filter(a=>a.cat===cur);
  const g = document.getElementById('libGrid');
  g.innerHTML = list.map(a=>`
    <div class="lib-card" onclick="openArticle('${a.id}')">
      ${S.learn.read[a.id]?'<div class="rd">已读 ✓</div>':''}
      <div class="ti">${escapeHtml(a.title)}</div>
      <div style="display:flex;gap:6px;align-items:center;margin-top:auto">
        <span class="badge ${a.type==='video'?'lav':'pink'}">${a.type==='video'?'▶ 视频':escapeHtml(a.cat)}</span>
        ${a.type==='video'&&videoLink(a.id)?'<span class="badge blue">🔗 直达</span>':''}
        <span class="src">${escapeHtml(a.src)}</span>
      </div>
      <div class="src">${a.type==='video'?'📺 '+(a.up||'')+' · ':''}约 ${a.mins} 分钟 · ${bunnyHeadSVG('#FFC2D4',13)} ${a.notes.length} 条批注</div>
    </div>`).join('');
}

window.openArticle = function(id){
  const a = articleById(id);
  if(!a) return;
  const note = S.learn.notes[id]||'';
  showModal({
    title: '📖 '+a.cat+' · 精选共读',
    bodyHtml: `
      <div class="art-meta">
        <span class="badge pink">${escapeHtml(a.cat)}</span>
        <span class="badge cream">${escapeHtml(a.src)}</span>
        <span class="badge blue">约 ${a.mins} 分钟</span>
        ${S.learn.read[id]?'<span class="badge mint">✓ 已读</span>':''}
      </div>
      <div style="font-size:1.1rem;font-weight:bold;margin-bottom:12px;line-height:1.5">${escapeHtml(a.title)}</div>
      ${a.type==='video'?`<div style="margin-bottom:12px;color:var(--ink-l)">📺 UP主：<b>${escapeHtml(a.up||'')}</b>${a.kw?` · 关键词：${escapeHtml(a.kw)}`:''}</div>`:''}
      <div class="art-modal-body"><div class="art-digest">${renderDigest(a)}</div></div>
      <label class="lbl">✍️ 我的心得</label>
      <textarea class="inp" id="artNote" placeholder="读完想记点什么？">${escapeHtml(note)}</textarea>
      <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
        ${a.type==='video'?`<button class="btn b-blue" onclick="openBili('${a.id}')">${videoLink(a.id)?'🎬 去B站看':'🔍 去B站搜索'}</button><button class="btn b-ghost" onclick="editVideoLink('${a.id}')">✏️ 改链接</button>`:''}
        <button class="btn b-ghost" onclick="closeModal()">关闭</button>
        <button class="btn b-mint" onclick="saveArtNote('${id}')">保存心得${S.learn.read[id]?'':'并标记已读'}</button>
      </div>`
  });
};
window.saveArtNote = function(id){
  const v = (document.getElementById('artNote')||{}).value||'';
  if(v.trim()) S.learn.notes[id] = v.trim();
  if(!S.learn.read[id]) S.learn.read[id] = todayISO();
  save();
  closeModal();
  renderResearch(document.getElementById('body-research'));
  toast('✅ 已保存');
};
function videoLink(id){
  const a = articleById(id); if(!a) return '';
  if((S.videoLinks||{})[id]) return (S.videoLinks||{})[id];
  if(a.bv) return 'https://www.bilibili.com/video/'+a.bv;
  if(a.space) return 'https://space.bilibili.com/'+a.space;
  return '';
}
window.openBili = function(id){
  const a = articleById(id);
  if(!a) return;
  const url = videoLink(id);
  if(url){
    window.open(url, '_blank');

        c.height = Math.max(1,Math.round(img.height*sc));

/* ── 作息配置：点「⚙ 作息时间」可自定义，存在本机 ── */
const CLS_DEF = { days: ['一','二','三','四','五'], periods: ['第1节','第2节','第3节','第4节','第5节','第6节','第7节','第8节'], times: ['08:00','08:50','09:50','10:40','11:30','13:30','14:20','15:10'] };
function clsCfg(){
  var c = S.class.cfg;
  if(!c || !c.periods || !c.periods.length) c = S.class.cfg = {days:CLS_DEF.days.slice(), periods:CLS_DEF.periods.slice(), times:CLS_DEF.times.slice()};
  if(!c.days || !c.days.length) c.days = CLS_DEF.days.slice();
  if(!c.times) c.times = [];
  while(c.times.length < c.periods.length) c.times.push('');
  return c;
}
function clsDays(){ return clsCfg().days; }
function clsPeriods(){ return clsCfg().periods; }
function clsTimes(){ return clsCfg().times; }

function drawClsGrid(){
  const g = document.getElementById('clsGrid');
  g.style.gridTemplateColumns = '70px repeat(' + clsDays().length + ',1fr)';
  let html = '<div class="h">节次</div>';
  clsDays().forEach((d,i)=>{ html += `<div class="h">星期${d}</div>`; });
  const now = new Date();
  const curDay = now.getDay(); // 0-6
  for(let p=0;p<clsPeriods().length;p++){
    html += `<div class="h">${clsPeriods()[p]}<br><small style="font-size:.65rem;color:var(--ink-l)">${clsTimes()[p]}</small></div>`;
    for(let d=0;d<clsDays().length;d++){
      const item = S.class.items.find(x => x.day===d && x.period===p);
      const isNow = (d+1) === curDay;
      html += `<div class="c ${isNow?'today-col':''}" onclick="openEdit('class','${d}','${p}')">
        ${item?`<div style="font-weight:bold">${escapeHtml(item.name||'')}</div><div style="font-size:.65rem;color:var(--ink-l)">${escapeHtml(item.room||'')}</div>`:'<span style="color:#C3B5C8">＋</span>'}
      </div>`;
    }
  }
  g.innerHTML = html;
  // 现在上课：今天 + 现在时间最接近的节次
  if(curDay>=1 && curDay<=5){
    const todayItems = S.class.items.filter(x => x.day === curDay-1).sort((a,b)=>a.period-b.period);
    // 高亮当前节次（根据时分比较）
  }
  drawTodayCls();
}

function drawTodayCls(){
  const curDay = new Date().getDay();
  if(curDay<1 || curDay>clsDays().length){
    document.getElementById('todayClassList').innerHTML = `<div class="empty"><span class="pic">🌙</span>今天是周末，休息一下吧</div>`;
    return;
  }
  const items = S.class.items.filter(x=>x.day===curDay-1).sort((a,b)=>a.period-b.period);
  if(items.length===0){
    document.getElementById('todayClassList').innerHTML = `<div class="empty"><span class="pic">📭</span>今天还没有课程安排</div>`;
    return;
  }
  // 高亮当前正在进行
  const now = new Date();
  const nowH = now.getHours();
  const nowM = now.getMinutes();
  const nowMin = nowH*60 + nowM;
  function inPeriod(p){
    const t = clsTimes()[p] || '00:00';
    const [h,m] = t.split(':').map(Number);
    const start = h*60+m;
    const next = p+1<clsTimes().length ? (parseInt(clsTimes()[p+1].split(':')[0])*60 + parseInt(clsTimes()[p+1].split(':')[1])) : (start+50);
    return nowMin>=start && nowMin<next;
  }
  let html = '';
  for(const it of items){
    const active = inPeriod(it.period);
    html += `<div class="item" style="${active?'border-color:var(--mint-d);background:var(--mint);':''}">
      <span class="it-ic">${active?'🔔':'📘'}</span>
      <div class="it-main">
        <div class="it-title">${escapeHtml(it.name||'')} <span class="badge blue">${clsPeriods()[it.period]||''}</span> ${active?'<span class="badge mint">进行中</span>':''}</div>
        <div class="it-sub">
          <span>⏰ ${clsTimes()[it.period]||''}</span>
          ${it.room?`<span>📍 ${escapeHtml(it.room)}</span>`:''}
        </div>
      </div>
    </div>`;
  }
  document.getElementById('todayClassList').innerHTML = html;
}

function drawExamChart(stuId){
  const c = document.getElementById('examChart');
  if(!c) return;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  const e = (S.studentData[stuId]||{}).exam || [];
  if(e.length===0){
    ctx.font='20px sans-serif';
    ctx.fillStyle='#BFB0C7';
    ctx.textAlign='center';
    ctx.fillText('还没有考试数据，先录入考试～', c.width/2, c.height/2);
    return;
  }
  const data = e.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const padL=50, padB=40, padT=20, padR=20;
  const W = c.width - padL - padR;
  const H = c.height - padB - padT;
  const maxScore = Math.max(...data.map(x=>parseFloat(x.max)||100));
  const minScore = Math.min(...data.map(x=>parseFloat(x.score)||0), 0);

  // 网格
  ctx.strokeStyle='#F3E0EA'; ctx.lineWidth=1;
  for(let i=0;i<=5;i++){
    const y = padT + H*i/5;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+W,y); ctx.stroke();
    const val = (maxScore - (maxScore-minScore)*i/5).toFixed(0);
    ctx.fillStyle='#9A8AA0';
    ctx.font='12px sans-serif';
    ctx.textAlign='right';
    ctx.fillText(val, padL-8, y+4);
  }
  // x 轴
  ctx.fillStyle='#5A4A5E';
  ctx.font='11px sans-serif';
  ctx.textAlign='right';
  data.forEach((d,i)=>{
    const x = padL + (data.length===1? W/2 : W*i/(data.length-1));
    ctx.save();
    ctx.translate(x, padT+H+8);
    ctx.rotate(-Math.PI/6);
    ctx.textAlign='right';
    ctx.fillText(`${d.date.slice(5)}\n${d.subject||''}`, 0, 8);
    ctx.restore();
  });
  // 折线
  ctx.strokeStyle='#F79CB8'; ctx.lineWidth=3;
  ctx.beginPath();
  data.forEach((d,i)=>{
    const x = padL + (data.length===1? W/2 : W*i/(data.length-1));
    const y = padT + H*(1 - (parseFloat(d.score)-minScore)/(maxScore-minScore || 1));
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  // 点
  data.forEach((d,i)=>{
    const x = padL + (data.length===1? W/2 : W*i/(data.length-1));
    const y = padT + H*(1 - (parseFloat(d.score)-minScore)/(maxScore-minScore || 1));
    ctx.fillStyle='#fff'; ctx.strokeStyle='#F79CB8'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#5A4A5E';
    ctx.font='12px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(d.score, x, y-12);
  });
}

function drawDutyCal(){
  const grid = document.getElementById('dutyCal');
  if(!grid) return;
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y,m,1);
  const startW = first.getDay();
  const lastDay = new Date(y,m+1,0).getDate();
  let html = ['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startW;i++) html += `<div></div>`;
  for(let d=1; d<=lastDay; d++){
    const iso = y+'-'+pad(m+1)+'-'+pad(d);
    const items = S.duty.filter(x=>x.date===iso);
    html += `<div class="cal-cell ${iso===todayISO()?'today':''}" title="${items.map(x=>x.item+' '+x.period).join('\\n')}">
      ${d}
      ${items.length?'<div class="dot-marks"><i style="background:#9ADBBB"></i></div>':''}
    </div>`;
  }
  grid.innerHTML = html;
}

      <label class="lbl">排多少周</label>
      <input type="number" class="inp" id="drWeeks" value="16" min="1" max="24" style="max-width:140px">
      <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
        <button class="btn b-ghost" onclick="closeModal()">取消</button>
        <button class="btn b-mint" onclick="saveDutyRule()">一键生成</button>

};
window.saveDutyRule = function(){
  const wd = ['周日','周一','周二','周三','周四','周五','周六'];
  const weekday = parseInt(document.getElementById('drWd').value,10);
  const item = document.getElementById('drItem').value;
  const period = document.getElementById('drPeriod').value.trim();
  const note = document.getElementById('drNote').value.trim();
  const weeks = Math.max(1, Math.min(24, parseInt(document.getElementById('drWeeks').value,10)||16));
  if(!period) return toast('时段必填');
  const d = new Date(); d.setHours(0,0,0,0);
  while(d.getDay()!==weekday) d.setDate(d.getDate()+1);
  const dates = [];
  for(let i=0;i<weeks;i++){ dates.push(fmtDate(d)); d.setDate(d.getDate()+7); }
  const end = dates[dates.length-1];
  const ruleId = uid();
  for(const iso of dates){ S.duty.push({id:uid(), date:iso, item, period, note, ruleId}); }
  S.dutyRules = S.dutyRules||[];
  S.dutyRules.push({id:ruleId, weekday, item, period, note, weeks, end});
  save();
  closeModal();
  drawDutyTable(); drawDutyCal(); drawDutyRules();
  toast('✅ 已为随后 '+weeks+' 个'+wd[weekday]+'排好值日');
};
window.delDutyRule = function(id){
  if(!confirm('删除该循环规则？已自动生成的值日也会一并移除。')) return;
  S.duty = (S.duty||[]).filter(x=>x.ruleId!==id);
  S.dutyRules = (S.dutyRules||[]).filter(r=>r.id!==id);
  save(); drawDutyTable(); drawDutyCal(); drawDutyRules();
};

function drawParentGrid(){
  const g = document.getElementById('parentGrid');
  if(S.students.length===0){
    g.innerHTML = `<div class="empty" style="grid-column:1/-1"><span class="pic">🐰</span>请先在【学生追踪】中添加学生</div>`;
    return;
  }
  const now = Date.now();
  let html = '';
  for(const s of S.students){
    const list = S.parent[s.id] || [];
    const last = list[list.length-1];
    const days = last ? Math.floor((now - new Date(last.date).getTime())/86400000) : 999;
    let pass = true;
    if(S.parentFilter==='warn' && days<=7) pass = false;
    if(S.parentFilter==='fresh' && days>7) pass = false;
    if(!pass) continue;
    const warn = days>7 ? '<span class="warn">⚠️</span>' : '<span class="badge mint" style="position:absolute;top:-6px;right:-6px">✅</span>';
    html += `<div class="stu-card" onclick="openParentDetail('${s.id}')">
      ${warn}
      <div class="av">${escapeHtml((s.name||'?').slice(0,1))}</div>
      <div class="nm">${escapeHtml(s.name)}</div>
      <div class="st">${last? escapeHtml(last.date)+'（'+days+'天前）': '<span style="color:#bbb">还没沟通</span>'}</div>
    </div>`;
  }
  if(!html) html = `<div class="empty" style="grid-column:1/-1"><span class="pic">📭</span>该筛选下无学生</div>`;
  g.innerHTML = html;
}

window.addS63 = async function(){
  const date = document.getElementById('s63Date').value || todayISO();
  const name = document.getElementById('s63Name').value.trim();
  const amt = parseFloat(document.getElementById('s63Amt').value);
  if(!name || isNaN(amt)) return toast('名称与金额必填');
  const type = document.getElementById('s63Type').value;
  const note = document.getElementById('s63Note').value.trim();
  const files = document.getElementById('s63File').files;
  const arr = [];
  for(const f of files){
    const r = await readFileAsDataURL(f);
    arr.push(r);
  }
  S.six30.push({id:uid(), date, name, amt, type, note, files: arr});
  save();
  document.getElementById('s63Name').value='';
  document.getElementById('s63Amt').value='';
  document.getElementById('s63File').value='';
  drawS63();
  toast('✅ 已保存');
};

window.delS63 = function(id){
  if(!confirm('删除此条（含凭证）？')) return;
  const i = S.six30.findIndex(x=>x.id===id);
  if(i>=0) S.six30.splice(i,1);
  save(); drawS63();
};

window.exportS63 = function(){
  let csv = '日期,类别,项目,金额（元）,备注\\n';
  const sorted = S.six30.slice().sort((a,b)=>b.date.localeCompare(a.date));
  for(const x of sorted){
    csv += `${x.date},${x.type},${(x.name||'').replace(/,/g,'，')},${x.amt},${(x.note||'').replace(/,/g,'，')}\\n`;
  }
  downloadFile('630台账.csv', csv, 'text/csv;charset=utf-8');
  toast('✅ 已导出');
};

window.saveEdit = function(type, date, id){
  const newDate = document.getElementById('edDate').value || date;
  const time = document.getElementById('edTime').value;
  const title = document.getElementById('edTitle').value.trim();
  if(!title) return toast('请输入标题');
  const item = {
    id: id || uid(),
    time,
    title,
    duration: document.getElementById('edDuration') ? document.getElementById('edDuration').value.trim() : '',
    note: document.getElementById('edNote').value.trim(),
    done: false
  };
  // 移到新的日期桶
  if(type==='schedule'){
    S.schedule_fixed[date] = S.schedule_fixed[date]||[];
    if(id){
      const i = S.schedule_fixed[date].findIndex(x=>x.id===id);
      if(i>=0) S.schedule_fixed[date].splice(i,1);
    }
    S.schedule_fixed[newDate] = S.schedule_fixed[newDate]||[];
    S.schedule_fixed[newDate].push(item);
  } else {
    S.reminders[date] = S.reminders[date]||[];
    if(id){
      const i = S.reminders[date].findIndex(x=>x.id===id);
      if(i>=0) S.reminders[date].splice(i,1);
    }
    S.reminders[newDate] = S.reminders[newDate]||[];
    S.reminders[newDate].push(item);
  }
  S.today.selDate = newDate;
  save();
  closeModal();
  drawCal();
  drawDay();
  toast('✅ 已保存');
};

window.saveCls = function(id){
  const day = +document.getElementById('clsDay').value;
  const period = +document.getElementById('clsPeriod').value;
  const name = document.getElementById('clsName').value.trim();
  const room = document.getElementById('clsRoom').value.trim();
  if(!name) return toast('请输入科目');
  if(id){
    const i = S.class.items.findIndex(x=>x.id===id);
    if(i>=0){
      // 删除已存在的同 day+period（防止冲突）
      S.class.items = S.class.items.filter(x => !(x.day===day && x.period===period));
      S.class.items.push({id, day, period, name, room});
    }
  } else {
    S.class.items = S.class.items.filter(x => !(x.day===day && x.period===period));
    S.class.items.push({id: uid(), day, period, name, room});
  }
  save();
  closeModal();
  drawClsGrid();
};

window.delCls = function(id){
  S.class.items = S.class.items.filter(x=>x.id!==id);
  save();
  closeModal();
  drawClsGrid();
};

window.bulkImportCls = function(){
  const text = document.getElementById('clsBulk').value.trim();
  if(!text) return toast('请粘贴课程表');
  const lines = text.split('\n').map(s=>s.trim()).filter(Boolean);
  for(const ln of lines){
    const m = ln.match(/星期\s*(\d)[,，]\s*第\s*(\d)\s*节[,，]\s*([^,，]+)[,，]?\s*(.*)/);
    if(!m) continue;
    const day = +m[1]-1, period = +m[2]-1;
if(day<0 || day>=clsDays().length) continue;
    if(period<0 || period>=clsPeriods().length) continue;
    S.class.items = S.class.items.filter(x => !(x.day===day && x.period===period));
    S.class.items.push({id:uid(), day, period, name:m[3].trim(), room:(m[4]||'').trim()});
  }
  save();
  closeModal();
  drawClsGrid();
  toast('✅ 已导入');
};

window.saveClsCfg = function(){
  const WEEK = ['一','二','三','四','五','六','日'];
  const dayBox = document.getElementById('cfgDays');
  const rowBox = document.getElementById('cfgRows');
  if(!dayBox || !rowBox) return;
  const days = Array.prototype.slice.call(dayBox.querySelectorAll('input:checked')).map(function(x){ return +x.value; });
  const names = Array.prototype.slice.call(rowBox.querySelectorAll('[data-pname]')).map(function(x){ return x.value.trim(); });
  const times = Array.prototype.slice.call(rowBox.querySelectorAll('[data-ptime]')).map(function(x){ return x.value; });
  if(!days.length) return toast('至少选一个上课日');
  const keep = [];
  names.forEach(function(n,i){ if(n) keep.push({n:n, t:times[i]||''}); });
  if(!keep.length) return toast('至少保留一个节次');
  days.sort(function(a,b){ return a-b; });
  const oldP = clsPeriods().slice();
  const oldD = clsDays().slice();
  const newDays = days.map(function(i){ return WEEK[i]; });
  // 已排的课按「星期名 / 节次名」重新映射，对不上就夹到最接近的一格
  S.class.items.forEach(function(it){
    const di = newDays.indexOf(oldD[it.day]);
    it.day = di>=0 ? di : Math.min(it.day, newDays.length-1);
    const pi = keep.findIndex(function(k){ return k.n===oldP[it.period]; });
    it.period = pi>=0 ? pi : Math.min(it.period, keep.length-1);
  });
  S.class.items = S.class.items.filter(function(it){ return it.day < newDays.length && it.period < keep.length; });
  S.class.cfg = {days:newDays, periods:keep.map(function(k){return k.n;}), times:keep.map(function(k){return k.t;})};
  save(); closeModal(); drawClsGrid();
  toast('✅ 作息已更新');
};

window.importClsCsv = function(){

/* ============== 文件下载 ============== */
function downloadFile(name, content, mime){
  const blob = content.startsWith('data:') ? null : new Blob([content], {type: mime||'text/plain'});
  let url;
  if(blob) url = URL.createObjectURL(blob);
  else {
    // content 是 data url
    const a = document.createElement('a');
    a.href = content;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    return;
  }
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

let _remindedHash = {};

function checkReminders(){
  if(!S.settings.reminderOn) return;
  const now = new Date();
  const date = todayISO();
  const cur = pad(now.getHours())+':'+pad(now.getMinutes());
  const rems = (S.reminders[date]||[]).filter(x => !x.done && !x.alerted);
  for(const r of rems){
    if(r.time && r.time.substring(0,5) === cur){
      r.alerted = true;
      save();
      showBanner('🔔 提醒：'+r.title+'（'+r.time+'）');
    }
  }
  // 每分钟重新计算"未做"事情的 banner
}

function checkDailyGen(){
  // 设置生成时间，每日提示一次
  const now = new Date();
  const cur = pad(now.getHours())+':'+pad(now.getMinutes());
  if(cur === (S.settings.genTime||'07:30') && now.getSeconds() < 30){
    const today = todayISO();
    const fix = S.schedule_fixed[today] || [];
    const rem = S.reminders[today] || [];
    const clsToday = S.class.items.filter(x => x.day === (new Date().getDay()-1)).sort((a,b)=>a.period-b.period);
    let summary = `☀️ 早上好！今天 ${weekDay(today)}，`;
    summary += `固定行程 ${fix.length} 条，提醒 ${rem.length} 条，`;
    summary += `课程 ${clsToday.length} 节`;
    // 今日共读提醒
    try{
      const art = dailyArticle();
      if(art && !S.learn.checks[today]){
        summary += `；🌸 今日共读《${art.title.slice(0,18)}${art.title.length>18?'…':''}》等你来打卡`;
      }
    }catch(_){}
    if(!S._dailyShown || S._dailyShown !== today){
      S._dailyShown = today;
      save();
      showBanner(summary);
    }
  }
}

/* 晚间共读温柔提醒：20:00 还没打卡就提示一次 */
function checkLearnReminder(){
  try{
    const now = new Date();
    const cur = pad(now.getHours())+':'+pad(now.getMinutes());
    const today = todayISO();
    if(cur === '20:00' && now.getSeconds() < 30 && !S.learn.checks[today] && S._learnReminded !== today){
      S._learnReminded = today;
      save();
      const art = dailyArticle();

    }
  }catch(_){}
}

  if(window.Notification && Notification.permission==='default'){
    setTimeout(()=>Notification.requestPermission(), 5000);
  }
});



</script>
</body>
</html>
