<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家乡文化二维码 · 正在打开</title>
<meta http-equiv="refresh" content="0; url=https://api.kexvefuxi.cn/qr2/">
<style>
  :root{--bg:#FBF7F2;--card:#fff;--ink:#2E2A26;--sub:#8A8078;--accent:#E8734A;--line:#EDE4DA}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 50% -10%,#FFF3E8 0%,var(--bg) 60%);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);padding:24px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 36px;
    max-width:460px;width:100%;text-align:center;box-shadow:0 10px 34px rgba(120,90,60,.08)}
  .ic{font-size:44px;line-height:1}
  h1{font-size:20px;margin:14px 0 6px}
  p{color:var(--sub);font-size:14px;line-height:1.75;margin:6px 0}
  a.go{display:inline-block;margin-top:18px;background:var(--accent);color:#fff;text-decoration:none;
    padding:12px 26px;border-radius:999px;font-size:15px;font-weight:600}
  a.go:active{transform:translateY(1px)}
  .addr{margin-top:16px;font-size:12px;color:#B3A79B;word-break:break-all}
  .note{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);font-size:12px;color:#B3A79B}
</style>
</head>
<body>
  <div class="box">
    <div class="ic">🏡</div>
    <h1>家乡文化二维码</h1>
    <p>正在为你打开课堂页面…<br>如果 2 秒后没有自动跳转，请点下面的按钮。</p>
    <a class="go" href="https://api.kexvefuxi.cn/qr2/">进入家乡文化二维码 ↗</a>
    <div class="addr">https://api.kexvefuxi.cn/qr2/</div>
    <div class="note">本入口仅作跳转，工具本身部署在 api.kexvefuxi.cn</div>
  </div>
</body>
</html>
